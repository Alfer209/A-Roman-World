l_english: 
 
 ming.1.t:0 "Purging The Reformists"
 ming.1.desc:0 "The reformists, once hailed as visionaries by the southern provinces, now stand accused of treason, sedition, and undermining the divine order of the Empire. Their influence lingers like a shadow over the court, poisoning minds and sowing doubt in the Mandate. The Emperor’s advisors are divided: some call for swift execution to restore order, others urge a public trial to preserve the illusion of justice. The fate of these dissidents now rests in your hands. Will you strike with the sword, or cloak your judgement in ceremony?"
 ming.1.a:0 "They must be executed, they cant be left alive. "
 ming.1.b:0 "Give them a 'fair' trial."

 ming.2.t:0 "Reformists Executed!"
 ming.2.desc:0 "The executions were carried out at dawn, swift and unceremonious. The reformists met their end not with defiance, but with quiet resignation — as if they knew their fate was sealed the moment they challenged the throne. News of their deaths has rippled through the provinces, stirring unrest among sympathisers and drawing sharp criticism from foreign observers. Yet within the imperial court, a sense of grim satisfaction prevails. The Mandate has spoken. Though stability has suffered, the Empire stands firmer in its resolve."
 ming.2.a:0 "A dent in our stability, but a necessary one."

 ming.3.t:0 "Reformists Stages An Escape!"
 ming.3.desc:0 "The trial was meant to be a display of imperial justice — a calculated performance to placate the masses and silence foreign critics. But somewhere between the opening statements and the final verdict, chaos erupted. A coordinated escape, aided by sympathisers within the bureaucracy, allowed the reformists to slip through the cracks and vanish into the southern provinces. The court is in disarray, and whispers of betrayal echo through the halls. The Emperor is furious, yet the public remains unaware of the full extent of the failure. For now."
 ming.3.a:0 "Send the police, the army, god- anyone, everyone!. They must be hunted down!"

 ming.4.t:0 "The Ming Sends An Ulimatum!"
 ming.4.desc:0 "A sealed decree has arrived from Beijing.\n\nThe Great Empire of Ming, now fully restored and wielding the Mandate of Heaven with unflinching authority, demands the immediate surrender of all Republican officials and the unconditional entry of imperial forces into every city, every garrison, every hall of governance.\n\nThere is no room for negotiation. No offer of compromise. The Emperor’s words are carved in iron: submit, or be erased. The decree speaks not of politics, but of divine justice — of rebellion against Heaven itself, and the punishment that must follow.\n\nIn the Republican capital, silence reigns. Ministers stare at the parchment as if it were a death sentence. Some call for resistance, their voices trembling. Others speak of survival, of pragmatism, of the futility of defying a power reborn.\n\nThe streets are restless. The people sense what is coming. The old wounds of the Xinhai Revolution have been torn open, and the spectre of imperial vengeance looms once more.\n\nThe Dragon does not roar. It whispers — and its whisper is enough to shake the foundations of the Republic."
 ming.4.a:0 "Never! The Republic will not fall!"
 ming.4.b:0 "We cannot win this. We must surrender..."

 ming.5.t:0 "The Rebels Refuse to Yield"
 ming.5.desc:0 "The Republican leadership has refused the imperial decree. Their officials remain in place, their borders closed, and their defiance declared.\n\nThe Emperor is enraged. The southern provinces have chosen rebellion over reconciliation, and now they shall face the full wrath of the Empire.\n\nOrders have been issued. The banners rise once more. The Second Republican War begins."
 ming.5.a:0 "Then let the heavens witness their fall."

 ming.6.t:0 "The Republic Collapses"
 ming.6.desc:0 "The Republican government has accepted the imperial ultimatum. Officials have been detained, provincial gates opened, and Ming forces now enter the southern cities unopposed.\n\nThe Emperor has declared the restoration of unity complete. The Republic is dissolved, its remnants scattered, and the Mandate stands unchallenged.\n\nThe Dragon has reclaimed its dominion."
 ming.6.a:0 "China is united again!"

 ming.7.t:0 "The Tianming Principles"
 ming.7.desc:0 "With the Empire restored and the Mandate of Heaven reaffirmed, the question now turns to doctrine. The Tianming Principles — once a vague spiritual justification for rule — must now be forged into a clear ideological foundation for the modern age.\n\nScholars, generals, and ministers gather in Beijing to debate the future. Should the Empire embrace unity and harmony? Should it modernise and centralise? Or should it cast aside all pretence and rule through fear and divine absolutism?"
 ming.7.a:0 "Unity, Virtue, Prosperity."
 ming.7.b:0 "Strength, Order, Sovereignty"
 ming.7.c:0 "Blood, Obedience, Destiny"

 ming.8.t:0 "Beijing Sends An Ulimatum"
 ming.8.desc:0 "A sealed imperial decree has arrived from Beijing. The Great Empire of Ming, emboldened by its restoration and the reaffirmation of the Mandate of Heaven, now demands the full submission of Xinjiang. The terms are clear; surrender all Republican officials, allow immediate entry of imperial forces, and renounce any claim to independent governance.\n\nThe timing is cruel. Xinjiang has only just begun to breathe the air of freedom, its people still scarred from decades of imperial oversight. Now, the Dragon returns — not with diplomacy, but with demand.\n\nThe local government is paralysed. Some call for defiance, invoking the spirit of the revolution. Others whisper of pragmatism, of avoiding another war that could devastate the region.\n\nThe choice must be made. And it will echo across the East."
 ming.8.a:0 "Never! We just got our independence from them!"
 ming.8.b:0 "Let's avoid bloodshed... in exchange for our sovereignty."

 ming.9.t:0 "Xinjiang Fights Back!"
 ming.9.desc:0 "The ultimatum from Beijing was clear; surrender all authority, disband the warlord regime, and allow imperial forces to enter Xinjiang unopposed. It was delivered with the weight of the Mandate behind it — a demand, not a negotiation.\n\nXinjiang refused.\n\nWithin hours, the region erupted into mobilisation. Militias loyal to the warlord began fortifying key passes, and old arsenals were reopened. The streets of Ürümqi filled with conscripts, many armed with rusted rifles and fading hope. The scars of imperial rule still linger, and the warlord has chosen defiance over submission. In Beijing, the Emperor’s fury is palpable. Orders have been issued. Armoured columns roll westward. The silence that followed the Mandate’s reaffirmation has shattered. The campaign to crush Xinjiang begins now. And this time, the Empire does not intend to offer mercy."
 ming.9.a:0 "Forward! To Urumqi!"

 ming.10.t:0 "Xinjiang Yields!"
 ming.10.desc:0 "Faced with overwhelming pressure and the looming threat of war, Xinjiang has accepted the imperial ultimatum. Republican officials have been detained, and Ming forces now enter the region unopposed.\n\nThe local population watches in silence as the banners of independence are lowered. The dream of sovereignty ends not with gunfire, but with quiet surrender.\n\nThe Emperor has declared the reintegration of Xinjiang complete. The little state is no more."
 ming.10.a:0 "They actually gave up?"

 ming.11.t:0 "Beijing Sends An Ulimatum"
 ming.11.desc:0 "A sealed imperial decree has arrived in Lhasa. The Ming, emboldened by its restoration and the reaffirmation of the Mandate of Heaven, now demands the full submission of the Tibetan government. The terms are absolute: surrender all authority, dissolve the regional administration, and allow imperial forces to enter unopposed.\n\nThe timing is deliberate. Tibet stands isolated, its defences scattered, its allies silent. The Dragon does not roar — it whispers, and its whisper carries the weight of centuries.\n\nWithin the Potala Palace, the council is divided. Some call for defiance, invoking the spirit of the mountains and the memory of past resistance. Others speak of pragmatism, of avoiding a war that cannot be won.The choice must be made. And the winds over the Himalayas grow colder."
 ming.11.a:0 "I dare they to cross the mountains!"
 ming.11.b:0 "Let us avoid meaningless bloodshed..."

 ming.12.t:0 "Tibet Refuses To Yield!"
 ming.12.desc:0 "The Tibetan government has formally rejected the ultimatum issued by Beijing. All demands for political dissolution, military access, and imperial oversight have been denied.In response, Ming authorities have authorised full mobilisation of forces along the western frontier. \n\nIntelligence reports confirm defensive preparations underway in key mountain passes and urban centres across the region.Diplomatic channels have collapsed. No further negotiations are expected. \n\nThe situation has escalated beyond containment, and military intervention is now imminent. Hostilities between the Ming Empire and the Tibetan administration are expected to begin within days."
 ming.12.a:0 "Then they shall be crushed under the Dragon."

 ming.13.t:0 "Tibet Gives Up!"
 ming.13.desc:0 "Faced with overwhelming pressure and the looming threat of war, the Tibetan government has accepted the imperial ultimatum. Officials have stepped down, and Ming forces now enter the region unopposed.\n\nThe banners of independence are lowered. The monasteries fall silent. The mountains, once symbols of defiance, now bear witness to submission.\n\nThe Emperor has declared the reintegration of Tibet complete. The frontier is pacified. The Mandate stands unchallenged."
 ming.13.a:0 "They are wise to avoid bloodshed."

 ming.14.t:0 "The Ming Wants To Coorporate"
 ming.14.desc:0 "In a development few anticipated, the Ming Empire has extended a formal proposal for diplomatic cooperation. The offer outlines a framework for mutual recognition, cessation of hostilities, and the establishment of a temporary peace aimed at securing long-term stability across China. This marks the first instance in which the government in Beijing has acknowledged our legitimacy and opened direct diplomatic channels.\n\nThe proposal has sparked intense debate within our administration. Some view it as a pragmatic necessity — a chance to preserve the Republic in the face of overwhelming imperial strength. With no clear path to military victory, they argue that engagement may buy time to rebuild and consolidate.\n\nOthers, however, warn that accepting such terms risks compromising the ideological foundation of the Republic. Cooperation with a regime that claims divine authority over the nation could be seen as a betrayal of the revolutionary cause and may erode public confidence in our leadership.\n\nThe decision before us is not merely strategic — it is existential. To accept is to gamble with our principles. To refuse is to risk annihilation."
 ming.14.a:0 "Finally! A path toward peace!"
 ming.14.b:0 "We don't coorporate with imperialists!"

 ming.15.t:0 "The Republicans Agree!"
 ming.15.desc:0 "The Republican administration in Guangdong has formally accepted our offer of cooperation. This marks the first diplomatic treaty ever signed between our two governments — a historic moment in the pursuit of national stability.\n\nPreliminary discussions have commenced to establish a framework for peace, including mutual recognition, cessation of hostilities, and limited strategic coordination. While ideological divisions persist, the acceptance of our overture represents a significant breakthrough in regional diplomacy.\n\nThe court views this development as a calculated step toward strategic consolidation. Stabilising the southern frontier without further military expenditure allows us to redirect resources toward internal development and external defence.\n\nIn securing peace within China, we strengthen our position against foreign interference. The Mandate remains firm — and the path to unity grows clearer."
 ming.15.a:0 "A path toward peace for China!"

 ming.16.t:0 "The Republicans Refuse..."
 ming.16.desc:0 "Those damn Republican rebels have refused our generous offer of peace. We knew they would do this, and now we suffer our mistake of offering a chance at peace. It's like talking to a brick wall."
 ming.16.a:0 "We tried."

 ming.17.t:0 "Open Arms Policy"
 ming.17.desc:0 "With diplomatic ties to the Republican government in Guangzhou now restored, our administration faces a critical decision on how to shape this newfound relationship. The Open Arms Policy presents an opportunity to formalise peaceful engagement and stabilise the southern frontier — but the approach must be carefully chosen.\n\nOne option is to renew the Treaty of Nanjing, establishing a binding non-aggression pact that would prohibit any future conflict between our governments. Another path involves a mutual defence guarantee, ensuring that both parties stand united against foreign threats. A third proposal calls for coordinated military access, allowing for strategic cooperation and joint operations.\n\nEach path carries distinct strategic implications. The court must weigh the benefits of trust against the risks of entanglement. The Mandate of Heaven demands stability — but not at the cost of vigilance."
 ming.17.a:0 "Let us renew the treaty of Nanjing."
 ming.17.b:0 "A mutual defensive pact will be beneficial."
 ming.17.c:0 "Let our forces cooperate."

 ming.18.t:0 "The Ming Requests Cooperation"
 ming.18.desc:0 "A diplomatic communiqué has arrived from Beijing. The Ming Empire, seeking to stabilise its position in East Asia, has proposed a formal framework for cooperation. The offer includes mutual recognition, strategic dialogue, and potential military coordination.\n\nWithin our government, the proposal has sparked debate. Some view it as a pragmatic opportunity to secure influence in the East and counterbalance rival powers. Others warn that accepting such terms would be seen as a betrayal of our longstanding ties to the Republican government — and may carry ideological consequences.\n\nThe decision is not merely diplomatic. It is a signal to the world about where we stand — and who we stand with."
 ming.18.a:0 "We require allies in the East."
 ming.18.b:0 "That means bretraying the Republicans..."

 ming.19.t:0 "The Teutons Accept!"
 ming.19.desc:0 "The Teutonic Empire has formally accepted our proposal for cooperation. Diplomatic channels have been established, and preliminary discussions are underway to define the scope of the agreement.\n\nThis marks a significant breakthrough in our foreign policy. A new European power other than East Rome now recognises our legitimacy and is willing to engage in strategic dialogue. The court views this as a validation of our growing influence — and a step toward securing our position on the global stage.\n\nThe Mandate of Heaven extends beyond borders. And now, others begin to acknowledge it."
 ming.19.a:0 "This is beneficial."

 ming.20.t:0 "The Teutons Refuse..."
 ming.20.desc:0 "The Teutonic Empire has declined our offer of cooperation. No formal explanation was provided, though internal reports suggest ideological alignment with the Republican government may have influenced the decision.\n\nThe court views this refusal as a missed opportunity — and a reminder that not all foreign powers are prepared to recognise the legitimacy of our rule.\n\nDiplomatic efforts will be redirected. The Mandate remains firm, with or without their support."
 ming.20.a:0 "What? No?"

 ming.21.t:0 "An Attempt At Unification"
 ming.21.desc:0 "The Ming Empire has extended a formal overture for national reconciliation. Their proposal includes recognition of their authority as the central government and the possibility of full reunification under a single banner.\n\nThis marks a dramatic shift in the political landscape. For the first time, the imperial court in Beijing seeks peaceful resolution rather than military conquest.\n\nWithin our administration, opinions are divided. Some argue that recognising the Ming is a necessary step toward ending decades of bloodshed and restoring national unity. Others warn that such a move would compromise the Republic’s founding ideals and legitimise authoritarian rule.\n\nThe future of China hangs in the balance. We must decide whether to pursue unity — or hold the line against imperialism."
 ming.21.a:0 "Not yet... but we'll recognise them as the central government."
 ming.21.b:0 "Time has come! We can finally re-unite China!"
 ming.21.c:0 "Cooperate with imperialists? Hell no!"

 ming.22.t:0 "The Republicans recognises us as the central government!"
 ming.22.desc:0 "The Republican government has formally acknowledged our authority as the legitimate central government of China. While full reunification remains pending, this recognition marks a major diplomatic victory.\n\nThe court views this development as a validation of our position and a step toward restoring national unity.\n\nThe Mandate of Heaven grows stronger. The path to complete reunification is now open."
 ming.22.a:0 "Not united yet, but soon!"

 ming.23.t:0 "The Republicans Offer Complete Re-Unification!"
 ming.23.desc:0 "In a historic move, the Republican government has proposed full reunification under the imperial banner. All administrative and military structures are to be integrated, and the Republic will dissolve its independent authority.\n\nThe Emperor has declared this moment a triumph of diplomacy and destiny. The scars of division begin to heal.\n\nChina stands united once more — under the Mandate of Heaven."
 ming.23.a:0 "Wansui!"

 ming.24.t:0 "The Republicans Refuse To Cooperate!"
 ming.24.desc:0 "Despite our overtures, the Republican government has rejected all proposals for reconciliation. They refuse to recognise our authority and have reaffirmed their commitment to ideological independence.\n\nThe court expresses disappointment, but not surprise. The path to unity remains blocked — for now.\n\nThe Mandate endures. We will continue to act in the interest of national restoration."
 ming.24.a:0 "What? After all this?"

 ming.25.t:0 "A China Reunited!"
 ming.25.desc:0 "After a long grueling struggle, the Great Ming has triumphed over all challengers. The republican pretenders in Guangzhou have been crushed, their dream of a so-called modern republic extinguished beneath the thunder of imperial arms. In the far west, the separatists of Xinjiang and the rebels of Tibet have been brought back into the fold, their banners torn down as the Dragon Throne reasserts its ancient sovereignty. \n\nFor the first time since the collapse of the old dynasty in 1911, the Middle Kingdom once again bows to one ruler, one Son of Heaven, one Empire. The Mandate of Heaven has been restored, and the shame of disunity erased. The court in Nanjing proclaims to all nations that China stands whole once more—resurgent, unbroken, and destined to retake its rightful place among the great powers of the world."
 ming.25.a:0 "It is time... to finally reunite China."

 ming.27.t:0 "The Fate of Joseon"
 ming.27.desc:0 "For centuries, the Kingdom of Joseon has stood as our most loyal vassal, a dutiful servant and buffer state against the storms of the outside world. Through war and peace, famine and prosperity, they have bent knee to the Son of Heaven, offering tribute and recognition of the Celestial Throne’s supremacy. Yet times have changed. The dynasty, once unshakable in its reverence, now stumbles under the weight of foreign intrigues and the whisper of independence. Imperial envoys report that the Joseon court grows restless, torn between loyalty to the old order and the temptations of standing on its own. \n\nThe Great Empire of Ming must now decide their destiny. To leave Joseon as it is ensures continued tribute and stability, though their ambitions may grow unchecked in the years to come. To annex Joseon directly into the empire would unify the peninsula under the Celestial Banner, strengthening our defenses and our dominion over the East—but it would surely stir resentment among the people of Hanseong, who have known their own royal line for generations. And lastly, there are those in the Forbidden City who whisper that Joseon has already served its purpose. By granting them independence, we would sever the ancient bonds of fealty and cast them into the world to fend for themselves, though at the cost of our traditional supremacy. \n\nThe choice before us is one of history itself: will Joseon remain a tributary buffer, be absorbed into the body of the Empire, or stand alone as a sovereign nation? The Son of Heaven alone must decide how the legacy of Joseon will be remembered in the annals of the Celestial Court."
 ming.27.a:0 "Leave as is."
 ming.27.b:0 "Annex them into China!"
 ming.27.c:0 "They served us long enough."

 ming.28.t:0 "The Ming Requests Direct Control Over Us!"
 ming.28.desc:0 "The Ming Empire has issued a sweeping demand: our concession territories, once carved out of Japan by foreign treaty, are to be placed under their direct administration. They claim to be liberators, sweeping away the last remnants of imperial humiliation, yet for us it would mean the end of our autonomy. Yielding may prevent bloodshed, but refusal risks drawing us into open conflict with one of the world’s most powerful states."
 ming.28.a:0 "Accept the demand — hand the cities over to Ming."
 ming.28.b:0 "Refuse their demands — This is a international zone!"

 ming.29.t:0 "The International Concession Cities Yields!" 
 ming.29.desc:0 "Under pressure from our government, the concession authorities have folded without resistance. The foreign powers have withdrawn their administrators, leaving us in full control of the once-divided cities along the home islands of Japan." 
 ming.29.a:0 "Our foothold in Japan is secure!"

 ming.30.t:0 "Concessions Refuse..."
 ming.30.desc:0 "Our ultimatum to the concession authorities has been rejected outright. Backed quietly by their foreign sponsors, they have declared their continued loyalty to the Treaty of Nagasaki. Their defiance is a challenge to our sovereignty — one that cannot be ignored if we are to assert control over our concessions in Japan." 
 ming.30.a:0 "Then we shall take them by force!"

 ming.32.t:0 "Protest from the Teutonic Powers"
 ming.32.desc:0 "The Teutonic Empire and its allies have lodged a furious protest against our actions in Japan, condemning the direct control of the international concession cities as illegitimate. They demand an immediate reversal, threatening unspecified consequences should we ignore their ultimatum. Some advisors urge caution, but others dismiss the protests as hollow posturing." 
 ming.32.a:0 "Perhaps a retreat is wise..."
 ming.32.b:0 "We will not be intimidated!"

 ming.34.t:0 "Protest from the Roman Powers"
 ming.34.desc:0 "Both Eastern and Western Roman governments have issued a strong condemnation of our actions in Japan. Declaring that our moves destabilise the international order, they threaten sanctions and retaliation if the concession cities are not restored to their previous status. Their envoys crowd our capital, pressing us for a response." 
 ming.34.a:0 "Give up the cities."
 ming.34.b:0 "Ignore their demands!"

 ming.31.t:0 "The Ming Seize the Japanese Concessions"
 ming.31.desc:0 "News arrives from the Far East: the Ming government has unilaterally seized the international concession cities in Japan, expelling foreign authorities and declaring them an integral part of their realm. This bold act has shocked the world, sparking outrage in diplomatic circles. The Kaiserpakt now faces a crucial decision — whether to confront Ming aggression directly, or settle for mere diplomatic protest." 
 ming.31.a:0 "War is the only answer!"
 ming.31.b:0 "Issue a formal protest."
 ming.31.c:0 "Do nothing — it is too distant to matter."

 ming.33.t:0 "The Ming Seize the Japanese Concessions"
 ming.33.desc:0 "The Ming Empire has declared the end of the international concessions in Japan, seizing them by force of decree. Administrators and troops have already been expelled. Among the Roman empires and their allies, debate rages: should Ming defiance be tolerated, or punished? Some whisper that a confrontation in Asia may serve only to overextend us."
 ming.33.a:0 "War must come!"
 ming.33.b:0 "Protest, but nothing more."
 ming.33.c:0 "Turn our gaze elsewhere."

 ming.35.t:0 "The Ming Demand Our Submission!"
 ming.35.desc:0 "An ultimatum has arrived from the Ming court. With their armies massed along our borders and their fleets prowling the seas, they demand that Dai-Nam surrender its sovereignty and be absorbed into their empire. Some in our court whisper that resistance is futile, while others vow to fight to the last man rather than see our homeland chained."
 ming.35.a:0 "We have no choice but to submit..."
 ming.35.b:0 "Never! Dai-Nam shall resist!"

 ming.36.t:0 "Dai-Nam Submits!"
 ming.36.desc:0 "Faced with the weight of our demands, the Dai-Nam authorities have folded. Their officials have stepped aside, their banners lowered, and their land now passes into our hands without resistance. The people of Dai-Nam awaken to a new reality: the rule of the Middle Kingdom restored over them."
 ming.36.a:0 "Another jewel returns to the Empire."

 ming.37.t:0 "Dai-Nam Defies Us!"
 ming.37.desc:0 "Our ultimatum has been rejected. The government of Dai-Nam has declared that they will never submit, invoking ancient independence and calling on their people to rise in defiance of Ming power. Their refusal leaves us with only one path if we are to enforce our rightful claims: war."
 ming.37.a:0 "Then let war decide their fate."


 ming.200.t:0 "The Mandate Of Heaven Reaffirmed"
 ming.200.desc:0 "In a moment of pround imperial resurgance, the Great Empire of Ming has declared their full reaffirmation of the Mandate of Heaven. Following years of internal strife, political purges, and the Xinhai Revolution, the Emperor now stands unchallenged at the helm of a revitalised state. The imperial court in Beijing has issued proclamations reaffirming Ming's divine right to rule, backed by sweeping reforms and military restructuring. East Roman envoys were present at the ceremony, signalling continued strtaegic alignment between the two ancient powers. Across Asia and beyond, governments are reassessing their positions. Republican elements in Guangdong and Yunnan have gone silent, and the whispers of a second war grows louder..."
 ming.200.a:0 "The Mandate is ours once more. Let all under Heaven bear witness."
 ming.200.b:0 "They dare call themselves legitimate? We must prepare — the storm is coming."
 ming.200.c:0 "Interesting developments in the East."

 ming.201.t:0 "The Beiji Bridge Incident"
 ming.201.desc:0 "At dawn today, a firefight broke out at Beiji Bridge in Chongqing between Imperial and Republican border forces. What began as a routine Ming patrol ended in a brief but bloody clash, leaving bodies strewn along the riverbank. Official accounts are predictably contradictory — Republicans accuse the Ming of provocation, while the Imperial court cries sabotage. Yet beyond the rhetoric lies something more ominous: a crack in the fragile peace holding back the floodwaters of war. Tensions now surge across the frontier. Troops mass, fortifications rise, and whispers of mobilisation spread. Mediation attempts by Eastern Roman and Teutonic observers have failed. Many fear this clash will be remembered less for its dead than for what it unleashed. The silence is breaking. The East stirs."
 ming.201.a:0 "Retribution!"
 ming.201.b:0 "The drums of war are silent... for now."
 ming.201.c:0 "A tragic misunderstanding... or something more?"

 ming.202.t:0 "The Second Republican War"
 ming.202.desc:0 "War has erupted once more in China. Following a failed ultimatum and rising tensions, the Ming Empire has launched a full-scale campaign to crush remaining Republican resistance. The conflict, dubbed the Second Republican War, or 'Second Xinhai Revolution' by Republican forces, threatens to engulf the region in unprecedented violence.\n\nRepublican forces have declared total mobilisation, vowing to defend their sovereignty at all costs. Meanwhile, foreign observers express concern as diplomatic channels collapse and battle lines harden. The East trembles. The Dragon marches. And the world watches, uncertain whether this war will remain contained — or spiral into something far greater."
 ming.202.a:0 "Forward! To Victory!"
 ming.202.b:0 "We must win!"
 ming.202.c:0 "Is there any hope for peace?"

 ming.203.t:0 "China Reunited"
 ming.203.desc:0 "The Second Republican War has ended, with the Great Empire of Ming achieving total reunification of China. The final resistance has been crushed, and imperial banners now fly over every former rebel province.\n\nBeijing has declared the restoration of national unity complete. The Mandate of Heaven stands unchallenged, and the Emperor’s authority stretches from the coastlines to the mountains.\n\nAcross the world, governments react with caution and awe. The balance of power in East Asia has shifted. The Dragon has awakened — and it has reclaimed its throne."
 ming.203.a:0 "Wansui!"
 ming.203.b:0 "They have reclaimed their place upon the Great Powers..."