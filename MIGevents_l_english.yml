l_english: 
 
 ming.1.t:0 "Чистка Реформістів"
ming.1.desc:0 "Реформісти, яких колись вітали як провидців у південних провінціях, тепер звинувачуються у державній зраді, підбурюванні до заколоту та підриві божественного порядку Імперії. Їхній вплив, як тінь, нависає над двором, отруюючи розум і сіючи сумніви в Мандаті. Радники Імператора розділені: одні закликають до швидкої страти, щоб відновити порядок, інші наполягають на публічному суді, щоб зберегти ілюзію справедливості. Доля цих дисидентів тепер у ваших руках. Чи завдасте ви удару мечем, чи загорнете свій вирок у церемонію?"
ming.1.a:0 "Їх необхідно стратити, їх не можна залишити живими."
ming.1.b:0 "Надати їм 'справедливий' суд."

ming.2.t:0 "Реформісти Страчені!"
ming.2.desc:0 "Страти були здійснені на світанку, швидко та без церемоній. Реформісти зустріли свій кінець не з непокорою, а з тихою покірністю — ніби вони знали свою долю з моменту, коли кинули виклик трону. Звістка про їхню смерть прокотилася провінціями, викликаючи заворушення серед симпатиків та різку критику від іноземних спостерігачів. Проте в імператорському дворі панує відчуття похмурого задоволення. Мандат промовив. Хоча стабільність постраждала, Імперія стоїть міцніше у своїй рішучості."
ming.2.a:0 "Втрата для нашої стабільності, але необхідна."

ming.3.t:0 "Реформісти Організовують Втечу!"
ming.3.desc:0 "Суд мав бути демонстрацією імперської справедливості — прорахованим виступом, щоб заспокоїти маси та змусити замовкнути іноземних критиків. Але десь між вступними заявами та фінальним вердиктом спалахнув хаос. Скоординована втеча, за допомогою симпатиків усередині бюрократії, дозволила реформістам прослизнути крізь щілини та зникнути в південних провінціях. Двір у безладді, а в залах лунає шепіт про зраду. Імператор розлючений, проте громадськість поки не знає про повний масштаб провалу. Поки що."
ming.3.a:0 "Надіслати поліцію, армію, Боже — будь-кого, всіх! Їх треба вистежити!"

ming.4.t:0 "Мін Надсилає Ультиматум!"
ming.4.desc:0 "З Пекіна надійшов запечатаний указ.\n\nВелика Імперія Мін, тепер повністю відновлена та озброєна Мандатом Небес із непохитною владою, вимагає негайної здачі всіх Республіканських чиновників та беззастережного вступу імперських сил до кожного міста, кожного гарнізону, кожної урядової зали.\n\nНемає місця для переговорів. Жодної пропозиції компромісу. Слова Імператора викарбувані в залізі: підкоритися, або бути стертим. Указ говорить не про політику, а про божественну справедливість — про повстання проти самих Небес і про покарання, яке має настати.\n\nУ Республіканській столиці панує тиша. Міністри дивляться на пергамент, ніби це смертний вирок. Дехто закликає до опору, їхні голоси тремтять. Інші говорять про виживання, про прагматизм, про марність протистояння відродженій силі.\n\nВулиці неспокійні. Люди відчувають, що наближається. Старі рани Сіньхайської революції розкриті, і привид імперської помсти знову нависає.\n\nДракон не реве. Він шепоче — і його шепіт достатній, щоб похитнути основи Республіки."
ming.4.a:0 "Ніколи! Республіка не впаде!"
ming.4.b:0 "Ми не можемо перемогти. Ми мусимо здатися..."

ming.5.t:0 "Повстанці Відмовляються Підкоритися"
ming.5.desc:0 "Республіканське керівництво відхилило імперський указ. Їхні чиновники залишаються на місцях, їхні кордони закриті, а їхня непокора оголошена.\n\nІмператор розлючений. Південні провінції обрали повстання замість примирення, і тепер вони зіткнуться з усією люттю Імперії.\n\nНакази видано. Прапори знову піднімаються. Розпочинається Друга Республіканська Війна."
ming.5.a:0 "Тоді нехай небеса засвідчать їхнє падіння."

ming.6.t:0 "Республіка Колапсує"
ming.6.desc:0 "Республіканський уряд прийняв імперський ультиматум. Чиновники затримані, ворота провінцій відчинені, і сили Мін тепер без опору входять до південних міст.\n\nІмператор оголосив про повне відновлення єдності. Республіка розпущена, її залишки розсіяні, а Мандат стоїть беззаперечно.\n\nДракон повернув собі своє панування."
ming.6.a:0 "Китай знову об'єднаний!"

ming.7.t:0 "Принципи Тяньміна"
ming.7.desc:0 "З відновленням Імперії та підтвердженням Мандату Небес, питання тепер переходить до доктрини. Принципи Тяньміна — колись розпливчасте духовне виправдання правління — тепер мають бути перековані в чіткий ідеологічний фундамент для сучасної ери.\n\nНауковці, генерали та міністри збираються в Пекіні, щоб обговорити майбутнє. Чи повинна Імперія прийняти єдність і гармонію? Чи повинна вона модернізуватися та централізуватися? Чи повинна вона відкинути всі прикидання і правити через страх та божественний абсолютизм?"
ming.7.a:0 "Єдність, Чеснота, Процвітання."
ming.7.b:0 "Сила, Порядок, Суверенітет"
ming.7.c:0 "Кров, Покора, Доля"

ming.8.t:0 "Пекін Надсилає Ультиматум"
ming.8.desc:0 "До Сіньцзяну надійшов запечатаний імперський указ. Велика Імперія Мін, натхненна своїм відновленням та підтвердженням Мандату Небес, тепер вимагає повного підкорення Сіньцзяну. Умови чіткі: здати всіх Республіканських чиновників, дозволити негайний вступ імперських сил та відмовитися від будь-яких претензій на незалежне управління.\n\nЧас жорстокий. Сіньцзян лише щойно почав дихати повітрям свободи, його народ все ще скалічений десятиліттями імперського нагляду. Тепер Дракон повертається — не з дипломатією, а з вимогою.\n\nМісцевий уряд паралізований. Дехто закликає до непокори, посилаючись на дух революції. Інші шепочуть про прагматизм, про уникнення чергової війни, яка може спустошити регіон.\n\nВибір має бути зроблений. І він відлунюватиметься по всьому Сходу."
ming.8.a:0 "Ніколи! Ми щойно здобули незалежність від них!"
ming.8.b:0 "Уникнемо кровопролиття... в обмін на наш суверенітет."

ming.9.t:0 "Сіньцзян Чинить Опір!"
ming.9.desc:0 "Ультиматум з Пекіна був чітким: відмовитися від усієї влади, розпустити режим військового правителя та дозволити імперським силам без опору увійти до Сіньцзяну. Він був доставлений із вагою Мандату позаду нього — вимога, а не переговори.\n\nСіньцзян відмовився.\n\nПротягом кількох годин регіон вибухнув мобілізацією. Ополчення, лояльні до військового правителя, почали укріплювати ключові перевали, і старі арсенали були знову відкриті. Вулиці Урумчі заповнилися призовниками, багато з яких озброєні іржавими гвинтівками та згасаючою надією. Шрами імперського правління все ще залишаються, і військовий правитель обрав непокору замість підкори. У Пекіні лють Імператора відчутна. Накази видано. Бронетанкові колони котяться на захід. Тиша, що настала після підтвердження Мандату, розбита. Кампанія зі знищення Сіньцзяну починається зараз. І цього разу Імперія не має наміру виявляти милосердя."
ming.9.a:0 "Вперед! На Урумчі!"

ming.10.t:0 "Сіньцзян Піддається!"
ming.10.desc:0 "Зіткнувшись із переважним тиском та загрозою війни, Сіньцзян прийняв імперський ультиматум. Республіканські чиновники затримані, і сили Мін тепер без опору входять до регіону.\n\nМісцеве населення мовчки спостерігає, як опускаються прапори незалежності. Мрія про суверенітет закінчується не стріляниною, а тихою здачею.\n\nІмператор оголосив реінтеграцію Сіньцзяну завершеною. Малої держави більше немає."
ming.10.a:0 "Вони справді здалися?"

ming.11.t:0 "Пекін Надсилає Ультиматум"
ming.11.desc:0 "До Лхаси надійшов запечатаний імперський указ. Мін, натхненна своїм відновленням та підтвердженням Мандату Небес, тепер вимагає повного підкорення Тибетського уряду. Умови абсолютні: відмовитися від усієї влади, розпустити регіональну адміністрацію та дозволити без опору вступ імперських сил.\n\nЧас обраний навмисно. Тибет ізольований, його оборонні рубежі розсіяні, його союзники мовчать. Дракон не реве — він шепоче, і його шепіт несе вагу століть.\n\nУсередині Палацу Потала рада розділена. Дехто закликає до непокори, посилаючись на дух гір та пам'ять про минулий опір. Інші говорять про прагматизм, про уникнення війни, яку неможливо виграти. Вибір має бути зроблений. І вітри над Гімалаями стають холоднішими."
ming.11.a:0 "Я кидаю їм виклик перетнути гори!"
ming.11.b:0 "Уникнемо безглуздого кровопролиття..."

ming.12.t:0 "Тибет Відмовляється Підкоритися!"
ming.12.desc:0 "Тибетський уряд офіційно відхилив ультиматум, виданий Пекіном. Усі вимоги щодо політичного розпуску, військового доступу та імперського нагляду були відхилені. У відповідь влада Мін дозволила повну мобілізацію сил уздовж західного кордону.\n\nРозвідувальні звіти підтверджують оборонні приготування, що тривають у ключових гірських перевалах та міських центрах по всьому регіону. Дипломатичні канали зруйновані. Подальших переговорів не очікується.\n\nСитуація вийшла за межі стримування, і військове втручання тепер неминуче. Очікується, що бойові дії між Імперією Мін та Тибетською адміністрацією розпочнуться протягом кількох днів."
ming.12.a:0 "Тоді вони будуть розчавлені під Драконом."

ming.13.t:0 "Тибет Піддається!"
ming.13.desc:0 "Зіткнувшись із переважним тиском та загрозою війни, Тибетський уряд прийняв імперський ультиматум. Чиновники пішли у відставку, і сили Мін тепер без опору входять до регіону.\n\nПрапори незалежності опущені. Монастирі замовкли. Гори, колись символи непокори, тепер свідчать про підкорення.\n\nІмператор оголосив реінтеграцію Тибету завершеною. Кордон умиротворений. Мандат стоїть беззаперечно."
ming.13.a:0 "Вони мудрі, що уникли кровопролиття."

ming.14.t:0 "Мін Бажає Співпрацювати"
ming.14.desc:0 "У розвитку подій, якого мало хто очікував, Імперія Мін надіслала офіційну пропозицію про дипломатичну співпрацю. Пропозиція окреслює рамки для взаємного визнання, припинення бойових дій та встановлення тимчасового миру, спрямованого на забезпечення довгострокової стабільності по всьому Китаю. Це знаменує перший випадок, коли уряд у Пекіні визнав нашу легітимність та відкрив прямі дипломатичні канали.\n\nЦя пропозиція викликала інтенсивні дебати в нашій адміністрації. Деякі розглядають це як прагматичну необхідність — шанс зберегти Республіку перед обличчям переважної імперської сили. Вони стверджують, що за відсутності чіткого шляху до військової перемоги, взаємодія може виграти час для відбудови та консолідації.\n\nІнші, однак, попереджають, що прийняття таких умов ризикує скомпрометувати ідеологічні основи Республіки. Співпраця з режимом, який заявляє про божественну владу над нацією, може розглядатися як зрада революційної справи та може підірвати суспільну довіру до нашого керівництва.\n\nРішення, що стоїть перед нами, є не просто стратегічним — воно екзистенційне. Прийняти — означає ризикнути нашими принципами. Відмовитися — означає ризикнути знищенням."
ming.14.a:0 "Нарешті! Шлях до миру!"
ming.14.b:0 "Ми не співпрацюємо з імперіалістами!"

ming.15.t:0 "Республіканці Погоджуються!"
ming.15.desc:0 "Республіканська адміністрація в Гуандуні офіційно прийняла нашу пропозицію про співпрацю. Це знаменує перший дипломатичний договір, коли-небудь підписаний між нашими двома урядами, — історичний момент у прагненні до національної стабільності.\n\nРозпочалися попередні обговорення щодо встановлення рамок для миру, включаючи взаємне визнання, припинення бойових дій та обмежену стратегічну координацію. Хоча ідеологічні розбіжності зберігаються, прийняття нашої пропозиції являє собою значний прорив у регіональній дипломатії.\n\nДвір розглядає цей розвиток як прорахований крок до стратегічної консолідації. Стабілізація південного кордону без подальших військових витрат дозволяє нам перенаправити ресурси на внутрішній розвиток та зовнішню оборону.\n\nЗабезпечуючи мир усередині Китаю, ми зміцнюємо наші позиції проти іноземного втручання. Мандат залишається непохитним — і шлях до єдності стає яснішим."
ming.15.a:0 "Шлях до миру для Китаю!"

ming.16.t:0 "Республіканці Відмовляються..."
ming.16.desc:0 "Ті кляті Республіканські повстанці відхилили нашу щедру пропозицію миру. Ми знали, що вони так зроблять, і тепер ми страждаємо через нашу помилку, що дали шанс на мир. Це все одно, що розмовляти з цегляною стіною."
ming.16.a:0 "Ми спробували."

ming.17.t:0 "Політика 'Відкритих Обіймів'"
ming.17.desc:0 "З відновленням дипломатичних зв'язків із Республіканським урядом у Гуанчжоу, наша адміністрація стикається з критичним рішенням про те, як сформувати ці новознайдені відносини. 'Політика Відкритих Обіймів' надає можливість формалізувати мирну взаємодію та стабілізувати південний кордон — але підхід має бути обраний обережно.\n\nОдин варіант — поновити Нанкінський Договір, встановлюючи обов'язковий пакт про ненапад, який заборонятиме будь-який майбутній конфлікт між нашими урядами. Інший шлях включає взаємну оборонну гарантію, що забезпечує єдність обох сторін проти іноземних загроз. Третя пропозиція закликає до скоординованого військового доступу, що дозволить стратегічну співпрацю та спільні операції.\n\nКожен шлях має виразні стратегічні наслідки. Двір повинен зважити переваги довіри проти ризиків втягування. Мандат Небес вимагає стабільності — але не ціною пильності."
ming.17.a:0 "Давайте поновимо Нанкінський договір."
ming.17.b:0 "Взаємний оборонний пакт буде вигідним."
ming.17.c:0 "Нехай наші сили співпрацюють."

ming.18.t:0 "Мін Просить Про Співпрацю"
ming.18.desc:0 "З Пекіна надійшло дипломатичне повідомлення. Імперія Мін, прагнучи стабілізувати своє становище у Східній Азії, запропонувала офіційні рамки для співпраці. Пропозиція включає взаємне визнання, стратегічний діалог та потенційну військову координацію.\n\nУсередині нашого уряду ця пропозиція викликала дебати. Дехто розглядає це як прагматичну можливість забезпечити вплив на Сході та протистояти суперницьким силам. Інші попереджають, що прийняття таких умов буде розглядатися як зрада наших давніх зв'язків із Республіканським урядом — і може мати ідеологічні наслідки.\n\nРішення не є лише дипломатичним. Це сигнал світові про те, де ми стоїмо — і з ким ми стоїмо."
ming.18.a:0 "Нам потрібні союзники на Сході."
ming.18.b:0 "Це означає зраду Республіканців..."

ming.19.t:0 "Тевтони Приймають!"
ming.19.desc:0 "Тевтонська Імперія офіційно прийняла нашу пропозицію про співпрацю. Дипломатичні канали налагоджені, і розпочалися попередні обговорення для визначення обсягу угоди.\n\nЦе знаменує значний прорив у нашій зовнішній політиці. Нова Європейська держава, окрім Східного Риму, тепер визнає нашу легітимність і готова до стратегічного діалогу. Двір розглядає це як підтвердження нашого зростаючого впливу — і крок до забезпечення нашого місця на світовій арені.\n\nМандат Небес поширюється за межі кордонів. І тепер інші починають це визнавати."
ming.19.a:0 "Це вигідно."

ming.20.t:0 "Тевтони Відмовляються..."
ming.20.desc:0 "Тевтонська Імперія відхилила нашу пропозицію про співпрацю. Жодного офіційного пояснення не було надано, хоча внутрішні звіти свідчать, що ідеологічна прихильність Республіканського уряду могла вплинути на рішення.\n\nДвір розглядає цю відмову як втрачену можливість — і нагадування, що не всі іноземні держави готові визнати легітимність нашого правління.\n\nДипломатичні зусилля будуть перенаправлені. Мандат залишається непохитним, з їхньою підтримкою чи без неї."
ming.20.a:0 "Що? Ні?"

ming.21.t:0 "Спроба Об'єднання"
ming.21.desc:0 "Імперія Мін надіслала офіційну пропозицію про національне примирення. Їхня пропозиція включає визнання їхнього авторитету як центрального уряду та можливість повного возз'єднання під єдиним прапором.\n\nЦе знаменує драматичний зсув у політичному ландшафті. Вперше імператорський двір у Пекіні шукає мирного вирішення, а не військового завоювання.\n\nУ нашій адміністрації думки розділені. Деякі вважають визнання Мін необхідним кроком до припинення десятиліть кровопролиття та відновлення національної єдності. Інші попереджають, що такий крок скомпрометує основоположні ідеали Республіки та легітимізує авторитарне правління.\n\nМайбутнє Китаю висить на волосині. Ми повинні вирішити, чи прагнути єдності — чи тримати лінію проти імперіалізму."
ming.21.a:0 "Ще ні... але ми визнаємо їх центральним урядом."
ming.21.b:0 "Настав час! Ми нарешті можемо возз'єднати Китай!"
ming.21.c:0 "Співпрацювати з імперіалістами? Нізащо!"

 ming.22.t:0 "Республіканці Визнають Нас Центральним Урядом!"
ming.22.desc:0 "Республіканський уряд офіційно визнав наш авторитет як легітимний центральний уряд Китаю. Хоча повне возз'єднання залишається на розгляді, це визнання знаменує велику дипломатичну перемогу.\n\nДвір розглядає цей розвиток як підтвердження нашої позиції та крок до відновлення національної єдності.\n\nМандат Небес стає сильнішим. Шлях до повного возз'єднання тепер відкритий."
ming.22.a:0 "Ще не об'єднані, але скоро!"

ming.23.t:0 "Республіканці Пропонують Повне Возз'єднання!"
ming.23.desc:0 "У історичному кроці Республіканський уряд запропонував повне возз'єднання під імперським прапором. Усі адміністративні та військові структури мають бути інтегровані, і Республіка розпустить свою незалежну владу.\n\nІмператор оголосив цей момент тріумфом дипломатії та долі. Шрами розколу починають гоїтися.\n\nКитай знову об'єднаний — під Мандатом Небес."
ming.23.a:0 "Ваньсуй!"

ming.24.t:0 "Республіканці Відмовляються Співпрацювати!"
ming.24.desc:0 "Незважаючи на наші пропозиції, Республіканський уряд відхилив усі пропозиції про примирення. Вони відмовляються визнати нашу владу та підтвердили свою прихильність до ідеологічної незалежності.\n\nДвір висловлює розчарування, але не здивування. Шлях до єдності залишається заблокованим — наразі.\n\nМандат триває. Ми продовжуватимемо діяти в інтересах національного відновлення."
ming.24.a:0 "Що? Після всього цього?"

ming.25.t:0 "Возз'єднаний Китай!"
ming.25.desc:0 "Після довгої виснажливої боротьби Велика Мін тріумфувала над усіма претендентами. Республіканські самозванці в Гуанчжоу розгромлені, їхня мрія про так звану сучасну республіку згасла під гуркіт імперської зброї. На далекому заході, сепаратисти Сіньцзяну та повстанці Тибету повернуті до складу імперії, їхні прапори зірвані, коли Трон Дракона відновлює свій стародавній суверенітет.\n\nВперше з моменту краху старої династії у 1911 році, Серединне Царство знову схиляється перед одним правителем, одним Сином Небес, однією Імперією. Мандат Небес відновлено, а ганьба розколу стерта. Двір у Нанкіні проголошує всім націям, що Китай знову цілий — відроджений, непорушний та призначений повернути собі законне місце серед великих світових держав."
ming.25.a:0 "Настав час... нарешті об'єднати Китай."

ming.27.t:0 "Доля Чосону"
ming.27.desc:0 "Протягом століть Королівство Чосон стояло як наш найвірніший васал, відданий слуга та буферна держава проти штормів зовнішнього світу. Крізь війну та мир, голод та процвітання, вони схиляли коліно перед Сином Небес, пропонуючи данину та визнання верховенства Небесного Трону. Проте часи змінилися. Династія, колись непохитна у своїй повазі, тепер хитається під вагою іноземних інтриг та шепоту про незалежність. Імперські посланці повідомляють, що двір Чосону стає неспокійним, розірваний між лояльністю до старого ладу та спокусами стати самостійним.\n\nВелика Імперія Мін має тепер вирішити їхню долю. Залишити Чосон як є, забезпечує постійну данину та стабільність, хоча їхні амбіції можуть зрости безконтрольно в наступні роки. Анексувати Чосон безпосередньо до імперії означало б об'єднати півострів під Небесним Прапором, зміцнюючи нашу оборону та наше панування над Сходом — але це, безсумнівно, викличе невдоволення серед народу Хансона, який знає свою власну королівську лінію протягом поколінь. І нарешті, є ті, хто шепоче у Забороненому Місті, що Чосон вже відслужив своє. Надавши їм незалежність, ми розірвали б стародавні зв'язки вірності та кинули б їх у світ, щоб вони самі дбали про себе, хоча й ціною нашого традиційного верховенства.\n\nВибір, що стоїть перед нами, є питанням самої історії: чи залишиться Чосон данницьким буфером, чи буде поглинений тілом Імперії, чи стоятиме на самоті як суверенна нація? Лише Син Небес має вирішити, як спадщина Чосону буде згадана в анналах Небесного Двору."
ming.27.a:0 "Залишити як є."
ming.27.b:0 "Анексувати їх до Китаю!"
ming.27.c:0 "Вони служили нам досить довго."

ming.28.t:0 "Мін Вимагає Прямий Контроль Над Нами!"
ming.28.desc:0 "Імперія Мін видала всеосяжну вимогу: наші концесійні території, колись вирізані з Японії іноземним договором, мають бути передані під їхню пряму адміністрацію. Вони стверджують, що є визволителями, які змітають останні залишки імперського приниження, але для нас це означало б кінець нашої автономії. Поступка може запобігти кровопролиттю, але відмова ризикує втягнути нас у відкритий конфлікт з однією з наймогутніших держав світу."
ming.28.a:0 "Прийняти вимогу — передати міста Мін."
ming.28.b:0 "Відмовитися від їхніх вимог — Це міжнародна зона!"

ming.29.t:0 "Міжнародні Концесійні Міста Піддаються!"
ming.29.desc:0 "Під тиском нашого уряду, концесійні влади підкорилися без опору. Іноземні держави відкликали своїх адміністраторів, залишаючи нас у повному контролі над колись розділеними містами на рідних островах Японії."
ming.29.a:0 "Наш плацдарм у Японії забезпечено!"

ming.30.t:0 "Концесії Відмовляються..."
ming.30.desc:0 "Наш ультиматум концесійним властям був відхилений відверто. Тихо підтримані своїми іноземними спонсорами, вони заявили про свою незмінну лояльність до Нагасакського Договору. Їхня непокора — це виклик нашому суверенітету — той, який не можна ігнорувати, якщо ми хочемо встановити контроль над нашими концесіями в Японії."
ming.30.a:0 "Тоді ми візьмемо їх силою!"

ming.32.t:0 "Протест Тевтонських Держав"
ming.32.desc:0 "Тевтонська Імперія та її союзники висловили лютий протест проти наших дій у Японії, засуджуючи прямий контроль над міжнародними концесійними містами як нелегітимний. Вони вимагають негайного скасування, погрожуючи невизначеними наслідками, якщо ми проігноруємо їхній ультиматум. Деякі радники закликають до обережності, але інші відкидають протести як порожній позерство."
ming.32.a:0 "Можливо, відступ буде розумним..."
ming.32.b:0 "Ми не дамо себе залякати!"

ming.34.t:0 "Протест Римських Держав"
ming.34.desc:0 "Як Східний, так і Західний Римські уряди висловили рішуче засудження наших дій у Японії. Заявляючи, що наші кроки дестабілізують міжнародний порядок, вони погрожують санкціями та відплатою, якщо концесійні міста не будуть відновлені до їхнього попереднього статусу. Їхні посланці скупчуються в нашій столиці, вимагаючи відповіді."
ming.34.a:0 "Віддати міста."
ming.34.b:0 "Ігнорувати їхні вимоги!"

ming.31.t:0 "Мін Захоплює Японські Концесії"
ming.31.desc:0 "Надійшла звістка зі Сходу: уряд Мін в односторонньому порядку захопив міжнародні концесійні міста в Японії, вигнавши іноземні влади та оголосивши їх невід'ємною частиною своєї імперії. Цей сміливий акт шокував світ, викликавши обурення в дипломатичних колах. Кайзерпакт тепер стоїть перед вирішальним вибором — чи протистояти агресії Мін безпосередньо, чи обмежитися лише дипломатичним протестом."
ming.31.a:0 "Війна — єдина відповідь!"
ming.31.b:0 "Надіслати офіційний протест."
ming.31.c:0 "Нічого не робити — це занадто далеко, щоб мати значення."

ming.33.t:0 "Мін Захоплює Японські Концесії"
ming.33.desc:0 "Імперія Мін оголосила про припинення міжнародних концесій у Японії, захопивши їх силою указу. Адміністратори та війська вже вислані. Серед Римських імперій та їхніх союзників вирують дебати: чи слід терпіти непокору Мін, чи покарати? Дехто шепоче, що конфронтація в Азії може лише перенапружити нас."
ming.33.a:0 "Війна має прийти!"
ming.33.b:0 "Протест, але не більше."
ming.33.c:0 "Звернути наш погляд на інше."

ming.35.t:0 "Мін Вимагає Нашого Підкорення!"
ming.35.desc:0 "Надійшов ультиматум від двору Мін. З арміями, стягнутими вздовж наших кордонів, та флотами, що патрулюють моря, вони вимагають, щоб Дайнам здав свій суверенітет і був поглинутий їхньою імперією. Дехто в нашому дворі шепоче, що опір марний, тоді як інші клянуться боротися до останнього, щоб не побачити нашу батьківщину в кайданах."
ming.35.a:0 "У нас немає вибору, окрім як підкоритися..."
ming.35.b:0 "Ніколи! Дайнам буде чинити опір!"

ming.36.t:0 "Дайнам Підкоряється!"
ming.36.desc:0 "Зіткнувшись із вагою наших вимог, влада Дайнаму підкорилася. Їхні чиновники відійшли, їхні прапори опущені, і їхня земля тепер переходить до наших рук без опору. Народ Дайнаму прокидається до нової реальності: відновлене над ними правління Серединного Царства."
ming.36.a:0 "Ще одна перлина повертається до Імперії."

ming.37.t:0 "Дайнам Чинить Нам Опір!"
ming.37.desc:0 "Наш ультиматум був відхилений. Уряд Дайнаму оголосив, що вони ніколи не підкоряться, посилаючись на стародавню незалежність та закликаючи свій народ повстати проти могутності Мін. Їхня відмова залишає нам лише один шлях, якщо ми хочемо відстояти наші законні претензії: війна."
ming.37.a:0 "Тоді нехай війна вирішить їхню долю."


ming.200.t:0 "Мандат Небес Підтверджено"
ming.200.desc:0 "У момент гордого імперського відродження, Велика Імперія Мін оголосила про повне підтвердження Мандату Небес. Після років внутрішніх чвар, політичних чисток та Сіньхайської революції, Імператор тепер стоїть беззаперечно на чолі відродженої держави. Імператорський двір у Пекіні видав прокламації, що підтверджують божественне право Мін на правління, підкріплене всеосяжними реформами та військовою реструктуризацією. На церемонії були присутні посланці Східного Риму, що свідчить про продовження стратегічної узгодженості між двома стародавніми державами. По всій Азії та за її межами уряди переглядають свої позиції. Республіканські елементи в Гуандуні та Юньнані замовкли, і шепіт про другу війну стає гучнішим..."
ming.200.a:0 "Мандат наш знову. Нехай усі під Небесами засвідчать це."
ming.200.b:0 "Вони сміють називати себе легітимними? Ми мусимо готуватися — наближається буря."
ming.200.c:0 "Цікаві події на Сході."

ming.201.t:0 "Інцидент на Мосту Бейцзі"
ming.201.desc:0 "Сьогодні на світанку на мосту Бейцзі в Чунціні спалахнула перестрілка між Імперськими та Республіканськими прикордонними силами. Те, що почалося як рутинний патруль Мін, закінчилося короткою, але кривавою сутичкою, залишивши тіла розкиданими вздовж берега річки. Офіційні звіти, як і очікувалося, суперечливі — Республіканці звинувачують Мін у провокації, тоді як Імперський двір кричить про саботаж. Проте за риторикою криється щось більш зловісне: тріщина у крихкому мирі, що стримує потік війни. Напруга зараз зростає по всьому кордону. Стягуються війська, піднімаються укріплення, і поширюється шепіт про мобілізацію. Спроби посередництва з боку Східних Римських та Тевтонських спостерігачів провалилися. Багато хто побоюється, що ця сутичка запам'ятається менше своїми загиблими, ніж тим, що вона розв'язала. Тиша порушується. Схід ворушиться."
ming.201.a:0 "Відплата!"
ming.201.b:0 "Барабани війни замовкли... наразі."
ming.201.c:0 "Трагічне непорозуміння... чи щось більше?"

ming.202.t:0 "Друга Республіканська Війна"
ming.202.desc:0 "Війна знову спалахнула в Китаї. Після невдалого ультиматуму та зростання напруги, Імперія Мін розпочала повномасштабну кампанію, щоб придушити опір Республіканців, що залишився. Конфлікт, названий 'Другою Республіканською Війною', або 'Другою Сіньхайською Революцією' Республіканськими силами, загрожує охопити регіон безпрецедентним насильством.\n\nРеспубліканські сили оголосили повну мобілізацію, обіцяючи захищати свій суверенітет за будь-яку ціну. Тим часом іноземні спостерігачі висловлюють занепокоєння, оскільки дипломатичні канали руйнуються, а лінії фронту стають жорсткими. Схід тремтить. Дракон марширує. І світ спостерігає, не впевнений, чи залишиться ця війна локальною — чи переросте в щось набагато більше."
ming.202.a:0 "Вперед! До Перемоги!"
ming.202.b:0 "Ми мусимо перемогти!"
ming.202.c:0 "Чи є якась надія на мир?"

ming.203.t:0 "Китай Возз'єднаний"
ming.203.desc:0 "Друга Республіканська Війна закінчилася, і Велика Імперія Мін досягла повного возз'єднання Китаю. Фінальний опір був розгромлений, і імперські прапори тепер майорять над кожною колишньою повстанською провінцією.\n\nПекін оголосив про повне відновлення національної єдності. Мандат Небес стоїть беззаперечно, і авторитет Імператора простягається від узбережжя до гір.\n\nПо всьому світу уряди реагують з обережністю та благоговінням. Баланс сил у Східній Азії змінився. Дракон прокинувся — і він повернув собі свій трон."
ming.203.a:0 "Ваньсуй!"
ming.203.b:0 "Вони відновили своє місце серед Великих Держав..."