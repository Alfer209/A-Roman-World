l_english:
 eastromandebufftest:0 "East Roman Debuff Test"
 eastromandebufftest_desc:0 "I serve the Emperor!"

 ERE_armyexpansion:0 "Rapid Army Expansion"
 ERE_armyexpansion_desc:0 "The Empire has committed to a sweeping expansion of its military forces. Recruitment surges, training accelerates, and new legions rise to meet the coming storm."

 agentsinalltheatres:0 "Agents In All Theatres"
 agentsinalltheatres_desc:0 "The Roman intelligence network spans every front. Agents operate in foreign lands, gathering information, sabotaging enemies, and shaping the battlefield from the shadows."

 imperialcentralcommand:0 "Imperial Central Command"
 imperialcentralcommand_desc:0 "A unified command structure now governs all Roman military operations."

 easternconsolidation:0 "Eastern Consolidation"
 easternconsolidation_desc:0 "The Eastern Roman Empire chooses to consolidate and commit all defense in her territory instead of her Western Roman allied homeland."

 easternconsolidation2:0 "Eastern Consolidation"
 easternconsolidation2_desc:0 "The Eastern Roman Empire chooses to consolidate and commit all defense in her territory instead of her Western Roman allied homeland."

 westernconsolidation:0 "Western Consolidation"
 westernconsolidation_desc:0 ""

 
 ERE_rallyingpeople:0 "Rally of the Roman People"
 ERE_rallyingpeople_desc:0 "The Roman people have answered the call. National unity surges as citizens embrace their role in defending the Empire and restoring its ancient glory."

 ERE_massproduction:0 "Mass Production"
 ERE_massproduction_desc:0 "Our factories roar with renewed purpose. Mass production of arms, vehicles, and supplies ensures our legions remain equipped for prolonged conflict."

 alloutdefense:0 "All Out Defense"
 alloutdefense_desc:0 "Fortifications rise, factories roar, and the legions prepare to defend the homeland with unyielding resolve. Rome shall not fall again."

 newdefenseindustry:0 "Defense Industry"
 newdefenseindustry_desc:0 "War demands steel, oil, and sacrifice. We expand our military-industrial complex, converting civilian factories into engines of war. Ammunition, vehicles, and weapons flow from our workshops, ensuring the legions are never wanting. The Empire’s survival depends on its ability to arm itself faster than its foes."

 armadefenseindustry:0 "Defense Industry"
 armadefenseindustry_desc:0 "War demands steel, oil, and sacrifice. We expand our military-industrial complex, converting civilian factories into engines of war. Ammunition, vehicles, and weapons flow from our workshops, ensuring the legions are never wanting. The Empire’s survival depends on its ability to arm itself faster than its foes."

 heavyindustrydefense:0 "Defense Industry"
 heavyindustrydefense_desc:0 "War demands steel, oil, and sacrifice. We expand our military-industrial complex, converting civilian factories into engines of war. Ammunition, vehicles, and weapons flow from our workshops, ensuring the legions are never wanting. The Empire’s survival depends on its ability to arm itself faster than its foes."

 increasedstatereserves:0 "Increased State Reserves"
 increasedstatereserves_desc:0 "In times of crisis, foresight is as vital as firepower. The Empire stockpiles strategic materials—fuel, metals, and food—ensuring continuity in the face of siege or embargo. These reserves will sustain our armies and our people when the world turns cold and hostile."

 integratedsubjecteconomies:0 "Integrated Subject Economies"
 integratedsubjecteconomies_desc:0 "The provinces and client states of the Empire must serve a unified purpose. Through economic integration, eliminates inefficiencies and redirect their output toward imperial goals. No longer fragmented, the dominion becomes a single, synchronised machine of production and power."

 romanresearchinstitue:0 "Roman Research Institute"
 romanresearchinstitue_desc:0 "Knowledge is the cornerstone of supremacy. East Rome must establish a centralised institute to coordinate scientific efforts across the Empire."

 antiteutoniclegions:0 "Anti Teutonic Legions"
 antiteutoniclegions_desc:0 "The Teutonic menace threatens the Empire’s borders and ideals. In response, Constantinople must raise specialised legions trained to counter their tactics and break their formations. These elite units carry the fire of Roman vengeance and the discipline of centuries. The barbarians shall be repelled once more."

 antifrancianlegions:0 "Anti Teutonic Legions"
 antifrancianlegions_desc:0 "The Teutonic menace threatens the Empire’s borders and ideals. In response, Constantinople must raise specialised legions trained to counter their tactics and break their formations. These elite units carry the fire of Roman vengeance and the discipline of centuries. The barbarians shall be repelled once more."

 britishdestroyer:0 "British Destroyer"
 britishdestroyer_desc:0 "The illegimate usurpers in Britian must answer to their destruction, as they now attack their former overlords."

 reconquerer:0 "Flame of Reconquest"
 reconquerer_desc:0 "The dream of a united Roman world burns anew. Rome ignites the imperial ambition to reclaim lost territories and restore ancient borders. The legions march not for conquest alone, but for destiny. The flame of reconquest shall light the path to glory."

 latinhellenicsolidatry:0 "Latin Hellenic Solidarity"
 latinhellenicsolidatry_desc:0 "Though divided by centuries, the Latin West and Hellenic East share a common heritage. By fostering unity between Roman and Greek peoples, forges a cultural and military alliance rooted in shared history. Together, they stand as pillars of civilization against the chaos beyond."

 deathanddestruction:0 "Death and Destruction"
 deathanddestruction_desc:0 "East Roman planes deliver death and destruction from the sky."

 ERE_sinolegions:0 "Sino Legions"
 ERE_sinolegions_desc:0 "The Eastern Roman Imperial Legions have been sent to fight alongside their Chinese imperial brothers against the republican menance."

