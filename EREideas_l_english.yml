 strikewest:0 "Focus on the West"
 strikewest_desc:0 "The Eastern Romans choose to assist their brothers in the west than consolidate within their homeland."

 ERE_legacyofjustinian:0 "Legacy of Justinian"
 ERE_legacyofjustinian_desc:0 "By following the legacy of Justinian the Great, can Constantinople and her Empire finally suceed and prevail over its foes. "

 integratedwesterneconomies:0 "Integrated Western Economies"
 integratedwesterneconomies_desc:0 "Western Roman industries are integrated into East Rome's economic efforts."

 antirepublicanism:0 "Anti-Republican in China"
 antirepublicanism_desc:0 "This country has taken a stance against all Republicanism in China."

 romaneurope:0 "Crusade For A Roman Europe"
 romaneurope_desc:0 "Constantinople has taken the stance of taking back its rightful place in history, as leader of Europe and pinnacle of civilisation."

 dispersedworkshops:0 "Dispersed Workshops"
 dispersedworkshops_desc:0 "Without coordinated effort, industrial output lags. Factories and artisans work at cross purposes, limiting production."

 neglectedarmy:0 "Neglected Army"
 neglectedarmy_desc:0 "Once proud legions now languish in neglect, their discipline eroded and readiness undermined by neglect."

 neglectedarmy2:0 "Neglected Army"
 neglectedarmy2_desc:0 "Once proud legions now languish in neglect, their discipline eroded and readiness undermined by neglect."

 neglectedarmy3:0 "Neglected Army"
 neglectedarmy3_desc:0 "Once proud legions now languish in neglect, their discipline eroded and readiness undermined by neglect."

 neglectedarmy4:0 "Modernised Army"
 neglectedarmy4_desc:0 "Constantinople has finally come to their senses and invested in their legions, restoring the honour they once had during the times of ancient Rome."

 eastwestschism:0 "East-West Schism"
 eastwestschism_desc:0 "Once proud and united, Rome and Constantinople has had a falling ever since the loss of the last Belisarius dynastic emperor of West Rome, which resulted in Constantinople declaring its twin empire illegitimate. The recent Illyrian War only eroded its relations even more."

 eastwestschism2:0 "East-West Schism"
 eastwestschism2_desc:0 "Once proud and united, Rome and Constantinople has had a falling ever since the loss of the last Belisarius dynastic emperor of West Rome, which resulted in Constantinople declaring its twin empire illegitimate. The recent Illyrian War only eroded its relations even more."

 eastromandiscipline:0 "East Roman Discipline"
 eastromandiscipline_desc:0 "Once again the Eastern Roman army regains its ancient Roman legion honour of discipline, strength, and pride."

 imperiallegitimacycampaign:0 "Imperial Legitimacy Campaign"
 imperiallegitimacycampaign_desc:0 "For centuries the Empire has been divided by questions of legitimacy, with rival claimants in Rome and Constantinople. By rallying scholars, jurists, and chroniclers, we are mounting a coordinated campaign to prove that our claim to the Imperial throne is the only rightful one. Every speech, decree, and pamphlet strengthens the idea that we alone embody the true Roman legacy."

 nobleandpatriciansupport:0 "Noble and Patrician Support"
 nobleandpatriciansupport_desc:0 "The great houses of Rome and Constantinople have long shaped the fate of empires. By courting their loyalty through marriages, honors, and political concessions, we can secure their backing for our unification project. With the nobility on our side, the vision of a single Rome gains legitimacy not only in law but in tradition."

 peopleledunificationmovements:0 "People-led Unification Movements"
 peopleledunificationmovements_desc:0 "The call for unity is no longer confined to palaces and senates. From the marketplaces of Constantinople to the streets of Rome, the people themselves demand that the Empire be one again. Though disorganised, their passion cannot be ignored; these popular demonstrations provide us with the momentum to turn a dream of unification into reality."