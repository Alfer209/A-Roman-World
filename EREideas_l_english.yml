strikewest:0 "Фокус на Захід"
strikewest_desc:0 "Східні римляни обирають допомагати своїм братам на заході, а не консолідуватися на своїй батьківщині."

ERE_legacyofjustinian:0 "Спадщина Юстиніана"
ERE_legacyofjustinian_desc:0 "Слідуючи спадщині Юстиніана Великого, Константинополь і його імперія нарешті зможуть досягти успіху та перемогти своїх ворогів."

integratedwesterneconomies:0 "Інтеграція західних економік"
integratedwesterneconomies_desc:0 "Західноримські галузі інтегруються в економічні зусилля Східного Риму."

antirepublicanism:0 "Антиреспубліканізм у Китаї"
antirepublicanism_desc:0 "Ця країна зайняла позицію проти республіканізму в Китаї."

romaneurope:0 "Хрестовий похід за римську Європу"
romaneurope_desc:0 "Константинополь зайняв позицію повернення свого законного місця в історії як лідер Європи та вершина цивілізації."

dispersedworkshops:0 "Розпорошені майстерні"
dispersedworkshops_desc:0 "Без скоординованих зусиль промисловий випуск відстає. Заводи та ремісники працюють розрізнено, обмежуючи виробництво."

neglectedarmy:0 "Занедбана армія"
neglectedarmy_desc:0 "Колись горді легіони тепер занепадають через нехтування, їхня дисципліна підірвана, а готовність послаблена."

neglectedarmy2:0 "Занедбана армія"
neglectedarmy2_desc:0 "Колись горді легіони тепер занепадають через нехтування, їхня дисципліна підірвана, а готовність послаблена."

neglectedarmy3:0 "Занедбана армія"
neglectedarmy3_desc:0 "Колись горді легіони тепер занепадають через нехтування, їхня дисципліна підірвана, а готовність послаблена."

neglectedarmy4:0 "Модернізована армія"
neglectedarmy4_desc:0 "Константинополь нарешті схаменувся і вклав кошти в свої легіони, відновивши честь, яку вони мали за часів Стародавнього Риму."

eastwestschism:0 "Східно-західний розкол"
eastwestschism_desc:0 "Колись гордий і єдиний, Рим і Константинополь розійшлися після втрати останнього імператора династії Белізарія в Західному Римі, що призвело до оголошення Константинополем свого брата-імперії нелегітимною. Недавня Іллірійська війна лише погіршила відносини."

eastwestschism2:0 "Східно-західний розкол"
eastwestschism2_desc:0 "Колись гордий і єдиний, Рим і Константинополь розійшлися після втрати останнього імператора династії Белізарія в Західному Римі, що призвело до оголошення Константинополем свого брата-імперії нелегітимною. Недавня Іллірійська війна лише погіршила відносини."

eastromandiscipline:0 "Східноримська дисципліна"
eastromandiscipline_desc:0 "Східноримська армія знову здобуває давньоримську честь легіонів — дисципліну, силу та гордість."

imperiallegitimacycampaign:0 "Кампанія імперської легітимності"
imperiallegitimacycampaign_desc:0 "Протягом століть імперію розділяли питання легітимності, з конкуруючими претендентами в Римі та Константинополі. Згуртовуючи вчених, юристів і літописців, ми розпочинаємо скоординовану кампанію, щоб довести, що наше право на імперський трон є єдино законним. Кожна промова, указ і памфлет зміцнюють ідею, що лише ми втілюємо справжню римську спадщину."

nobleandpatriciansupport:0 "Підтримка дворян і патриціїв"
nobleandpatriciansupport_desc:0 "Великі доми Риму та Константинополя довго формували долю імперій. Залучаючи їхню лояльність через шлюби, почесті та політичні поступки, ми можемо забезпечити їхню підтримку нашого проєкту об'єднання. З дворянством на нашому боці бачення єдиного Риму отримує легітимність не лише в законі, але й у традиціях."

peopleledunificationmovements:0 "Народні рухи за об'єднання"
peopleledunificationmovements_desc:0 "Заклик до єдності більше не обмежується палацами та сенатами. Від ринків Константинополя до вулиць Риму сам народ вимагає, щоб імперія знову стала єдиною. Хоча ці рухи неорганізовані, їхню пристрасть не можна ігнорувати; ці народні демонстрації надають нам імпульс, щоб перетворити мрію про об'єднання в реальність."