#Потребує редагування

eastromandebufftest:0 "Тест дебафу Східного Риму"
eastromandebufftest_desc:0 "Я служу імператору!"

ERE_armyexpansion:0 "Швидке розширення армії"
ERE_armyexpansion_desc:0 "Імперія взяла на себе зобов'язання масштабно розширити свої збройні сили. Набір прискорюється, навчання інтенсифікується, і нові легіони формуються, щоб зустріти наближаючу бурю."

agentsinalltheatres:0 "Агенти на всіх театрах"
agentsinalltheatres_desc:0 "Розвідувальна мережа Риму охоплює кожен фронт. Агенти діють у чужих землях, збираючи інформацію, саботуючи ворогів і формуючи поле бою з тіні."

imperialcentralcommand:0 "Імперське центральне командування"
imperialcentralcommand_desc:0 "Єдина структура командування тепер керує всіма римськими військовими операціями."

easternconsolidation:0 "Східна консолідація"
easternconsolidation_desc:0 "Східна Римська Імперія обирає консолідацію та повне зосередження оборони на своїй території замість союзної батьківщини Західного Риму."

easternconsolidation2:0 "Східна консолідація"
easternconsolidation2_desc:0 "Східна Римська Імперія обирає консолідацію та повне зосередження оборони на своїй території замість союзної батьківщини Західного Риму."

westernconsolidation:0 "Західна консолідація"
westernconsolidation_desc:0 ""

ERE_rallyingpeople:0 "Згуртування римського народу"
ERE_rallyingpeople_desc:0 "Римський народ відгукнувся на заклик. Національна єдність зростає, оскільки громадяни приймають свою роль у захисті імперії та відновленні її давньої слави."

ERE_massproduction:0 "Масове виробництво"
ERE_massproduction_desc:0 "Наші заводи гудять із новою метою. Масове виробництво зброї, техніки та припасів забезпечує оснащення наших легіонів для тривалого конфлікту."

alloutdefense:0 "Тотальна оборона"
alloutdefense_desc:0 "Укріплення зростають, заводи гудять, а легіони готуються захищати батьківщину з непохитною рішучістю. Рим більше не впаде."

newdefenseindustry:0 "Оборонна промисловість"
newdefenseindustry_desc:0 "Війна вимагає сталі, нафти та жертв. Ми розширюємо наш військово-промисловий комплекс, перетворюючи цивільні заводи на двигуни війни. Боєприпаси, техніка та зброя течуть із наших майстерень, забезпечуючи легіони всім необхідним. Виживання імперії залежить від її здатності озброюватися швидше за ворогів."

armadefenseindustry:0 "Оборонна промисловість"
armadefenseindustry_desc:0 "Війна вимагає сталі, нафти та жертв. Ми розширюємо наш військово-промисловий комплекс, перетворюючи цивільні заводи на двигуни війни. Боєприпаси, техніка та зброя течуть із наших майстерень, забезпечуючи легіони всім необхідним. Виживання імперії залежить від її здатності озброюватися швидше за ворогів."

heavyindustrydefense:0 "Оборонна промисловість"
heavyindustrydefense_desc:0 "Війна вимагає сталі, нафти та жертв. Ми розширюємо наш військово-промисловий комплекс, перетворюючи цивільні заводи на двигуни війни. Боєприпаси, техніка та зброя течуть із наших майстерень, забезпечуючи легіони всім необхідним. Виживання імперії залежить від її здатності озброюватися швидше за ворогів."

increasedstatereserves:0 "Збільшення державних резервів"
increasedstatereserves_desc:0 "У часи кризи передбачливість так само важлива, як вогнева міць. Імперія накопичує стратегічні матеріали — паливо, метали та продовольство, — забезпечуючи стійкість перед обличчям облоги чи ембарго. Ці резерви підтримають наші армії та народ, коли світ стане холодним і ворожим."

integratedsubjecteconomies:0 "Інтеграція економік підлеглих"
integratedsubjecteconomies_desc:0 "Провінції та клієнтські держави імперії повинні служити єдиній меті. Завдяки економічній інтеграції ми усуваємо неефективність і перенаправляємо їхній випуск на імперські цілі. Більше не роздроблена, імперія стає єдиною, синхронізованою машиною виробництва та сили."

romanresearchinstitue:0 "Римський дослідницький інститут"
romanresearchinstitue_desc:0 "Знання — це наріжний камінь переваги. Східний Рим повинен створити централізований інститут для координації наукових зусиль по всій імперії."

antiteutoniclegions:0 "Анти-тевтонські легіони"
antiteutoniclegions_desc:0 "Тевтонська загроза становить небезпеку для кордонів і ідеалів імперії. У відповідь Константинополь повинен сформувати спеціалізовані легіони, навчені протидіяти їхній тактиці та розбивати їхні формування. Ці елітні підрозділи несуть вогонь римської помсти та дисципліну століть. Варвари будуть відбиті знову."

antifrancicanlegions:0 "Анти-тевтонські легіони"
antifrancicanlegions_desc:0 "Тевтонська загроза становить небезпеку для кордонів і ідеалів імперії. У відповідь Константинополь повинен сформувати спеціалізовані легіони, навчені протидіяти їхній тактиці та розбивати їхні формування. Ці елітні підрозділи несуть вогонь римської помсти та дисципліну століть. Варвари будуть відбиті знову."

britishdestroyer:0 "Британський руйнівник"
britishdestroyer_desc:0 "Нелегітимні узурпатори в Британії повинні відповісти за своє знищення, оскільки вони тепер атакують своїх колишніх володарів."

reconquerer:0 "Полум'я відвоювання"
reconquerer_desc:0 "Мрія про об'єднаний римський світ палає знову. Рим розпалює імперські амбіції, щоб повернути втрачені території та відновити стародавні кордони. Легіони марширують не лише заради завоювань, але заради долі. Полум'я відвоювання освітить шлях до слави."

latinhellenicsolidatry:0 "Латино-еллінська солідарність"
latinhellenicsolidatry_desc:0 "Хоча століттями розділені, латинський Захід і еллінський Схід мають спільну спадщину. Сприяючи єдності між римськими та грецькими народами, ми створюємо культурний і військовий союз, заснований на спільній історії. Разом вони стоять як стовпи цивілізації проти хаосу за їхніми межами."

deathanddestruction:0 "Смерть і руйнування"
deathanddestruction_desc:0 "Східноримські літаки несуть смерть і руйнування з небес."

ERE_sinolegions:0 "Китайські легіони"
ERE_sinolegions_desc:0 "Східноримські імперські легіони відправлені битися пліч-о-пліч зі своїми китайськими імперськими братами проти республіканської загрози."

ERE_sinolegions2:0 "Китайські легіони"
ERE_sinolegions2_desc:0 "Східноримські імперські легіони відправлені битися пліч-о-пліч зі своїми китайськими імперськими братами проти республіканської загрози."

