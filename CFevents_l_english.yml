l_english:


cf.1.t:0 "Падіння Риму"
cf.1.d:0 "Рим упав. Вічне Місто, яке довго було символом імперської стійкості, було захоплене тевтонськими силами після запеклої битви. Західна Римська Імперія тепер тріщить після втрати свого священного серця, коли тріумфальні тевтонські прапори майорять над руїнами її стародавніх палаців. Для Кайзерпакту ця перемога є кульмінацією їхніх амбіцій; для римлян — це гірке нагадування про крихкість їхньої відновленої імперії. По всьому світу спостерігачі розмірковують, чи є це падіння лише тимчасовою невдачею — чи початком кінця для Заходу."
cf.1.a:0 "Трагедія для цивілізації."
cf.1.b:0 "Рим знову наш!"
cf.1.c:0 "Вічне Місто втрачено..."

cf.2.t:0 "Падіння Константинополя"
cf.2.d:0 "Вперше за свою довгу й славетну історію Константинополь упав. Валаські війська пробили легендарні Феодосієві стіни — укріплення, які понад тисячу років витримували кожну облогу і захищали серце Східної Римської Імперії. Імператор утік, і Королева Міст тепер у чужих руках. Ця безпрецедентна катастрофа потрясла імперію до самого її фундаменту, викликаючи сумніви, чи зможе вона колись відновитися. Для Кайзерпакту це вершина досягнень; для римлян — це день скорботи без прецеденту."
cf.2.a:0 "Шок для світу."
cf.2.b:0 "Королева Міст наша!"
cf.2.c:0 "Константинополь упав..."

cf.3.t:0 "Падіння Константинополя"
cf.3.d:0 "Неможливе стало реальністю: тевтонські прапори тепер майорять над Константинополем. Століттями місто було неприступною фортецею Сходу, його мури й захисники відбивали кожного загарбника. Але після жорстоких вуличних боїв оборона була нарешті подолана. Падіння Королеви Міст — це рана не лише для Східної Римської Імперії, але й для самої ідеї римської витривалості. Тевтонський престиж злітає до нових висот, тоді як для імперії ця катастрофа може сигналізувати про початок кінця."
cf.3.a:0 "Катастрофа для римлян."
cf.3.b:0 "Перлина імперії належить нам!"
cf.3.c:0 "Константинополь втрачено..."

cf.4.t:0 "Падіння Константинополя"
cf.4.d:0 "Після століть витримування кожної облоги й протистояння кожному ворогу Константинополь нарешті захоплений — цього разу арміями Паннонії. Падіння столиці Східної Римської Імперії, яке колись вважалося неможливим, відлунює по всьому світу. Місто було не просто фортецею; воно було живим символом римської ідентичності та стійкості. Бачити його в чужих руках — це означає стати свідком того, як сама історія ламається. Чи стане це смертельним ударом для імперії, чи лише тимчасовим приниженням, ще належить з’ясувати."
cf.4.a:0 "Світ потрясений."
cf.4.b:0 "Тріумф для всіх!"
cf.4.c:0 "Серце імперії втрачено..."

cf.6.t:0 "Падіння Константинополя"
cf.6.d:0 "Ворота Константинополя вперше в історії розбиті. Посеред кривавої Римської громадянської війни Королева Міст захоплена західноримськими силами. Армії під командуванням західноримського імператора Лоренцо тріумфально крокують вулицями, захоплюючи 'Столицю Сходу', яку вважали неприступною фортецею. Одразу після цього тут влаштували пради, щоб відсвяткувати повернення Нового Риму під владу Західного Риму. Багато хто впевнений, що це початок кінця Східної Римської Імперії..."
cf.6.a:0 "Чи повернувся Західний Рим, щоб здійснити свою долю?"
cf.6.b:0 "Новий Рим знову наш!"
cf.6.c:0 "Західні претенденти тримають серце Сходу..."

cf.5.t:0 "Падіння Гуанчжоу"
cf.5.d:0 "Прапори Великої Мін тепер майорять над Гуанчжоу. Після тижнів жорстоких боїв імперська армія нарешті захопила місто і поклала край владі Тимчасового Уряду над його столицею. Республіканські сили запекло билися на вулицях, але зрештою були розбиті або захоплені, їхнє керівництво тікало в розгубленості. Падіння Гуанчжоу — це не просто втрата міста, а символічний крах самої республіканської справи — їхній центр влади та адміністративний осередок вирвано з їхніх рук. Для Мін цей тріумф є вирішальним кроком до повного відновлення імперської влади, тоді як для Республіки шлях вперед стає дедалі темнішим з кожною годиною."
cf.5.a:0 "Значна подія."
cf.5.b:0 "Оплот Республіки упав!"
cf.5.c:0 "Як ми тепер відновимося?"
