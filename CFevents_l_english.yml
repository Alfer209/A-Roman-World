l_english:

 cf.1.t:0 "The Fall of Rome"
 cf.1.d:0 "Rome has fallen. The Eternal City, long a symbol of imperial resilience, has been captured by Teutonic forces after a hard-fought battle. The Western Roman Empire now reels from the loss of its sacred heart, as triumphant Teutonic banners fly over the ruins of its ancient palaces. For the the Kaiserpakt, this victory marks the culmination of their ambitions; for the Romans, it is a bitter reminder of the fragility of their restored empire. Across the world, observers wonder whether this fall marks merely a setback — or the beginning of the end for the West."
 cf.1.a:0 "A tragedy for civilisation."
 cf.1.b:0 "Rome is ours once more!"
 cf.1.c:0 "The Eternal City has been lost..."

 cf.2.t:0 "The Fall of Constantinople"
 cf.2.d:0 "For the first time in its long and storied history, Constantinople has fallen. Wallachian forces battered through the legendary Theodosian Walls — fortifications that for over a thousand years withstood every siege and safeguarded the heart of the Eastern Roman Empire. The Emperor has fled, and the Queen of Cities now lies in foreign hands. This unprecedented catastrophe has shaken the empire to its very foundation, casting doubt on whether it can ever recover. For the Kaiserpakt, this is a crowning achievement; for the Romans, it is a day of grief without precedent."
 cf.2.a:0 "A shock to the world."
 cf.2.b:0 "The Queen of Cities is ours!"
 cf.2.c:0 "Constantinople has fallen..."

 cf.3.t:0 "The Fall of Constantinople"
 cf.3.d:0 "The impossible has become reality: Teutonic banners now fly above Constantinople. For centuries, the city stood as the impregnable bastion of the East, its walls and defenders turning back every invader. But after brutal street fighting, the defenses were finally overwhelmed. The fall of the Queen of Cities is a wound not only to the Eastern Roman Empire but to the very idea of Roman endurance itself. Teutonic prestige soars to new heights, while for the empire, this disaster may signal the beginning of the end."
 cf.3.a:0 "A catastrophe for the Romans."
 cf.3.b:0 "The empire’s jewel belongs to us!"
 cf.3.c:0 "Constantinople is lost..."

 cf.4.t:0 "The Fall of Constantinople"
 cf.4.d:0 "After centuries of withstanding every siege and defying every enemy, Constantinople has finally been captured — this time by the armies of Pannonia. The fall of the Eastern Roman capital, once thought impossible, reverberates across the world. The city was more than just a fortress; it was the living symbol of Roman identity and resilience. To see it in foreign hands is to witness history itself break. Whether this marks the empire’s death knell or only a temporary humiliation remains to be seen."
 cf.4.a:0 "The world is shaken."
 cf.4.b:0 "A triumph for all!"
 cf.4.c:0 "The heart of the empire is gone..."
 
 cf.6.t:0 "Fall of Constantinople"
 cf.6.d:0 "The gates of Constantinople have been blasted open for the first time in history. In the midst of the bloody Roman Civil War, the Queen of Cities, have been captured by West Roman forces. The armies under West Roman Emperor Lorenzo marches triumphantly through the streets, taking the 'Capital of the East', which have thought to be the impregnatable fortress. Parades have been set up to witness the return of Nova Roma to West Roman rule. To some, this may be the end of the Eastern Roman Empire... "  
 cf.6.a:0 "Has West Rome returned to claim its destiny?"
 cf.6.b:0 "Nova Roma is ours once more!"
 cf.6.c:0 "The Western pretenders hold the heart of the East..."

 cf.5.t:0 "Fall of Guangzhou"
 cf.5.d:0 "The banners of the Great Ming now fly above Guangzhou. After weeks of brutal fighting, the Imperial army stormed the city and brought an end to the Provisional Government’s hold over its capital. Republican forces fought fiercely in the streets but were ultimately scattered or captured, their leadership fleeing in disarray. The fall of Guangzhou is not merely the loss of a city, but a symbolic collapse of the Republican cause itself — their seat of power and center of administration has been torn from their grasp. For the Ming, this triumph marks a decisive step toward the full restoration of imperial authority, while for the Republic, the path ahead grows darker with every passing hour."
 cf.5.a:0 "A significant development"
 cf.5.b:0 "The stronghold of the Republic has fallen!"
 cf.5.c:0 "How will we ever recover?"
