l_english:
mainnews.1.t: "Completion of the Bosporus Megabridge"
mainnews.1.desc: "In a stunning feat of modern engineering, the Eastern Roman Empire has completed the colossal Bosporus Megabridge, linking Europe and Asia with a span unmatched anywhere in the world. The project, once ridiculed as impossible, now stands as a proud symbol of Eastern Rome’s technical prowess and industrial resurgence./n/nSpectators from across the Empire gathered to watch the first vehicles cross the bridge, and newspapers throughout the world report it as a sign that the Romans are reclaiming their place as masters of trade, industry, and destiny./n/nWhile many applaud the achievement, some foreign analysts warn that such engineering power could soon be turned toward military ends."
mainnews.1.a: "Long live the Empire!"
mainnews.1.b: "Good for them."

mainnews.2.t: "Proclaimation of the Roman League"
mainnews.2.desc: "In a moment that echoes through the annals of history, the Western Roman Empire has answered Constantinople’s call. The ancient divide between East and West is mended, not with parchment, but with purpose. Today, the Roman League is proclaimed—a unified front forged from shared blood, legacy, and ambition. As threats loom beyond the imperial borders, the twin eagles of Rome rise together, wings outstretched over a world in turmoil. From the marble halls of the Palatine to the golden domes of the Bosporus, a single voice resounds: Rome endures."
mainnews.2.a: "Long live the Empire!"
mainnews.2.b: "Rome's power grows ever larger..."

mainnews.67.t: "Constantinople And Rome Rectifies Their Alliance"
mainnews.67.desc: "After decades of simmering contempt and fractured diplomacy, the Eastern and Western Roman spheres have reconciled, marking a historic unity unseen since the twilight of the old empire. The scars of the Illyrian War—fought ten years prior across the rugged hills of Illyria—still linger in the minds of generals and statesmen alike. That brutal conflict, ending in stalemate, had driven a wedge between Constantinople and Rome. Yet now, in the shadow of rising threats and shifting alliances across Europa, pragmatism triumphs over pride. Joint declarations are signed, military doctrines aligned, envoys exchanged with solemn ceremony. For some, this is the rebirth of imperial strength—two halves reforged into a singular Roman will. For others, it is a harbinger of renewed aggression cloaked in brotherhood."
mainnews.67.a: "East and West! Brothers Re-United!"
mainnews.67.b: "A united Rome means worse for all..."
mainnews.67.c: "East and West! Brothers Re-United!"

homelegions.1.t: "Home Legions"
homelegions.1.desc: "With the threat of invasion looming, the call to arms echoes across the provinces. No longer can we rely solely on professional soldiers—the people themselves must rise. Farmers, merchants, and scholars alike will take up arms to defend their homeland. These Home Legions, forged from duty and desperation, will stand as the Empire’s final shield against the coming storm."
homelegions.1.a: "Rise up! For the Empire!"
homelegions.1.b: "We are in no need of further troops."

homelegions.2.t: "Revival of the Legions of Gaul"
homelegions.2.desc: "The banners of the Legions of Gaul rise once more, their legacy echoing through the valleys of the Rhône and the forests of Germania. Once the iron fist of Julius Caesar, these legions carved the path of empire with discipline, valor, and ruthless efficiency. Now, in an age of steel and fire, we summon their spirit to forge a new destiny. Their revival is not mere nostalgia—it is a declaration that Rome remembers, and Rome returns."
homelegions.2.a: "These legions once was the backbone of Julius Caesar. Now it will guide us to victory."
homelegions.2.b: "There are no need for this ancient order."

persian.1.t: "The Romans ask us to honour the ancient alliance"
persian.1.desc: "TEST"
persian.1.a: "Yes! We will join them!"
persian.1.b: "No. We'll never bend the knee for Romans."

persian.2.t: "The Persian Empire honours the ancient alliance!"
persian.2.desc: "The Persian Empire has chosen to honor the ancient alliance. Their banners now fly beside ours, a symbol of unity between two great civilizations. Together, we shall face the trials ahead—not as rivals, but as brothers-in-arms. The Roman League grows stronger, and the world shall tremble before our combined might."
persian.2.a: "The Roman League grows ever stronger! Long Live the Empire!"

persian.3.t: "The Persians refuse to aid us."
persian.3.desc: "The Persian court has rejected our call for unity, casting aside centuries of shared struggle and diplomacy. Their refusal marks a bitter fracture in the legacy of cooperation, and with it, the dissolution of mutual guarantees. As tensions rise and enemies gather, the East must now prepare to face the storm without its oldest ally."
persian.3.a: "Damn Persians..."

hispania.1.t: "The Romans ask us to join them once more"
hispania.desc: "Rome once ruled Hispania with pride and purpose, and now the Eastern Empire seeks to rekindle that bond. With the formation of the Roman League underway, Hispania is invited to stand once more beneath the imperial eagle. Will they embrace their heritage and join the cause—or turn their back on the legacy that shaped them?"
hispania.1.a: "Long Live the Empire!"
hispania.1.b: "No. We'll never bend the knee for Romans."

hispania.2.t: "Spain stands with Rome once more!"
hispania.2.desc: "Hispania has pledged its loyalty to the Roman League. The old provinces rise again, not in rebellion, but in unity. With their strength added to ours, the dream of a restored empire inches closer to reality. The West awakens, and the eagle spreads its wings across the continent."
hispania.2.a: "Long Live the Empire!"

hispania.3.t: "The Spanish refuses to aid us."
hispania.3.desc: "Hispania has refused our offer of alliance, rejecting the call to unity and the legacy of Rome itself. Their decision weakens the League and emboldens our enemies. If they will not join us in peace, then they may yet face the consequences of defiance. The path forward grows darker—but Rome endures."
hispania.3.a: "They want the hard way then?"

romanleague.1.t: "Constantinople calls for a 'Roman League"
romanleague.1.desc: "The threat from the north looms ever closer, its shadow stretching across the fractured lands of the empire. The Teutonic Empire and her allies gather strength, and whispers of invasion grow louder with each passing day. In this hour of uncertainty, Constantinople reaches out—not with demands, but with a proposal rooted in shared legacy: the creation of a 'Roman League.' This alliance would bind East and West in mutual defense, rekindling the unity that once made Rome invincible. To reject it is to stand alone against the storm; to accept is to embrace a future forged in cooperation, strength, and imperial brotherhood. The Western court must now decide—will it answer the call, or let the old world fall divided?"
romanleague.1.a: "Let the Eagles unite once more!"
romanleague.1.b: "We do not require aid from the illegimate Eastern 'Romans'"

romanleague.2.t: "The Western Romans answer our call"
romanleague.2.desc: "The Western Roman Empire has accepted our proposal to form the Roman League. The twin eagles of Rome shall now soar together once more, bound by shared purpose and ancient legacy. This alliance marks the beginning of a renewed imperial order—one that may yet withstand the storms gathering beyond our borders."
romanleague.2.a: "Together, we shall endure. Long Live the Empire!"

romanleague.3.t: "The Western Romans' Bretrayal"
romanleague.3.desc: "Our offer of unity has been rejected. The Western Roman Empire has chosen isolation over cooperation, severing the bonds of mutual defense and trust. As the northern threat grows ever more dire, this decision casts a long shadow over the future of Rome. Diplomatic ties fray, and the dream of a united front fades into memory."
romanleague.3.a: "Yet they call themselves 'Romans'..."

romanleague.67.t: "Begin Consolidation In The East"
romanleague.67.desc: "For centuries, the twin pillars of the Roman world—Rome and Constantinople—stood together against the tides of chaos, barbarism, and decay. But time has not been kind to the Western half of our Empire. Plagued by internal instability, fractured loyalties, and an ever-weakening grasp on its provinces, the Western Roman Empire has become a shadow of its former self. Meanwhile, the East endures. Constantinople remains a beacon of civilisation, a bastion of order, and the last true guardian of Roman legacy. Yet we can no longer afford to stretch our legions thin across distant frontiers for the sake of a unity that exists only in name. The West has squandered its strength, and we must not follow it into ruin. The time has come to consolidate our defenses—not in Francia, not in Iberia, but here, in the heart of the Eastern Empire. Thrace, Anatolia, Syria, and Egypt must be fortified, supplied, and secured. Our cities must be shielded, our borders reinforced, and our armies restructured to defend what truly matters: the Eternal Empire of the East."
romanleague.67.a: "Let's begin."

romanleague.69.t: "Constantinople Consolidates In The East"
romanleague.69.desc: "News from Constantinople has sent shockwaves through the Western court. The Eastern Romans have chosen to abandon joint defense strategies, focusing instead on fortifying their own territories. To many in Rome, this is nothing short of betrayal—a retreat from shared imperial responsibility in favor of regional survival. Some call for retaliation, arguing that such selfishness must be punished. Others urge restraint, believing that any defense, even limited, is better than none. The fate of imperial unity now hangs in the balance."
romanleague.69.a: "What? How dare they? We must sabotage their efforts."
romanleague.69.b: "Help is help, even if it's little."

romanleague.68.t: "Consolidation Is A Success!"
romanleague.68.desc: "The consolidation efforts have borne fruit. Eastern defenses are reinforced, morale is high, and the provinces rally behind Constantinople’s renewed leadership. Despite the silence—or indifference—from the West, the Eastern Roman Empire stands stronger than it has in years. The Eternal City of the East has proven it can endure, even when left to face the storm alone. For now, the empire holds. And its people believe once more in its destiny."
romanleague.68.a: "Our Eternal Empire will stay Eternal!"

romanleague.66.t: "Consolidation Is A Failure!"
romanleague.66.desc: "The consolidation has faltered. Reports from the frontier reveal logistical failures, intercepted communications, and unexplained delays—all pointing to covert interference. Evidence suggests that agents loyal to the Western Roman court have undermined the effort, fearing a shift in power and autonomy. The betrayal stings deeply. In Constantinople, the Senate is divided: some argue that unity must be preserved at all costs, while others demand retribution. The dream of a united Rome dims, and the specter of civil fracture looms once more."
romanleague.66.a: "We still need them."
romanleague.66.b: "Their bretrayal will not be unpunished."

romanleague.207.t: "Constantinople Proposes Unification"
romanleague.207.desc: "As the fires of the Bellum Magnum rage across Europe, Constantinople has delivered a proposal that shakes the foundations of history itself. For centuries, the Roman world has been divided between East and West, bound together by legacy but separated by ambition, geography, and distrust. Now, faced with the existential threat of the Teutonic Empire and its Kaiserpakt allies, the Emperor of the East calls for unity — a single Roman state, standing shoulder to shoulder, as it did in the days of Augustus and Constantine.\n\nTo many in the Senate and among the people, this is a dream reborn — Rome restored in her ancient majesty, capable of crushing her enemies through the combined might of East and West. Yet to others, it is a dangerous surrender of sovereignty, an invitation to once again be dominated by foreign rulers in Constantinople. The decision now rests with us: will we embrace unification, or reject it in the name of our independence?"
romanleague.207.a: "Rome must be united once again!"
romanleague.207.b: "With the East 'Romans'? Never!"

romanleague.208.t: "West Rome Agrees!"
romanleague.208: "In a decision that will echo across centuries, the leaders of the Western Roman state have accepted Constantinople’s proposal. At long last, the division born of the ancient schism is to be healed. The banners of the East and West shall march together, the armies of Rome once more united under a common command. For the first time since the fall of the Eternal City, the dream of imperium sine fine — empire without end — appears within reach.\n\nThe Kaiser’s propagandists denounce this as desperation, but the world knows the truth: a united Rome is not merely a symbol, but a juggernaut. From the Danube to the Alps, from the Adriatic to the Aegean, the roar of the legions will once again remind all nations that Rome is eternal."
romanleague.208.a: "Ave Roma! Together, we are unstoppable."

romanleague.209.t: "West Rome Refuses..."
romanleague.209: "To our shock, the West has rejected the call for unification. The Senate has declared that the Western Roman state will not be subsumed under the Eastern throne, nor will it risk its independence by reviving an empire long consigned to history. To them, Rome’s legacy must be preserved through sovereignty, not subordination.\n\nThe refusal has caused fury in our Senate, where many see this as betrayal in the midst of the Bellum Magnum. The armies of the Teutons march relentlessly, yet Rome remains divided, her strength squandered by pride and distrust. The decision may one day be seen as a fatal blow to Roman destiny — or as the defiant stand of a people unwilling to kneel to Constantinople."
romanleague.209.a: "So Rome remains divided… at the cost of victory."

romanleague.888.t: "The Cry For One Rome"
romanleague.888.desc: "Across our lands, banners are raised and voices cry out for unity. Scholars, nobles, and common citizens alike call for the healing of the ancient rupture between East and West. Pamphlets proclaim that the Roman people are one, and that the schism was born not of faith but of dynastic pride. Once more, the call for one Empire echoes through the Forum and the Hagia Sophia alike."
romanleague.888.a: "Promote the rhetoric of legitimacy."
romanleague.888.b: "Encourage noble and patrician support."
romanleague.888.c: "Let the people lead the movement."

tanks.1.t: "The Imperial Tank Trials"
tanks.1.desc: "After months of grueling design, testing, and political maneuvering, the Imperial Tank Trials have reached their climax. Two competing prototypes now stand before us: Isildur’s tanks, known for their rugged simplicity and battlefield reliability, and Maximillian’s tanks, sleek, modern, and bristling with cutting-edge technology. Isildur’s design evokes the spirit of the legions—durable, swift, and built for mass deployment. It’s a tank for the soldier, forged with practicality in mind and capable of enduring the harshest conditions. Commanders praise its ease of maintenance and adaptability across varied terrain. It may not dazzle in parades, but it wins wars. Maximillian’s prototype, on the other hand, is a marvel of engineering. Heavier, more imposing, and equipped with state-of-the-art guns, it promises unmatched firepower and protection. Its presence alone can turn the tide of battle—but it demands precision, resources, and elite crews to operate at full potential. The Empire must now decide: do we embrace the reliability and speed of Isildur’s vision, or invest in the overwhelming might of Maximillian’s war machine?"
tanks.1.a: "Choose Isildur’s design"
tanks.1.b: "Choose Maximillian’s design"

teuton.1.t: "Hochmeister Wilheim II"
teuton.1.desc: "In a surprising turn of events, Wilheim the II or the 'Kaiser' is declared the Hochmeister of the Teutonic Empire, aiming to revive the old legacy of the Teutonic Order before its transition to the modern Imperial state it is now. Lavish ceremonies and sweeping parades have been scheduled across the imperial heartlands to commemorate Wilhelm’s transformation from Emperor to Hochmeister. Foreign dignitaries from Britain, Francia, and the Roman Empires have arrived in full regalia, offering their congratulations—though some suspect their smiles mask unease. As banners bearing the black cross rise once more, the world watches with bated breath. A new era has dawned—one not of peace, but of purpose. And somewhere, in the shadow of history, the drums begin to beat."
teuton.1.a: "Long Live Wilheim the II! Long Live the Empire!"
teuton.1.b: "Our government sends their regards."

teuton.2.t: "The Last Debate"
teuton.2.desc: "The Senate of the Empire has always proved to be a thorn to our side. With the recent ascension of Wilheim the II to Hochmeister, it begs the question is the Senate even effective anymore? It is not. Top government officials have passed the official dissolution of the senate to rid of trivial matters and corrupt bureacracy forever. With Wilheim the II's ambitious future, the Senate is an obstacle blocking the Empire's future. The time has begun to decide the fate of the senators."
teuton.2.a: "Let the senators retire with dignitiy."
teuton.2.b: "Round up the senators and purge them to prevent further resistance."

teuton.3.t: "Retirement of Senators"
teuton.3.desc: "In a gesture of restrained authority, Hochmeister Wilheim II has chosen to allow the senators to retire peacefully. Though their influence wanes, they are granted the dignity of stepping down without bloodshed. This decision reflects a strategic pivot—removing obstacles without igniting unnecessary unrest. The senators, many of whom have served for decades, now fade into obscurity, their legacy overshadowed by the Empire’s new direction. The halls of power grow quieter, but the message is clear: the old order has ended, and a new era begins."
teuton.3.a: "Let them fade away and never return."

teuton.4.t: "Senators Purged"
teuton.4.desc: "In a ruthless display of power, Hochmeister Wilhelm II has ordered the purge of the Senate. No longer content with symbolic gestures, the regime moves swiftly to eliminate any potential dissent. Senators are rounded up, their titles stripped, and their influence extinguished. This brutal act sends shockwaves through the Empire, silencing opposition and consolidating Wilhelm’s control. This may have drastic consequences for the Empire, but is necessary."
teuton.4.a: "Finally."

teuton.5.t: "The Question of Dissidents"
teuton.5.desc: "With the Senate dismantled and resistance purged from within, the Empire now turns its gaze to the final remnants of opposition—dissidents who dare to challenge Hochmeister Wilheim II’s vision. These agitators, scattered across provinces and whispering rebellion, pose a threat to the new order. The time has come to decide their fate. Should they be silenced permanently, judged publicly, or cast out beyond the Empire’s borders? Whatever path is chosen, one truth remains: dissent will no longer be tolerated. The Empire must be united, and unity demands sacrifice."
teuton.5.a: "Execute Them."
teuton.5.b: "Let them have trials."
teuton.5.c: "Exile! Deport! Extradite!"

teuton.6.t: "A Union With the Teutonic Empire"
teuton.6.desc: "The Teutonic Empire has extended a formal invitation to Austria, proposing a historic union that would reshape the balance of power in Central Europe. Hochmeister Wilheim II envisions a future where shared heritage and strategic alignment forge an unbreakable bond between the two nations. Yet, the offer carries weight beyond diplomacy—it is a test of loyalty, ambition, and sovereignty. Austria must now choose: embrace unity and ascend with the Empire, or reject the overture and risk the wrath of a rising power."
teuton.6.a: "We accept!"
teuton.6.b: "We'll never bend the knee to Teutons."

teuton.7.t: "The Austrians Accept!"
teuton.7.desc: "Austria has accepted the Teutonic Empire’s proposal, marking the dawn of a new era. The banners of both nations now fly together, symbolising strength through unity. Hochmeister Wilheim II hails the decision as a triumph of vision and destiny. With Austria’s resources and strategic position now aligned with the Empire, the path ahead gleams with promise. With our border with the Romans now secured, this shall become our staging ground on destroying them once and for all."
teuton.7.a: "To a great future united!"

teuton.8.t: "The Austrians Decline..."
teuton.8.desc: "Austria has rejected the Teutonic Empire’s offer of union, defying Hochmeister Wilheim II’s vision for continental unity. The refusal is seen not as a diplomatic choice, but as a provocation—an insult to the Empire’s authority and ambition. In response, the Teutonic Empire declares war, determined to bring Austria to heel by force. The time for negotiation has passed. Steel and fire will now decide the fate of the defiant."
teuton.8.a: "They have chose the hard way then."

teuton.69.t: "The Teutonic Empire sends an ultimatum"
teuton.69.desc: "A sealed diplomatic communiqué arrives from Königsberg, bearing the insignia of the Teutonic Empire: a black cross over blood-red parchment. Its contents are chillingly direct. The ultimatum demands unconditional surrender of key border provinces, the dismantling of the Roman military command, and recognition of Wilhelm II as Protector of Europa. The Senate is in uproar. Generals call for mobilisation. The people chant for defiance.\nBut behind closed doors, fear spreads. The Teutonic war machine is vast, disciplined, and fanatical. Their Hochmeister speaks of destiny, of crusade, of a new world forged in steel and fire.\n\nTo accept would mean humiliation. To refuse may mean annihilation."
teuton.69.a: "We will never surrender!"
teuton.69.b: "We must preserve all that remains."

teuton.68.t: "The Western Romans refuse to kneel."
teuton.68.desc: "The Western Roman Empire has rejected our ultimatum.\n\nTheir envoys returned the sealed decree unopened, accompanied only by a single phrase: 'Roma bows to no master.' The Hochmeister read the message in silence, then cast it into the fire. The room did not stir. The decision had already been made.\n\nAcross the Empire, legions unfurl. The black cross rises above every fortress, every city, every army. The Teutonic legions mobilise with divine purpose, their chants echoing the vows of ancient crusaders. This is no mere conflict—it is a reckoning.\nThe Eagle clings to its fading glory. But it has chosen defiance over survival. And now, history shall be rewritten in fire and iron.\n\nLet the world bear witness: The Teutonic Empire marches to war."
teuton.68.a: "Then so be it. LET THE CRUSADE BEGIN!"

teuton.547.t: "Dissolution of the Teutonic Senate"
teuton.547.desc: "In the recent months, the Teutonic Empire has officially dissolved its Senate, citing inefficiency and entrenched corruption. Hochmeister Wilheim II’s administration declared the decision a necessary step toward streamlining governance and accelerating national progress. Teutonic-aligned states have praised the bold reform, viewing it as a decisive break from outdated bureaucracy and a signal of renewed imperial strength. However, in capitals beyond the Empire’s influence, the reaction has been markedly different. Many foreign observers question the legality and morality of the dissolution, raising concerns about authoritarian overreach and the erosion of democratic institutions."
teuton.547.a: "It is needed."
teuton.547.b: "What are they doing?"


teuton.207.t: "Anti-Roman Pact"
teuton.207.desc: "The Teutons have extended an offer of alliance, proposing a united front against the growing threat of Roman resurgence. It is no secret that our histories are stained with blood and rivalry, yet the Romans seek to reclaim their former dominion—and we may be next. The Teutonic emissaries speak of pragmatism, of survival, of strength in unity. But can we truly trust those who once sought to dominate us? The choice before us is stark: join hands with old enemies to face a greater one, or stand alone and risk being crushed beneath Rome’s ambition."
teuton.207.a: "Let us cast aside our differences to face a common enemy."
teuton.207.b: "We'll never bend the knee to the Teutons!"

teuton.2077.t: "The Franks Accept!"
teuton.2077.desc: "The Franks have chosen wisdom over pride. Their acceptance of our pact marks a turning point in the struggle against Roman tyranny. Though our past is marred by conflict, today we stand as allies, bound by a shared resolve to resist imperial domination. With Frankish steel and Teutonic discipline united, our alliance grows ever stronger. Let the Romans tremble—for they now face a coalition forged in necessity and hardened by history."
teuton.2077.a: "Our alliance grows ever stronger."

teuton.20774.t: "The Franks Decline..."
teuton.20774.desc: "The Franks have turned their backs on reason, rejecting our offer of unity against the Roman menace. Their decision reeks of arrogance and short-sightedness. We extended a hand in peace, and they slapped it away. Let it be known: their betrayal will not be forgotten. When the legions march and the fires of war consume the continent, they will find no sympathy from the Teutonic Empire. They have chosen isolation—and they will reap its consequences."
teuton.20774.a: "Their bretrayal will not be forgotten."

teuton.208.t: "Anti-Roman Pact"
teuton.208.desc: "The Teutonic Empire proposes an alliance against Rome, invoking memories of imperial chains and foreign rule. We remember the eagle banners flying over our lands, the centuries of subjugation. The Romans must never rise again. Yet, the Teutons are no saints—they too harbor ambitions, cloaked in diplomacy. To join them is to gamble with our sovereignty. Still, the threat is real, and time is short. Do we strike preemptively with unlikely allies, or risk facing both empires alone?"
teuton.208.a: "We cannot allow our former overlords to ever control us again."
teuton.208.b: "The Romans may be a threat, but the Teutons are the greater evil."

teuton.2088.t: "The British agree to sign!"
teuton.2088.desc: "Britain has signed the pact, choosing courage and foresight over hesitation. Their leaders understand that the Roman threat cannot be faced alone. With their naval prowess and our military might, the alliance now spans land and sea. Together, we shall crush the imperial dream once and for all. Let the world bear witness: the Anti-Roman Pact is no longer a vision—it is a reality, and it marches towards victory against Rome and Constantinople."
teuton.2088.a: "Let us conquer Rome together!"

teuton.2084.t: "The British Decline..."
teuton.2084.desc: "The British have refused our offer, blinded by mistrust and haunted by old grudges. Their decision is a grave miscalculation. We offered them a shield against Roman aggression, and they spat in our face. So be it. Let the damn Romans conquer them again—perhaps then they’ll remember what it means to be ruled. The Teutonic Empire will not wait for the hesitant. We move forward, with or without them."
teuton.2084.a: "Let the damn Romans conquer them again."

teuton.299.t: "Anti-Roman Pact"
teuton.299.desc: "The Teutonic Empire has extended a hand—one wrapped in iron and veiled in diplomacy. They propose a pact against the Roman menace, promising protection and shared strength. Yet many in our government remember the Teutons' past conquests, their disdain for Slavic autonomy, and their hunger for influence. To accept would be to trade one imperial yoke for another. But with Roman legions stirring in the south, the question remains: is survival worth submission?"
teuton.299.a: "Better to be under the Teutons than Romans."
teuton.299.b: "No! We'll never bend the knee to the teutons!"

teuton.2999.t: "The Czechslovakians join us!"
teuton.2999.desc: "Our southern neighbors have seen reason. In the face of Roman expansionism, they have chosen unity with the Teutonic Empire. Their allegiance strengthens our eastern flank and sends a clear message to Rome: the old alliances are crumbling, and a new order rises. Let the world bear witness—Teutonic steel and Slavic resolve now march as one."
teuton.2999.a: "Our southern neighbour is with us!"

teuton.2991.t: "The Czechslovakians Decline..."
teuton.2991.desc: "Fools. The Czechoslovakians have rejected our offer, clinging to their fragile independence as Roman influence creeps ever closer. Let them face the consequences of their pride. We will not shield them when the legions arrive. If they wish to stand alone, then alone they shall fall."
teuton.2991.a: "Let them be conquered by Romans and we'll not bat an eye."

teuton.666.t: "The Wreck in the Alps"
teuton.666.desc: "The report arrived under heavy silence. A border patrol in the high Alpine passes stumbled upon a twisted wreck—metal torn, scorched, and half-buried in snow. It was a plane. Not ours. Teutonic markings, unmistakable. No flight plan. No diplomatic clearance. A scout, sent deep into our territory under the cover of cloud and night.\n\nThe pilot was dead, frozen in the cockpit, his face locked in a final grimace. The onboard equipment was damaged, but not beyond recognition. Surveillance gear. Terrain maps. A partially decrypted transmission log—encrypted coordinates, some matching our border defenses. They were watching. Measuring. Preparing.\n\nLegion command is shaken. The Teutons have been stirring—mobilising forces, fortifying roads, whispering of unity and vengeance. We told ourselves it was bluster. But this wreckage is no accident. It is a message. Or worse, a warning.\n\nNo word has come from the Teutonic Empire. No apology. No explanation. Just silence. And silence, in times like these, is louder than war drums. The Alps have long stood as a wall between empires. But now, they feel like a fault line—cracking under the weight of something vast and violent. Something is coming. We feel it in the frost. In the quiet. In the eyes of every soldier who saw that wreck and knew. The Teutons are not just watching. They are ready."
teuton.666.a: "They were scouting our defenses... Why?"

teuton.667.t: "The Wreck in the Alps"
teuton.667.desc: "The report arrived under heavy silence. A border patrol in the high Alpine passes stumbled upon a twisted wreck—metal torn, scorched, and half-buried in snow. It was a plane. Not ours. Teutonic markings, unmistakable. No flight plan. No diplomatic clearance. A scout, sent deep into our territory under the cover of cloud and night.\n\nThe pilot was dead, frozen in the cockpit, his face locked in a final grimace. The onboard equipment was damaged, but not beyond recognition. Surveillance gear. Terrain maps. A partially decrypted transmission log—encrypted coordinates, some matching our border defenses. They were watching. Measuring. Preparing.\n\nLegion command is shaken. The Teutons have been stirring—mobilising forces, fortifying roads, whispering of unity and vengeance. We told ourselves it was bluster. But this wreckage is no accident. It is a message. Or worse, a warning.\n\nNo word has come from the Teutonic Empire. No apology. No explanation. Just silence. And silence, in times like these, is louder than war drums. The Alps have long stood as a wall between empires. But now, they feel like a fault line—cracking under the weight of something vast and violent. Something is coming. We feel it in the frost. In the quiet. In the eyes of every soldier who saw that wreck and knew. The Teutons are not just watching. They are ready."
teuton.667.a: "They were scouting our defenses... Why?"

teuton.455.t: "The Senatorial Question"
teuton.455.desc: "The Senate have always proved to be a thorn to the Hochmeister's side, formed from the old Roman Republic model - it has grown bold in its defiance after Wilhelm's ascension. A large faction of senators now openly questions his authority, citing corruption, stagnation, and whispers of Roman influence. Their rhetoric is gaining traction among the disillusioned, threatening to fracture our glorious Empire from within. The Hochmeister must decide now: supress the dissent with force, negotiate for compromise, or allow the Senate its voice and risk emboldening future opposition."
teuton.455.a: "Crack down on dissidents"
teuton.455.b: "Begin negotiations"
teuton.455.c: "Let them speak freely"

teuton.99.t: "The Teutons Propose a Treaty"
teuton.99.desc: "The Teutonic Empire has approached us with a proposal to formalise a technology-sharing treaty, specifically offering advancements in armor design and metallurgy. While their intentions remain unclear, the potential benefits to our armoured divisions cannot be ignored. Teutonic engineering is among the finest in Europe, and integrating their designs could give our forces a decisive edge on the battlefield. However, many within the Kremlin remain skeptical—memories of past conflicts and ideological divides run deep. Signing this treaty may be seen as a betrayal of our strategic independence, yet refusing it could mean falling behind in the arms race. The decision now rests with us: embrace pragmatic cooperation, or reaffirm our defiance of Teutonic influence."
teuton.99.a: "We'll sign."
teuton.99.b: "We never coorperate with the Teutons!"

teuton.991.t: "The Russians Sign the Treaty!"
teuton.991.desc: "The Russian government has formally agreed to the terms of our proposed technology-sharing treaty. This marks a significant diplomatic milestone, establishing a framework for mutual cooperation in the development and refinement of armored warfare capabilities. Our engineering teams will commence joint operations with their Russian counterparts, facilitating the exchange of technical expertise and production methodologies. While historical tensions remain, this accord represents a pragmatic step toward strategic alignment and enhanced military readiness on both sides."
teuton.991.a: "To both our countries!"

teuton.992.t: "The Russians Refuse to Sign."
teuton.992.desc: "The Russians have rejected our overture, refusing to sign the treaty and spurning the opportunity for technological cooperation. Their decision reaffirms the deep-rooted suspicion and hostility that has long defined our relationship. Let it be known: we extended a hand, and they turned away. We will forge ahead alone, and should our tanks meet theirs on the battlefield, they will learn the cost of stubborn pride."
teuton.992.a: "Russians will always be Russians."

teuton.300.t: "The Teutons demand Sudetenland!"
teuton.300.desc: "The Teutonic Empire has formally issued an ultimatum to our government, demanding the cession of the Sudetenland. They claim that the Germanic peoples within the region rightfully belong under their banner, and that any refusal to comply would be seen as a direct act of hostility. Our nation now stands at a crossroads: surrender our fortified borderlands, or risk war with the rising Teutonic power."
teuton.300.a: "We must preserve peace at all costs..."
teuton.300.b: "We'll never surrender our lands to them!"

teuton.301.t: "The Czechslovaks Accept!"
teuton.301.desc: "Prague has bowed to our demands! The Sudetenland now rightfully returns to the Teutonic Empire. With our borders secured and the will of our people fulfilled, the Teutonic Empire marches ever stronger into the future."
teuton.301.a: "Our destiny is fulfilled!"

teuton.302.t: "The Czechslovaks Decline..."
teuton.302.desc: "The traitorous government in Prague has dared to reject our rightful claim to the Sudetenland! Instead of seeing reason, they prepare to resist us with force. The Sudeten Germans cry out for liberation, and we shall answer their call. War is now inevitable."
teuton.302.a: "Well well well. It seems they have chose the hard way."


tanks.2.t: "Production Priority"
tanks.2.desc: "There is much debate amongst the East Rome Military Command on what to prioritise in production of certain weaponry. The largest contenders are Anti-Tank or Anti-Air weapons, which both offers benefits and negatives for our Legions. Anti-Tank provides our legions with capabilities of striking and destroying our foes on the ground, while Anti-Air allows us to shoot down every foe of Rome who dares enter our space."
tanks.2.a: "Anti-Tank" 
tanks.2.b: "Anti-Air"

teuton.719.t: "The Bellum Magnum has begun"
teuton.719.desc: "The Bellum Magnum has erupted. The Kaiserpakt, led by the Teutonic Empire, has crossed into the Western Roman Empire, shattering decades of uneasy stability. Mobilisation is total, as both sides commit everything to a war that will determine the fate of Europe—and the world. The Roman League scrambles to respond, but the scale and ferocity of the invasion threatens to overwhelm even the most prepared defenses. A clash between the two greatest global powers, this is no ordinary conflict; it is the greatest war humanity has ever faced, one that may decide whether the Roman hegemony survives or collapses, paving the way for a new order."
teuton.719.a: "The hammer has fallen. Rome will fall."
teuton.719.b: "Oh God... They are coming..."
teuton.719.c: "The world is unraveling. We must choose."

teuton.555.t: "Kaiser’s Ultimatum"
teuton.555.desc: "Wilhelm II has chosen not to pursue the slow and uncertain path of drafting a constitution for the Senate. Instead, he has issued a bold ultimatum: either the Senate concedes sweeping powers to the Hochmeister and his government, or they risk the wrath of the crown. The message is clear — submit, or face consequences. The fate of our internal stability now hangs in the balance, as the Senate prepares its answer."
teuton.555.a: "Send the ultimatum."

teuton.554.t: "A Chance To Sabotage Teutonic Politics"
teuton.554.desc: "The Teutonic Senate has been presented with the Kaiser’s ultimatum, a demand that would strip them of their authority and place the full machinery of the state into his hands. Our agents have informed us that the Senate is divided, uncertain of how to respond. If we intervene, our sabotage may tip the vote against the Kaiser, but it risks discovery and future retaliation."
teuton.554.a: "Sabotage the Senate’s vote."
teuton.552.b: "Do nothing."

teuton.553.t: "Ultimatum Vetoed!"
teuton.553.desc: "The Senate has rejected the ultimatum, condemning it as a reckless power grab that would end the delicate balance of governance. Senators speak of their duty to resist tyranny, and their veto is a direct insult to the Kaiser’s authority. The bluff has failed, and the humiliation will not be easily forgotten. Across the Empire, whispers of weakness spread, even as Wilhelm II swears vengeance on those who opposed him."
teuton.553.a: "Gottverdammt!"

teuton.551.t: "Ultimatum Accepted!"
teuton.551.desc: "The Senate has bent to the Kaiser’s will. Intimidated by his threats and awed by his growing influence, they have voted to hand the government sweeping powers. For Wilhelm II, this is a triumph — proof that his iron will cannot be resisted. The halls of government now echo with obedience, and the road to absolute control has been cleared. The people cheer, some in loyalty, others in fear."
teuton.551.a: "A glorious victory!"

teuton.557.t: "Evidence of Russian Sabotage!"
teuton.557.desc: "Investigations by loyal agents have uncovered damning evidence: the Russians meddled in our political process, spreading bribes, whispers, and fear among Senators to ensure the ultimatum was rejected. The betrayal is undeniable, and the Kaiser seethes with fury. To do nothing would be an admission of weakness, yet to retaliate risks escalating the conflict with our eastern rival."
teuton.557.a: "Embargo the Russians!"
teuton.557.b: "Do nothing."

teuton.558.t: "Teutons Retaliate!"
teuton.558.desc: "The Teutons have uncovered our hand in the Senate’s decision, and they have responded with fury. Their government has announced an embargo, striking at our economy and prestige. Our involvement is no longer a secret — the world now knows we have meddled in their affairs, and the Teutons will not forgive easily."
teuton.558.a: "Damn them!"

teuton.466.t: "The Teutonic Empire Proposes Protection"
teuton.466.desc: "The Teutonic Empire has extended a hand—clad not in velvet, but in iron. They speak of “protection,” a word that trembles with false benevolence. But we know better. This is no pact between equals. It is a collar, forged in Warsaw, meant to be fastened around our neck. Should we accept, our crown may still gleam in the sunlight, but its weight will no longer be ours to bear. Our laws will echo with foreign tongues, our armies will march to foreign drums, and our proud Commonwealth will become a shadow cast by Teutonic ambition.\n\nYet the storm gathers. The Russians stir in the east, the Romans scheme in the west, and our allies grow silent. The world is no longer kind to the proud. To refuse may mean war, ruin, and the slow death of our sovereignty. But to accept is to live as vassals—safe, perhaps, but shackled. The Commonwealth is divided. Some whisper that survival is nobler than defiance. Others cry that a nation without freedom is no nation at all. So we stand at the crossroads of history. One path leads to gilded chains. The other, to uncertain fire."
teuton.466.a: "We must preserve our peace... at any cost."
teuton.466.b: "We'll never bend the knee to the Teutons!"

teuton.467.t: "The Commonwealth Accepts Our Protection!"
teuton.467.desc: "The Polish-Lithuanian Commonwealth has submitted to our authority. Though they may speak of partnership, the truth is clear: their sovereignty now flows through Teutonic veins. With their lands under our watchful eye, our eastern frontier is secure, and our influence stretches deeper into the heart of Europa."
teuton.467.a: "The border with the Russians are secure."

teuton.468.t: "The Commonwealth Denies Our Protection!"
teuton.468.desc: "The Commonwealth has refused our offer, choosing pride over prudence. Their defiance is noted—and will not be forgotten. If they will not stand with us against the Roman threat, then they shall face the consequences alone. The time for diplomacy has passed. Let the drums of war sound, and let their lands learn the cost of isolation."
teuton.468.a: "Then war must come to their lands."

teuton.551255.t: "The Teutonic Empire Asserts Eastern Claims"
teuton.551255.desc: "As the Teutonic Empire battles Roman forces in the west, its eyes now turn eastward. Teutonic officials have issued formal declarations asserting historical and strategic claims over territories held by the Polish-Lithuanian Commonwealth. The announcement outlines a vision of Teutonic expansion that stretches to the Russian frontier—an audacious bid to secure influence across the entire northern corridor of Europa. Though no shots have been fired, the implications are clear. The Commonwealth, caught between a resurgent Teutonic Empire and the distant gaze of Moscow, now finds itself in a precarious position. Diplomats scramble, alliances are tested, and the world watches—wondering whether this is mere posturing or the quiet prelude to a new front in an already sprawling war."
teuton.551255.a: "The Commonwealth will be next to fall!"
teuton.551255.b: "The Commonwealth will be next to fall..."
teuton.551255.c: "The Commonwealth will be next to fall..."

teuton.100.t: "The Teutonic Empire Proposes A Treaty"
teuton.100.desc: "In a move that has stirred debate across the halls of Moscow, the Teutonic Empire has extended a formal proposal for a treaty of non-aggression and mutual recognition. With Rome keeping their watchful eye and the Commonwealth under increasing pressure, Berlin seeks to secure its eastern flank—offering Russia a chance to reshape the regional balance without firing a single shot. The proposal arrives cloaked in pragmatism, yet beneath its polished language lies a deeper ambition: Teutonic access to the Russian frontier and a quiet endorsement of their eastern claims. The Kremlin is divided. Some argue that aligning with Berlin could offer breathing room and strategic leverage. Others warn that the Teutons, with their imperial ambitions and history of expansionism, pose a greater long-term threat than Rome ever could. The decision will echo far beyond the Kremlin walls."
teuton.100.a: "Better to ally wtih Berlin than Rome..."
teuton.100.b: "Never! Rome may be terrible, but the Teutons are way worse!"

teuton.101.t: "The Russians Refuse!"
teuton.101.desc: "The Russian Federative Socialist Republic has declined the Teutonic overture. Despite the carefully crafted terms and the promise of peaceful coexistence, Moscow has chosen to keep its distance. The rejection, delivered with cold formality, underscores the deep ideological divide and lingering mistrust between the two powers. In Berlin the High Council expresses disappointment but not surprise. The refusal is seen as confirmation of Russia’s unwillingness to look beyond its own dogma. For now, the eastern frontier remains uncertain—quiet, but tense. "
teuton.101.a: "Russians will always be Russians..."

teuton.102.t: "The Russians Accept!"
teuton.102.desc: "In a development that has stunned observers across Europa, the Russian Federative Socialist Republic has accepted the Teutonic Empire’s proposal. The treaty, signed in a discreet diplomatic exchange, marks a turning point in eastern relations. With Rome distracted and the Commonwealth vulnerable, Berlin and Moscow now stand poised to redefine the regional order. The agreement promises non-aggression, mutual recognition, and a shared interest in stability along their border. For the Teutonic Empire, it is a diplomatic victory—proof that even ideological rivals can be swayed by strategic necessity. In Königsberg, the mood is triumphant. In Moscow, cautious. And across Europa, the question lingers: is this the beginning of a new alignment, or merely a pause before deeper tensions unfold?"
teuton.102.a: "To a greater future between our peoples!"

teuton.777.t: "Law of Reichstag"
teuton.777.desc: "After months of political maneuvering, public unrest, and backroom coercion, the Reichstag has passed a sweeping law that strips the Senate of its remaining authority. Once a proud institution modeled after Roman republicanism, the Senate now stands as a hollow chamber—its members reduced to ceremonial advisors, its voice silenced beneath the iron will of the Hochmeister.\n\nThe law, framed as a necessary measure to ensure national unity and wartime efficiency, has been met with mixed reactions. Some hail it as the dawn of a stronger, more decisive Empire. Others whisper of tyranny cloaked in patriotism. Regardless, the balance of power has shifted—and the Teutonic Empire marches forward, unburdened by the chains of debate."
teuton.777.a: "Pass the Law!"
teuton.777.b: "Better not to..."

teuton.778.t: "The Teutons Introduces The Law of Reichstag"
teuton.778.desc: "In a sweeping act of political transformation, the Teutonic Empire has enacted the Law of Reichstag—an authoritarian decree that strips the Senate of all legislative power and consolidates authority under the Hochmeister. Once a bastion of debate and republican ideals, the Reichstag now stands as a ceremonial relic, its chambers silenced and its members reduced to mere spectators of imperial will.\nThe Hochmeister, invoking the need for national unity and wartime efficiency, declared the law a necessary step to 'preserve the soul of the Empire.' Supporters rallied in the streets, waving black-and-gold banners and chanting slogans of loyalty. Yet beneath the surface, whispers of dissent grow louder. Former senators and foreign observers warn that the Empire teeters on the edge of despotism."
teuton.778.a: "Long live the Hochmeister!"
teuton.778.b: "The Teutonic Empire's future is grim... to all of us."


