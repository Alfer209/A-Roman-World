l_english:
mainnews.1.t:0 "Завершення Босфорського Мегамосту"
mainnews.1.desc:0 "У приголомшливому подвигу сучасної інженерії Східна Римська Імперія завершила колосальний Босфорський Мегаміст, з'єднавши Європу та Азію прольотом, неперевершеним ніде у світі. Проєкт, який колись висміювали як неможливий, тепер стоїть як гордий символ технічної майстерності та промислового відродження Східного Риму.\n\nГлядачі з усієї Імперії зібралися, щоб спостерігати за тим, як перші транспортні засоби перетинають міст, а газети по всьому світу повідомляють про це як про знак того, що Римляни повертають собі місце як майстрів торгівлі, промисловості та долі.\n\nХоча багато хто аплодує досягненню, деякі іноземні аналітики попереджають, що така інженерна міць може незабаром бути спрямована на військові цілі."
mainnews.1.a:0 "Хай живе Імперія!"
mainnews.1.b:0 "Добре для них."

mainnews.2.t:0 "Проголошення Римської Ліги"
mainnews.2.desc:0 "У момент, що лунає в анналах історії, Західна Римська Імперія відповіла на заклик Константинополя. Стародавній розкол між Сходом і Заходом виправлений, але не пергаментом, а метою. Сьогодні проголошується 'Римська Ліга' — єдиний фронт, викуваний зі спільної крові, спадщини та амбіцій. Коли загрози нависають за імперськими кордонами, подвійні орли Риму піднімаються разом, розпростерши крила над світом у сум'ятті. Від мармурових залів Палатина до золотих куполів Босфору лунає єдиний голос: Рим вистоїть."
mainnews.2.a:0 "Хай живе Імперія!"
mainnews.2.b:0 "Сила Риму зростає все більше..."

mainnews.67.t:0 "Константинополь та Рим Виправляють Свій Союз"
mainnews.67.desc:0 "Після десятиліть тліючої зневаги та роздробленої дипломатії, Східна та Західна Римські сфери примирилися, що знаменує історичну єдність, небачену з часів сутінків старої імперії. Шрами Іллірійської Війни — що відбулася за десять років до цього через суворі пагорби Іллірії — все ще залишаються в пам'яті генералів та державних діячів. Той жорстокий конфлікт, що закінчився глухим кутом, вбив клин між Константинополем та Римом. Проте тепер, у тіні зростаючих загроз та мінливих альянсів по всій Європі, прагматизм перемагає гордість. Підписані спільні декларації, узгоджені військові доктрини, обміняні посланці з урочистою церемонією. Для декого це відродження імперської сили — дві половини перековані в єдину Римську волю. Для інших це провісник відновленої агресії, замаскованої під братерство."
mainnews.67.a:0 "Схід і Захід! Брати Возз'єднані!"
mainnews.67.b:0 "Об'єднаний Рим означає гірше для всіх..."

homelegions.1.t:0 "Домашні Легіони"
homelegions.1.desc:0 "З нависаючою загрозою вторгнення, заклик до зброї лунає по провінціях. Ми більше не можемо покладатися виключно на професійних солдатів — сам народ повинен піднятися. Фермери, купці та науковці — усі беруть у руки зброю, щоб захистити свою батьківщину. Ці Домашні Легіони, викувані з обов'язку та відчаю, стануть останнім щитом Імперії проти прийдешньої бурі."
homelegions.1.a:0 "Повставайте! За Імперію!"
homelegions.1.b:0 "Нам не потрібні додаткові війська."

homelegions.2.t:0 "Відродження Легіонів Галлії"
homelegions.2.desc:0 "Прапори Легіонів Галлії знову піднімаються, їхня спадщина лунає долинами Рони та лісами Германії. Колись залізний кулак Юлія Цезаря, ці легіони проклали шлях імперії дисципліною, доблестю та безжальною ефективністю. Тепер, в епоху сталі та вогню, ми викликаємо їхній дух, щоб викувати нову долю. Їхнє відродження — це не просто ностальгія — це декларація того, що Рим пам'ятає, і Рим повертається."
homelegions.2.a:0 "Ці легіони колись були основою Юлія Цезаря. Тепер вони поведуть нас до перемоги."
homelegions.2.b:0 "Немає потреби в цьому стародавньому ордені."

persian.1.t:0 "Римляни просять нас вшанувати стародавній союз"
persian.1.desc:0 "ТЕСТ"
persian.1.a:0 "Так! Ми приєднаємося до них!"
persian.1.b:0 "Ні. Ми ніколи не схилимо коліно перед Римлянами."

persian.2.t:0 "Перська Імперія вшановує стародавній союз!"
persian.2.desc:0 "Перська Імперія вирішила вшанувати стародавній союз. Їхні прапори тепер майорять поруч із нашими, символ єдності між двома великими цивілізаціями. Разом ми зіткнемося з прийдешніми випробуваннями — не як суперники, а як брати по зброї. 'Римська Ліга' зростає сильнішою, і світ тремтітиме перед нашою об'єднаною міццю."
persian.2.a:0 "'Римська Ліга' зростає все сильнішою! Хай живе Імперія!"

persian.3.t:0 "Перси відмовляються допомагати нам."
persian.3.desc:0 "Перський двір відхилив наш заклик до єдності, відкинувши століття спільної боротьби та дипломатії. Їхня відмова знаменує гіркий розкол у спадщині співпраці, а з ним — розпад взаємних гарантій. У міру зростання напруги та збирання ворогів, Схід має тепер готуватися зустріти бурю без свого найстарішого союзника."
persian.3.a:0 "Кляті перси..."

hispania.1.t:0 "Римляни просять нас знову приєднатися до них"
hispania.desc:0 "Рим колись правив Іспанією з гордістю та метою, і тепер Східна Імперія прагне відродити цей зв'язок. З формуванням 'Римської Ліги', Іспанія запрошується знову стати під імперського орла. Чи приймуть вони свою спадщину та приєднаються до справи — чи відвернуться від спадщини, яка їх сформувала?"
hispania.1.a:0 "Хай живе Імперія!"
hispania.1.b:0 "Ні. Ми ніколи не схилимо коліно перед Римлянами."

hispania.2.t:0 "Іспанія знову стає з Римом!"
hispania.2.desc:0 "Іспанія присягнула на вірність 'Римській Лізі'. Старі провінції знову піднімаються, але не в повстанні, а в єдності. З їхньою силою, доданою до нашої, мрія про відновлену імперію наближається до реальності. Захід прокидається, і орел розправляє крила над континентом."
hispania.2.a:0 "Хай живе Імперія!"

hispania.3.t:0 "Іспанці відмовляються допомагати нам."
hispania.3.desc:0 "Іспанія відхилила нашу пропозицію союзу, відкидаючи заклик до єдності та спадщину самого Риму. Їхнє рішення послаблює Лігу та підбадьорює наших ворогів. Якщо вони не приєднаються до нас у мирі, то можуть зіткнутися з наслідками непокори. Шлях уперед стає темнішим — але Рим вистоїть."
hispania.3.a:0 "Вони хочуть важкого шляху?"

romanleague.1.t:0 "Константинополь закликає до 'Римської Ліги'"
romanleague.1.desc:0 "Загроза з півночі наближається, її тінь простягається через розколоті землі імперії. Тевтонська Імперія та її союзники набирають сили, і шепіт про вторгнення стає гучнішим з кожним днем. У цю годину невизначеності Константинополь простягає руку — не з вимогами, а з пропозицією, вкоріненою у спільній спадщині: створення 'Римської Ліги'. Цей союз зв'яже Схід і Захід взаємною обороною, відродивши єдність, яка колись зробила Рим непереможним. Відкинути це — означає стояти наодинці проти бурі; прийняти — означає прийняти майбутнє, викуване у співпраці, силі та імперському братерстві. Західний двір має тепер вирішити — чи відповість він на заклик, чи дозволить старому світу впасти розділеним?"
romanleague.1.a:0 "Нехай Орли знову об'єднаються!"
romanleague.1.b:0 "Нам не потрібна допомога від нелегітимних Східних 'Римлян'"

romanleague.2.t:0 "Західні Римляни відповідають на наш заклик"
romanleague.2.desc:0 "Західна Римська Імперія прийняла нашу пропозицію про створення 'Римської Ліги'. Подвійні орли Риму тепер знову злетять разом, пов'язані спільною метою та стародавньою спадщиною. Цей союз знаменує початок оновленого імперського порядку — того, який, можливо, ще витримає бурі, що збираються за нашими кордонами."
romanleague.2.a:0 "Разом ми вистоїмо. Хай живе Імперія!"

romanleague.3.t:0 "Зрада Західних Римлян"
romanleague.3.desc:0 "Нашу пропозицію про єдність було відхилено. Західна Римська Імперія обрала ізоляцію замість співпраці, розірвавши зв'язки взаємної оборони та довіри. Оскільки північна загроза стає все більш грізною, це рішення кидає довгу тінь на майбутнє Риму. Дипломатичні зв'язки рвуться, і мрія про єдиний фронт згасає."
romanleague.3.a:0 "А вони ще називають себе 'Римлянами'..."

romanleague.67.t:0 "Почати Консолідацію на Сході"
romanleague.67.desc:0 "Протягом століть подвійні стовпи Римського світу — Рим і Константинополь — стояли разом проти хвиль хаосу, варварства та занепаду. Але час не був прихильним до Західної половини нашої Імперії. Охоплена внутрішньою нестабільністю, розколотими лояльностями та дедалі слабшим контролем над своїми провінціями, Західна Римська Імперія стала тінню свого колишнього 'я'. Тим часом Схід вистоює. Константинополь залишається маяком цивілізації, бастіоном порядку та останнім справжнім охоронцем Римської спадщини. Проте ми більше не можемо дозволити собі розтягувати наші легіони по далеких кордонах заради єдності, що існує лише на словах. Захід розтратив свою силу, і ми не повинні слідувати за ним у руїну. Настав час консолідувати наші оборонні рубежі — не у Франкії, не в Іберії, а тут, у серці Східної Імперії. Фракія, Анатолія, Сирія та Єгипет мають бути укріплені, забезпечені та захищені. Наші міста мають бути захищені, наші кордони посилені, а наші армії реструктуровані для захисту того, що справді має значення: Вічної Імперії Сходу."
romanleague.67.a:0 "Почнімо."

romanleague.69.t:0 "Константинополь Консолідується на Сході"
romanleague.69.desc:0 "Новини з Константинополя викликали шок у Західному дворі. Східні Римляни вирішили відмовитися від спільних оборонних стратегій, зосередившись натомість на укріпленні власних територій. Для багатьох у Римі це не що інше, як зрада — відступ від спільної імперської відповідальності на користь регіонального виживання. Деякі закликають до відплати, стверджуючи, що такий егоїзм має бути покараний. Інші закликають до стриманості, вважаючи, що будь-який захист, навіть обмежений, кращий, ніж жоден. Доля імперської єдності тепер висить на волосині."
romanleague.69.a:0 "Що? Як вони сміють? Ми повинні саботувати їхні зусилля."
romanleague.69.b:0 "Допомога є допомогою, навіть якщо її мало."

romanleague.68.t:0 "Консолідація Успішна!"
romanleague.68.desc:0 "Зусилля з консолідації принесли плоди. Східні оборонні рубежі посилені, моральний дух високий, а провінції гуртуються навколо оновленого керівництва Константинополя. Незважаючи на мовчання — або байдужість — із Заходу, Східна Римська Імперія стоїть міцніше, ніж за останні роки. Вічне Місто Сходу довело, що може вистояти, навіть якщо його залишать наодинці проти бурі. Наразі імперія тримається. І її народ знову вірить у свою долю."
romanleague.68.a:0 "Наша Вічна Імперія залишиться Вічною!"

romanleague.66.t:0 "Консолідація Провалена!"
romanleague.66.desc:0 "Консолідація не вдалася. Повідомлення з кордону виявляють логістичні провали, перехоплені комунікації та непояснені затримки — усе це вказує на таємне втручання. Докази свідчать, що агенти, лояльні до Західного Римського двору, підірвали зусилля, побоюючись зсуву влади та автономії. Зрада завдає глибокого удару. У Константинополі Сенат розділений: дехто стверджує, що єдність має бути збережена за будь-яку ціну, тоді як інші вимагають відплати. Мрія про об'єднаний Рим тьмяніє, і привид громадянського розколу знову нависає."
romanleague.66.a:0 "Ми все ще потребуємо їх."
romanleague.66.b:0 "Їхня зрада не залишиться безкарною."

romanleague.207.t:0 "Константинополь Пропонує Об'єднання"
romanleague.207.desc:0 "Поки вогні Bellum Magnum лютують по Європі, Константинополь висунув пропозицію, яка хитає самі основи історії. Протягом століть Римський світ був розділений між Сходом і Заходом, пов'язаний спадщиною, але розділений амбіціями, географією та недовірою. Тепер, зіткнувшись із екзистенційною загрозою Тевтонської Імперії та її союзників Райхспакту, Імператор Сходу закликає до єдності — єдиної Римської держави, що стоїть пліч-о-пліч, як це було в часи Августа та Костянтина.\n\nДля багатьох у Сенаті та серед народу це мрія, що відродилася — Рим, відновлений у своїй стародавній величі, здатний розчавити ворогів об'єднаною міццю Сходу та Заходу. Проте для інших це небезпечна відмова від суверенітету, запрошення знову опинитися під домінуванням іноземних правителів у Константинополі. Рішення тепер за нами: чи приймемо ми об'єднання, чи відкинемо його в ім'я нашої незалежності?"
romanleague.207.a:0 "Рим має об'єднатися знову!"
romanleague.207.b:0 "Зі Східними 'Римлянами'? Ніколи!"

romanleague.208.t:0 "Західний Рим Погоджується!"
romanleague.208:0 "У рішенні, яке лунатиме протягом століть, лідери Західної Римської держави прийняли пропозицію Константинополя. Нарешті, розкол, народжений стародавньою схизмою, буде зцілений. Прапори Сходу та Заходу маршируватимуть разом, армії Риму знову об'єднані під спільним командуванням. Вперше з часів падіння Вічного Міста, мрія про *imperium sine fine* — імперію без кінця — здається досяжною."
romanleague.208.a:0 "Ave Roma! Разом ми непереможні."

romanleague.209.t:0 "Західний Рим Відмовляється..."
romanleague.209:0 "На наш шок, Захід відхилив заклик до об'єднання. Сенат оголосив, що Західна Римська держава не буде поглинута Східним троном, і не ризикуватиме своєю незалежністю, відроджуючи імперію, давно віддану історії. Для них спадщина Риму має бути збережена через суверенітет, а не підпорядкування.\n\nВідмова викликала лють у нашому Сенаті, де багато хто бачить у цьому зраду в розпал Bellum Magnum. Армії Тевтонів невпинно наступають, але Рим залишається розділеним, його сила розтрачена гордістю та недовірою. Це рішення одного дня може розглядатися як фатальний удар по Римській долі — або як непокірна позиція народу, який не бажає схилятися перед Константинополем."
romanleague.209.a:0 "Отже, Рим залишається розділеним... ціною перемоги."

romanleague.888.t:0 "Крик За Єдиний Рим"
romanleague.888.desc:0 "По всіх наших землях піднімаються прапори, і голоси закликають до єдності. Науковці, шляхта та прості громадяни закликають до зцілення стародавнього розколу між Сходом та Заходом. Памфлети проголошують, що Римський народ єдиний, і що схизма народилася не з віри, а з династичної гордості. Знову заклик до однієї Імперії лунає як через Форум, так і через Софію."
romanleague.888.a:0 "Просувати риторику легітимності."
romanleague.888.b:0 "Заохочувати підтримку шляхтичів та патриціїв."
romanleague.888.c:0 "Нехай народ очолить рух."

tanks.1.t:0 "Імперські Танкові Випробування"
tanks.1.desc:0 "Після місяців виснажливого проєктування, тестування та політичного маневрування, 'Імперські Танкові Випробування' досягли свого апогею. Перед нами тепер стоять два конкуруючі прототипи: танки Ісілдура, відомі своєю міцною простотою та надійністю на полі бою, та танки Максимілліана, елегантні, сучасні та оснащені передовою технологією. Проєкт Ісілдура викликає дух легіонів — міцний, швидкий та створений для масового розгортання. Це танк для солдата, викуваний із думкою про практичність та здатний витримувати найсуворіші умови. Командири хвалять його легкість обслуговування та адаптивність до різноманітної місцевості. Він може не вражати на парадах, але виграє війни. Прототип Максимілліана, з іншого боку, — це диво інженерії. Важчий, більш грізний та оснащений найсучаснішими гарматами, він обіцяє неперевершену вогневу міць та захист. Його присутність сама по собі може переломити хід битви — але він вимагає точності, ресурсів та елітних екіпажів для роботи на повну потужність. Імперія має тепер вирішити: чи ми приймаємо надійність та швидкість бачення Ісілдура, чи інвестуємо у нищівну міць військової машини Максимілліана?"
tanks.1.a:0 "Обрати проєкт Ісілдура"
tanks.1.b:0 "Обрати проєкт Максимілліана"

teuton.1.t:0 "Гохмайстер Вільгельм II"
teuton.1.desc:0 "У дивовижному повороті подій, Вільгельм II, або 'Кайзер', оголошений Гохмайстером Тевтонської Імперії, прагнучи відродити стару спадщину Тевтонського Ордену до його перетворення на сучасну Імперську державу. Розкішні церемонії та масштабні паради заплановані по всьому імперському серцю, щоб вшанувати перетворення Вільгельма з Імператора на Гохмайстера. Іноземні високопосадовці з Британії, Франкії та Римських Імперій прибули в повному вбранні, висловлюючи свої привітання — хоча дехто підозрює, що їхні посмішки приховують занепокоєння. Коли прапори з чорним хрестом знову піднімаються, світ спостерігає із завмиранням. Настала нова ера — не миру, а мети. І десь, у тіні історії, починають бити барабани."
teuton.1.a:0 "Хай живе Вільгельм II! Хай живе Імперія!"
teuton.1.b:0 "Наш уряд передає свої вітання."

teuton.2.t:0 "Останні Дебати"
teuton.2.desc:0 "Сенат Імперії завжди був проблемою для нас. З недавнім сходженням Вільгельма II на Гохмайстера, виникає питання, чи є Сенат узагалі ефективним? Ні. Вищі державні чиновники ухвалили офіційний розпуск Сенату, щоб назавжди позбутися дріб’язкових питань та корумпованої бюрократії. З амбітним майбутнім Вільгельма II Сенат є перешкодою, що блокує майбутнє Імперії. Настав час вирішити долю сенаторів."
teuton.2.a:0 "Нехай сенатори підуть на пенсію з гідністю."
teuton.2.b:0 "Зачистити сенаторів, щоб запобігти подальшому опору."

teuton.3.t:0 "Відставка Сенаторів"
teuton.3.desc:0 "У жесті стриманої влади Гохмайстер Вільгельм II вирішив дозволити сенаторам мирно піти на пенсію. Хоча їхній вплив слабшає, їм надається гідність піти без кровопролиття. Це рішення відображає стратегічний поворот — усунення перешкод без розпалювання непотрібних заворушень. Сенатори, багато з яких служили десятиліттями, тепер зникають у невідомість, їхня спадщина затьмарена новим напрямком Імперії. Зали влади стають тихішими, але повідомлення чітке: старий лад закінчився, і починається нова ера."
teuton.3.a:0 "Нехай вони зникнуть і ніколи не повернуться."

teuton.4.t:0 "Сенаторів Зачищено"
teuton.4.desc:0 "У безжальній демонстрації влади Гохмайстер Вільгельм II наказав провести чистку Сенату. Більше не задовольняючись символічними жестами, режим швидко рухається до усунення будь-якого потенційного інакомислення. Сенаторів збирають, їхні титули позбавляють, а їхній вплив гасять. Цей жорстокий акт викликає шок по всій Імперії, придушуючи опозицію та консолідуючи контроль Вільгельма. Це може мати різкі наслідки для Імперії, але це необхідно."
teuton.4.a:0 "Нарешті."

teuton.5.t:0 "Питання Дисидентів"
teuton.5.desc:0 "З розпуском Сенату та викоріненням опору зсередини, Імперія тепер звертає свій погляд на останні залишки опозиції — дисидентів, які наважуються кинути виклик баченню Гохмайстера Вільгельма II. Ці агітатори, розсіяні по провінціях і шепочучі про повстання, становлять загрозу для нового ладу. Настав час вирішити їхню долю. Чи слід їх придушити назавжди, судити публічно, чи вигнати за межі Імперії? Який би шлях не було обрано, одна істина залишається: інакомислення більше не терпітимуть. Імперія має бути об'єднаною, і єдність вимагає жертв."
teuton.5.a:0 "Стратити їх."
teuton.5.b:0 "Нехай відбудуться суди."
teuton.5.c:0 "Вигнання! Депортація! Екстрадиція!"

teuton.6.t:0 "Союз із Тевтонською Імперією"
teuton.6.desc:0 "Тевтонська Імперія надіслала Австрії офіційне запрошення, пропонуючи історичний союз, який змінить баланс сил у Центральній Європі. Гохмайстер Вільгельм II передбачає майбутнє, де спільна спадщина та стратегічна узгодженість створять нерозривний зв'язок між двома націями. Проте пропозиція має вагу, що перевищує дипломатію — це перевірка лояльності, амбіцій та суверенітету. Австрія має тепер обрати: прийняти єдність та піднестися з Імперією, або відхилити пропозицію та ризикнути гнівом зростаючої сили."
teuton.6.a:0 "Ми приймаємо!"
teuton.6.b:0 "Ми ніколи не схилимо коліно перед Тевтонами."

teuton.7.t:0 "Австрійці Приймають!"
teuton.7.desc:0 "Австрія прийняла пропозицію Тевтонської Імперії, знаменуючи світанок нової ери. Прапори обох націй тепер майорять разом, символізуючи силу через єдність. Гохмайстер Вільгельм II вітає це рішення як тріумф бачення та долі. З ресурсами Австрії та стратегічним положенням, які тепер узгоджені з Імперією, шлях уперед сяє обіцянками. З нашим кордоном з Римлянами, який тепер захищено, це стане нашим плацдармом для знищення їх раз і назавжди."
teuton.7.a:0 "За велике об'єднане майбутнє!"

teuton.8.t:0 "Австрійці Відмовляються..."
teuton.8.desc:0 "Австрія відхилила пропозицію Тевтонської Імперії про союз, кинувши виклик баченню континентальної єдності Гохмайстера Вільгельма II. Відмова розглядається не як дипломатичний вибір, а як провокація — образа авторитету та амбіцій Імперії. У відповідь Тевтонська Імперія оголошує війну, вирішивши приборкати Австрію силою. Час для переговорів минув. Сталь і вогонь тепер вирішать долю непокірних."
teuton.8.a:0 "Тоді вони обрали важкий шлях."

teuton.69.t:0 "Тевтонська Імперія Надсилає Ультиматум"
teuton.69.desc:0 "Надходить запечатане дипломатичне повідомлення з Кенігсберга, що несе відзнаку Тевтонської Імперії: чорний хрест на криваво-червоному пергаменті. Його зміст жахливо прямий. Ультиматум вимагає беззастережної здачі ключових прикордонних провінцій, демонтажу Римського військового командування та визнання Вільгельма II Протектором Європи. Сенат у сум'ятті. Генерали закликають до мобілізації. Народ скандує про непокору.\nАле за зачиненими дверима поширюється страх. Тевтонська військова машина величезна, дисциплінована та фанатична. Їхній Гохмайстер говорить про долю, про хрестовий похід, про новий світ, викуваний у сталі та вогні.\n\nПрийняти — означало б приниження. Відмовитися може означати знищення."
teuton.69.a:0 "Ми ніколи не здамося!"
teuton.69.b:0 "Ми повинні зберегти все, що залишилося."

teuton.68.t:0 "Західні Римляни Відмовляються Схилитися."
teuton.68.desc:0 "Західна Римська Імперія відхилила наш ультиматум.\n\nЇхні посланці повернули запечатаний указ нерозкритим, супроводжуючи лише однією фразою: 'Рим не схиляється перед жодним господарем'. Гохмайстер прочитав повідомлення мовчки, а потім кинув його у вогонь. Кімната не ворухнулася. Рішення вже було прийнято.\n\nПо всій Імперії розгортаються легіони. Чорний хрест піднімається над кожною фортецею, кожним містом, кожною армією. Тевтонські легіони мобілізуються з божественною метою, їхні співи повторюють клятви стародавніх хрестоносців. Це не просто конфлікт — це розплата.\nОрел чіпляється за свою згасаючу славу. Але він обрав непокору замість виживання. І тепер історія буде переписана у вогні та залізі.\n\nНехай світ засвідчить: Тевтонська Імперія йде на війну."
teuton.68.a:0 "Тоді нехай буде так. НЕХАЙ ПОЧНЕТЬСЯ ХРЕСТОВИЙ ПОХІД!"

teuton.547.t:0 "Розпуск Тевтонського Сенату"
teuton.547.desc:0 "Протягом останніх місяців Тевтонська Імперія офіційно розпустила свій Сенат, посилаючись на неефективність та вкорінену корупцію. Адміністрація Гохмайстера Вільгельма II оголосила це рішення необхідним кроком до оптимізації управління та прискорення національного прогресу. Держави, що підтримують Тевтонців, високо оцінили сміливу реформу, розглядаючи її як рішучий розрив із застарілою бюрократією та сигнал про оновлену імперську силу. Однак у столицях за межами впливу Імперії реакція була помітно іншою. Багато іноземних спостерігачів ставлять під сумнів законність та моральність розпуску, висловлюючи занепокоєння щодо авторитарного перевищення повноважень та ерозії демократичних інститутів."
teuton.547.a:0 "Це необхідно."
teuton.547.b:0 "Що вони роблять?"


teuton.207.t:0 "Антиримський Пакт"
teuton.207.desc:0 "Тевтони висунули пропозицію союзу, пропонуючи єдиний фронт проти зростаючої загрози Римського відродження. Не секрет, що наша історія заплямована кров'ю та суперництвом, але Римляни прагнуть повернути своє колишнє панування — і ми можемо бути наступними. Тевтонські посланці говорять про прагматизм, про виживання, про силу в єдності. Але чи можемо ми справді довіряти тим, хто колись прагнув нами домінувати? Вибір, який стоїть перед нами, суворий: об'єднатися зі старими ворогами, щоб протистояти більшому, або стояти наодинці та ризикувати бути розчавленим під амбіціями Риму."
teuton.207.a:0 "Відкинемо наші розбіжності, щоб зустріти спільного ворога."
teuton.207.b:0 "Ми ніколи не схилимо коліно перед Тевтонами!"

teuton.2077.t:0 "Франки Приймають!"
teuton.2077.desc:0 "Франки обрали мудрість замість гордості. Їхня згода на наш пакт знаменує поворотний момент у боротьбі проти Римської тиранії. Хоча наше минуле затьмарене конфліктом, сьогодні ми стоїмо як союзники, пов'язані спільною рішучістю протистояти імперському домінуванню. З об'єднаною Франкською сталлю та Тевтонською дисципліною, наш союз стає все міцнішим. Нехай Римляни тремтять — бо вони тепер зіткнулися з коаліцією, викуваною необхідністю та загартованою історією."
teuton.2077.a:0 "Наш союз стає все міцнішим."

teuton.20774.t:0 "Франки Відмовляються..."
teuton.20774.desc:0 "Франки відвернулися від розуму, відхиливши нашу пропозицію про єдність проти Римської загрози. Їхнє рішення віддає зарозумілістю та недалекоглядністю. Ми простягли руку в мирі, а вони відштовхнули її. Хай буде відомо: їхня зрада не буде забута. Коли легіони маршируватимуть, і вогонь війни охопить континент, вони не знайдуть співчуття від Тевтонської Імперії. Вони обрали ізоляцію — і пожнуть її наслідки."
teuton.20774.a:0 "Їхня зрада не буде забута."

teuton.208.t:0 "Антиримський Пакт"
teuton.208.desc:0 "Тевтонська Імперія пропонує союз проти Риму, посилаючись на спогади про імперські кайдани та іноземне правління. Ми пам'ятаємо орлині прапори, що майоріли над нашими землями, століття підкорення. Римляни ніколи не повинні знову піднятися. Проте Тевтони — не святі: вони також плекають амбіції, замасковані дипломатією. Приєднатися до них — це ризикнути нашим суверенітетом. Тим не менш, загроза реальна, і часу обмаль. Чи вдаримо ми превентивно з малоймовірними союзниками, чи ризикнемо зіткнутися з обома імперіями наодинці?"
teuton.208.a:0 "Ми не можемо дозволити нашим колишнім володарям знову нас контролювати."
teuton.208.b:0 "Римляни можуть бути загрозою, але Тевтони — більше зло."

teuton.2088.t:0 "Британці Погоджуються Підписати!"
teuton.2088.desc:0 "Британія підписала пакт, обравши мужність та передбачливість замість вагань. Їхні лідери розуміють, що Римській загрозі не можна протистояти наодинці. З їхньою морською майстерністю та нашою військовою міццю, союз тепер охоплює сушу та море. Разом ми розчавимо імперську мрію раз і назавжди. Нехай світ засвідчить: 'Антиримський Пакт' — це вже не бачення, а реальність, і він марширує до перемоги проти Риму та Константинополя."
teuton.2088.a:0 "Завоюймо Рим разом!"

teuton.2084.t:0 "Британці Відмовляються..."
teuton.2084.desc:0 "Британці відмовилися від нашої пропозиції, засліплені недовірою та переслідувані старими образами. Їхнє рішення є серйозним прорахунком. Ми запропонували їм щит проти Римської агресії, а вони плюнули нам в обличчя. Хай буде так. Нехай кляті Римляни знову їх завоюють — можливо, тоді вони згадають, що означає бути під владою. Тевтонська Імперія не чекатиме на тих, хто вагається. Ми рухаємося вперед, з ними чи без них."
teuton.2084.a:0 "Нехай кляті Римляни знову їх завоюють."

teuton.299.t:0 "Антиримський Пакт"
teuton.299.desc:0 "Тевтонська Імперія простягнула руку — загорнуту в залізо та завуальовану дипломатією. Вони пропонують пакт проти Римської загрози, обіцяючи захист та спільну силу. Проте багато хто в нашому уряді пам'ятає минулі завоювання Тевтонів, їхню зневагу до Слов'янської автономії та їхню жагу до впливу. Прийняти — означало б обміняти одне імперське ярмо на інше. Але з Римськими легіонами, що активізуються на півдні, питання залишається: чи варте виживання підкорення?"
teuton.299.a:0 "Краще бути під Тевтонами, ніж під Римлянами."
teuton.299.b:0 "Ні! Ми ніколи не схилимо коліно перед Тевтонами!"

teuton.2999.t:0 "Чехословацька Держава Приєднується До Нас!"
teuton.2999.desc:0 "Наші південні сусіди побачили розум. Перед обличчям Римського експансіонізму вони обрали єдність із Тевтонською Імперією. Їхня вірність зміцнює наш східний фланг і надсилає чітке повідомлення Риму: старі союзи руйнуються, і піднімається новий лад. Нехай світ засвідчить — Тевтонська сталь і Слов'янська рішучість тепер марширують як одне ціле."
teuton.2999.a:0 "Наш південний сусід з нами!"

teuton.2991.t:0 "Чехословацька Держава Відмовляється..."
teuton.2991.desc:0 "Дурні. Чехословацька Держава відхилила нашу пропозицію, чіпляючись за свою крихку незалежність, коли Римський вплив підкрадається все ближче. Нехай вони зіткнуться з наслідками своєї гордості. Ми не захищатимемо їх, коли прибудуть легіони. Якщо вони бажають стояти наодинці, то наодинці вони й впадуть."
teuton.2991.a:0 "Нехай їх завоюють Римляни, а ми й оком не моргнемо."

teuton.666.t:0 "Катастрофа в Альпах"
teuton.666.desc:0 "Повідомлення надійшло в глибокій тиші. Прикордонний патруль на високих Альпійських перевалах натрапив на понівечені уламки — метал порваний, обгорілий і наполовину похований у снігу. Це був літак. Не наш. Тевтонські позначки, безпомилкові. Жодного плану польоту. Жодного дипломатичного дозволу. Розвідник, відправлений глибоко на нашу територію під покровом хмар і ночі.\n\nПілот був мертвий, замерзлий у кабіні, його обличчя застигло у фінальній гримасі. Бортове обладнання було пошкоджене, але його можна було розпізнати. Обладнання для спостереження. Карти місцевості. Частково розшифрований журнал передач — зашифровані координати, деякі з яких збігаються з нашими прикордонними укріпленнями. Вони спостерігали. Вимірювали. Готувалися.\n\nКомандування Легіону збентежене. Тевтони активізуються — мобілізують сили, укріплюють дороги, шепочуть про єдність і помсту. Ми казали собі, що це просто балаканина. Але ці уламки — не випадковість. Це повідомлення. Або, що гірше, попередження.\n\nВід Тевтонської Імперії не надійшло жодного слова. Жодних вибачень. Жодних пояснень. Лише тиша. А тиша в такі часи гучніша за військові барабани. Альпи довго стояли стіною між імперіями. Але тепер вони відчуваються як лінія розлому — що тріщить під вагою чогось величезного і жорстокого. Щось наближається. Ми відчуваємо це у морозі. У тиші. В очах кожного солдата, який бачив ті уламки і знав. Тевтони не просто спостерігають. Вони готові."
teuton.666.a:0 "Вони розвідували наші оборонні рубежі... Чому?"

teuton.667.t:0 "Катастрофа в Альпах"
teuton.667.desc:0 "Повідомлення надійшло в глибокій тиші. Прикордонний патруль на високих Альпійських перевалах натрапив на понівечені уламки — метал порваний, обгорілий і наполовину похований у снігу. Це був літак. Не наш. Тевтонські позначки, безпомилкові. Жодного плану польоту. Жодного дипломатичного дозволу. Розвідник, відправлений глибоко на нашу територію під покровом хмар і ночі.\n\nПілот був мертвий, замерзлий у кабіні, його обличчя застигло у фінальній гримасі. Бортове обладнання було пошкоджене, але його можна було розпізнати. Обладнання для спостереження. Карти місцевості. Частково розшифрований журнал передач — зашифровані координати, деякі з яких збігаються з нашими прикордонними укріпленнями. Вони спостерігали. Вимірювали. Готувалися.\n\nКомандування Легіону збентежене. Тевтони активізуються — мобілізують сили, укріплюють дороги, шепочуть про єдність і помсту. Ми казали собі, що це просто балаканина. Але ці уламки — не випадковість. Це повідомлення. Або, що гірше, попередження.\n\nВід Тевтонської Імперії не надійшло жодного слова. Жодних вибачень. Жодних пояснень. Лише тиша. А тиша в такі часи гучніша за військові барабани. Альпи довго стояли стіною між імперіями. Але тепер вони відчуваються як лінія розлому — що тріщить під вагою чогось величезного і жорстокого. Щось наближається. Ми відчуваємо це у морозі. У тиші. В очах кожного солдата, який бачив ті уламки і знав. Тевтони не просто спостерігають. Вони готові."
teuton.667.a:0 "Вони розвідували наші оборонні рубежі... Чому?"

teuton.455.t:0 "Питання Сенату"
teuton.455.desc:0 "Сенат завжди був проблемою для Гохмайстера, сформований за моделлю старої Римської Республіки — він став зухвалим у своїй непокорі після сходження Вільгельма. Велика фракція сенаторів тепер відкрито ставить під сумнів його владу, посилаючись на корупцію, стагнацію та чутки про Римський вплив. Їхня риторика набирає обертів серед розчарованих, загрожуючи розколоти нашу славетну Імперію зсередини. Гохмайстер повинен вирішити зараз: придушити інакомислення силою, домовитися про компроміс, або дозволити Сенату висловитися та ризикнути підбадьорити майбутню опозицію."
teuton.455.a:0 "Розправитися з дисидентами"
teuton.455.b:0 "Розпочати переговори"
teuton.455.c:0 "Дозволити їм вільно говорити"

teuton.99.t:0 "Тевтони Пропонують Договір"
teuton.99.desc:0 "Тевтонська Імперія звернулася до нас із пропозицією формалізувати договір про обмін технологіями, зокрема пропонуючи досягнення в конструкції броні та металургії. Хоча їхні наміри залишаються незрозумілими, потенційні переваги для наших бронетанкових дивізій не можна ігнорувати. Тевтонська інженерія є однією з найкращих у Європі, і інтеграція їхніх проєктів може дати нашим силам вирішальну перевагу на полі бою. Проте багато хто в Кремлі залишається скептичним — спогади про минулі конфлікти та ідеологічні розбіжності глибокі. Підписання цього договору може розглядатися як зрада нашої стратегічної незалежності, але відмова від нього може означати відставання в гонці озброєнь. Рішення тепер за нами: прийняти прагматичну співпрацю, чи підтвердити нашу непокору Тевтонському впливу."
teuton.99.a:0 "Ми підпишемо."
teuton.99.b:0 "Ми ніколи не співпрацюємо з Тевтонами!"

teuton.991.t:0 "Росіяни Підписують Договір!"
teuton.991.desc:0 "Російський уряд офіційно погодився на умови нашого запропонованого договору про обмін технологіями. Це знаменує важливу дипломатичну віху, створюючи рамки для взаємної співпраці у розвитку та вдосконаленні можливостей бронетанкової війни. Наші інженерні команди розпочнуть спільні операції зі своїми російськими колегами, сприяючи обміну технічним досвідом та методологіями виробництва. Хоча історична напруга зберігається, ця угода являє собою прагматичний крок до стратегічного узгодження та посилення військової готовності обох сторін."
teuton.991.a:0 "За обидві наші країни!"

teuton.992.t:0 "Росіяни Відмовляються Підписати."
teuton.992.desc:0 "Росіяни відхилили нашу пропозицію, відмовившись підписати договір і знехтувавши можливістю технологічної співпраці. Їхнє рішення підтверджує глибоко вкорінену підозру та ворожість, які довгий час визначали наші відносини. Нехай буде відомо: ми простягли руку, а вони відвернулися. Ми підемо вперед самі, і якщо наші танки зустрінуться з їхніми на полі бою, вони дізнаються ціну впертої гордості."
teuton.992.a:0 "Росіяни завжди будуть росіянами."

teuton.300.t:0 "Тевтони Вимагають Судети!"
teuton.300.desc:0 "Тевтонська Імперія офіційно висунула ультиматум нашому уряду, вимагаючи передачі Судетської області. Вони стверджують, що германські народи в цьому регіоні по праву належать до них, і що будь-яка відмова підкоритися буде розглядатися як прямий акт ворожості. Наша нація тепер стоїть на роздоріжжі: здати наші укріплені прикордонні землі, або ризикнути війною з Тевтонською силою, що піднімається."
teuton.300.a:0 "Ми повинні зберегти мир за будь-яку ціну..."
teuton.300.b:0 "Ми ніколи не віддамо їм наші землі!"

teuton.301.t:0 "Чехословацька Держава Приймає!"
teuton.301.desc:0 "Прага підкорилася нашим вимогам! Судетська область тепер по праву повертається до Тевтонської Імперії. З нашими забезпеченими кордонами та виконаною волею нашого народу, Тевтонська Імперія крокує до майбутнього, стаючи все сильнішою."
teuton.301.a:0 "Наша доля виконана!"

teuton.302.t:0 "Чехословацька Держава Відмовляється..."
teuton.302.desc:0 "Зрадницький уряд у Празі наважився відхилити наші законні претензії на Судетську область! Замість того, щоб зрозуміти, вони готуються чинити нам опір силою. Судетські німці кличуть про визволення, і ми відповімо на їхній заклик. Війна тепер неминуча."
teuton.302.a:0 "Ну, ну, ну. Здається, вони обрали важкий шлях."

tanks.2.t:0 "Пріоритет Виробництва"
tanks.2.desc:0 "У Військовому Командуванні Східного Риму точаться великі дебати щодо того, що слід пріоритезувати у виробництві певного озброєння. Найбільші претенденти — протитанкова чи протиповітряна зброя, кожна з яких пропонує переваги та недоліки для наших Легіонів. Протитанкова зброя дає нашим легіонам можливість завдавати ударів та знищувати ворогів на землі, тоді як протиповітряна дозволяє нам збивати кожного ворога Риму, який наважується увійти в наш простір."
tanks.2.a:0 "Протитанкова"
tanks.2.b:0 "Протиповітряна"

teuton.719.t:0 "Bellum Magnum розпочалася"
teuton.719.desc:0 "Bellum Magnum (Велика Війна) вибухнула. Кайзерпакт, очолюваний Тевтонською Імперією, перетнув кордон із Західною Римською Імперією, розбиваючи десятиліття хиткої стабільності. Мобілізація повна, оскільки обидві сторони кидають усе на війну, яка визначить долю Європи — та світу. 'Римська Ліга' намагається відповісти, але масштаб та лють вторгнення загрожують перевантажити навіть найбільш підготовлені оборонні рубежі. Зіткнення між двома найбільшими світовими державами — це не звичайний конфлікт; це найбільша війна, з якою коли-небудь стикалося людство, та, яка може вирішити, чи виживе Римська гегемонія, чи завалиться, прокладаючи шлях для нового порядку."
teuton.719.a:0 "Молот упав. Рим впаде."
teuton.719.b:0 "О Боже... Вони наближаються..."
teuton.719.c:0 "Світ розвалюється. Ми повинні обирати."

teuton.555.t:0 "Ультиматум Кайзера"
teuton.555.desc:0 "Вільгельм II вирішив не йти повільним та невизначеним шляхом розробки конституції для Сенату. Натомість він висунув сміливий ультиматум: або Сенат поступається широкими повноваженнями Гохмайстеру та його уряду, або вони ризикують гнівом корони. Повідомлення чітке — підкоріться, або зіткніться з наслідками. Доля нашої внутрішньої стабільності тепер висить на волосині, оскільки Сенат готує свою відповідь."
teuton.555.a:0 "Надіслати ультиматум."

teuton.554.t:0 "Шанс Саботувати Тевтонську Політику"
teuton.554.desc:0 "Тевтонському Сенату був представлений ультиматум Кайзера — вимога, яка позбавить їхнього авторитету та передасть увесь державний механізм у його руки. Наші агенти повідомили нам, що Сенат розділений, не впевнений, як реагувати. Якщо ми втрутимося, наш саботаж може схилити голосування проти Кайзера, але це ризикує викриттям та майбутньою відплатою."
teuton.554.a:0 "Саботувати голосування Сенату."
teuton.552.b:0 "Нічого не робити."

teuton.553.t:0 "Ультиматум Ветовано!"
teuton.553.desc:0 "Сенат відхилив ультиматум, засудивши його як безрозсудне захоплення влади, яке поклало б край делікатному балансу управління. Сенатори говорять про свій обов'язок протистояти тиранії, і їхнє вето є прямою образою авторитету Кайзера. Блеф не вдався, і приниження не буде легко забуте. По всій Імперії ширяться чутки про слабкість, навіть коли Вільгельм II клянеться помститися тим, хто йому протистояв."
teuton.553.a:0 "Хай йому грець!"

teuton.551.t:0 "Ультиматум Прийнято!"
teuton.551.desc:0 "Сенат підкорився волі Кайзера. Залякані його погрозами та вражені його зростаючим впливом, вони проголосували за передачу уряду широких повноважень. Для Вільгельма II це тріумф — доказ того, що його залізній волі не можна протистояти. Зали уряду тепер лунають покорою, і шлях до абсолютного контролю очищений. Люди вітають, дехто з лояльності, інші зі страху."
teuton.551.a:0 "Славетна перемога!"

teuton.557.t:0 "Докази Російського Саботажу!"
teuton.557.desc:0 "Розслідування лояльних агентів виявило незаперечні докази: росіяни втручалися в наш політичний процес, поширюючи хабарі, шепіт і страх серед Сенаторів, щоб забезпечити відхилення ультиматуму. Зрада незаперечна, і Кайзер кипить люттю. Нічого не робити було б визнанням слабкості, але відплата ризикує ескалацією конфлікту з нашим східним суперником."
teuton.557.a:0 "Оголосити ембарго Росії!"
teuton.557.b:0 "Нічого не робити."

teuton.558.t:0 "Тевтони Відповідають!"
teuton.558.desc:0 "Тевтони виявили наше втручання у рішення Сенату і відповіли люттю. Їхній уряд оголосив ембарго, завдаючи удару по нашій економіці та престижу. Наша участь більше не є таємницею — світ тепер знає, що ми втручалися в їхні справи, і Тевтони не пробачать легко."
teuton.558.a:0 "Хай їм грець!"

teuton.466.t:0 "Тевтонська Імперія Пропонує Захист"
teuton.466.desc:0 "Тевтонська Імперія простягнула руку — одягнену не в оксамит, а в залізо. Вони говорять про 'захист', слово, що тремтить фальшивою доброзичливістю. Але ми знаємо краще. Це не пакт між рівними. Це нашийник, викуваний у Варшаві, призначений бути застебнутим навколо нашої шиї. Якщо ми погодимося, наша корона, можливо, все ще блищатиме на сонці, але її тягар більше не буде нашим. Наші закони відлунюватимуть чужими мовами, наші армії маршируватимуть під чужі барабани, а наша горда Співдружність стане тінню, відкинутою Тевтонськими амбіціями.\n\nПроте буря збирається. Росіяни ворушаться на сході, Римляни інтригують на заході, а наші союзники замовкають. Світ більше не прихильний до гордих. Відмовитися може означати війну, руїну та повільну смерть нашого суверенітету. Але погодитися — це жити як васали: можливо, у безпеці, але скуті. Співдружність розділена. Дехто шепоче, що виживання благородніше за непокору. Інші кричать, що нація без свободи — це взагалі не нація. Отже, ми стоїмо на роздоріжжі історії. Один шлях веде до позолочених ланцюгів. Інший — до невизначеного вогню."
teuton.466.a:0 "Ми повинні зберегти наш мир... за будь-яку ціну."
teuton.466.b:0 "Ми ніколи не схилимо коліно перед Тевтонами!"

teuton.467.t:0 "Співдружність Приймає Наш Захист!"
teuton.467.desc:0 "Польсько-Литовська Співдружність підкорилася нашій владі. Хоча вони можуть говорити про партнерство, правда очевидна: їхній суверенітет тепер тече Тевтонськими венами. З їхніми землями під нашим пильним оком, наш східний кордон забезпечений, і наш вплив простягається глибше в серце Європи."
teuton.467.a:0 "Кордон з Росіянами забезпечено."

teuton.468.t:0 "Співдружність Відмовляє Нам у Захисті!"
teuton.468.desc:0 "Співдружність відхилила нашу пропозицію, обравши гордість замість розсудливості. Їхня непокора помічена — і не буде забута. Якщо вони не стануть з нами проти Римської загрози, то зіткнуться з наслідками самі. Час для дипломатії минув. Нехай зазвучать барабани війни, і нехай їхні землі дізнаються ціну ізоляції."
teuton.468.a:0 "Тоді війна прийде на їхні землі."

teuton.551255.t:0 "Тевтонська Імперія Заявляє Східні Претензії"
teuton.551255.desc:0 "Поки Тевтонська Імперія бореться з Римськими силами на заході, її погляд тепер звертається на схід. Тевтонські чиновники видали офіційні декларації, що заявляють історичні та стратегічні претензії на території, які утримує Польсько-Литовська Співдружність. Оголошення окреслює бачення Тевтонської експансії, що простягається до російського кордону — зухвала спроба забезпечити вплив по всьому північному коридору Європи. Хоча жодного пострілу не пролунало, наслідки очевидні. Співдружність, спіймана між відроджуваною Тевтонською Імперією та далеким поглядом Москви, тепер опиняється в хисткому становищі. Дипломати метушаться, альянси перевіряються, і світ спостерігає — розмірковуючи, чи це лише поза, чи тиха прелюдія до нового фронту у вже розростаючій війні."
teuton.551255.a:0 "Співдружність буде наступною, що впаде!"
teuton.551255.b:0 "Співдружність буде наступною, що впаде..."
teuton.551255.c:0 "Співдружність буде наступною, що впаде..."

teuton.100.t:0 "Тевтонська Імперія Пропонує Договір"
teuton.100.desc:0 "У кроці, що викликав дебати в залах Москви, Тевтонська Імперія надіслала офіційну пропозицію про договір про ненапад та взаємне визнання. Оскільки Рим пильно стежить, а Співдружність перебуває під зростаючим тиском, Берлін прагне забезпечити свій східний фланг — пропонуючи Росії шанс змінити регіональний баланс, не вистріливши жодного разу. Пропозиція прибуває, замаскована під прагматизм, але під її відточеною мовою криється глибша амбіція: Тевтонський доступ до російського кордону та мовчазне схвалення їхніх східних претензій. Кремль розділений. Деякі стверджують, що союз із Берліном може дати перепочинок та стратегічний вплив. Інші попереджають, що Тевтони, з їхніми імперськими амбіціями та історією експансіонізму, становлять більшу довгострокову загрозу, ніж Рим коли-небудь міг. Рішення відгукнеться далеко за стінами Кремля."
teuton.100.a:0 "Краще об'єднатися з Берліном, ніж з Римом..."
teuton.100.b:0 "Ніколи! Рим може бути жахливим, але Тевтони набагато гірші!"

teuton.101.t:0 "Росіяни Відмовляються!"
teuton.101.desc:0 "Російська Федеративна Соціалістична Республіка відхилила Тевтонську пропозицію. Незважаючи на ретельно складені умови та обіцянку мирного співіснування, Москва вирішила триматися осторонь. Відмова, висловлена з холодною формальністю, підкреслює глибоку ідеологічну розбіжність та затяжну недовіру між двома державами. У Берліні Вища Рада висловлює розчарування, але не здивування. Відмова розглядається як підтвердження небажання Росії дивитися далі за свою власну догму. Наразі східний кордон залишається невизначеним — тихим, але напруженим."
teuton.101.a:0 "Росіяни завжди будуть росіянами..."

teuton.102.t:0 "Росіяни Приймають!"
teuton.102.desc:0 "У розвитку подій, що приголомшив спостерігачів по всій Європі, Російська Федеративна Соціалістична Республіка прийняла пропозицію Тевтонської Імперії. Договір, підписаний під час стриманого дипломатичного обміну, знаменує поворотний момент у східних відносинах. Коли Рим відволічений, а Співдружність уразлива, Берлін та Москва тепер готові переглянути регіональний порядок. Угода обіцяє ненапад, взаємне визнання та спільний інтерес до стабільності вздовж їхнього кордону. Для Тевтонської Імперії це дипломатична перемога — доказ того, що навіть ідеологічні суперники можуть бути схилені стратегічною необхідністю. У Кенігсберзі настрій тріумфальний. У Москві — обережний. А по всій Європі залишається питання: чи це початок нового узгодження, чи лише пауза перед загостренням глибшої напруги?"
teuton.102.a:0 "За велике майбутнє між нашими народами!"

teuton.777.t:0 "Закон про Райхстаг"
teuton.777.desc:0 "Після місяців політичних маневрувань, громадських заворушень та закулісного примусу, Райхстаг ухвалив всеосяжний закон, який позбавляє Сенат його решти повноважень. Колись горда інституція, змодельована за Римським республіканізмом, Сенат тепер стоїть як порожня палата — його члени зведені до церемоніальних радників, його голос придушений залізною волею Гохмайстера.\n\nЗакон, представлений як необхідний захід для забезпечення національної єдності та ефективності воєнного часу, був зустрінутий неоднозначно. Дехто вітає його як світанок сильнішої, більш рішучої Імперії. Інші шепочуть про тиранію, замасковану патріотизмом. Незважаючи на це, баланс сил змінився — і Тевтонська Імперія йде вперед, не обтяжена ланцюгами дебатів."
teuton.777.a:0 "Ухвалити Закон!"
teuton.777.b:0 "Краще цього не робити..."

teuton.778.t:0 "Тевтони Запроваджують Закон про Райхстаг"
teuton.778.desc:0 "У всеосяжному акті політичної трансформації Тевтонська Імперія запровадила 'Закон про Райхстаг' — авторитарний указ, який позбавляє Сенат усієї законодавчої влади та консолідує владу під Гохмайстером. Колись бастіон дебатів та республіканських ідеалів, Райхстаг тепер стоїть як церемоніальний пережиток, його палати замовкли, а його члени зведені до простих спостерігачів імперської волі.\n\nГохмайстер, посилаючись на необхідність національної єдності та ефективності воєнного часу, оголосив закон необхідним кроком для 'збереження душі Імперії'. Прихильники гуртувалися на вулицях, розмахуючи чорно-золотими прапорами та скандуючи гасла лояльності. Проте під поверхнею наростає шепіт незгоди. Колишні сенатори та іноземні спостерігачі попереджають, що Імперія хитається на межі деспотизму."
teuton.778.a:0 "Хай живе Гохмайстер!"
teuton.778.b:0 "Майбутнє Тевтонської Імперії похмуре... для всіх нас."


