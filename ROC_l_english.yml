l_english:
CRP.1.t:0 "Weng Jinwei's Leadership"
CRP.1.desc:0 "In these dark times, one leader has risen from the ashes, originally thought to be just another revolutionary, he won the rivalry with Chiang Kai-shek and since then, has been ruling the country, he now is on a difficult path, the Shadow of the Ming continues to hautn the Republic of China and the agrarian country is still underdeveloped, it will be under him whether China will rise from the ashes, or sticks to an old tradition."
CRP.1.a:0 "Long Live Weng Jinwei!"

CRP.2.t:0 "Reunification of China"
CRP.2.desc:0 "We have done it, it has been 286 years since China was last fully unified, and now it is, under one flag, one banner and one nation, we shall begin the Chinese Age for China, with China, under Wang Jinwei's Leadership. Let us remember the souls who have died to bring us to the turning point of history, the turning point of the world, and all eyes turn on China, from the east, to the west, to the north, to the south, it is time for a new era. A Chinese Era."
CRP.2.a:0 "So the Dragon of the East has risen."

CRP.3.t:0 "Ultimantium to Tibet"
CRP.3.desc:0 "It is time for the fall of Tibet, either they will be annexed through force or through peace, it does not matter in the end and we will have our way with them, whether their government wants it, or not."
CRP.3.a:0 "Yet again, their ignorance shows.."

CRP.4.t:0 "Ultimantium to Xinjiang"
CRP.4.desc:0 "A second front is ideal for our war against the Ming, the Xinjiang people have been a nusiance, constantly getting in our way during negotiations with the Ming, and it is time to end them once and for all."
CRP.4.a:0 "Yet again, their ignorance shows.."

CRP.5.t:0 "A Strange Man appears in Guangzhou.."
CRP.5.desc:0 "He claims to be the descendant of all China, claiming to also be the reincarnation of Mao Zedong, his ideas and personality is eerily similar to him aswell, not only that, but his entire face has changed, we do not know whether he is telling the truth, but we need a decision, he may cause instability and riots should he continue."
CRP.5.a:0 "Execute him and hang his followers."
CRP.5.b:0 "Perhaps we should see where this goes.."

CRP.6.t:0 "It went nowhere.."
CRP.5.desc:0 "It turns out he was a fraud, his entire motive for doing so remains unknown, as he attempted a rebellion and was shot down by one of our soldiers, it seems the mystery has went unsolved."
CRP.6.a:0 "Dang it!"

CRP.7.t:0 "Ultimantium to the Khanate of Mongolia"
CRP.7.des:0 "The beginning of the end has begun for the Khanate in Mongolia, whether through force or peace, we shall make them submit, for a brighter future, and brighter china."
CRP.7.a:0 "Yet again, their ignorance shows.."

CRP_Weng_Jinweis_Leadership:0 "Wang Jinwei's Leadership"
CRP_Weng_Jinweis_Leadership_desc:0 "Wang Jinwei has led us into a new era, a turblent but resilent era, yet there is still underlying elements in the Chinese State that is rotting our nation, we must follow Wang Jinwei lest our nation fall in peril."
CRP_Support_The_Left:0 "Support The Left"
CRP_Support_The_Left_desc:0 "The Left is Wang Jinwei's main party, it is where his power and control is, therefore we must support him and his party, in order to further centralize China and prevent instability."
CRP_Reorganize_The_Railways:0 "Reorganize the Railways"
CRP_Reorganize_The_Railways_desc:0 "Over centuries of control, the railways have gotten too powerful, they influence national poltiics to an absurd degree, more then most political parties, they must be stopped, lest China itself faces peril from the one enemy they did not expect."
CRP_Principle_of_Minsheng:0 "Principle of Minsheng"
CRP_Principle_of_Minsheng_desc:0 "With the politics of the country nearly settled, Wing Jinwei can focus on what he always wanted to do, and the foundation of this, will be the Principle of Minsheng, his own vision for leading China into a brighter future."
Principle_of_Minsheng:0 "Principle of Minsheng"
Principle_of_Minsheng_desc:0 "test"
CRP_Shadow_of_The_Ming:0 "Shadow of The Ming"
CRP_Shadow_of_The_Ming_desc:0 "The internal poltiics of the Republic is still in turmoil, many are still sympathetic to the Ming, and to Beijing, these people are to be expolited to create further instability in China."
CRP_Subvert_Ming_Influence:0 "Subvert Ming Influence"
CRP_Subvert_Ming_Influence_desc:0 "Since the Revolution, the Ming has watched it's south fall under our flag, and Beijing will not simply glare at us, many officals are corrupted by the Ming, Weng Jinwei must subvert the influence of the Ming, lest peril falls China."
CRP_Preparations_For_The_Second_Xinhai_Revolution:0 "Preparations For The Second Xinhai Revolution"
CRP_Preparations_For_The_Second_Xinhai_Revolution_desc:0 "We must prepare for the inevitable, for years the Ming has been modernizing and arming, border conflicts still occur regularly at the DMZ, we must strike first, and strike hard."
CRP_Executive_Directive_77:0 "Executive Directive No. 77"
CRP_Executive_Directive_77_desc:0 "The rearmament of the state is paramount to our survival, with the Principle of Mensheng we shall advance faster and further then any who has come before us, to secure our independnece and our liberty, it must be done."
CRP_Weed_out_Corrupt_Officals:0 "Weed out Corrupt Officals"
CRP_Weed_out_Corrupt_Officals_desc:0 "Corruption in the state runs rampant, the halls of power fill with lies and backdoor deals, the Republic is plagued by the blatant corruption that is happening in broad daylight, it is time to crush these corrupt officals, and put an end to this system."
CRP_Sabotage_Ming_Industry:0 "Sabotage Ming Industry"
CRP_Sabotage_Ming_Industry_desc:0 "We must reek in the fish, and reel in the Ming, while we sabotage their industry, we can continue to rearm and prepare further for the Second Xinhai Revolution."
CRP_Military-Industrial_Complex:0 "Military Industrial Complex"
CRP_Military-Industrial_Complex_desc:0 "Under the Principle of Minsheng, the Republic must reorganize its agrarian industry, into an industrial one, to fully unlock the industrial might of China, for a brighter future."
CRP_European_Modernization:0 "European Modernization"
CRP_European_Modernization_desc:0 "We must follow the tradition of a modern army, the Teutons have offered to give us lessons and let us learn from their armed forces, and we shall take it with honour."
CRP_Further_Further_Further:0 "Further! Further! Further!"
CRP_Further_Further_Further_desc:0 "The full and total elimination of any Ming agents acting in the Republic of China is required, even if we may sacrifice some innocents, all for Wang Jinwei!"
CRP_Garner_European_Support:0 "Garner European Support"
CRP_Garner_European_Support_desc:0 "In order to ensure our victory in the coming war, we must choose who to garner our support from, the Teutons, a natural ally to have, or the West Romans, who have long had a bitter rivalry with the East, who shall we choose?"
CRP_Army_Dominant:0 "Army Dominant"
CRP_Army_Dominant_desc:0 "Our armed forces is ready for a war, this is our final gamble, either we win or lose, China will be changed forever, it is up to the Army to acheive victory in the inevitable war."
CRP_From_The_Western_Romans:0 "From the Western Roman Empire"
CRP_From_The_Western_Romans_desc:0 "Our aid must come from the Western Roman Empire, originally thought to be just another ally of the Ming, it turns out they have ulterior motives, which includes a restored China under the Republican Flag."
CRP_From_The_Teutons:0 "From the Teutonic Empire"
CRP_From_The_Teutons_desc:0 "Our aid must come from the Teutonic Empire, our long lived ally, who wishes for a unified China under our banner, and a natural ally aswell, with many of their investments being in our China."
CRP_Begin_The_Second_Xinhai_Revolution:0 "Begin The Second Xinhai Revolution"
CRP_Begin_The_Second_Xinhai_Revolution_desc:0 "China need not be under 5 flags, 5 banners, 5 countries, instead it shall be under one flag, one banner and one country, forged in blood, sweat and steel, a new Chinese Age has begun."
CRP_Submission_of_Tibet:0 "Submission of Tibet"
CRP_Submission_of_Tibet_desc:0 "The Himalayas are a scarce region, full of mountains and perfect for launching incursions into Ming space, we must make the Tibetian government yield, whether through force, or through diplomacy."
CRP_Submission_of_Xinjiang:0 "Submission of Xinjiang"
CRP_Submission_of_Xinjiang_desc:0 "Should we take over Xinjiang, there will be another front that the Ming will have to worry about, and Eastern China will almost certainly be in our hands, it is thus required we get them on our side."
CRP_Submission_of_Mongolia:0 "The Submission of Mongolia"
CRP_Submission_of_Mongolia_desc:0 "The Mongolian Khanate will have to yield, in our plans of national security, they are near top priority, should we take over their government, Beijing will face itself in a three front war, and victory will be all but guaranteed."
CRP_Reunification_of_China:0 "Reunification of China"
CRP_Reunification_of_China_desc:0 "The World Trembles, for the first time in centuries, by blood, sweat and steel, it has been done, China has been reunified under Wang Jinwei, and the Chinese Era, for better or worse, has begun."
Reunification_of_China:0 "Reunification of China"
Reunification_of_China_desc:0 "It has been exactly 286 years since China was first fully unified, and now, it shall be again, from the Himalayas to the south, to the Gobi Desert to the North, to the Korean Penisula to the East, we have reached a turning point in Chinese History, no single empire will now ever truly match the Chinese Might, for it is Weng Jinwei who will decide the new age."
Shadow_of_The_Ming_2:0 "Shadow of the Ming"
Executive_Directive_77:0 "Executive Directive No. 77"
Preparations_For_The_Second_Xinhai_Revolution:0 "Preparations For The Second Xinhai Revolution"
Further_Further_Further:0 "Further! Further! Further!"
Army_Dominant:0 "Army Dominant"
CRP_operation_sunset:0 "Operation Sunset"
CRP_operation_sunset_desc:0 "To our east lies the Land of the Rising Sun, their rapid militarization and threatening to take the concession cities has been a worry to Beijing, it is time to set the Rising Sun."
CRP_operation_viet:0 "Operation Viet"
CRP_operation_viet_desc:0 "To our south lays the Nam Dynasty, an ignorant dynasty that has constantly been pirating our merchant vessels, their government shows defiance due to the Eastern Roman Empire's support, yet they will be proven wrong."
CRP_operation_phony:0 "Operation Phony"
CRP_operation_phony_desc:0 "To our south east, lays the region of the Phillippines, ripe for conquest and invasion, it is a suitable jumping off point for our invasion of South East Asia, as well as providing us with massive gold resources."
CRP_operation_bengali:0 "Operation Bengali"
CRP_operation_bengali_desc:0 "To our west, lays the lands of India, weakened by years of civil war and strife, the confederacy is a suitable point of invasion, for our further storm into Southern Asia."
CRP_operation_rubber:0 "Operation Rubber"
CRP_operation_rubber_desc:0 "To our far south, lays the Jungle of Indonesia and Malaysia, ripe for invasion, these lands have key resources that will fuel our War Machine as we prepare for our final storm of the world."
CRP_final_storm:0 "The Final Storm"
CRP_final_storm_desc:0 "So it has come to this, in a meeting room in Beijing, the Congress has been assembled, the vote is 218-209, Operation Final Storm is unleashed, and thus begins the Second World War, our final gamble, China will either be a world power, or will not."
CRP_one_world_one_china:0 "One World, One China"
CRP_one_world_one_china_desc:0 "The Second War is over, now it is only time for world domination, and by extension, world conquest, the new age has begun, and China will be the only nation left."
CRP_industrial_reformation_plan:0 "Industrial Reformation Plan"
CRP_industrial_reformation_plan_desc:0 "Our industry is backwards and not at all comparable to the Ming, we must either modernize our industry, or die trying."
CRP_deng_xiaoping_plan:0 "Deng Xiaoping's Plan"
CRP_deng_xiaoping_plan_desc:0 "We must move with Deng Xiaoping, his ideas for reform are simply too great, Agrarianism is simply the way to go for China!"
CRP_wang_jingwei_plan:0 "Wang Jinwei's Plan"
CRP_wang_jingwei_plan_desc:0 "We must move with Wang Jinwei, his ideas for reform are simply too great, Industrial Reformation is simply the way to go for China!"
CRP_following_chinese_legacy:0 "Following Chinese Legacy"
CRP_following_chinese_legacy:0 "We must follow back to our roots, where China originally took off into a superpower, built on the backs of Agrarianism."
CRP_transformation_into_agrarianism:0 "Transformation into Agrarianism"
CRP_transformation_into_agrarianism_desc:0 "It is time to fully transform our nation, into a nation for the people, a state for the people, and an army for the people, for Agrarianism! The Method Forward!"
CRP_going_back_to_old_roots:0 "Going back to the Old Roots"
CRP_going_back_to_old_roots_desc:0 "In order to ensure the final phase of the Deng Xiaoping plan is successful, we must return to original Chinese tradition, to pave the way forward for a new era and a new age, a Chinese Age."
CRP_continued_industrial_centralization:0 "Continued Industrial Centralization"
CRP_continued_industrial_centralization_desc:0 "As per Wang Jinwei's plan of an industralized society, centralization of the key industrial areas is a must, and it will lead to our success, whether intentional, or not."
CRP_agrarian_reform:0 "Agrarian Reform"
CRP_agrarian_reform_desc:0 "Following Wang Jinwei, the agrarian areas of the country must be reformed, it is imperative for this to happen, for a revived China."
CRP_chinese_industrial_giant:0 "Chinese Industrial Giant"
CRP_chinese_industrial_giant_desc:0 "Many have doubted Wang Jinwei, but he has brought upon China an Industrial Revolution, and to that, we are to thank him, for it will not be Deng Xiaoping who rules over the Chinese Industry, but our glorious leader Wang Jinwei."
CRP_revival_of_chinese_industry:0 "Revival of the Chinese Industry"
CRP_revival_of_chinese_industry_desc:0 "We have done, it has been hundreds of years since China has ever fully had an industralized nation, yet here we are, in the very bones and flesh, it is time for a new National holiday, for this day, this day will not be the last day we will industralize, it is only the end of the beginning, and the beginning of the end."
CRP_armed_forces_reformation_plan:0 "The Armed Forces Reformation Plan"
CRP_armed_forces_reformation_plan_desc:0 "The Armed Forces is in a sad state, the Officers Corps are rife with corruption and inefficency, the troops have no hope, they live in dug out holes even when it is peace time, there is no organization at all, we must fix this, lest the Ming take advantage and destroy us."
CRP_zhang_xueliang_plan:0 "Zhang Xueliang's Plan"
CRP_zhang_xueliang_plan_desc:0 "It is time to go with Zhang Xueliang, his ideas for a modernized and mechanized army are fascinating, should we undergo this, we shall emerge out with a reformed armed forces, ready to on the entire world."
CRP_zhu_de_plan:0 "Zhu De's Plan"
CRP_zhu_de_plan_desc:0 "With Zhu De's Plan, we can both keep our Chinese Tradition and advance our armed forces, we may even be able to overtake the European Powers in strength, and reorganize and rehabiiate the crumbling armed forces."
CRP_wang_jingwei_compromise:0 "The Dual Compromise"
CRP_wang_jingwei_compromise_desc:0 "Wang Jinwei has offered a compromise between the two officers that spilt the Officer Corps apart, to prevent outright mayhem in the armed forces, Wang Jinwei has proposed that a compromise be settled, and both ideas will be used, which will further advance our nation."
CRP_deep_battle_warfare:0 "Art of Deep Battle"
CRP_deep_battle_warfare_desc:0 "The Art of Deep Battle, orginally developed by Russian Planners should they go to war, is a very efficient and easy art to replicate, we will use it better, and perfect it."
CRP_aerial_compromise:0 "The Aerial Compromise"
CRP_aerial_compromise_desc:0 "The Officer Corps are spilt on what to do with the Air Force, but with Wang Jinwei, he proposes that both fighters and close air support be used closely, to maximize efficiency."
CRP_mixed_naval_doctrine:0 "Mixed Naval Doctrine"
CRP_mixed_naval_doctrine_desc:0 "Out of the three armed forces, the navy is often the most overlooked, China may not be a seafaring nation for now, but in the future, we will make it have the greatest navy in the world! China Rules the Seas!"
CRP_mastering_deep_battle:0 "Perfect the Art of Deep Battle"
CRP_mastering_deep_battle_desc:0 "We must perfect the art of Deep Battle, for our survival and Wang Jinwei, once we do this, China can be the master of the land, and take Beijing by storm."
CRP_naval_aerial_supremacy:0 "Reorganize the Aerial and Naval Departments"
CRP_naval_aerial_supremacy_desc:0 "For our and China's continued survival, the air and naval doctrine must be reshaped and reorganized, their departments are rife with corruption, and due to this, it impacts our ability to wage war."
CRP_master_of_land_sea_skies:0 "Master of the Land, Sea, and Skies"
CRP_master_of_land_sea_skies_desc:0 "We have done it, we have mastered the land and the sea, and the skies, it is all ours, the Chinese Armed Forces has been completely reshaped, it is time to thrust China into a new era."
The_Chinese_Armed_Forces_1:0 "The Chinese Armed Forces"
The_Chinese_Armed_Forces_2:0 "The Chinese Armed Forces"
The_Chinese_Armed_Forces_3:0 "The Chinese Armed Forces"
master_of_land_sea_skies:0 "Master of the Land, The Seas, and the Skies"
CRP_capital_ship_buildup:0 "Capital Ship Arms Race"
CRP_capital_ship_buildup_desc:0 "We must continue our arms race with the Ming, should we defeat them in open naval warfare, we will be able to starve Beijing into submission."
CRP_mobile_warfare:0 "The Art of Mobile Warfare"
CRP_mobile_warfare_desc:0 "We must master the art of Mobile Warfare and begin our preparations to reform the Chinese Army into one of a mechanized force, able to redeploy and scare our enemies with our sheer speed."
CRP_cas_theory:0 "Close Air Support Theory"
CRP_cas_theory_desc:0 "The Close Air Support Theory is one that if we combine our arms and focus on Close Air Support, we will able to destroy their armies and bomb them to submission, with this, our army will be unstoppable!"
CRP_strengthen_the_army:0 "Strengthen The Army"
CRP_strengthen_the_army_desc:0 "We must strengthen the army, it is the most important of the Three Armed Forces, and will lead us to victory in the inevitable civil war, let us go furhter and faster then any before us."
CRP_modernize_the_airforce:0 "Modernization of the Airforce"
CRP_modernize_the_airforce_desc:0 "The Modernization of the Airforce must take priority, it is our second most important of the three armed forces, and not only that, but it may win us the war should we invest it in it."
CRP_chinese_innovation:0 "Chinese Innovation"
CRP_chinese_innovation_desc:0 "The Chinese Innovation is miraclous, we invented gunpowder, fireworks and even multiple religions, China is the foremost power of the World, and we will show them that."
CRP_slow_warfare:0 "The Art of Mass Warfare"
CRP_slow_warfare_desc:0 "We must perfect the art of Mass warfare, and learn from the Illyrian war, it is imperative to our survival as a nation, and as the true China."
CRP_submarine_flotilla:0 "Submarine Flotilla"
CRP_submarine_flotilla_desc:0 "The Submarine Flotilla is a necessary step to our Reorganization of the Armed Forces Plan, we will be able to cut Beijing's Supply Lines and strangle their trade."
CRP_fighter_theory:0 "The Fighter Theory"
CRP_fighter_theory_desc:0 "The Fighter Theory says that we must dominate the skies and achieve complete aerial superiority for our victory to be total and complete, this in accord with Zhu De's Plan, therefore, we shall follow it."
CRP_modernize_the_army:0 "Modernization of the Army"
CRP_modernize_the_army_desc:0 "The Army is in a sorry state, it is unmodernized and has no innovation, we must drive forward the new era and stick to a tradition of infantry warfare."
CRP_strengthen_the_navy:0 "Strengthening the Navy"
CRP_strengthen_the_navy_desc:0 "In order to ensure our victory in the inevitable upcoming war, it is imperative for us to focus on the navy, as when we do, we will be able to cut off East Roman Support to the Ming. "
CRP_chinese_legacy:0 "The Chinese Legacy"
CRP_chinese_legacy_desc:0 "The Chinese Legacy has arrived, when we do this, there will be no turning back, our legacy will be secure for all to witness, and it will only be us who will win the upcoming war, it is time to revert to our legacy, for China!"
