l_english:
 LOADING_TIP_0: "Fortune favors the bold.\n- Virgil"
 LOADING_TIP_1: "If you must break the law, do it to seize power; in all other cases, observe it.\n- Julius Caesar"
 LOADING_TIP_2: "The wounds of war are sweet to one who fights for Rome.\n- Belisarius"
 LOADING_TIP_3: "I came, I saw, I conquered.\n- Julius Caesar"
 LOADING_TIP_4: "Fear not the sword, but the hand that wields it.\n- Belisarius"
 LOADING_TIP_5: "An empire is not maintained by timidity.\n- Tacitus"
 LOADING_TIP_6: "Cowards die many times before their deaths; the valiant never taste of death but once.\n- Julius Caesar"
 LOADING_TIP_7: "The secret of all victory lies in the organization of the non-obvious.\n- Marcus Aurelius"
 LOADING_TIP_8: "No one is brave who has never faced danger.\n- Seneca"
 LOADING_TIP_9: "He conquers twice, who conquers himself in victory.\n- Publilius Syrus"
 LOADING_TIP_10: "Let them hate, so long as they fear.\n- Lucius Accius (popular among emperors)"
 LOADING_TIP_11: "The more corrupt the state, the more laws it has.\n- Tacitus"
 LOADING_TIP_12: "The nearer the collapse of an empire, the crazier its laws.\n- Tacitus"
 LOADING_TIP_13: "The strong man is strongest when alone.\n- Livy"
 LOADING_TIP_14: "Men willingly believe what they wish.\n- Julius Caesar"
 LOADING_TIP_15: "A brave man is a man who dares to look the gods in the face and defy them.\n- Ovid"
 LOADING_TIP_16: "It is the part of a good general to know when to retreat.\n- Scipio Africanus"
 LOADING_TIP_17: "Valor is of no service, chance rules all.\n- Tacitus"
 LOADING_TIP_18: "No one is fit to command who has not learned to obey.\n- Marcus Aurelius"
 LOADING_TIP_19: "To rule is to serve.\n- Seneca"
 LOADING_TIP_20: "The more you sweat in peace, the less you bleed in war.\n- Belisarius"
 LOADING_TIP_21: "Soldiers win battles, emperors win wars.\n- Belisarius"
 LOADING_TIP_22: "No plan survives first contact with the enemy.\n- Aelianus Tacticus"
 LOADING_TIP_23: "The greatest danger comes from within.\n- Cicero"
 LOADING_TIP_24: "In war, events of importance are the result of trivial causes.\n- Julius Caesar"
 LOADING_TIP_25: "He who desires peace, let him prepare for war.\n- Vegetius"
 LOADING_TIP_26: "To spare the conquered and subdue the proud.\n- Virgil"
 LOADING_TIP_27: "A good commander is the servant of his army.\n- Belisarius"
 LOADING_TIP_28: "Great things are not accomplished by idle hands.\n- Cicero"
 LOADING_TIP_29: "The sinews of war are infinite money.\n- Cicero"
 LOADING_TIP_30: "Fortune is a goddess; she favors the daring.\n- Livy"
 LOADING_TIP_31: "No man is more unhappy than he who never faces adversity.\n- Seneca"
 LOADING_TIP_32: "The gods favor the man who dares.\n- Ovid"
 LOADING_TIP_33: "A wrong war brings ruin to both victor and vanquished.\n- Sallust"
 LOADING_TIP_34: "Rome was not built by peace, but by discipline.\n- Augustus"
 LOADING_TIP_35: "To fight for glory is to live forever.\n- Scipio Africanus"
 LOADING_TIP_36: "Better to fall in battle than live in shame.\n- Belisarius"
 LOADING_TIP_37: "Endure, and you will conquer.\n- Marcus Aurelius"
 LOADING_TIP_38: "Glory follows virtue as a shadow.\n- Cicero"
 LOADING_TIP_39: "Those who cannot remember the past are condemned to relive it.\n- Livy"
 LOADING_TIP_40: "Rome conquers by learning from her enemies.\n- Claudius"
 LOADING_TIP_41: "No man ever became great by chance.\n- Livy"
 LOADING_TIP_42: "It is a rough road that leads to the heights of greatness.\n- Seneca"
 LOADING_TIP_43: "Courage is resistance to fear, mastery of fear—not absence of it.\n- Marcus Aurelius"
 LOADING_TIP_44: "War gives birth to freedom, and freedom to war.\n- Sallust"
 LOADING_TIP_45: "Never despair. The gods help the brave.\n- Virgil"
 LOADING_TIP_46: "A commander’s first victory must be over himself.\n- Marcus Aurelius"
 LOADING_TIP_47: "To command many, learn to obey few.\n- Belisarius"
 LOADING_TIP_48: "What we do in life echoes in eternity.\n- Marcus Aurelius (apocryphal)"
 LOADING_TIP_49: "The fault, dear Brutus, is not in our stars, but in ourselves.\n- Julius Caesar (via Shakespeare)"
 LOADING_TIP_50: "The soldier’s highest virtue is obedience.\n- Vegetius"
 LOADING_TIP_51: "The only easy day was yesterday.\n- Roman military proverb"
 LOADING_TIP_52: "It is better to create than to destroy.\n- Caesar Augustus"
 LOADING_TIP_53: "Rome conquers not by arms alone, but by her spirit.\n- Livy"
 LOADING_TIP_54: "War makes thieves, and peace hangs them.\n- George Herbert (often attributed to Rome)"
 LOADING_TIP_55: "Even death is honorable in the service of Rome.\n- Belisarius"
 LOADING_TIP_56: "A sword never kills anybody; it is a tool in the killer’s hand.\n- Seneca"
 LOADING_TIP_57: "An army’s discipline is worth more than its numbers.\n- Vegetius"
 LOADING_TIP_58: "He who fears death loses the power of life.\n- Seneca"
 LOADING_TIP_59: "The whole earth is the tomb of heroic men.\n- Pericles (quoted by Roman historians)"
 LOADING_TIP_60: "A general must know his men as well as his maps.\n- Belisarius"
 LOADING_TIP_61: "There is no easy way from the earth to the stars.\n- Seneca"
 LOADING_TIP_62: "Cowardice is the mother of cruelty.\n- Seneca"
 LOADING_TIP_63: "The glory of Rome is eternal, if her sons are worthy.\n- Belisarius"
 LOADING_TIP_64: "A man’s worth is measured by the enemies he makes.\n- Marcus Aurelius"
 LOADING_TIP_65: "The Republic is not walls and marble, but men.\n- Cicero"
 LOADING_TIP_66: "The higher we are placed, the more humbly we should walk.\n- Cicero"
 LOADING_TIP_67: "Power is given only to those who are prepared to stoop to pick it up.\n- Tacitus"
 LOADING_TIP_68: "The empire grows by valor, not by chance.\n- Augustus"
 LOADING_TIP_69: "No nation is defeated until it admits defeat.\n- Belisarius"
 LOADING_TIP_70: "Rome is the world; to rule her is to rule all men.\n- Caesar"
 LOADING_TIP_71: "A wrong peace is worse than a just war.\n- Cicero"
 LOADING_TIP_72: "Courage stands firm even when fortune turns her back.\n- Seneca"
 LOADING_TIP_73: "If you wish to be loved, love.\n- Seneca"
 LOADING_TIP_74: "Necessity conquers the reluctant and the brave alike.\n- Tacitus"
 LOADING_TIP_75: "Our greatest glory is not in never falling, but in rising every time we fall.\n- Cicero"
 LOADING_TIP_76: "Luck is what happens when preparation meets opportunity.\n- Seneca"
 LOADING_TIP_77: "Discipline is the soul of an army.\n- Vegetius"
 LOADING_TIP_78: "Bravery conquers fear, and fear conquers nations.\n- Belisarius"
 LOADING_TIP_79: "In victory, magnanimity; in defeat, defiance.\n- Caesar"
 LOADING_TIP_80: "When you are at peace, prepare for war.\n- Vegetius"
 LOADING_TIP_81: "He who controls himself is mightier than he who conquers cities.\n- Marcus Aurelius"
 LOADING_TIP_82: "The gods favor the daring.\n- Virgil"
 LOADING_TIP_83: "A commander must think like a soldier, but act like a statesman.\n- Belisarius"
 LOADING_TIP_84: "Fate leads the willing and drags the unwilling.\n- Seneca"
 LOADING_TIP_85: "Where there’s unity, there’s victory.\n- Publius Syrus"
 LOADING_TIP_86: "The blood of soldiers waters the roots of empires.\n- Roman proverb"
 LOADING_TIP_87: "A nation that forgets its warriors will itself be forgotten.\n- Roman maxim"
 LOADING_TIP_88: "It is sweet and fitting to die for one’s country.\n- Horace"
 LOADING_TIP_89: "Rome’s peace is the peace of her sword.\n- Tacitus"
 LOADING_TIP_90: "The greatest victory is to conquer without battle.\n- Belisarius"
 LOADING_TIP_91: "Glory is fleeting, but duty endures.\n- Marcus Aurelius"
 LOADING_TIP_92: "The cause is just when the gods approve the outcome.\n- Livy"
 LOADING_TIP_93: "Victory loves preparation.\n- Anonymous Roman motto"
 LOADING_TIP_94: "A man who fears war is already defeated.\n- Belisarius"
 LOADING_TIP_95: "We become what we repeatedly do; excellence, then, is not an act but a habit.\n- Aristotle (widely quoted in Roman thought)"
 LOADING_TIP_96: "To fight for Rome is to fight for eternity.\n- Belisarius"
 LOADING_TIP_97: "Rome’s might is not in her arms, but in her spirit.\n- Livy"
 LOADING_TIP_98: "To command is to serve.\n- Marcus Aurelius"
 LOADING_TIP_99: "A house divided cannot stand.\n- Roman proverb"
 LOADING_TIP_100: "Even in ruins, Rome remains great.\n- Procopius on Belisarius"
 LOADING_TIP_101: "It shall be between us and them a war of extermination, for we will follow them, till the last drop of their blood is spilled.\n- Sidney Rigdon"
 LOADING_TIP_102: "we must kill all of them, and our orders are to get them out by treachery if no other thing can be done to get them in our power.\n- John D. Lee"
 LOADING_TIP_103: "God being my helper, I will give the last ounce of strength and if need be my last drop of blood in defense of Zion.\n - Isaac C. Haight"
 LOADING_TIP_104: "We will fight them, gentlemen, and we will fight all hell.\n- Brigham Young"
 LOADING_TIP_105: "Burn every house, fence, stack of hay, or straw… let the whole country be wrapped in flames if the troops attempt to pass through.\n- Brigham Young"
 LOADING_TIP_106: "We have burned your trains; we can burn the rest any night. Go back; winter is coming.\n Lot Smith"
 LOADING_TIP_107: "If the troops enter the valley, we will burn New Jerusalem to the ground and take to the deserts and mountains… we will be a scourge to our enemies.\n Brigham Young"
 LOADING_TIP_108: "Strike, burn, and be gone before the moon sets.\n - Night Rider's Oath, Nauvoo Legion"
