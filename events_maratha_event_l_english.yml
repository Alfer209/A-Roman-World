maratha_event.1.t:0 "Maratha Demands Delhi!"
maratha_event.1.d:0 "Maratha just send us an ultimatium "
maratha_event.1.a:0 "Give up the territories"
maratha_event.1.b:0 "Refuse to give up Delhi"
maratha_event.2.t:0 "The Mughals Refuse to give us Delhi"
maratha_event.2.d:0 "Time to mobilize!"
maratha_event.2.a:0 "If so, then war"
maratha_event.3.t:0 "The Mughals Gave us Delhi!"
maratha_event.3.d:0 "Good, we won't touch them for now..."
maratha_event.3.a:0 "Good"

maratha_event.4.t:0 "The Maratha Confederacy"
maratha_event.4.d:0 "Once the blazing thunder of the Deccan, the Maratha Confederacy now stands as a fractured titan, its glory dimmed by centuries of complacency, intrigue, and betrayal. Founded in fire and ambition, the Confederacy united the proud Maratha clans beneath the banner of freedom from foreign empires. Its armies once galloped across the plains of Hindustan, breaking sultanates and challenging even the shadow of Rome itself. Yet the world has changed.\n\nThe Eternal Empire’s merchants and legions have long pierced the southern coasts, establishing fortified ports and trade cities that bleed the subcontinent of its wealth. Around the Confederacy, rival powers watch and wait — the Sikh Empire in the west scheme in silence, the revived Rajput lords in the north rally behind forgotten gods, and the eastern principalities of Bengal whisper of rebellion. Maratha is encircled, and every border bristles with fear and ambition.\n\nWithin the halls of Satara, the Great Council of Clans bickers endlessly. Corruption, once a silent parasite, has become the marrow of the state. Each chieftain commands his own army, his own treasury, his own spies. The Prime Peshwa rules in name only, while the confederacy’s generals cling to outdated doctrines and rusting cannon. The once-proud Maratha horsemen ride beneath banners faded by neglect, their tactics unchanged since the wars of their ancestors.\n\nYet even in this decay, embers of defiance remain. Beneath the corruption and decadence, the Maratha spirit — the will to resist domination — still flickers. The younger nobles speak of reform, of reclaiming the confederacy’s lost strength. Secret societies of scholars, merchants, and officers dream of a new Deccan Renaissance, one that will cast off foreign influence and restore Maratha to its rightful place as the heart of India.\n\nThe Confederacy now stands at a crossroads. It can wither in the shadow of empires — or awaken once more as the forge of liberation, and reclaim the thunder of its ancestors." 
maratha_event.4.a:0 "The old lion still breathes..."

