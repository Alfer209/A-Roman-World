l_english: 
 
 homeoftherevolution:0 "Home of the Revolution"
 homeoftherevolution_desc:0 "From Moscow to the farthest corners of the Russia, our land stands as the birthplace of the revolution. The world watches us closely, some with hope, others with fear, as we carry the torch of Russian democracy into the future."
 
 bastionofdemocracy:0 "Bastion of Democracy"
 bastionofdemocracy_desc:0 "Surrounded by monarchs, imperialists, and reactionaries, the RSFR stands as a fortress of social democracy. While our borders may be threatened, the ideals forged in struggle bind our people together against any who would see freedom extinguished."
 
 scarsoftherevolution:0 "Scars of the Revolution"
 scarsoftherevolution_desc:0 "The Revolution was won, but not without great sacrifice. Cities lie in ruins, industry struggles to recover, and countless families bear wounds both seen and unseen. These scars remind Russia of the cost of freedom — and the need to defend it at all costs."