l_english:

 ERE_test:0 "Test Focus"
 ERE_test_desc:0 "EAST ROMAN SUPREMACY!"
 
 ERE_test2:0 "Test Focus 2"
 ERE_test2_desc:0 "EAST ROMAN SUPREMACY 2222222"

 ERE_coorporatewithwest:0 "Reapproach the West"
 ERE_coorporatewithwest_desc:0 "Diplomatic overtures are extended to the Western 'Romans'. Cooperation may yet restore unity and strength before the storm breaks."

 ERE_rallyunificationmovements:0 "Rally Unification Movements"
 ERE_rallyunificationmovements_desc:0 "Across the empire, voices call for reunification. We shall amplify them, forging a pan-Roman identity to rally our people."

 ERE_jointmilitaryexcerises:0 "Joint Military Excersises"
 ERE_jointmilitaryexcerises_desc:0 "Joint drills with Western forces will strengthen coordination and prepare our legions for the trials of modern warfare."

 ERE_rebuildromanroads:0 "Rebuild Roman Roads"
 ERE_rebuildromanroads_desc:0 "The ancient arteries of empire must be restored. Revitalising our infrastructure will ensure swift mobilization and economic resilience."
 
 ERE_revitalisebothromes:0 "Revitalise Both Romes"
 ERE_revitalisebothromes_desc:0 "From Constantinople to Rome, the twin hearts of empire must beat as one. Cultural and administrative renewal will bind East and West."

 ERE_mendtheschism:0 "Mend the Schism"
 ERE_mendtheschism_desc:0 "The divide between churches has long weakened our unity. A bold initiative to reconcile faiths may heal centuries of discord."

 ERE_rectifythealliance:0 "Rectify the Alliance"
 ERE_rectifythealliance_desc:0 "The alliance has faltered, strained by years of mistrust and divergent goals. It is time to restore its foundations and redefine our shared purpose."

 ERE_theromanleague:0 "The Roman League"
 ERE_theromanleague_desc:0 "The time has come to unite all Roman-aligned states under a single banner. East and West shall stand together once more, bound by legacy, strength, and the promise of a restored empire."

 ERE_militarysupportforWRE:0 "Military Support for the West"
 ERE_militarysupportforWRE_desc:0 "In the spirit of imperial unity, we shall extend military aid to our Western brethren. Our legions will bolster their defenses, and our officers will guide their armies. Together, we may yet restore the glory of Rome."

 ERE_buildfortsinsouthillyria:0 "Forts in South Illyria"
 ERE_buildfortsinsouthillyria_desc:0 "South Illyria remains a vulnerable frontier. By constructing a network of fortified positions, we shall secure the region against barbarian incursions and Western instability."

 ERE_garrisonnorthafricanfrontier:0 "Garrison North Africa"
 ERE_garrisonnorthafricanfrontier_desc:0 "The deserts and coasts of North Africa are vital to our imperial supply lines. A permanent garrison will ensure stability, suppress unrest, and project power across the southern Mediterranean."

 ERE_rapidarmyexpansion:0 "Rapid Army Expansion"
 ERE_rapidarmyexpansion_desc:0 "The threats we face demand swift and decisive action. We must expand our army at an accelerated pace, recruiting and training new legions to defend the empire’s borders and interests."

 ERE_formaliseintelligencering:0 "Formalise Intelligence Ring"
 ERE_formaliseintelligencering_desc:0 "Our intelligence efforts have long operated in the shadows. It is time to formalise these networks into a cohesive ring of agents, analysts, and operatives loyal to the imperial cause."

 ERE_formthe:0 "Form Department"
 ERE_formthe_desc:0 "To coordinate our covert operations, we shall establish a dedicated department tasked with espionage, counterintelligence, and strategic deception. The enemies of Rome will never see us coming."

 ERE_effectiveoperations:0 "Effective Operations"
 ERE_effectiveoperations_desc:0 "With our intelligence apparatus refined, we can now execute operations with precision and efficiency. Sabotage, infiltration, and subversion will become tools of imperial policy."

 ERE_agentsinalltheatres:0 "Agents in All Theatres"
 ERE_agentsinalltheatres_desc:0 "From the sands of Africa to the forests of Germania, our agents will operate in every theatre. Their eyes and ears will guide our decisions, and their hands will shape the fate of nations."

 ERE_consolidateintheeast:0 "Consolidate in the East"
 ERE_consolidateintheeast_desc:0 "The West is a lost cause, we must now secure the heart of our empire. By consolidating our holdings in the East, we ensure stability, prosperity, and a strong foundation for future ambitions."

 ERE_centralisedcommand:0 "Centralised Command"
 ERE_centralisedcommand_desc:0 "Fragmented authority has weakened our military response. By centralising command under a unified structure, we ensure swift coordination and decisive action across all fronts."

 ERE_homelegions:0 "Home Legions"
 ERE_homelegions_desc:0 "The people must become the shield of the Empire. By forming Home Legions from local citizens, we prepare every province for defense, turning villages into bastions of resistance."

 ERE_protectnorthborder:0 "Protect Our Northern Border"
 ERE_protectnorthborder_desc:0 "The northern frontier is vulnerable to incursion. Reinforcing this border with troops and fortifications will deter aggression and buy us time to mobilise."

 ERE_protectcoastal:0 "Protect Our Coast"
 ERE_protectcoastal_desc:0 "Our coasts are gateways to both trade and invasion. Naval patrols, coastal batteries, and fortified ports will safeguard our shores from enemy fleets."

 ERE_rallythepeople:0 "Rally The People"
 ERE_rallythepeople_desc:0 "The Empire stands only as long as its people do. Through speeches, symbols, and shared purpose, we will ignite the spirit of unity and resilience across every province."

 ERE_protectconstantinople:0 "Protect Constantinople"
 ERE_protectconstantinople_desc:0 "Constantinople is the heart of our realm. We must fortify its walls, secure its supply lines, and ensure its survival—no matter the cost."

 ERE_protectourskies:0 "Protect Our Skies"
 ERE_protectourskies_desc:0 "The war planes of the enemies of Rome will be shot down if they dare enter within our airspace of Constantinople."

 ERE_theroadtowar:0 "The Road To War"
 ERE_theroadtowar_desc:0 "The Teutonic Empire sharpens its blades. War is inevitable. We must prepare our armies, reinforce our borders, and ready our people for the storm that approaches."

 ERE_assistourchinesebrothers:0 "Assist Our Chinese Brothers"
 ERE_assistourchinesebrothers_desc:0 "The Chinese Empire always stood with us and as ancient eternal brothers, we shall extend our hand in solidarity, offering diplomatic and logistical support in their time of need."

 ERE_limitedintervention:0 "Limited Intervention"
 ERE_limitedintervention_desc:0 "While avoiding full entanglement, we can provide strategic aid—advisors, supplies, and intelligence—to help the Chinese Empire resist the Republican insurgency."

 ERE_directintervention:0 "Direct Intervention"
 ERE_directintervention_desc:0 "The time for caution has passed. We will commit forces directly to the conflict, standing shoulder to shoulder with our imperial allies against the southern rebellion."

 ERE_militarysupportforCHI:0 "Military Support for China"
 ERE_militarysupportforCHI_desc:0 "Our legions will reinforce Chinese positions, supply lines will flow eastward, and our officers will help shape the battlefield. The Empire defends its own."

 ERE_embargotherepublicans:0 "Embargo the Republicans"
 ERE_embargotherepublicans_desc:0 "The Republican rebels threaten imperial order. We shall cut off their access to trade, resources, and foreign aid—isolating them economically and diplomatically."

 ERE_destroytherepublicanblight:0 "Destroy the Republican Blight"
 ERE_destroytherepublicanblight_desc:0 "Republicanism is a disease that corrodes civilization. We will eradicate this blight from China, ensuring the survival of imperial authority and the triumph of tradition."

 ERE_strikewest:0 "Strike West"
 ERE_strikewest_desc:0 "The time for hesitation is over. We must turn our gaze westward, reclaim lost provinces, and restore Roman authority across the continent. The East shall lead the charge."

 ERE_restorethewesternforums:0 "Restore the Western Forums"
 ERE_restorethewesternforums_desc:0 "The forums of the West once echoed with the voices of emperors and philosophers. Restoring these centers of civic life will rekindle Roman identity and unify our people."

 ERE_embracelatinhellenicsolidatry:0 "Embrace Latin Hellenic Solidarity"
 ERE_embracelatinhellenicsolidatry_desc:0 "Though divided by geography, Latin and Hellenic cultures share a common legacy. We shall embrace this solidarity to forge a stronger, united Roman civilization."

 ERE_revivethelegionsofgaul:0 "Revive the Legions of Gaul"
 ERE_revivethelegionsofgaul_desc:0 "Gaul was once the backbone of imperial defense. By reviving its legions, we restore a proud tradition and reinforce our western military presence."

 ERE_sparktheflameofreconquest:0 "Spark the Flame of Reconquest"
 ERE_sparktheflameofreconquest_desc:0 "The dream of a united Rome burns still. We shall ignite the flame of reconquest, rallying our forces to reclaim what was lost and punish those who defiled it."

 ERE_protectwestrome:0 "Protect West Rome"
 ERE_protectwestrome_desc:0 "West Rome remains vulnerable to foreign aggression. We must fortify its defenses and ensure its survival as a symbol of imperial continuity."

 ERE_marchintohispania:0 "March Into Hispania"
 ERE_marchintohispania_desc:0 "Hispania was once a jewel of the empire. Our legions will march westward, liberating its lands and restoring Roman governance."

 ERE_striketheteutonsfirst:0 "Strike the Teutons First"
 ERE_striketheteutonsfirst_desc:0 "The Teutonic Empire threatens our western ambitions. We must strike first—decisively and without mercy—to secure our path to reunification."

 ERE_reclaimbritannia:0 "Reclaim Britainnia"
 ERE_reclaimbritannia_desc:0 "Britannia, long lost to barbarism, shall be Roman once more. Our forces will cross the channel and restore imperial rule to the island."

 ERE_alphinefortifications:0 "Alphine Fortifications"
 ERE_alphinefortifications_desc:0 "The Alpine passes are key to our western advance. Fortifying these strategic chokepoints will protect our supply lines and secure our flanks."

 ERE_romaneurope:0 "Roman Europe"
 ERE_romaneurope_desc:0 "Europe must be Roman again. Through diplomacy, conquest, and cultural revival, we shall reshape the continent in the image of the empire."

 ERE_romansolidatry:0 "Roman Solidarity"
 ERE_romansolidatry_desc:0 "All Roman-aligned states must stand together. By fostering solidarity, we build a coalition rooted in shared heritage and imperial destiny."

 ERE_invitewesternindustries:0 "Invite Western Industries"
 ERE_invitewesternindustries_desc:0 "To rebuild the West, we must harness its industrial potential. By inviting Western enterprises into our fold, we accelerate modernization and foster mutual prosperity under Roman oversight."

 ERE_instilldiscipline:0 "Instill Discipline"
 ERE_instilldiscipline_desc:0 "A fractured empire cannot stand. Through rigorous training, strict codes, and centralized command, we shall instill discipline across our ranks—military and civil alike."

 ERE_integrateeconomies:0 "Integrate Economies"
 ERE_integrateeconomies_desc:0 "The East and West must no longer operate as separate entities. By integrating our economies, we create a unified Roman market, resilient to foreign influence and primed for expansion."

 ERE_ambition:0 "Ambition"
 ERE_ambition_desc:0 "The flame of Rome still burns. Our ambitions stretch beyond mere survival—we seek restoration, dominance, and eternal glory."

 ERE_turntoouroldally:0 "Turn To Our Old Ally"
 ERE_turntoouroldally_desc:0 "The Persian Empire once aided us in times of the Islamic expansion. We once again call for their aid."

 ERE_invitethespainards:0 "Invite the Spainards"
 ERE_invitethespainards_desc:0 "Hispania was once a jewel of the Empire. By inviting the modern Spanish states into our fold, we rekindle the legacy of Roman Iberia"

 ERE_purgetheeasternmenance:0 "Purge the Eastern Menance"
 ERE_purgetheeasternmenance_desc:0 "The Persians have always proved to be a thorn at our side. Our ancestors may have failed in taking them, but with our superior force we will conquer them once and for all."

 ERE_scipioslegacy:0 "Scipio's Legacy"
 ERE_scipioslegacy_desc:0 "Scipio Africanus once conquered all of Hispania, and his legacy will not be in vain."

 ERE_massproduction:0 "Mass Production"
 ERE_massproduction_desc:0 "To sustain our legions, we must embrace modern industrial methods. Let the factories roar with the sound of imperial might."

 ERE_tankdefense:0 "Tank Defense"
 ERE_tankdefense_desc:0 "Steel beasts shall guard our borders. We prioritize armored warfare to ensure our legions are never outmatched."

 ERE_airdefense:0 "Air Defense"
 ERE_airdefense_desc:0 "The skies are the new frontier of war. We invest in aerial supremacy to protect our empire from above."

 ERE_inetgratesubjecteconomies:0 "Integrate Subject Economies"
 ERE_inetgratesubjecteconomies_desc:0 "Our subjects must serve the empire not only in loyalty but in labor. Their economies will be woven into the imperial machine."

 ERE_inetgratewestromanindustries:0 "Integrate West Roman Industries"
 ERE_inetgratewestromanindustries_desc:0 "The industrial heartlands of the West shall beat for Rome once more. We reclaim and repurpose their output for imperial strength."

 ERE_alloutdefense:0 "All Out Defense"
 ERE_alloutdefense_desc:0 "Every citizen, every soldier, every resource—dedicated to the defense of the Empire. We shall not yield."

 ERE_antiteutoniclegions:0 "Anti Teutonic Legions"
 ERE_antiteutoniclegions_desc:0 "The Teutonic threat will be pacified. We form specialised legions trained to counter their tactics and crush their ambitions."

 ERE_rallyromanfrancianforces:0 "Rally Roman Francian Forces"
 ERE_rallyromanfrancianforces_desc:0 "The legacy of Roman Gaul lives on in the Francian territories. By rallying these forces under our banner, we awaken the martial spirit of the West and prepare for a unified campaign to reclaim Europe."

 ERE_denoouncetheillegimatebritishregime:0 "Denounce the Illegimate British Regime"
 ERE_denoouncetheillegimatebritishregime_desc:0 "The British regime stands as a relic of rebellion and illegitimacy. We shall publicly denounce their false rule, expose their hypocrisy, and prepare the ideological groundwork for their inevitable downfall."

 ERE_unitedunderoneemperor:0 "United Under One Emperor"
 ERE_unitedunderoneemperor_desc:0 "The fractured lands of Rome must be united once more—not in name, but in truth. Under one Emperor, one vision, and one destiny, we shall restore the eternal empire and bring order to a chaotic world."

 ERE_endoftheenemiesofrome:0 "End the Enemies of Rome"
 ERE_endoftheenemiesofrome_desc:0 "The time for diplomacy has passed. All who oppose the Roman order shall be crushed beneath our banners. The enemies of Rome will know fear, and the world will know peace through conquest."

 ERE_rootoutantiromans:0 "Root Out Anti Romans"
 ERE_rootoutantiromans_desc:0 "Subversion festers within and beyond our borders. We must identify and eliminate all anti-Roman elements—traitors, dissidents, and foreign agents who threaten imperial unity."

 ERE_paxromana:0 "Pax Romana"
 ERE_paxromana_desc:0 "With our enemies vanquished and our dominion secured, we shall usher in a new age of peace and prosperity. The Pax Romana returns—not as a dream, but as a global reality."

 ERE_alignsouthamerica:0 "Align South America"
 ERE_alignsouthamerica_desc:0 "South America holds strategic and ideological value. By aligning its nations with our imperial vision, we extend Roman influence across the southern hemisphere."

 ERE_hegemonyoveramerica:0 "Hegemony Over America"
 ERE_hegemonyoveramerica_desc:0 "The Americas must bow to Roman supremacy. Through diplomacy, pressure, and force, we will establish hegemony and reshape the continent in our image."

 ERE_strikeattheeast:0 "Strike At The East"
 ERE_strikeattheeast_desc:0 "Eastern Europe remains a bastion of resistance. We shall launch a decisive campaign to break their defenses and bring the region under Roman control once and for all."

 ERE_conquerasia:0 "Conquer Asia"
 ERE_conquerasia_desc:0 "Asia is vast, rich, and fractured. By conquering its lands, we secure resources, strategic depth, and the final piece of our imperial puzzle. Rome shall span the world."

 ERE_romannavalinstitution:0 "Roman Naval Institution"
 ERE_romannavalinstitution_desc:0 "The Empire rekindles its ancient maritime legacy, laying the foundation for a modern navy inspired by the disciplined might of Roman tradition."

 ERE_legionstatesadvisors:0 "Legion States Advisors"
 ERE_legionstatesadvisors_desc:0 "Naval strategists from the Legion States are summoned to Rome, bringing regional expertise and diverse tactics to shape a unified command."

 ERE_surfacewarfare:0 "Surface Warfare"
 ERE_surfacewarfare_desc:0 "Emphasising dominance in open-sea combat, the Empire trains its fleets to engage enemy vessels head-on with precision and overwhelming firepower."

 ERE_battlecrusiers:0 "Battle Crusiers"
 ERE_battlecrusiers_desc:0 "Fast, heavily armed cruisers are commissioned to chase down enemy ships and strike with brutal efficiency, embodying Rome’s aggressive doctrine."

 ERE_heavyguns:0 "Heavy Guns"
 ERE_heavyguns_desc:0 "Naval engineers develop colossal artillery pieces, turning every warship into a floating fortress capable of devastating long-range bombardment."

 ERE_lightcrusiers:0 "Light Crusiers"
 ERE_lightcrusiers_desc:0 "Agile and versatile, these ships scout ahead and protect the battle line, ensuring the fleet’s cohesion and tactical flexibility."

 ERE_battleships:0 "Battleships"
 ERE_battleships_desc:0 "Massive battleships are constructed to serve as symbols of imperial power, dominating the seas with unmatched firepower and resilience."

 ERE_legiontorpedos:0 "Legion Torpedos"
 ERE_legiontorpedos_desc:0 "Borrowing designs from Legion States, Rome enhances its torpedo arsenal, enabling smaller vessels to deliver lethal strikes against larger foes."

 ERE_submarinewarfare:0 "Submarine Warfare"
 ERE_submarinewarfare_desc:0 "The Empire expands its underwater fleet, embracing stealth and sabotage to cripple enemy supply lines and sow chaos beneath the waves."

 ERE_legionstateassistance:0 "Legion States Assistance"
 ERE_legionstateassistance_desc:0 "Constantinople's fleet cannot survive alone, especially across global theatres. The Legion States weld a powerful navy which combined with ours, are able to dominate the seven seas."

 ERE_jointnavaldominance:0 "Joint Naval Dominance"
 ERE_jointnavaldominance_desc:0 "Coordinated operations with Legion fleets ensure shared control of strategic waters, creating a unified front against foreign threats."

 ERE_offerdefensetreaties:0 "Offer Defense Treaties"
 ERE_offerdefensetreaties_desc:0 "Rome proposes formal defense pacts, solidifying alliances and guaranteeing mutual protection in times of war."

 ERE_bringthelegionstatesintothefold:0 "Bring the Legion States Into The Fold"
 ERE_bringthelegionstatesintothefold_desc:0 "For an ensured victory, we must convince the Legion States across the Altantic to join us in fighting the enemies of Rome."

 ERE_expandshipbuildingplants:0 "Expand Ship Building Plants"
 ERE_expandshipbuildingplants_desc:0 "New shipyards rise across the Empire, accelerating production and preparing for a fleet worthy of Roman ambition."

 ERE_divertmanpowertobuildingships:0 "Divert Manpower to Building Ships"
 ERE_divertmanpowertobuildingships_desc:0 "Civilian labor is redirected toward naval construction, transforming cities into engines of war."

 ERE_coorperationprograms:0 "Cooperation Programs"
 ERE_coorperationprograms_desc:0 "Joint industrial ventures with allies improve efficiency and innovation, ensuring the Empire stays ahead in naval technology."

 ERE_independentnavy:0 "Independent Navy"
 ERE_independentnavy_desc:0 "Rejecting foreign influence, the Empire charts its own course, crafting a naval doctrine rooted in pure Roman ingenuity."

 ERE_atraditionalsurfacefleet:0 "Traditional Surface Fleet"
 ERE_atraditionalsurfacefleet_desc:0 "A balanced fleet of cruisers and battleships is developed, echoing the disciplined formations of Rome’s legions."

 ERE_offensivemaritimefleet:0 "Offensive Maritime Fleet"
 ERE_offensivemaritimefleet_desc:0 "The navy is reshaped for aggressive operations, capable of projecting power far beyond Roman shores."

 ERE_deepwaternavy:0 "Deep Water Navy"
 ERE_deepwaternavy_desc:0 "Rome prepares for global reach, designing ships and logistics to operate in distant waters and foreign theaters."

 ERE_modernsubmarinewarfare:0 "Modern Submarine Warfare"
 ERE_modernsubmarinewarfare_desc:0 "Advanced submarines are deployed to disrupt enemy convoys and gather intelligence beneath the waves."

 ERE_torpedomanufacturing:0 "Torpedo Manufacturing"
 ERE_torpedomanufacturing_desc:0 "Industrial efforts focus on producing vast quantities of torpedoes, ensuring every vessel is armed to the teeth."

 ERE_expandnavalresearch:0 "Expand Naval Research"
 ERE_expandnavalresearch_desc:0 "Research institutions are expanded, pushing the boundaries of naval science and unlocking new possibilities."

 ERE_aircraftcarriers:0 "Aircraft Carriers"
 ERE_aircraftcarriers_desc:0 "Rome enters the age of naval aviation, constructing carriers to dominate both sea and sky."

 ERE_atrueromannavy:0 "A True Roman Navy"
 ERE_atrueromannavy_desc:0 "The culmination of Rome’s naval renaissance. A fleet unmatched in size, technology, and doctrine now sails under the imperial banner, ready to reclaim global dominance and restore the glory of the ancient seas."

 ERE_infrastructureplan:0 "Infrastructure Plan"
 ERE_infrastructureplan_desc:0 "The Empire must be stitched together not only by loyalty but by roads, rails, and ports. This plan lays the foundation for a modern infrastructure network, echoing the legacy of Roman engineering."

 ERE_industryplan:0 "Industry Plan"
 ERE_industryplan_desc:0 "Rome was once the heart of civilization—now it must become the engine of production. This initiative mobilizes regional factories, revitalizes urban centers, and sets the stage for industrial ascendancy."

 ERE_greatindustryplan:0 "Great Industry Plan"
 ERE_greatindustryplan_desc:0 "No longer content with modest growth, the Empire embarks on a bold campaign to dominate industrial output. Massive complexes rise from the dust, powered by imperial ambition. The world will marvel at our capacity—and fear our resolve."

 ERE_romanrailways:0 "Roman Railways"
 ERE_romanrailways_desc:0 "As the ancient Romans built roads to bind their empire, so shall we lay rails to unite ours. A sweeping expansion of the railway system will ensure swift movement of troops, goods, and ideas. The Empire moves not just with purpose—but with speed."

 ERE_increasestatereserves:0 "Increase State Reserves"
 ERE_increasestatereserves_desc:0 "A wise empire prepares for lean years. By bolstering our reserves of critical materials and currency, we ensure resilience in the face of blockade, war, or economic collapse. The coffers of Constantinople shall overflow once more."

 ERE_reorganiseheavyindustry:0 "Reorganise Heavy Industry"
 ERE_reorganiseheavyindustry_desc:0 "Our factories groan under outdated methods. This focus restructures the heavy industry sector, streamlining production and eliminating inefficiencies. The Empire will not just produce—it will produce with precision."

 ERE_armamentproduction:0 "Armament Production"
 ERE_armamentproduction_desc:0 "The legions of old wielded gladius and shield. Today, they require rifles, tanks, and artillery. This focus accelerates the manufacture of weapons of war, ensuring our armies are equipped to reclaim Rome’s lost glory."

 ERE_syntheticrubber:0 "Synthetic Rubber"
 ERE_syntheticrubber_desc:0 "Natural rubber is scarce and unreliable. Through scientific ingenuity, we shall create synthetic alternatives to fuel our war machines and industrial needs. The Empire bends chemistry to its will."

 ERE_steelcasting:0 "Steel Casting"
 ERE_steelcasting_desc:0 "Steel is the backbone of modern civilization. By refining our casting techniques, we unlock stronger, more versatile materials for construction and warfare. The Empire’s foundries roar with renewed vigor."

 ERE_oilproduction:0 "Oil Production"
 ERE_oilproduction_desc:0 "The lifeblood of mechanised warfare flows from beneath the earth. We will tap domestic reserves and develop extraction technologies to ensure a steady supply. The Empire shall never run dry."

 ERE_rampuprubberindustry:0 "Ramp Up Rubber Industry"
 ERE_rampuprubberindustry_desc:0 "Tires, seals, and equipment will flow from our factories in abundance. The Empire marches on rubber wheels."

 ERE_focusonalumimum:0 "Focus On Aluminium"
 ERE_focusonalumimum_desc:0 "Light, strong, and essential—aluminium is the metal of modern warfare. Aircraft, vehicles, and infrastructure depend on it. We will mine, refine, and master its use, turning our mountains into arsenals."

 ERE_anatoliandevelopment:0 "Anatolian Development"
 ERE_anatoliandevelopment_desc:0 "Anatolia, the Empire’s heartland, holds untapped potential. We invest in its cities, roads, and industries, transforming it into a beacon of prosperity. From the Bosporus to the Taurus Mountains, Anatolia shall rise."

 ERE_developeuropeanregions:0 "Develop European Regions"
 ERE_developeuropeanregions_desc:0 "The Empire’s European territories have languished under neglect. This focus revitalizes Thrace, Macedonia, and beyond, bringing jobs, infrastructure, and pride. Europe shall once again feel the pulse of Roman ambition."

 ERE_romanscienceacademy:0 "Roman Science Academy"
 ERE_romanscienceacademy_desc:0 "Knowledge is power. We establish a prestigious academy to cultivate the brightest minds in engineering, chemistry, and warfare. The Empire shall not only conquer with force—but with intellect."

 ERE_researchinstitute:0 "Roman Research Institute"
 ERE_researchinstitute_desc:0 "To stay ahead of rivals, we must innovate relentlessly. This institute coordinates national research efforts, accelerating breakthroughs in every field. The Empire’s future is forged in laboratories as much as on battlefields."
 
 ERE_defenseindustry:0 "Defense Industry"
 ERE_defenseindustry_desc:0 "We must priortise all our industrial efforts in producing materiel and weapons for the inevitable defense of Constantinople."

 ERE_airforceacademy:0 "Air Force Academy"
 ERE_airforceacademy_desc:0 "The skies are the new frontier of imperial power. We establish a prestigious academy to train the next generation of pilots, tacticians, and engineers. Here, discipline meets innovation, and the Empire’s aerial future begins to take flight."

 ERE_traditionalflyingdoctrine:0 "Traditional Flying Doctrine"
 ERE_traditionalflyingdoctrine_desc:0 "Drawing from the battlefield coordination of ancient legions, we adopt a doctrine focused on close air support. Our aircraft will fly low and strike hard—supporting ground troops with precision and fury, just as Roman artillery once did."

 ERE_CASdoctrine:0 "CAS Doctrine"
 ERE_CASdoctrine_desc:0 "We refine our tactical air doctrine to prioritise rapid response and battlefield integration. Pilots are trained to operate in tandem with infantry and armor, delivering devastating strikes that turn the tide of ground engagements."

 ERE_CASmodel:0 "CAS Model"
 ERE_CASmodel_desc:0 "A new generation of close air support aircraft is developed—fast, durable, and deadly. These machines are designed to loiter above the battlefield, hunting enemy armor and fortifications with surgical precision."

 ERE_flexiblebombers:0 "Flexible Bombers"
 ERE_flexiblebombers_desc:0 "Not all targets lie on the front lines. We develop multi-role bombers capable of adapting to various missions—strategic strikes, interdiction, and support. These aircraft will be the hammer of Rome’s airborne arsenal."

 ERE_deathanddestruction:0 "Death and Destruction"
 ERE_deathanddestruction_desc:0 "The Empire embraces total aerial warfare. Our bombers rain fire upon enemy cities, factories, and morale. This is not mere combat—it is annihilation from above, a reminder that Rome’s wrath knows no bounds."

 ERE_modernflyingdoctrine:0 "Modern Flying Doctrine"
 ERE_modernflyingdoctrine_desc:0 "We shift toward a doctrine of long-range strategic bombing, targeting the enemy’s heartland. Inspired by imperial campaigns of old, we aim not just to defeat armies—but to cripple entire nations from the sky."

 ERE_strategicbomberdevelopment:0 "Strategic Bomber Development"
 ERE_strategicbomberdevelopment_desc:0 "Massive, high-altitude bombers are designed to carry Rome’s vengeance across continents. These aircraft will fly farther, hit harder, and return unscathed—symbols of imperial reach and technological mastery."

 ERE_strategicbomberdoctrine:0 "Strategic Bomber Doctrine"
 ERE_strategicbomberdoctrine_desc:0 "We formalize our strategic bombing philosophy: precision, persistence, and psychological impact. Factories, infrastructure, and supply lines will be reduced to rubble. The enemy will feel our presence long before our legions arrive."

 ERE_longrangeescorts:0 "Long Range Escorts"
 ERE_longrangeescorts_desc:0 "To protect our bombers deep in enemy territory, we develop long-range fighter escorts. These guardians of the sky ensure our strategic assets reach their targets and return safely, extending the Empire’s aerial dominance."

 ERE_fighterdevelopment:0 "Fighter Development"
 ERE_fighterdevelopment_desc:0 "Speed, agility, and firepower—our fighter program focuses on creating elite aircraft to control the skies. Whether intercepting bombers or dueling enemy aces, Roman pilots will fly the finest machines ever built."

 ERE_aerodome_construction:0 "Aerodome Construction"
 ERE_aerodome_construction_desc:0 "Airfields are the lifeblood of our aerial operations. We construct modern aerodromes across the Empire, enabling rapid deployment, maintenance, and logistical support for our growing air force."

 ERE_forwardoperatingbases:0 "Forward Operating Bases"
 ERE_forwardoperatingbases_dessc:0 "To project power beyond our borders, we establish forward bases near hostile frontiers. These installations allow our aircraft to strike swiftly and retreat safely—Rome’s reach extends with every runway laid."

 ERE_expandaircorpsflyingschool:0 "Expand Air Corps Flying School"
 ERE_expandaircorpsflyingschool_desc:0 "The demand for skilled pilots grows. We expand our training programs, introducing advanced simulators, tactical theory, and rigorous flight regimens. The skies will be filled with Roman wings."

 ERE_radar_development:0 "Radar Development"
 ERE_radar_development_desc:0 "The Empire embraces the invisible frontier. Radar technology allows us to detect incoming threats, coordinate defenses, and guide interceptors with unmatched precision. Rome now sees what others cannot."

 ERE_deathfromthesky:0 "Death From The Sky"
 ERE_deathfromthesky_desc:0 "The legions now fall from the heavens. We train elite airborne units to strike behind enemy lines, seize key positions, and sow chaos. These paratroopers are the spearhead of imperial shock warfare."

 ERE_womenaces:0 "Women Aces"
 ERE_womenaces_desc:0 "Breaking tradition, the Empire recognizes the valor and skill of its female pilots. These trailblazers soar through the skies, earning glory and reshaping the future of Roman aviation. Their courage inspires a new generation."

 ERE_officeofthelegions:0 "Office of the Legions"
 ERE_officeofthelegions_desc:0 "We strengthen the administrative and organizational structure of our legions, reinforcing the backbone of the Eastern Roman military. War support surges as our authority consolidates."


 ERE_reformthelegions:0 "Reform the Legions"
 ERE_reformthelegions_desc:0 "Modernizing our ancient legions, we introduce new tactics, training, and equipment to prepare for the conflicts ahead, even at the cost of some stability."


 ERE_cassiandoctrine:0 "Cassian Doctrine"
 ERE_cassiandoctrine_desc:0 "A revolutionary set of land tactics developed by General Cassian, prioritizing mobility, firepower, and discipline in preparation for modern warfare."

 ERE_aurelianreforms:0 "Aurelian Reforms"
 ERE_aurelianreforms_desc:0 "Reinvigorating the legions with structural and tactical changes inspired by Emperor Aurelian, improving efficiency and battlefield resilience."

 ERE_examiningboards:0 "Examining Boards"
 ERE_examiningboards_desc:0 "We implement boards to assess officers and tactics, refining command structures and preparing for more advanced reforms."


 ERE_efficientproductionprogram:0 "Efficient Production Program"
 ERE_efficientproductionprogram_desc:0 "Optimizing factories and training programs to maximize output, ensuring our forces are well-equipped for prolonged engagements."


 ERE_shockandawe:0 "Shock and Awe"
 ERE_shockandawe_desc:0 "Using concentrated firepower and rapid offensives, we aim to overwhelm enemies before they can respond, achieving decisive victories early."


 ERE_theromanarmy:0 "The Roman Army"
 ERE_theromanarmy_desc:0 "Revitalising our traditions and modernizing tactics, our legions stand ready to defend the Empire with unparalleled discipline and doctrine."


 ERE_militaryresearch:0 "Military Research"
 ERE_militaryresearch_desc:0 "Investing in combined-arms technologies, we advance land, air, and naval capabilities to maintain strategic superiority."


 ERE_increasemilitaryspending:0 "Increase Military Spending"
 ERE_increasemilitaryspending_desc:0 "Allocating more resources to our armed forces ensures readiness and strengthens the backbone of the Empire’s defenses."


 ERE_warbonds:0 "War Bonds"
 ERE_warbonds_desc:0 "Mobilizing the population to fund the military, we construct arms factories and reinforce support for the Empire’s campaigns."


 ERE_increasearmyspending:0 "Increase Army Spending"
 ERE_increasearmyspending_desc:0 "Direct investment in the army improves capabilities and unlocks opportunities for elite units."


 ERE_investinthelegions:0 "Invest in the Legions"
 ERE_investinthelegions_desc:0 "Enhancing training, logistics, and technology, our legions become a modern fighting force capable of standing against any threat."


 ERE_modernisedarmy:0 "Modernised Army"
 ERE_modernisedarmy_desc:0 "Our legions are fully modernized, combining ancient discipline with cutting-edge strategy and equipment."


 ERE_increasemilitaryproduction:0 "Increase Military Production"
 ERE_increasemilitaryproduction_desc:0 "We boost industrial output to equip the army, accelerate mechanization, and maintain technological superiority."


 ERE_tankcompetition:0 "Tank Competition"
 ERE_tankcompetition_desc:0 "Encouraging innovation in armored warfare, we sponsor competitions to identify and produce the best tank designs."


 ERE_armouredcataphracts:0 "Armoured Cataphracts"
 ERE_armouredcataphracts_desc:0 "Our heavy armored units embody the spirit of the Roman cavalry, combining firepower, protection, and shock tactics."


 ERE_armybill:0 "Army Bill"
 ERE_armybill_desc:0 "Legislation to strengthen the army, expand its influence, and subtly shift political favor towards a more militarized state."

 
 ERE_artilleryprogram:0 "Advanced Artillery Program"
 ERE_artilleryprogram_desc:0 "Investing in heavy guns and siege weapons will bolster the Eastern Roman army’s firepower and fortification capabilities."

 ERE_productionpriority:0 "Production Priority"
 ERE_productionpriority_desc:0 "Redirecting resources towards key industries strengthens our economy and ensures critical war materiel reaches the frontlines."

 ERE_modernisecavalrytactics:0 "Modernise Cavalry Tactics"
 ERE_modernisecavalrytactics_desc:0 "Reforming the cavalry with contemporary manoeuvres and training will restore the Eastern Roman horsemen’s battlefield supremacy."

 ERE_mechanisationprogram:0 "Mechanisation Program"
 ERE_mechanisationprogram_desc:0 "Introducing motorised vehicles and mechanised units enhances mobility and reduces reliance on traditional infantry formations."

 ERE_womenarmycorps:0 "Women’s Army Corps"
 ERE_womenarmycorps_desc:0 "Forming a corps of women volunteers will supplement manpower shortages and demonstrate the empire’s commitment to total mobilisation."

 ERE_rifledevelopment:0 "Rifle Development"
 ERE_rifledevelopment_desc:0 "Developing modern rifles improves infantry firepower and ensures our soldiers remain competitive on the modern battlefield."

 ERE_newarmsfactories:0 "New Arms Factories"
 ERE_newarmsfactories_desc:0 "Expanding the empire’s arms production facilities guarantees a steady supply of weapons and ammunition for our troops."

 ERE_newtankassemblies:0 "New Tank Assemblies"
 ERE_newtankassemblies_desc:0 "Building new tank factories allows the Eastern Roman army to field modern armoured units capable of decisive breakthroughs."

 ERE_legacyofjustinian:0 "Legacy of Justinian"
 ERE_legacyofjustinian_desc:0 "Reviving the vision of Emperor Justinian inspires reforms, centralisation, and the revival of the Eastern Roman state’s greatness."
