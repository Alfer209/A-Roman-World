#Я є*бав цю нецікаву країхни перекладаьт. ШІ сам все зробив. Редагування потребує

ERE_test:0 "Тестовий фокус"
ERE_test_desc:0 "ПЕРЕВАГА СХІДНОГО РИМУ!"

ERE_test2:0 "Тестовий фокус 2"
ERE_test2_desc:0 "ПЕРЕВАГА СХІДНОГО РИМУ 2222222"

ERE_coorporatewithwest:0 "Зближення із Заходом"
ERE_coorporatewithwest_desc:0 "Дипломатичні ініціативи спрямовуються до західних ''римлян''. Співпраця може відновити єдність і силу перед наближенням бурі."

ERE_rallyunificationmovements:0 "Підтримка рухів за об'єднання"
ERE_rallyunificationmovements_desc:0 "По всій імперії лунають заклики до возз'єднання. Ми підтримаємо їх, формуючи загальноримську ідентичність, щоб згуртувати наш народ."

ERE_jointmilitaryexcerises:0 "Спільні військові навчання"
ERE_jointmilitaryexcerises_desc:0 "Спільні навчання із західними силами посилять координацію та підготують наші легіони до випробувань сучасної війни."

ERE_rebuildromanroads:0 "Відновлення римських доріг"
ERE_rebuildromanroads_desc:0 "Стародавні артерії імперії мають бути відновлені. Відродження інфраструктури забезпечить швидку мобілізацію та економічну стійкість."

ERE_revitalisebothromes:0 "Відродження обох Римів"
ERE_revitalisebothromes_desc:0 "Від Константинополя до Риму два серця імперії мають битися як одне. Культурне та адміністративне оновлення об'єднає Схід і Захід."

ERE_mendtheschism:0 "Подолання розколу"
ERE_mendtheschism_desc:0 "Розкол між церквами довго послаблював нашу єдність. Смілива ініціатива з примирення віри може зцілити століття розбрату."

ERE_rectifythealliance:0 "Відновлення альянсу"
ERE_rectifythealliance_desc:0 "Альянс похитнувся через роки недовіри та розбіжних цілей. Настав час відновити його основи та переосмислити нашу спільну мету."

ERE_theromanleague:0 "Римська Ліга"
ERE_theromanleague_desc:0 "Настав час об'єднати всі римські держави під єдиним прапором. Схід і Захід знову стоятимуть разом, пов'язані спадщиною, силою та обіцянкою відновленої імперії."

ERE_militarysupportforWRE:0 "Військова підтримка Заходу"
ERE_militarysupportforWRE_desc:0 "У дусі імперської єдності ми надамо військову допомогу нашим західним братам. Наші легіони підсилять їхню оборону, а наші офіцери керуватимуть їхніми арміями. Разом ми ще можемо відновити славу Риму."

ERE_buildfortsinsouthillyria:0 "Фортеці в Південній Іллірії"
ERE_buildfortsinsouthillyria_desc:0 "Південна Іллірія залишається вразливим рубежем. Створення мережі укріплених позицій захистить регіон від варварських вторгнень і західної нестабільності."

ERE_garrisonnorthafricanfrontier:0 "Гарнізон у Північній Африці"
ERE_garrisonnorthafricanfrontier_desc:0 "Пустелі та узбережжя Північної Африки є життєво важливими для наших імперських ліній постачання. Постійний гарнізон забезпечить стабільність, придушить заворушення та посилить нашу владу в південному Середземномор'ї."

ERE_rapidarmyexpansion:0 "Швидке розширення армії"
ERE_rapidarmyexpansion_desc:0 "Загрози, з якими ми стикаємося, вимагають швидких і рішучих дій. Ми повинні прискорено розширити нашу армію, набираючи та тренуючи нові легіони для захисту кордонів та інтересів імперії."

ERE_formaliseintelligencering:0 "Формалізація розвідувальної мережі"
ERE_formaliseintelligencering_desc:0 "Наші розвідувальні зусилля довго діяли в тіні. Настав час формалізувати ці мережі в єдину систему агентів, аналітиків і оперативників, вірних імперській справі."

ERE_formthe:0 "Створення департаменту"
ERE_formthe_desc:0 "Для координації наших таємних операцій ми створимо спеціальний департамент, відповідальний за шпигунство, контррозвідку та стратегічний обман. Вороги Риму ніколи не побачать нас."

ERE_effectiveoperations:0 "Ефективні операції"
ERE_effectiveoperations_desc:0 "З удосконаленим розвідувальним апаратом ми можемо виконувати операції з точністю та ефективністю. Саботаж, проникнення та підрив стануть інструментами імперської політики."

ERE_agentsinalltheatres:0 "Агенти на всіх театрах"
ERE_agentsinalltheatres_desc:0 "Від пісків Африки до лісів Германії наші агенти діятимуть на всіх театрах. Їхні очі та вуха керуватимуть нашими рішеннями, а їхні руки формуватимуть долю народів."

ERE_consolidateintheeast:0 "Консолідація на Сході"
ERE_consolidateintheeast_desc:0 "Захід — втрачена справа, ми повинні забезпечити серце нашої імперії. Консолідація наших володінь на Сході забезпечить стабільність, процвітання та міцну основу для майбутніх амбіцій."

ERE_centralisedcommand:0 "Централізоване командування"
ERE_centralisedcommand_desc:0 "Фрагментована влада послабила нашу військову реакцію. Централізація командування під єдиною структурою забезпечить швидку координацію та рішучі дії на всіх фронтах."

ERE_homelegions:0 "Домашні легіони"
ERE_homelegions_desc:0 "Народ має стати щитом імперії. Формуючи домашні легіони з місцевих громадян, ми підготуємо кожну провінцію до оборони, перетворюючи села на бастіони опору."

ERE_protectnorthborder:0 "Захист північного кордону"
ERE_protectnorthborder_desc:0 "Північний кордон вразливий до вторгнень. Посилення цього кордону військами та укріпленнями стримає агресію та дасть нам час на мобілізацію."

ERE_protectcoastal:0 "Захист узбережжя"
ERE_protectcoastal_desc:0 "Наші узбережжя — це ворота до торгівлі та вторгнень. Морські патрулі, берегові батареї та укріплені порти захистять наші береги від ворожих флотів."

ERE_rallythepeople:0 "Згуртувати народ"
ERE_rallythepeople_desc:0 "Імперія стоїть лише доти, доки стоїть її народ. Через промови, символи та спільну мету ми розпалимо дух єдності та стійкості в кожній провінції."

ERE_protectconstantinople:0 "Захист Константинополя"
ERE_protectconstantinople_desc:0 "Константинополь — серце нашого царства. Ми повинні укріпити його мури, забезпечити лінії постачання та гарантувати його виживання — за будь-яку ціну."

ERE_protectourskies:0 "Захист нашого неба"
ERE_protectourskies_desc:0 "Ворожі літаки, що наважаться увійти в наш повітряний простір над Константинополем, будуть збиті."

ERE_theroadtowar:0 "Шлях до війни"
ERE_theroadtowar_desc:0 "Тевтонська імперія гострить свої мечі. Війна неминуча. Ми повинні підготувати наші армії, укріпити кордони та налаштувати народ на бурю, що наближається."

ERE_assistourchinesebrothers:0 "Допомога нашим китайським братам"
ERE_assistourchinesebrothers_desc:0 "Китайська імперія завжди стояла поруч із нами, і як давні вічні брати ми протягнемо руку солідарності, надаючи дипломатичну та логістичну підтримку в час їхньої потреби."

ERE_limitedintervention:0 "Обмежене втручання"
ERE_limitedintervention_desc:0 "Уникаючи повного залучення, ми можемо надати стратегічну допомогу — радників, припаси та розвідку — щоб допомогти Китайській імперії протистояти республіканському повстанню."

ERE_directintervention:0 "Пряме втручання"
ERE_directintervention_desc:0 "Час обережності минув. Ми спрямуємо війська безпосередньо в конфлікт, стоячи пліч-о-пліч із нашими імперськими союзниками проти південного повстання."

ERE_militarysupportforCHI:0 "Військова підтримка Китаю"
ERE_militarysupportforCHI_desc:0 "Наші легіони підсилять китайські позиції, лінії постачання потечуть на схід, а наші офіцери допоможуть формувати поле бою. Імперія захищає своїх."

ERE_embargotherepublicans:0 "Ембарго республіканців"
ERE_embargotherepublicans_desc:0 "Республіканські повстанці загрожують імперському порядку. Ми відріжемо їх від торгівлі, ресурсів і іноземної допомоги, ізолюючи їх економічно та дипломатично."

ERE_destroytherepublicanblight:0 "Знищення республіканської загрози"
ERE_destroytherepublicanblight_desc:0 "Республіканізм — це хвороба, що роз’їдає цивілізацію. Ми викорінимо цю заразу з Китаю, забезпечуючи виживання імперської влади та тріумф традицій."

ERE_strikewest:0 "Удар на Захід"
ERE_strikewest_desc:0 "Час вагань минув. Ми повинні повернути свій погляд на захід, повернути втрачені провінції та відновити римську владу на континенті. Схід очолить наступ."

ERE_restorethewesternforums:0 "Відновлення західних форумів"
ERE_restorethewesternforums_desc:0 "Форуми Заходу колись гуділи голосами імператорів і філософів. Відновлення цих осередків громадянського життя розпалить римську ідентичність і об'єднає наш народ."

ERE_embracelatinhellenicsolidatry:0 "Солідарність латинської та елліністичної культур"
ERE_embracelatinhellenicsolidatry_desc:0 "Хоча й розділені географією, латинська та елліністична культури мають спільну спадщину. Ми приймемо цю солідарність, щоб створити сильнішу, об'єднану римську цивілізацію."

ERE_revivethelegionsofgaul:0 "Відродження легіонів Галлії"
ERE_revivethelegionsofgaul_desc:0 "Галлія колись була основою імперської оборони. Відроджуючи її легіони, ми відновлюємо горду традицію та посилюємо нашу військову присутність на Заході."

ERE_sparktheflameofreconquest:0 "Розпалити полум'я відвоювання"
ERE_sparktheflameofreconquest_desc:0 "Мрія про об'єднаний Рим досі палає. Ми розпалимо полум'я відвоювання, згуртувавши наші сили, щоб повернути втрачене та покарати тих, хто його осквернив."

ERE_protectwestrome:0 "Захист Західного Риму"
ERE_protectwestrome_desc:0 "Західний Рим залишається вразливим до іноземної агресії. Ми повинні укріпити його оборону та забезпечити його виживання як символ імперської спадкоємності."

ERE_marchintohispania:0 "Марш у Гіспанію"
ERE_marchintohispania_desc:0 "Гіспанія колись була перлиною імперії. Наші легіони рушать на захід, звільняючи її землі та відновлюючи римське правління."

ERE_striketheteutonsfirst:0 "Удар по тевтонах першим"
ERE_striketheteutonsfirst_desc:0 "Тевтонська імперія загрожує нашим західним амбіціям. Ми повинні вдарити першими — рішуче і без милосердя — щоб забезпечити наш шлях до возз'єднання."

ERE_reclaimbritannia:0 "Відвоювання Британії"
ERE_reclaimbritannia_desc:0 "Британія, давно втрачена через варварство, знову стане римською. Наші сили перетнуть канал і відновлять імперське правління на острові."

ERE_alphinefortifications:0 "Альпійські укріплення"
ERE_alphinefortifications_desc:0 "Альпійські перевали є ключовими для нашого просування на захід. Укріплення цих стратегічних точок захистить наші лінії постачання та забезпечить наші фланги."

ERE_romaneurope:0 "Римська Європа"
ERE_romaneurope_desc:0 "Європа знову має стати римською. Через дипломатію, завоювання та культурне відродження ми переформатуємо континент за образом імперії."

ERE_romansolidatry:0 "Римська солідарність"
ERE_romansolidatry_desc:0 "Усі римські держави повинні стояти разом. Сприяючи солідарності, ми будуємо коаліцію, засновану на спільній спадщині та імперській долі."

ERE_invitewesternindustries:0 "Залучення західних промисловців"
ERE_invitewesternindustries_desc:0 "Щоб відбудувати Захід, ми повинні використати його промисловий потенціал. Запрошуючи західні підприємства до нашого союзу, ми прискорюємо модернізацію та сприяємо спільному процвітанню під римським наглядом."

ERE_instilldiscipline:0 "Впровадження дисципліни"
ERE_instilldiscipline_desc:0 "Розділена імперія не може встояти. Через суворі тренування, чіткі кодекси та централізоване командування ми впровадимо дисципліну в наших лавах — як військових, так і цивільних."

ERE_integrateeconomies:0 "Інтеграція економік"
ERE_integrateeconomies_desc:0 "Схід і Захід більше не повинні діяти окремо. Інтегруючи наші економіки, ми створюємо єдиний римський ринок, стійкий до зовнішнього впливу та готовий до розширення."

ERE_ambition:0 "Амбіція"
ERE_ambition_desc:0 "Полум'я Риму досі палає. Наші амбіції виходять за межі простого виживання — ми прагнемо відновлення, домінування та вічної слави."

ERE_turntoouroldally:0 "Звернення до старого союзника"
ERE_turntoouroldally_desc:0 "Перська імперія колись допомагала нам у часи ісламської експансії. Ми знову закликаємо до їхньої підтримки."

ERE_invitethespainards:0 "Запрошення іспанців"
ERE_invitethespainards_desc:0 "Гіспанія колись була перлиною імперії. Запрошуючи сучасні іспанські держави до нашого союзу, ми відроджуємо спадщину римської Іберії."

ERE_purgetheeasternmenance:0 "Очищення від східної загрози"
ERE_purgetheeasternmenance_desc:0 "Перси завжди були перешкодою на нашому боці. Наші предки, можливо, не змогли їх подолати, але з нашою переважаючою силою ми завоюємо їх раз і назавжди."

ERE_scipioslegacy:0 "Спадщина Сципіона"
ERE_scipioslegacy_desc:0 "Сципіон Африканський колись завоював усю Гіспанію, і його спадщина не буде марною."

ERE_massproduction:0 "Масове виробництво"
ERE_massproduction_desc:0 "Щоб підтримувати наші легіони, ми повинні прийняти сучасні промислові методи. Нехай заводи гудуть звуком імперської могутності."

ERE_tankdefense:0 "Танкова оборона"
ERE_tankdefense_desc:0 "Сталеві звірі охоронятимуть наші кордони. Ми надаємо пріоритет броньованій війні, щоб наші легіони ніколи не поступалися ворогу."

ERE_airdefense:0 "Повітряна оборона"
ERE_airdefense_desc:0 "Небо — новий рубіж війни. Ми інвестуємо в повітряну перевагу, щоб захистити нашу імперію згори."

ERE_inetgratesubjecteconomies:0 "Інтеграція економік підлеглих"
ERE_inetgratesubjecteconomies_desc:0 "Наші підлеглі повинні служити імперії не лише вірністю, але й працею. Їхні економіки будуть вплетені в імперську машину."

ERE_inetgratewestromanindustries:0 "Інтеграція промисловості Західного Риму"
ERE_inetgratewestromanindustries_desc:0 "Промислові серця Заходу знову битимуться за Рим. Ми повернемо та перепрофілюємо їхню продукцію для імперської сили."

ERE_alloutdefense:0 "Тотальна оборона"
ERE_alloutdefense_desc:0 "Кожен громадянин, кожен солдат, кожен ресурс — присвячені захисту імперії. Ми не поступимося."

ERE_antiteutoniclegions:0 "Анти-тевтонські легіони"
ERE_antiteutoniclegions_desc:0 "Тевтонську загрозу буде приборкано. Ми формуємо спеціалізовані легіони, навчені протистояти їхнім тактикам і знищувати їхні амбіції."

ERE_rallyromanfrancianforces:0 "Згуртування римсько-франкських сил"
ERE_rallyromanfrancianforces_desc:0 "Спадщина римської Галлії живе в франкських територіях. Згуртувавши ці сили під нашим прапором, ми пробуджуємо бойовий дух Заходу та готуємося до єдиної кампанії з повернення Європи."

ERE_denoouncetheillegimatebritishregime:0 "Засудження нелегітимного британського режиму"
ERE_denoouncetheillegimatebritishregime_desc:0 "Британський режим є пережитком бунту та нелегітимності. Ми публічно засудимо їхнє фальшиве правління, викриємо їхнє лицемірство та підготуємо ідеологічний ґрунт для їхнього неминучого падіння."

ERE_unitedunderoneemperor:0 "Об'єднані під одним імператором"
ERE_unitedunderoneemperor_desc:0 "Розділені землі Риму мають бути об'єднані знову — не лише за назвою, а й по суті. Під одним імператором, одним баченням і однією долею ми відновимо вічну імперію та принесемо порядок у хаотичний світ."

ERE_endoftheenemiesofrome:0 "Кінець ворогів Риму"
ERE_endoftheenemiesofrome_desc:0 "Час дипломатії минув. Усі, хто протистоїть римському порядку, будуть розчавлені під нашими прапорами. Вороги Риму пізнають страх, а світ пізнає мир через завоювання."

ERE_rootoutantiromans:0 "Викорінення антиримлян"
ERE_rootoutantiromans_desc:0 "Підривна діяльність процвітає як всередині, так і за межами наших кордонів. Ми повинні виявити та знищити всіх антиримських елементів — зрадників, дисидентів і іноземних агентів, які загрожують імперській єдності."

ERE_paxromana:0 "Pax Romana"
ERE_paxromana_desc:0 "З переможеними ворогами та забезпеченим домінуванням ми відкриємо нову еру миру та процвітання. Pax Romana повертається — не як мрія, а як глобальна реальність."

ERE_alignsouthamerica:0 "Вирівнювання Південної Америки"
ERE_alignsouthamerica_desc:0 "Південна Америка має стратегічну та ідеологічну цінність. Вирівнюючи її нації з нашим імперським баченням, ми поширюємо римський вплив на південну півкулю."

ERE_hegemonyoveramerica:0 "Гегемонія над Америкою"
ERE_hegemonyoveramerica_desc:0 "Америки повинні підкоритися римській перевазі. Через дипломатію, тиск і силу ми встановимо гегемонію та переформатуємо континент за нашим образом."

ERE_strikeattheeast:0 "Удар по Сходу"
ERE_strikeattheeast_desc:0 "Східна Європа залишається бастіоном опору. Ми розпочнемо рішучу кампанію, щоб зламати їхню оборону та привести регіон під римський контроль раз і назавжди."

ERE_conquerasia:0 "Завоювання Азії"
ERE_conquerasia_desc:0 "Азія величезна, багата та розділена. Завоювавши її землі, ми забезпечимо ресурси, стратегічну глибину та останню частину нашої імперської головоломки. Рим охопить весь світ."

ERE_romannavalinstitution:0 "Римська морська установа"
ERE_romannavalinstitution_desc:0 "Імперія відроджує свою давню морську спадщину, закладаючи основу для сучасного флоту, натхненного дисциплінованою міццю римської традиції."

ERE_legionstatesadvisors:0 "Радники держав легіонів"
ERE_legionstatesadvisors_desc:0 "Морські стратеги з держав легіонів викликаються до Риму, приносячи регіональну експертизу та різноманітні тактики для формування єдиного командування."

ERE_surfacewarfare:0 "Наземна війна"
ERE_surfacewarfare_desc:0 "Наголошуючи на домінуванні у відкритому морі, імперія тренує свої флоти для прямого бою з ворожими суднами з точністю та переважаючою вогневою силою."

ERE_battlecrusiers:0 "Бойові крейсери"
ERE_battlecrusiers_desc:0 "Швидкі, важкоозброєні крейсери замовляються для переслідування ворожих кораблів та нанесення ударів із жорстокою ефективністю, втілюючи агресивну доктрину Риму."

ERE_heavyguns:0 "Важкі гармати"
ERE_heavyguns_desc:0 "Морські інженери розробляють величезні артилерійські гармати, перетворюючи кожен корабель на плавучу фортецю, здатну до нищівного далекобійного обстрілу."

ERE_lightcrusiers:0 "Легкі крейсери"
ERE_lightcrusiers_desc:0 "Маневрені та універсальні, ці кораблі розвідують попереду та захищають бойову лінію, забезпечуючи згуртованість флоту та тактичну гнучкість."

ERE_battleships:0 "Лінкори"
ERE_battleships_desc:0 "Величезні лінкори будуються як символи імперської могутності, домінуючи на морях із неперевершеною вогневою силою та стійкістю."

ERE_legiontorpedos:0 "Торпеди легіонів"
ERE_legiontorpedos_desc:0 "Запозичуючи конструкції з держав легіонів, Рим удосконалює свій торпедний арсенал, дозволяючи меншим суднам завдавати смертельних ударів по більших ворогах."

ERE_submarinewarfare:0 "Підводна війна"
ERE_submarinewarfare_desc:0 "Імперія розширює свій підводний флот, приймаючи стелс і саботаж для знищення ворожих ліній постачання та сіяння хаосу під хвилями."

ERE_legionstateassistance:0 "Допомога держав легіонів"
ERE_legionstateassistance_desc:0 "Флот Константинополя не може вистояти сам, особливо на глобальних театрах. Держави легіонів володіють потужним флотом, який у поєднанні з нашим здатний домінувати на семи морях."

ERE_jointnavaldominance:0 "Спільне морське домінування"
ERE_jointnavaldominance_desc:0 "Координовані операції з флотами легіонів забезпечують спільний контроль над стратегічними водами, створюючи єдиний фронт проти іноземних загроз."

ERE_offerdefensetreaties:0 "Пропозиція оборонних договорів"
ERE_offerdefensetreaties_desc:0 "Рим пропонує офіційні оборонні пакти, зміцнюючи альянси та гарантуючи взаємний захист у часи війни."

ERE_bringthelegionstatesintothefold:0 "Залучення держав легіонів"
ERE_bringthelegionstatesintothefold_desc:0 "Для забезпечення перемоги ми повинні переконати держави легіонів за Атлантикою приєднатися до нас у боротьбі з ворогами Риму."

ERE_expandshipbuildingplants:0 "Розширення кораблебудівних заводів"
ERE_expandshipbuildingplants_desc:0 "Нові верфі виникають по всій імперії, прискорюючи виробництво та готуючи флот, гідний римських амбіцій."

ERE_divertmanpowertobuildingships:0 "Перенаправлення робочої сили на будівництво кораблів"
ERE_divertmanpowertobuildingships_desc:0 "Цивільна робоча сила перенаправляється на морське будівництво, перетворюючи міста на двигуни війни."

ERE_coorperationprograms:0 "Програми співпраці"
ERE_coorperationprograms_desc:0 "Спільні промислові ініціативи з союзниками підвищують ефективність та інновації, забезпечуючи перевагу імперії в морських технологіях."

ERE_independentnavy:0 "Незалежний флот"
ERE_independentnavy_desc:0 "Відкидаючи іноземний вплив, імперія прокладає власний курс, створюючи морську доктрину, засновану на чистій римській винахідливості."

ERE_atraditionalsurfacefleet:0 "Традиційний надводний флот"
ERE_atraditionalsurfacefleet_desc:0 "Розвивається збалансований флот із крейсерів і лінкорів, що відображає дисципліновані формування римських легіонів."

ERE_offensivemaritimefleet:0 "Наступальний морський флот"
ERE_offensivemaritimefleet_desc:0 "Флот переформовується для агресивних операцій, здатний проєктувати силу далеко за межі римських берегів."

ERE_deepwaternavy:0 "Глибоководний флот"
ERE_deepwaternavy_desc:0 "Рим готується до глобального охоплення, проектуючи кораблі та логістику для операцій у віддалених водах і іноземних театрах."

ERE_modernsubmarinewarfare:0 "Сучасна підводна війна"
ERE_modernsubmarinewarfare_desc:0 "Просунуті підводні човни розгортаються для порушення ворожих конвоїв та збору розвідки під хвилями."

ERE_torpedomanufacturing:0 "Виробництво торпед"
ERE_torpedomanufacturing_desc:0 "Промислові зусилля зосереджені на виробництві величезної кількості торпед, забезпечуючи озброєння кожного судна до зубів."

ERE_expandnavalresearch:0 "Розширення морських досліджень"
ERE_expandnavalresearch_desc:0 "Дослідницькі установи розширюються, розсуваючи межі морської науки та відкриваючи нові можливості."

ERE_aircraftcarriers:0 "Авіаносці"
ERE_aircraftcarriers_desc:0 "Рим вступає в еру морської авіації, будуючи авіаносці для домінування як на морі, так і в небі."

ERE_atrueromannavy:0 "Справжній римський флот"
ERE_atrueromannavy_desc:0 "Кульмінація морського відродження Риму. Флот, неперевершений за розміром, технологіями та доктриною, тепер пливе під імперським прапором, готовий повернути глобальне домінування та відновити славу стародавніх морів."

ERE_infrastructureplan:0 "План інфраструктури"
ERE_infrastructureplan_desc:0 "Імперія має бути зшита не лише вірністю, а й дорогами, залізницями та портами. Цей план закладає основу для сучасної інфраструктурної мережі, що відображає спадщину римської інженерії."

ERE_industryplan:0 "План промисловості"
ERE_industryplan_desc:0 "Рим колись був серцем цивілізації — тепер він має стати двигуном виробництва. Ця ініціатива мобілізує регіональні заводи, відроджує міські центри та готує ґрунт для промислового піднесення."

ERE_greatindustryplan:0 "Великий промисловий план"
ERE_greatindustryplan_desc:0 "Більше не задовольняючись скромним зростанням, імперія розпочинає сміливу кампанію для домінування в промисловому виробництві. Величезні комплекси виникають із пилу, живлені імперськими амбіціями. Світ дивуватиметься нашій потужності — і боятиметься нашої рішучості."

ERE_romanrailways:0 "Римські залізниці"
ERE_romanrailways_desc:0 "Як стародавні римляни будували дороги, щоб об'єднати свою імперію, так і ми прокладемо залізниці, щоб об'єднати нашу. Масштабне розширення залізничної системи забезпечить швидке переміщення військ, товарів та ідей. Імперія рухається не лише з метою — а й зі швидкістю."

ERE_increasestatereserves:0 "Збільшення державних резервів"
ERE_increasestatereserves_desc:0 "Мудра імперія готується до важких років. Посилюючи наші запаси критичних матеріалів і валюти, ми забезпечуємо стійкість перед обличчям блокади, війни чи економічного колапсу. Скарбниці Константинополя знову переповняться."

ERE_reorganiseheavyindustry:0 "Реорганізація важкої промисловості"
ERE_reorganiseheavyindustry_desc:0 "Наші заводи стогнуть під вагою застарілих методів. Цей фокус реструктуризує сектор важкої промисловості, оптимізуючи виробництво та усуваючи неефективність. Імперія буде виробляти не просто багато — а з точністю."

ERE_armamentproduction:0 "Виробництво озброєнь"
ERE_armamentproduction_desc:0 "Легіони минулого володіли гладіусами та щитами. Сьогодні їм потрібні гвинтівки, танки та артилерія. Цей фокус прискорює виготовлення зброї війни, забезпечуючи оснащення наших армій для повернення втраченої слави Риму."

ERE_syntheticrubber:0 "Синтетична гума"
ERE_syntheticrubber_desc:0 "Натуральна гума рідкісна та ненадійна. Завдяки науковій винахідливості ми створимо синтетичні альтернативи для живлення наших військових машин та промислових потреб. Імперія підкоряє хімію своїй волі."

ERE_steelcasting:0 "Лиття сталі"
ERE_steelcasting_desc:0 "Сталь — це хребет сучасної цивілізації. Удосконалюючи техніки лиття, ми відкриваємо міцніші, універсальніші матеріали для будівництва та війни. Ливарні імперії гудуть із новою силою."

ERE_oilproduction:0 "Видобуток нафти"
ERE_oilproduction_desc:0 "Життєва кров механізованої війни тече з-під землі. Ми використаємо внутрішні запаси та розробимо технології видобутку, щоб забезпечити стабільне постачання. Імперія ніколи не висохне."

ERE_rampuprubberindustry:0 "Прискорення гумової промисловості"
ERE_rampuprubberindustry_desc:0 "Шини, ущільнення та обладнання тектимуть із наших заводів у достатку. Імперія рухається на гумових колесах."

ERE_focusonalumimum:0 "Фокус на алюміній"
ERE_focusonalumimum_desc:0 "Легкий, міцний і незамінний — алюміній є металом сучасної війни. Літаки, транспортні засоби та інфраструктура залежать від нього. Ми добуватимемо, очищатимемо та опануємо його використання, перетворюючи наші гори на арсенали."

ERE_anatoliandevelopment:0 "Розвиток Анатолії"
ERE_anatoliandevelopment_desc:0 "Анатолія, серце імперії, має невикористаний потенціал. Ми інвестуємо в її міста, дороги та промисловість, перетворюючи її на маяк процвітання. Від Босфору до гір Тавра Анатолія підніметься."

ERE_developeuropeanregions:0 "Розвиток європейських регіонів"
ERE_developeuropeanregions_desc:0 "Європейські території імперії занепадали через нехтування. Цей фокус відроджує Фракію, Македонію та інші регіони, приносячи робочі місця, інфраструктуру та гордість. Європа знову відчує пульс римських амбіцій."

ERE_romanscienceacademy:0 "Римська наукова академія"
ERE_romanscienceacademy_desc:0 "Знання — це сила. Ми створюємо престижну академію для виховання найяскравіших умів в інженерії, хімії та війні. Імперія перемагатиме не лише силою, а й розумом."

ERE_researchinstitute:0 "Римський дослідницький інститут"
ERE_researchinstitute_desc:0 "Щоб випереджати суперників, ми повинні невпинно інновувати. Цей інститут координує національні дослідницькі зусилля, прискорюючи прориви в усіх галузях. Майбутнє імперії кується в лабораторіях так само, як на полях битв."

ERE_defenseindustry:0 "Оборонна промисловість"
ERE_defenseindustry_desc:0 "Ми повинні віддати пріоритет усім нашим промисловим зусиллям для виробництва матеріалів і зброї для неминучої оборони Константинополя."

ERE_airforceacademy:0 "Академія повітряних сил"
ERE_airforceacademy_desc:0 "Небо — новий рубіж імперської сили. Ми створюємо престижну академію для підготовки нового покоління пілотів, тактиків та інженерів. Тут дисципліна поєднується з інноваціями, і повітряне майбутнє імперії починає злітати."

ERE_traditionalflyingdoctrine:0 "Традиційна льотна доктрина"
ERE_traditionalflyingdoctrine_desc:0 "Спираючись на координацію битв стародавніх легіонів, ми приймаємо доктрину, зосереджену на підтримці з повітря. Наші літаки літатимуть низько і вдарятимуть сильно — підтримуючи наземні війська з точністю та люттю, як колись римська артилерія."

ERE_CASdoctrine:0 "Доктрина CAS"
ERE_CASdoctrine_desc:0 "Ми вдосконалюємо нашу тактичну повітряну доктрину, надаючи пріоритет швидкій реакції та інтеграції на полі бою. Пілоти тренуються діяти в тандемі з піхотою та бронетехнікою, завдаючи нищівних ударів, що змінюють хід наземних боїв."

ERE_CASmodel:0 "Модель CAS"
ERE_CASmodel_desc:0 "Розробляється нове покоління літаків близької повітряної підтримки — швидких, міцних і смертоносних. Ці машини призначені для патрулювання над полем бою, полюючи на ворожу броню та укріплення з хірургічною точністю."

ERE_flexiblebombers:0 "Гнучкі бомбардувальники"
ERE_flexiblebombers_desc:0 "Не всі цілі лежать на передовій. Ми розробляємо багатоцільові бомбардувальники, здатні адаптуватися до різних місій — стратегічні удари, перехоплення та підтримка. Ці літаки стануть молотом повітряного арсеналу Риму."

ERE_deathanddestruction:0 "Смерть і руйнування"
ERE_deathanddestruction_desc:0 "Імперія приймає тотальну повітряну війну. Наші бомбардувальники сиплять вогонь на ворожі міста, заводи та мораль. Це не просто бій — це знищення згори, нагадування, що гнів Риму не знає меж."

ERE_modernflyingdoctrine:0 "Сучасна льотна доктрина"
ERE_modernflyingdoctrine_desc:0 "Ми переходимо до доктрини далекобійного стратегічного бомбардування, націленого на серце ворожих земель. Натхненні імперськими кампаніями минулого, ми прагнемо не лише перемогти армії, а й паралізувати цілі нації з неба."

ERE_strategicbomberdevelopment:0 "Розробка стратегічних бомбардувальників"
ERE_strategicbomberdevelopment_desc:0 "Величезні висотні бомбардувальники проектуються, щоб нести помсту Риму через континенти. Ці літаки літатимуть далі, вдарятимуть сильніше та повертатимуться неушкодженими — символи імперського охоплення та технологічної майстерності."

ERE_strategicbomberdoctrine:0 "Доктрина стратегічних бомбардувальників"
ERE_strategicbomberdoctrine_desc:0 "Ми формалізуємо нашу філософію стратегічного бомбардування: точність, наполегливість і психологічний вплив. Заводи, інфраструктура та лінії постачання будуть зведені до руїн. Ворог відчує нашу присутність ще до прибуття наших легіонів."

ERE_longrangeescorts:0 "Далекобійні ескортні винищувачі"
ERE_longrangeescorts_desc:0 "Щоб захистити наші бомбардувальники глибоко в ворожій території, ми розробляємо далекобійні винищувачі ескорту. Ці охоронці неба забезпечують безпечне досягнення цілей нашими стратегічними активами."

ERE_fighterdevelopment:0 "Розробка винищувачів"
ERE_fighterdevelopment_desc:0 "Швидкість, маневреність і вогнева міць — наша програма винищувачів зосереджена на створенні елітних літаків для контролю над небом. Чи то перехоплення бомбардувальників, чи двобої з ворожими асами, римські пілоти літатимуть на найкращих машинах."

ERE_aerodome_construction:0 "Будівництво аеродромів"
ERE_aerodome_construction_desc:0 "Аеродроми — це життєва кров наших повітряних операцій. Ми будуємо сучасні аеродроми по всій імперії, забезпечуючи швидке розгортання, технічне обслуговування та логістичну підтримку для наших зростаючих повітряних сил."

ERE_forwardoperatingbases:0 "Передові оперативні бази"
ERE_forwardoperatingbases_dessc:0 "Щоб проєктувати силу за межі наших кордонів, ми створюємо передові бази поблизу ворожих рубежів. Ці об'єкти дозволяють нашим літакам швидко завдавати ударів і безпечно відступати — охоплення Риму розширюється з кожною злітною смугою."

ERE_expandaircorpsflyingschool:0 "Розширення льотної школи повітряного корпусу"
ERE_expandaircorpsflyingschool_desc:0 "Попит на кваліфікованих пілотів зростає. Ми розширюємо наші навчальні програми, вводячи просунуті симулятори, тактичну теорію та суворі льотні режими. Небо наповниться римськими крилами."

ERE_radar_development:0 "Розробка радарів"
ERE_radar_development_desc:0 "Імперія приймає невидимий рубіж. Радарні технології дозволяють нам виявляти загрози, координувати оборону та спрямовувати перехоплювачі з неперевершеною точністю. Рим бачить те, що інші не можуть."

ERE_deathfromthesky:0 "Смерть із неба"
ERE_deathfromthesky_desc:0 "Легіони тепер падають із небес. Ми тренуємо елітні повітряно-десантні підрозділи для ударів за ворожими лініями, захоплення ключових позицій і сіяння хаосу. Ці парашутисти — вістря імперської шокової війни."

ERE_womenaces:0 "Жінки-аси"
ERE_womenaces_desc:0 "Ламаючи традиції, імперія визнає відвагу та майстерність своїх жінок-пілотів. Ці першопрохідці ширяють у небесах, здобуваючи славу та змінюючи майбутнє римської авіації. Їхня мужність надихає нове покоління."

ERE_officeofthelegions:0 "Управління легіонів"
ERE_officeofthelegions_desc:0 "Ми зміцнюємо адміністративну та організаційну структуру наших легіонів, посилюючи основу східноримської армії. Підтримка війни зростає разом із консолідацією нашої влади."

ERE_reformthelegions:0 "Реформа легіонів"
ERE_reformthelegions_desc:0 "Модернізуючи наші стародавні легіони, ми впроваджуємо нові тактики, навчання та обладнання для підготовки до майбутніх конфліктів, навіть ціною певної стабільності."

ERE_cassiandoctrine:0 "Доктрина Кассіана"
ERE_cassiandoctrine_desc:0 "Революційний набір наземних тактик, розроблений генералом Кассіаном, що надає пріоритет мобільності, вогневій силі та дисципліні для підготовки до сучасної війни."

ERE_aurelianreforms:0 "Реформи Авреліана"
ERE_aurelianreforms_desc:0 "Відродження легіонів за допомогою структурних і тактичних змін, натхненних імператором Авреліаном, покращує ефективність і стійкість на полі бою."

ERE_examiningboards:0 "Екзаменаційні ради"
ERE_examiningboards_desc:0 "Ми створюємо ради для оцінки офіцерів і тактик, удосконалюючи командні структури та готуючи ґрунт для більш просунутих реформ."

ERE_efficientproductionprogram:0 "Програма ефективного виробництва"
ERE_efficientproductionprogram_desc:0 "Оптимізація заводів і навчальних програм для максимізації випуску, забезпечуючи добре оснащення наших сил для тривалих бойових дій."

ERE_shockandawe:0 "Шок і трепет"
ERE_shockandawe_desc:0 "Використовуючи сконцентровану вогневу міць і швидкі наступи, ми прагнемо приголомшити ворогів, перш ніж вони встигнуть відповісти, досягаючи рішучих перемог на ранніх етапах."

ERE_theromanarmy:0 "Римська армія"
ERE_theromanarmy_desc:0 "Відроджуючи наші традиції та модернізуючи тактики, наші легіони готові захищати імперію з неперевершеною дисципліною та доктриною."

ERE_militaryresearch:0 "Військові дослідження"
ERE_militaryresearch_desc:0 "Інвестуючи в технології комбінованих озброєнь, ми просуваємо наземні, повітряні та морські можливості для збереження стратегічної переваги."

ERE_increasemilitaryspending:0 "Збільшення військових витрат"
ERE_increasemilitaryspending_desc:0 "Виділення додаткових ресурсів на наші збройні сили забезпечує готовність і зміцнює основу оборони імперії."

ERE_warbonds:0 "Військові облігації"
ERE_warbonds_desc:0 "Мобілізуючи населення для фінансування армії, ми будуємо збройові заводи та посилюємо підтримку імперських кампаній."

ERE_increasearmyspending:0 "Збільшення витрат на армію"
ERE_increasearmyspending_desc:0 "Прямі інвестиції в армію покращують можливості та відкривають перспективи для елітних підрозділів."

ERE_investinthelegions:0 "Інвестиції в легіони"
ERE_investinthelegions_desc:0 "Покращуючи навчання, логістику та технології, наші легіони стають сучасною бойовою силою, здатною протистояти будь-якій загрозі."

ERE_modernisedarmy:0 "Модернізована армія"
ERE_modernisedarmy_desc:0 "Наші легіони повністю модернізовані, поєднуючи стародавню дисципліну з передовими стратегіями та обладнанням."

ERE_increasemilitaryproduction:0 "Збільшення військового виробництва"
ERE_increasemilitaryproduction_desc:0 "Ми підвищуємо промисловий випуск для оснащення армії, прискорюємо механізацію та підтримуємо технологічну перевагу."

ERE_tankcompetition:0 "Танковий конкурс"
ERE_tankcompetition_desc:0 "Сприяючи інноваціям у броньованій війні, ми проводимо конкурси для виявлення та виробництва найкращих танкових конструкцій."

ERE_armouredcataphracts:0 "Броньовані катафракти"
ERE_armouredcataphracts_desc:0 "Наші важкі броньовані підрозділи втілюють дух римської кавалерії, поєднуючи вогневу міць, захист і шокові тактики."

ERE_armybill:0 "Військовий закон"
ERE_armybill_desc:0 "Законодавство для зміцнення армії, розширення її впливу та поступового зміщення політичної прихильності до більш мілітаризованої держави."

ERE_artilleryprogram:0 "Програма просунутої артилерії"
ERE_artilleryprogram_desc:0 "Інвестиції в важкі гармати та облогові знаряддя посилять вогневу міць і можливості укріплення східноримської армії."

ERE_productionpriority:0 "Пріоритет виробництва"
ERE_productionpriority_desc:0 "Перенаправлення ресурсів на ключові галузі зміцнює нашу економіку та забезпечує постачання критично важливих військових матеріалів на передову."

ERE_modernisecavalrytactics:0 "Модернізація кавалерійських тактик"
ERE_modernisecavalrytactics_desc:0 "Реформування кавалерії за допомогою сучасних маневрів і тренувань відновить перевагу східноримських вершників на полі бою."

ERE_mechanisationprogram:0 "Програма механізації"
ERE_mechanisationprogram_desc:0 "Впровадження моторизованих транспортних засобів і механізованих підрозділів підвищує мобільність і зменшує залежність від традиційних піхотних формувань."

ERE_womenarmycorps:0 "Жіночий армійський корпус"
ERE_womenarmycorps_desc:0 "Формування корпусу жінок-добровольців допоможе усунути нестачу робочої сили та продемонструє відданість імперії тотальній мобілізації."

ERE_rifledevelopment:0 "Розробка гвинтівок"
ERE_rifledevelopment_desc:0 "Розробка сучасних гвинтівок покращує вогневу міць піхоти та забезпечує конкурентоспроможність наших солдатів на сучасному полі бою."

ERE_newarmsfactories:0 "Нові збройові заводи"
ERE_newarmsfactories_desc:0 "Розширення збройових виробничих потужностей імперії гарантує стабільне постачання зброї та боєприпасів для наших військ."

ERE_newtankassemblies:0 "Нові танкові заводи"
ERE_newtankassemblies_desc:0 "Будівництво нових танкових заводів дозволяє східноримській армії виводити на поле сучасні броньовані підрозділи, здатні до рішучих проривів."

ERE_legacyofjustinian:0 "Спадщина Юстиніана"
ERE_legacyofjustinian_desc:0 "Відродження бачення імператора Юстиніана надихає на реформи, централізацію та відродження величі східноримської держави."