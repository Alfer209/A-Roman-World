 KOD_calling_of_saints:0 "The Calling of Saints"
 KOD_calling_of_saints_desc:0 "The faithful heed the call. From every valley and mountain, the Saints assemble to defend the Promised Land. Their devotion fills the ranks faster than any decree could."

 
 KOD_mormon_industry:0 "The Mormon Industry"
 KOD_mormon_industry_desc:0 "Industry in Deseret serves not the pursuit of wealth, but the will of God. Every hammer’s strike and every furnace’s flame are acts of faith and devotion to the holy state."

 
 KOD_the_holy_war:0 "The Holy War"
 KOD_the_holy_war_desc:0 "Our war is righteous — ordained by Heaven itself. The faithful rise in arms, not for conquest or greed, but for the divine deliverance of Zion."

 
 KOD_army_of_salt_lake:0 "Army of Salt Lake"
 KOD_army_of_salt_lake_desc:0 "Born from frontier militias and bands of faithful volunteers, the Army of Salt Lake is unrefined but resolute — its soldiers driven by faith rather than discipline."
 KOD_army_of_salt_lake_2z:0 "Army of Salt Lake"
