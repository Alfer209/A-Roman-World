l_english: 

 
 KOD_gentile_menance:0 "The Gentile Menace"
 KOD_gentile_menance_desc:0 "Surrounded by unbelievers, Deseret stands alone as the last bastion of divine truth. The Gentile nations seek to corrupt or destroy the holy order we’ve built — but we shall endure, as the faithful always have."
