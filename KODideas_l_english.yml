 KOD_from_plow_to_rifle:0 "From Plow to Rifle"
 KOD_from_plow_to_rifle_desc:0 "The same hands that built the land now rise to defend it. Farmers, laborers, and preachers take up arms — transforming tools of toil into instruments of salvation."

 
 KOD_divine_zeal:0 "Divine Zeal"
 KOD_divine_zeal_desc:0 "Faith fuels courage, and courage fuels victory. The soldiers of Deseret fight not merely as men, but as instruments of divine will."

 
 KOD_mormon_theocracy:0 "The Mormon Theocracy"
 KOD_mormon_theocracy_desc:0 "The Prophet’s word is law, his vision the foundation of our nation. Through unity of Church and State, Deseret shall prosper under divine guidance."
