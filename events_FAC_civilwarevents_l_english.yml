l_english:
FAC_civilwarevents.1.t:0 "The Northern Republic"
FAC_civilwarevents.1.d:0 "Francia has seen many "republics" come and go from within its boundaries all of which promised everything and delivered nothing. The French people are still cautious of another republic and it seems that our support is low. Although regardless of these minor setbacks the republic is in quite a desirable position to win a civil-war. Our militias are well trained and poised to attack the enemy. How will we approach this?"
FAC_civilwarevents.1.a:0 "The Republic Shall Endure"
FAC_civilwarevents.2.t:0 "The Legions Of The South"
FAC_civilwarevents.2.d:0 "The south is an unstable land full of bandits and gangs which terrorise our local population. The south is also known for its large population of Romans who have immigrated to Francia due to the current state that the Western Roman Republic is in. Many of these immigrants still contain sympathies for Rome and wish to see Francia under Legion control. After the outbreak of civil war our Legions quickly seized land to hopefully achieve a new Roman Republic in Francia. Our support is low however and Gangs still have large influence over our big cities making our ability to hold out in a civil war unlikely without aid from Rome."
FAC_civilwarevents.2.a:0 "The Roman Dream Will be Fulfilled"
FAC_civilwarevents.3.t:0 "The Communist Front"
FAC_civilwarevents.3.d:0 "The Commune has been easily the most active faction in the leadup to the civil-war and the most popular. The people of Francia have been waiting a long time for a new governing system and they hope we will be the ones to deliver to finally deliver it. Although we may have the support of the people we do not have the support of the army which is severely lacking proper training and is still quite small for its potential size."
FAC_civilwarevents.3.a:0 "Communism For All"
FAC_civilwarevents.4.t:0 "Napoleons Return"
FAC_civilwarevents.4.d:0 "Napoleon was a large figure whom many looked up to as one of Francia's greatest generals and one of the greatest revolutionaries of his time too. When Napoleon started his campaign from Bordeaux he was making huge victories and was heading straight to Paris to secure his hard-fought revolution against Francia's corrupt "Republic". Until one fateful battle just south of Paris Napoleon was shot by Loyalist Republican forces and everything went downhill from there marking the end of the revolution as a Republic victory. Now heir of the Bonapartist house, Napoleon VI, is leading a second rebellion to secure the victory that was stolen many years ago. Our divisions are ready Emperor. "
FAC_civilwarevents.4.a:0 "Righteous Victory"
FAC_civilwarevents.5.t:0 "Offer From The Teutons"
FAC_civilwarevents.5.d:0 "The Teutons have come to use with an interesting proposition that will significantly aid us in the fight against the tyrants that started the civil-war. If we accept this deal then we will receive large amounts of equipment and manpower for future political alienation with the Teutons. Right now this wont cause any problems but if we decide to take any more future offers from the Teutons we may become  dependent on the Teutonic Empire."
FAC_civilwarevents.5.a:0 "We Wont Risk It."
FAC_civilwarevents.5.b:0 "Accept the Offer"
FAC_civilwarevents.6.t:0 "Rome Grants Aid"
FAC_civilwarevents.6.d:0 "We have received news from Rome that they have accepted our plea for military equipment to be delivered. This aid will be vital to securing Francia from the illegitimate tyrants and from the corrupt Lebrun. We send our regards to Rome"
FAC_civilwarevents.6.a:0 "Great!"
