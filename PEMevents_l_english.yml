l_english:

pm.1.t: "An Empire of the Ages"
pm.1.desc: "Few can claim to have endured as Persia has. From the rise of the Achaemenids to the Sassanid revival, the Persian Empire has outlasted conquerors, invaders, and the endless turning of ages. When the faiths of the desert sought to engulf the world, Persia stood shoulder to shoulder with the Eastern Romans, sealing the crescent within its own sands. The centuries since have transformed the Empire beyond recognition—railways now cross the plateaus of Fars, oil burns in the lamps of Tehran, and scholars debate the soul of the nation itself.\n\nYet, beneath the modern veneer, the heart of Persia beats with the same fire as it did under Khosrow and Ardashir. The Shahanshah presides over a divided realm—caught between the ancient guardians of Zoroastrian tradition and the new order of industrial modernity. The world stands on the edge of war once again, and old empires stir from their slumber. Persia, eternal and defiant, must choose its path once more."
pm.1.a: "May Ahura Mazda guide the Empire once more."

pm.2.t: "The True Empire"
pm.2.desc: "The Roman and foreign powers have always called us the 'Persian Empire' in their Latinised translations, but we are not just some empire of Persia, we are the one and only Eranshahr! Let all those foreigners know us by our true name, the Eranshahr - The Realm of the Iranians."
pm.2.a: "All must know us as the Eranshahr!"
pm.2.b: "I think the Latinised name fits us perfectly."

pm.3.t: "Persian Ultimatum"
pm.3.desc: "A Persian envoy has arrived at our gates bearing an ultimatum. The Shahanshah demands the surrender of disputed ports, a guarantee of Persian trade rights, and heavy reparations — or the Empire will 'restore order' by force. The Council of the Caliphate meets in fevered argument. Some cry that honour and sovereignty must be defended at any cost; others plead that our people must not be sacrificed on the altar of pride. What shall the Caliphate do?"
pm.3.a: "We will not bow. Persia's demands are an affront to our sovereignty."
pm.3.b: "For the sake of our people we accept their conditions — better peace than ruin."

pm.4.t: "The Caliphate Refuses"
pm.4.desc: "The Muslims have refused to surrender to the true owner of Arabia. They shall face the wrath of the Eranshahr."
pm.4.a: "They shall see Persia's reckoning"

pm.5.t: "They Give In"
pm.5.desc: "What? I thought they would put up a fight."
pm.5.a: "Yipee"

pm.6.t: "Persia Offers To Join The League"
pm.6.desc: "Persian delegates have arrived with an unexpected proposal - they wish to join the Roman League, together in an alliance to stand united against the growing threat of the Teutonic Empire."
pm.6.a: "Join Us, Brothers!"
pm.6.b: "We don't need their help."

pm.7.t: "Constantinople Accepts!"
pm.7.desc: "The Romans have agreed to our proposal. Together, we shall march against the Teutonic menace as brothers-in-arms."
pm.7.a: "Let us fight against a common enemy."

pm.8.t: "Constantinople Declines!"
pm.8.desc: "Our offer has been turned down. The Romans prefer to face the Teutonic threat alone."
pm.8.a: "Oh Well..."


pm.100.t: "Restoration of the Achaemenid Empire"
pm.100.desc: "Today, the world stands witness to an event few thought possible in the modern age. In a grand ceremony held in Tehran, the Shahanshah of Persia proclaimed the rebirth of the Achaemenid Empire — the ancient dominion once spanning from the Aegean to the Indus. Draped in the regalia of the old kings, he declared that the spirit of Cyrus and Darius lives once more, and that the Persian people have reclaimed their divine mandate over the lands of the Aryans.\n\nThe announcement sent shockwaves across the world. From the deserts of Arabia to the halls of Rome, governments scramble to assess what this means for the fragile balance of power. For Persians, however, it is a moment of triumph unmatched since antiquity — the rising of a new sun over an ancient empire reborn."
pm.100.a: "A new empire rises from the old..."
pm.100.b: "The Flame of Ahura Mazda burns eternal — Persia stands eternal!"
