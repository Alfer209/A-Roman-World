l_english:

 GEM_hochmeisterwilheim:0 "Hochmeister Wilhelm"
 GEM_hochmeisterwilheim_desc:0 "Wilhelm II assumes the mantle of Hochmeister, blending imperial ambition with religious authority. His leadership marks a shift back to the old Teutonic order, where divine right and military discipline converge."

 GEM_dissolutionofthesenate:0 "Dissolution of the Senate"
 GEM_dissolutionofthesenate_desc:0 "The Senate, long seen as a relic of ineffective governance, is formally disbanded. This move eliminates political opposition and consolidates legislative power under the Hochmeister’s direct control."

 GEM_militarisetheclergy:0 "Militarise the Clergy"
 GEM_militarisetheclergy_desc:0 "The clergy are transformed into militant agents of the state. Religious institutions are repurposed to train and deploy loyalist forces, blurring the line between spiritual guidance and armed enforcement."

 GEM_puppetprimeminister:0 "Puppet Prime Minister"
 GEM_puppetprimeminister_desc:0 "A compliant Prime Minister is appointed to serve as a public-facing figurehead. While the illusion of civilian leadership is maintained, all decisions are dictated by the imperial court."

 GEM_destroybureacracy:0 "Destroy Bureacracy"
 GEM_destroybureacracy_desc:0 "Layers of inefficient administration are stripped away. Ministries are restructured or abolished, ensuring that governance is swift, obedient, and aligned with imperial priorities."

 GEM_crushthedissidents:0 "Crush the Dissidents"
 GEM_crushthedissidents_desc:0 "Internal resistance is met with overwhelming force. Surveillance, arrests, and purges target those who challenge the regime, securing ideological purity and national unity."

 GEM_absoluteimperialcontrol:0 "Absolute Imperial Control"
 GEM_absoluteimperialcontrol_desc:0 "All branches of government, military, and religious life fall under the Hochmeister’s command. Checks and balances are eliminated, creating a singular, unchallenged authority."

 GEM_preparefortheinevitablewar:0 "Prepare for Inevitable War"
 GEM_preparefortheinevitablewar_desc:0 "The Empire begins full-scale mobilization. Resources are redirected to armament production, strategic planning intensifies, and the population is conditioned for total war."

 GEM_establishtheordenspolizei:0 "Establish the Ordenspolizei"
 GEM_establishtheordenspolizei_desc:0 "A new internal security force is founded to enforce loyalty and suppress dissent. The Ordenspolizei operates with near-total autonomy, answering only to the Hochmeister."

 GEM_operationaleffectiveness:0 "Operational Effectiveness"
 GEM_operationaleffectiveness_desc:0 "The agency refines its tactics, improving coordination, intelligence gathering, and rapid response capabilities. Efficiency becomes the cornerstone of domestic control."

 GEM_formdepartment:0 "Form Department"
 GEM_formdepartment_desc:0 "Specialised departments are created to handle counterintelligence, propaganda, and political policing. Each unit is tailored to monitor and neutralize specific threats to the regime."

 GEM_eyesandearseverywhere:0 "Eyes and Ears Everywhere"
 GEM_eyesandearseverywhere_desc:0 "A vast surveillance network is deployed across the Empire. Informants, wiretaps, and data collection ensure that no citizen escapes scrutiny, and no secret remains hidden."

 GEM_thesentorialquestion:0 "The Senatorial Question"
 GEM_thesentorialquestion_desc:0 "The future of the Senate hangs in the balance. Debates erupt over its relevance, legitimacy, and role in a rapidly changing Empire. The Hochmeister must decide whether to preserve this ancient institution or cast it aside."

 GEM_reformorruin:0 "Reform Or Ruin"
 GEM_reformorruin_desc:0 "Faced with mounting pressure, the Senate proposes sweeping reforms to modernise its structure and regain public trust. Failure to act decisively could lead to its collapse—or worse, forced dissolution."

 GEM_constitutionaldraft:0 "Constitutional Draft"
 GEM_constitutionaldraft_desc:0 "A new constitutional framework is drafted to redefine the balance of power between the monarchy and the Senate. The document aims to enshrine civil liberties while preserving imperial authority."

 GEM_kaisersultimatum:0 "Kaiser's Ultimatum"
 GEM_kaisersultimatum_desc:0 "The Kaiser issues a stark ultimatum: the Senate must accept the proposed reforms or face permanent abolition. This moment becomes a test of political will and national unity."

 GEM_senatorialelections:0 "Senatorial Elections"
 GEM_senatorialelections_desc:0 "Free and fair elections are held to revitalise the Senate with fresh leadership. Reformist and loyalist factions vie for influence, shaping the future direction of governance."

 GEM_passthelawofreichstag:0 "Pass the Law of Reichstag"
 GEM_passthelawofreichstag_desc:0 "The newly elected Senate ratifies the Law of Reichstag, formalising its role as a legislative body under imperial oversight. The Empire retains its strength, but the voice of the people is preserved—at least for now."
 
 
 


    ######################
    #### CENTRAL PATH
    ######################

    GEM_unionwithaustria:0 "Union with Austria"
    GEM_unionwithaustria_desc:0 "Bring Austria under our control, strengthening our position in Central Europe and consolidating imperial influence."

    GEM_antiromanpact:0 "Form the Anti-Roman Pact"
    GEM_antiromanpact_desc:0 "Establish a coalition of nations opposing the Roman bloc, securing our borders and asserting dominance in European affairs."

    GEM_invitefrancians:0 "Invite the Francians"
    GEM_invitefrancians_desc:0 "Seek alliance with Francian nations to bolster our diplomatic influence and prepare for continental conflicts."

    GEM_invitebrits:0 "Invite the British"
    GEM_invitebrits_desc:0 "Engage Britain diplomatically, ensuring support or neutrality in our expansionist plans."

    GEM_asserteasternclaims:0 "Assert Eastern Claims"
    GEM_asserteasternclaims_desc:0 "Press our historical claims on eastern territories, challenging neighboring powers and extending our influence."

    GEM_endthecommonwealth:0 "End the Commonwealth"
    GEM_endthecommonwealth_desc:0 "Pursue full annexation of the Commonwealth, bringing its lands firmly under our control."

    GEM_protectthecommonwealth:0 "Protect the Commonwealth"
    GEM_protectthecommonwealth_desc:0 "Safeguard the independence of the Commonwealth to maintain regional stability and diplomatic leverage."

    GEM_fateofthecommonwealth:0 "The Fate of the Commonwealth"
    GEM_fateofthecommonwealth_desc:0 "Determine the ultimate outcome of the Commonwealth, balancing diplomacy and military pressure."

    GEM_invitetheczech:0 "Invite Czechoslovakia"
    GEM_invitetheczech_desc:0 "Extend diplomatic overtures to Czechoslovakia to gain their cooperation or alliance."

    GEM_influencethebenelux:0 "Influence the Benelux"
    GEM_influencethebenelux_desc:0 "Work diplomatically to bring Belgium, Netherlands, and Luxembourg into our sphere of influence."

    GEM_alliancewithiberia:0 "Alliance with Iberia"
    GEM_alliancewithiberia_desc:0 "Negotiate a formal alliance with Iberian states, securing support and trade for our upcoming campaigns."

    GEM_treatywithnewspain:0 "Treaty with New Spain"
    GEM_treatywithnewspain_desc:0 "Formalize relations with New Spain, strengthening our position in the western hemisphere."

    GEM_finalblowtoallromans:0 "Final Blow to the Romans"
    GEM_finalblowtoallromans_desc:0 "Launch a decisive campaign against Roman territories, crushing their influence once and for all."

    GEM_warwithiberia:0 "War with Iberia"
    GEM_warwithiberia_desc:0 "Prepare to subjugate the Iberian states militarily, expanding our power and securing strategic territory."

    GEM_sudenland:0 "Sudetenland Crisis"
    GEM_sudenland_desc:0 "Pressure Czechoslovakia over the Sudetenland, forcing territorial concessions or preparing for military action."

    GEM_czechclaims:0 "Czech Claims"
    GEM_czechclaims_desc:0 "Assert territorial claims in Czechoslovakia, laying the groundwork for integration or annexation."

    GEM_integrateczechslovakia:0 "Integrate Czechoslovakia"
    GEM_integrateczechslovakia_desc:0 "Formally incorporate Czechoslovak lands into our realm, consolidating control and resources."

    GEM_influencescandivaia:0 "Influence Scandinavia"
    GEM_influencescandivaia_desc:0 "Extend diplomatic influence over the Nordic countries, securing alliances and defense guarantees."

    GEM_securefinland:0 "Secure Finland"
    GEM_securefinland_desc:0 "Move to annex Finland, ensuring it becomes a firm part of our strategic territory."

    GEM_demandstoswedenandnorway:0 "Demands to Sweden and Norway"
    GEM_demandstoswedenandnorway_desc:0 "Issue territorial and political demands to Sweden and Norway to expand our influence in Scandinavia."

    GEM_prepareforthegreatwar:0 "Prepare for the Great War"
    GEM_prepareforthegreatwar_desc:0 "Mobilize forces, increase threat levels, and prepare for large-scale continental conflict."

    GEM_crushtheeagle:0 "Crush the Eagle"
    GEM_crushtheeagle_desc:0 "Strike decisively against the Roman Empire, eliminating their dominance and securing our position."

    GEM_antiromandoctrine:0 "Anti-Roman Doctrine"
    GEM_antiromandoctrine_desc:0 "Adopt strategic policies aimed at countering Roman influence and strengthening our military doctrine."

    GEM_winbyair:0 "Win by Air"
    GEM_winbyair_desc:0 "Focus on air superiority, ensuring our forces can dominate the skies and support ground operations effectively."

    ######################
    #### ARMY & REFORMS
    ######################

    GEM_reorganisetheheer:0 "Reorganize the Heer"
    GEM_reorganisetheheer_desc:0 "Restructure the army to improve efficiency, loyalty, and combat effectiveness."

    GEM_treatywiththerussians:0 "Treaty with the Russians"
    GEM_treatywiththerussians_desc:0 "Negotiate a treaty with Russia to stabilize our eastern borders and focus on other campaigns."

    GEM_berlinmoscowpact:0 "Berlin-Moscow Pact"
    GEM_berlinmoscowpact_desc:0 "Attempt a forceful diplomatic arrangement with Russia, solidifying our influence in Eastern Europe."

    GEM_expandteutoniclegions:0 "Expand the Teutonic Legions"
    GEM_expandteutoniclegions_desc:0 "Increase the size and capabilities of the Teutonic Legions to enforce our rule and project power."

    GEM_womensarmycorps:0 "Women's Army Corps"
    GEM_womensarmycorps_desc:0 "Incorporate women into military roles, expanding manpower and supporting the war effort."

    GEM_openupanewfrontagainsteastrome:0 "Open a New Front Against East Rome"
    GEM_openupanewfrontagainsteastrome_desc:0 "Initiate operations against Eastern Rome, aiming for rapid territorial gains."

    GEM_theafricanfrontier:0 "The African Frontier"
    GEM_theafricanfrontier_desc:0 "Deploy forces to Africa, securing resources and strategic positions."

    GEM_theasianfront:0 "The Asian Front"
    GEM_theasianfront_desc:0 "Extend military campaigns into Asia, challenging rival powers and gaining influence."

    GEM_armyloyalty:0 "Ensure Army Loyalty"
    GEM_armyloyalty_desc:0 "Strengthen the loyalty of our forces, preventing insubordination and reinforcing discipline."

    GEM_armyindoctrination:0 "Army Indoctrination"
    GEM_armyindoctrination_desc:0 "Instill political and ideological loyalty in the army, creating a unified command."

    GEM_appointloyalofficers:0 "Appoint Loyal Officers"
    GEM_appointloyalofficers_desc:0 "Place trusted officers in key positions, ensuring the army acts in accordance with state directives."

    GEM_prisonerformations:0 "Prisoner Formations"
    GEM_prisonerformations_desc:0 "Recruit prisoners into military units, increasing manpower and utilizing all available human resources."

    GEM_expandtheacademy:0 "Expand the Academy"
    GEM_expandtheacademy_desc:0 "Enhance military education and training facilities to produce highly skilled officers."

    GEM_anewtypeofwarfare:0 "A New Type of Warfare"
    GEM_anewtypeofwarfare_desc:0 "Develop innovative tactics and technologies, gaining an advantage across all military branches."
    
