GEM_divebombers_desc:0 "Develop specialized dive bombers to support ground operations and improve close air support efficiency."  

GEM_tacbombers:0 "Tactical Bombers"  
GEM_tacbombers_desc:0 "Invest in tactical bombers to support operational campaigns and reduce doctrine research costs."  

GEM_stratbomber:0 "Strategic Bombers"  
GEM_stratbomber_desc:0 "Develop long-range bombers capable of strategic bombing, affecting enemy infrastructure and industry."  

GEM_rocketinnovations:0 "Rocket Innovations"  
GEM_rocketinnovations_desc:0 "Research advanced rocketry to increase air capabilities and unlock special projects."  

GEM_fallschirmjager:0 "Fallschirmjäger"  
GEM_fallschirmjager_desc:0 "Train paratroopers to strengthen special forces and enhance airborne doctrines."  

GEM_formtheteutonairschool:0 "Teutonic Air School"  
GEM_formtheteutonairschool_desc:0 "Establish a premier air school to train pilots, develop fighter aircraft, and gain ace pilots."  

GEM_reorganisetheairforce:0 "Reorganize the Air Force"  
GEM_reorganisetheairforce_desc:0 "Restructure and modernize the air force to improve efficiency and gain command power."  

GEM_solveaeronauticalbottlenecks:0 "Solve Aeronautical Bottlenecks"  
GEM_solveaeronauticalbottlenecks_desc:0 "Address production and technological bottlenecks to increase research and aircraft output."  

