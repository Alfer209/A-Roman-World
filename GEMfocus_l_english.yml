l_english:

 GEM_hochmeisterwilheim:0 "Гохмайстер Вільгельм"
GEM_hochmeisterwilheim_desc:0 "Вільгельм II приймає мантію Гохмайстера, поєднуючи імперські амбіції з релігійним авторитетом. Його керівництво знаменує повернення до старого Тевтонського ладу, де божественне право та військова дисципліна сходяться."

GEM_dissolutionofthesenate:0 "Розпуск Сенату"
GEM_dissolutionofthesenate_desc:0 "Сенат, який давно вважався пережитком неефективного управління, офіційно розпускається. Цей крок усуває політичну опозицію та концентрує законодавчу владу під прямим контролем Гохмайстера."

GEM_militarisetheclergy:0 "Мілітаризувати Духовенство"
GEM_militarisetheclergy_desc:0 "Духовенство перетворюється на войовничих агентів держави. Релігійні установи перепрофільовуються для навчання та розгортання сил лоялістів, стираючи межу між духовним керівництвом та збройним примусом."

GEM_puppetprimeminister:0 "Маріонетковий Прем'єр-Міністр"
GEM_puppetprimeminister_desc:0 "Призначається покірний Прем'єр-Міністр, який слугує публічною фігурою. Хоча ілюзія цивільного керівництва зберігається, усі рішення диктуються імперським двором."

GEM_destroybureacracy:0 "Знищити Бюрократію"
GEM_destroybureacracy_desc:0 "Шари неефективної адміністрації усуваються. Міністерства реструктуризуються або скасовуються, забезпечуючи, що управління є швидким, слухняним та узгодженим з імперськими пріоритетами."

GEM_crushthedissidents:0 "Розчавити Дисидентів"
GEM_crushthedissidents_desc:0 "Внутрішній опір зустрічає нищівну силу. Спостереження, арешти та чистки спрямовані проти тих, хто кидає виклик режиму, забезпечуючи ідеологічну чистоту та національну єдність."

GEM_absoluteimperialcontrol:0 "Абсолютний Імперський Контроль"
GEM_absoluteimperialcontrol_desc:0 "Усі гілки влади, військові та релігійне життя потрапляють під командування Гохмайстера. Системи стримувань і противаг усуваються, створюючи єдину, беззаперечну владу."

GEM_preparefortheinevitablewar:0 "Готуватися до Неминучої Війни"
GEM_preparefortheinevitablewar_desc:0 "Імперія розпочинає повномасштабну мобілізацію. Ресурси перенаправляються на виробництво озброєнь, стратегічне планування посилюється, а населення готується до тотальної війни."

GEM_establishtheordenspolizei:0 "Створити Орденську Поліцію"
GEM_establishtheordenspolizei_desc:0 "Засновується нова служба внутрішньої безпеки для забезпечення лояльності та придушення інакомислення. 'Орденська Поліція' діє з майже повною автономією, підпорядковуючись лише Гохмайстеру."

GEM_operationaleffectiveness:0 "Оперативна Ефективність"
GEM_operationaleffectiveness_desc:0 "Агенція вдосконалює свою тактику, покращуючи координацію, збір розвідувальних даних та можливості швидкого реагування. Ефективність стає наріжним каменем внутрішнього контролю."

GEM_formdepartment:0 "Сформувати Відділ"
GEM_formdepartment_desc:0 "Створюються спеціалізовані відділи для боротьби з контррозвідкою, пропагандою та політичною поліцією. Кожен підрозділ пристосований для моніторингу та нейтралізації конкретних загроз режиму."

GEM_eyesandearseverywhere:0 "Очі та Вуха Скрізь"
GEM_eyesandearseverywhere_desc:0 "По всій Імперії розгортається величезна мережа спостереження. Інформатори, прослуховування та збір даних гарантують, що жоден громадянин не уникне перевірки, і жодна таємниця не залишиться прихованою."

GEM_thesentorialquestion:0 "Питання Сенату"
GEM_thesentorialquestion_desc:0 "Майбутнє Сенату висить на волосині. Спалахують дебати щодо його актуальності, легітимності та ролі в Імперії, що швидко змінюється. Гохмайстер має вирішити, чи зберегти цю стародавню інституцію, чи відкинути її."

GEM_reformorruin:0 "Реформа Або Руїна"
GEM_reformorruin_desc:0 "Зіткнувшись із зростаючим тиском, Сенат пропонує радикальні реформи, щоб модернізувати свою структуру та відновити довіру громадськості. Нездатність діяти рішуче може призвести до його краху — або, що гірше, до примусового розпуску."

GEM_constitutionaldraft:0 "Конституційний Проєкт"
GEM_constitutionaldraft_desc:0 "Розроблено нову конституційну структуру для перевизначення балансу влади між монархією та Сенатом. Документ має на меті закріпити громадянські свободи, водночас зберігаючи імперський авторитет."

GEM_kaisersultimatum:0 "Ультиматум Кайзера"
GEM_kaisersultimatum_desc:0 "Кайзер висуває суворий ультиматум: Сенат повинен прийняти запропоновані реформи або зіткнутися з постійною ліквідацією. Цей момент стає перевіркою політичної волі та національної єдності."

GEM_senatorialelections:0 "Вибори до Сенату"
GEM_senatorialelections_desc:0 "Проводяться вільні та чесні вибори для пожвавлення Сенату новим керівництвом. Реформістські та лоялістські фракції борються за вплив, формуючи майбутній напрямок управління."

GEM_passthelawofreichstag:0 "Прийняти Закон про Райхстаг"
GEM_passthelawofreichstag_desc:0 "Новообраний Сенат ратифікує 'Закон про Райхстаг', формалізуючи свою роль як законодавчого органу під імперським наглядом. Імперія зберігає свою силу, але голос народу зберігається — принаймні, наразі."
 
 
 


    ######################
    #### CENTRAL PATH
    ######################

    GEM_unionwithaustria:0 "Союз із Австрією"
GEM_unionwithaustria_desc:0 "Взяти Австрію під наш контроль, зміцнюючи наші позиції в Центральній Європі та консолідуючи імперський вплив."

GEM_antiromanpact:0 "Сформувати Антиримський Пакт"
GEM_antiromanpact_desc:0 "Створити коаліцію націй, які протистоять Римському блоку, забезпечуючи наші кордони та утверджуючи домінування в Європейських справах."

GEM_invitefrancians:0 "Запросити Франків"
GEM_invitefrancians_desc:0 "Шукати союзу з Франкськими націями, щоб посилити наш дипломатичний вплив та підготуватися до континентальних конфліктів."

GEM_invitebrits:0 "Запросити Британців"
GEM_invitebrits_desc:0 "Встановити дипломатичні контакти з Британією, забезпечуючи підтримку або нейтралітет у наших експансіоністських планах."

GEM_asserteasternclaims:0 "Заявити Східні Претензії"
GEM_asserteasternclaims_desc:0 "Наполягати на наших історичних претензіях на східні території, кидаючи виклик сусіднім державам та розширюючи наш вплив."

GEM_endthecommonwealth:0 "Покласти край Співдружності"
GEM_endthecommonwealth_desc:0 "Прагнути повної анексії Співдружності, приводячи її землі міцно під наш контроль."

GEM_protectthecommonwealth:0 "Захистити Співдружність"
GEM_protectthecommonwealth_desc:0 "Забезпечити незалежність Співдружності, щоб підтримувати регіональну стабільність та дипломатичний вплив."

GEM_fateofthecommonwealth:0 "Доля Співдружності"
GEM_fateofthecommonwealth_desc:0 "Визначити остаточний результат Співдружності, балансуючи дипломатію та військовий тиск."

GEM_invitetheczech:0 "Запросити Чехословаччину"
GEM_invitetheczech_desc:0 "Розширити дипломатичні пропозиції до Чехословаччини, щоб отримати їхню співпрацю або союз."

GEM_influencethebenelux:0 "Вплинути на Бенелюкс"
GEM_influencethebenelux_desc:0 "Працювати дипломатично, щоб ввести Бельгію, Нідерланди та Люксембург до нашої сфери впливу."

GEM_alliancewithiberia:0 "Союз із Іберією"
GEM_alliancewithiberia_desc:0 "Вести переговори про формальний союз з Іберійськими державами, забезпечуючи підтримку та торгівлю для наших майбутніх кампаній."

GEM_treatywithnewspain:0 "Договір із Новою Іспанією"
GEM_treatywithnewspain_desc:0 "Формалізувати відносини з Новою Іспанією, зміцнюючи наші позиції в західній півкулі."

GEM_finalblowtoallromans:0 "Фінальний Удар по Всім Римлянам"
GEM_finalblowtoallromans_desc:0 "Розпочати рішучу кампанію проти Римських територій, знищуючи їхній вплив раз і назавжди."

GEM_warwithiberia:0 "Війна з Іберією"
GEM_warwithiberia_desc:0 "Готуватися до військового підкорення Іберійських держав, розширюючи нашу владу та захоплюючи стратегічні території."

GEM_sudenland:0 "Судетська Криза"
GEM_sudenland_desc:0 "Чинити тиск на Чехословаччину через Судети, змушуючи до територіальних поступок або готуючись до військових дій."

GEM_czechclaims:0 "Чеські Претензії"
GEM_czechclaims_desc:0 "Заявити територіальні претензії в Чехословаччині, закладаючи основу для інтеграції або анексії."

GEM_integrateczechslovakia:0 "Інтегрувати Чехословаччину"
GEM_integrateczechslovakia_desc:0 "Офіційно включити Чехословацькі землі до нашого домену, консолідуючи контроль та ресурси."

GEM_influencescandivaia:0 "Вплив на Скандинавію"
GEM_influencescandivaia_desc:0 "Розширити дипломатичний вплив на Нордичні країни, забезпечуючи союзи та гарантії захисту."

GEM_securefinland:0 "Забезпечити Фінляндію"
GEM_securefinland_desc:0 "Діяти для анексії Фінляндії, забезпечуючи, що вона стане міцною частиною нашої стратегічної території."

GEM_demandstoswedenandnorway:0 "Вимоги до Швеції та Норвегії"
GEM_demandstoswedenandnorway_desc:0 "Висунути територіальні та політичні вимоги до Швеції та Норвегії, щоб розширити наш вплив у Скандинавії."

GEM_prepareforthegreatwar:0 "Готуватися до Великої Війни"
GEM_prepareforthegreatwar_desc:0 "Мобілізувати сили, підвищити рівень загрози та готуватися до великомасштабного континентального конфлікту."

GEM_crushtheeagle:0 "Розчавити Орла"
GEM_crushtheeagle_desc:0 "Завдати рішучого удару по Римській Імперії, усуваючи їхнє домінування та забезпечуючи нашу позицію."

GEM_antiromandoctrine:0 "Антиримська Доктрина"
GEM_antiromandoctrine_desc:0 "Прийняти стратегічну політику, спрямовану на протидію Римському впливу та зміцнення нашої військової доктрини."

GEM_winbyair:0 "Перемога у повітрі"
GEM_winbyair_desc:0 "Зосередитися на перевазі в повітрі, забезпечуючи, що наші сили можуть домінувати в небі та ефективно підтримувати наземні операції."

    ######################
    #### ARMY & REFORMS
    ######################

    GEM_reorganisetheheer:0 "Реорганізувати Армію"
GEM_reorganisetheheer_desc:0 "Реструктурувати армію, щоб покращити ефективність, лояльність та бойову спроможність."

GEM_treatywiththerussians:0 "Договір із росіянами"
GEM_treatywiththerussians_desc:0 "Вести переговори щодо договору з Росією, щоб стабілізувати наші східні кордони та зосередитися на інших кампаніях."

GEM_berlinmoscowpact:0 "Пакт Берлін-Москва"
GEM_berlinmoscowpact_desc:0 "Спробувати форсоване дипломатичне врегулювання з Росією, зміцнюючи наш вплив у Східній Європі."

GEM_expandteutoniclegions:0 "Розширити Тевтонські Легіони"
GEM_expandteutoniclegions_desc:0 "Збільшити розмір та можливості Тевтонських Легіонів, щоб утвердити наше правління та проєктувати силу."

GEM_womensarmycorps:0 "Жіночий Армійський Корпус"
GEM_womensarmycorps_desc:0 "Залучити жінок до військових ролей, збільшуючи живу силу та підтримуючи військові зусилля."

GEM_openupanewfrontagainsteastrome:0 "Відкрити Новий Фронт Проти Східного Риму"
GEM_openupanewfrontagainsteastrome_desc:0 "Ініціювати операції проти Східного Риму, прагнучи швидких територіальних здобутків."

GEM_theafricanfrontier:0 "Африканський фронт"
GEM_theafricanfrontier_desc:0 "Розгорнути війська в Африці, забезпечуючи ресурси та стратегічні позиції."

GEM_theasianfront:0 "Азійський фронт"
GEM_theasianfront_desc:0 "Розширити військові кампанії в Азію, кидаючи виклик конкуруючим силам та здобуваючи вплив."

GEM_armyloyalty:0 "Забезпечити Лояльність Армії"
GEM_armyloyalty_desc:0 "Зміцнити лояльність наших сил, запобігаючи непокорі та посилюючи дисципліну."

GEM_armyindoctrination:0 "Армійська Індоктринація"
GEM_armyindoctrination_desc:0 "Прищепити політичну та ідеологічну лояльність в армії, створюючи єдине командування."

GEM_appointloyalofficers:0 "Призначити Лояльних Офіцерів"
GEM_appointloyalofficers_desc:0 "Призначити довірених офіцерів на ключові посади, забезпечуючи відповідність дій армії державним директивам."

GEM_prisonerformations:0 "Формування З В'язнів"
GEM_prisonerformations_desc:0 "Рекрутувати в'язнів до військових підрозділів, збільшуючи живу силу та використовуючи всі доступні людські ресурси."

GEM_expandtheacademy:0 "Розширити Академію"
GEM_expandtheacademy_desc:0 "Посилити військову освіту та навчальні заклади для підготовки висококваліфікованих офіцерів."

GEM_anewtypeofwarfare:0 "Новий Тип Ведення Війни"
GEM_anewtypeofwarfare_desc:0 "Розробити інноваційні тактики та технології, отримуючи перевагу у всіх військових галузях."
    
