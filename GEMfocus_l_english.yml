GEM_divebombers:0 "Пікіруючі бомбардувальники"
GEM_divebombers_desc:0 "Розробити спеціалізовані пікіруючі бомбардувальники для підтримки наземних операцій та покращення ефективності безпосередньої авіаційної підтримки."

GEM_tacbombers:0 "Тактичні бомбардувальники"
GEM_tacbombers_desc:0 "Інвестувати в тактичні бомбардувальники для підтримки оперативних кампаній та зменшення витрат на дослідження доктрин."

GEM_stratbomber:0 "Стратегічні бомбардувальники"
GEM_stratbomber_desc:0 "Розробити далекобійні бомбардувальники, здатні до стратегічного бомбардування, впливаючи на інфраструктуру та промисловість ворога."

GEM_rocketinnovations:0 "Ракетні Інновації"
GEM_rocketinnovations_desc:0 "Дослідити просунуту ракетну техніку, щоб збільшити повітряні можливості та розблокувати спеціальні проєкти."

GEM_fallschirmjager:0 "Парашутисти (Fallschirmjäger)"
GEM_fallschirmjager_desc:0 "Навчити парашутистів, щоб зміцнити сили спеціального призначення та покращити повітряно-десантні доктрини."

GEM_formtheteutonairschool:0 "Тевтонська Повітряна Школа"
GEM_formtheteutonairschool_desc:0 "Заснувати першокласну повітряну школу для навчання пілотів, розробки винищувачів та підготовки асів."

GEM_reorganisetheairforce:0 "Реорганізувати Повітряні Сили"
GEM_reorganisetheairforce_desc:0 "Реструктурувати та модернізувати повітряні сили для підвищення ефективності та отримання командної влади."

GEM_solveaeronauticalbottlenecks:0 "Вирішити Авіаційні 'Вузькі Місця'"
GEM_solveaeronauticalbottlenecks_desc:0 "Усунути виробничі та технологічні 'вузькі місця' для збільшення досліджень та випуску літаків."

GER_experimental_rotorcrafts:0 "Експериментальні Гвинтокрилі Апарати"
GER_experimental_rotorcrafts_desc:0 "Розробити та експериментувати з ранніми конструкціями гелікоптерів, розблоковуючи нові повітряні можливості."

GEM_developradar:0 "Розробка Радару"
GEM_developradar_desc:0 "Інвестувати в радіолокаційні технології для покращення виявлення та розблокування просунутих повітряних проєктів."

GEM_vaterlanddefense:0 "Захист Вітчизни"
GEM_vaterlanddefense_desc:0 "Зміцнити протиповітряну оборону батьківщини, впроваджуючи ідеї та плануючи проєкти для захисту Вітчизни."

GEM_southernfortifications:0 "Південні Укріплення"
GEM_southernfortifications_desc:0 "Побудувати та розширити протиповітряну оборону вздовж південного узбережжя, щоб захистити життєво важливі території."

GEM_nightfighters:0 "Нічні Винищувачі"
GEM_nightfighters_desc:0 "Розробити спеціалізовані підрозділи нічних винищувачів для здобуття переваги в повітрі під час нічних операцій."

GEM_torpedobombers:0 "Торпедоносці"
GEM_torpedobombers_desc:0 "Розробити військово-морські бомбардувальники, здатні до торпедних атак, щоб зміцнити морську повітряну міць."

GEM_aerodynamicresearchinstitute:0 "Аеродинамічний Дослідницький Інститут"
GEM_aerodynamicresearchinstitute_desc:0 "Дослідити аеродинаміку та реактивні літаки для розблокування просунутих планерів та технологій."  


