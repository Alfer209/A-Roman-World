GER_experimental_rotorcrafts_desc:0 "Develop and experiment with early helicopter designs, unlocking new air capabilities."  

GEM_developradar:0 "Radar Development"  
GEM_developradar_desc:0 "Invest in radar technology to improve detection and unlock advanced air projects."  

GEM_vaterlanddefense:0 "Vaterland Defense"  
GEM_vaterlanddefense_desc:0 "Strengthen homeland air defense by deploying ideas and timed projects to protect the Vaterland."  

GEM_southernfortifications:0 "Southern Fortifications"  
GEM_southernfortifications_desc:0 "Build and expand anti-air defenses along the southern coast to secure vital territories."  

GEM_nightfighters:0 "Night Fighters"  
GEM_nightfighters_desc:0 "Develop specialized night-fighter units to gain air superiority during nighttime operations."  

GEM_torpedobombers:0 "Torpedo Bombers"  
GEM_torpedobombers_desc:0 "Develop naval bombers capable of torpedo attacks to strengthen maritime air power."  

GEM_aerodynamicresearchinstitute:0 "Aerodynamic Research Institute"  
GEM_aerodynamicresearchinstitute_desc:0 "Research aerodynamics and jet aircraft to unlock advanced airframes and technologies."  


