 KOD_jihad:0 "Mormon Jihad"
 KOD_jihad_desc:0 "With other faiths seeking our destruction, we must grant ourselves legitimacy as the only true abrahamic faith by conquering the holy land."
 KOD_islam:0 "Attack Islam"
 KOD_islam_desc:0 "We are the only real theocracy in the world, let's ensure that's true in the eyes of the public."
 KOD_levant:0 "Capture Jerusalem"
 KOD_levant_desc:0 "New Jerusalem and Old Jerusalem united under the banner of god, it truly brings a tear to the eye."

 KOD_corporate_church:0 "A Corporate Church"
 KOD_corporate_church_desc:0 "By sacrificing the needs of the people, we can ensure our elites become very wealthy with foreign trade."

 KOD_segregate_the_church:0 "Segregate the Church"
 KOD_segregate_the_church_desc:0 "Be racist, who said that? Jesus maybe. By implementing a system of racial discrimination, we can ensure that we retain racial purity within our lovely deseret"

 KOD_befriend_the_spanish:0 "Spanish Conversion"
 KOD_befriend_the_spanish_desc:0 "Now that we're a monarchy, we can far easier improve our relations with the spanish empire."

 KOD_nevada_for_guarantees:0 "A Devil's Deal"
 KOD_nevada_for_guarantees_desc:0 "Though we hate to part with it, by offering nevada to the spanish, we could get a guarantee; and with the legion encroaching, lord knows we need it."

 KOD_population_growth:0 "Reform the Family"
 KOD_population_growth_desc:0 "With all these reforms being done, it makes sense that the family too must be reformed if we are to enter the world stage."

 KOD_legalize_polygamy:0 "Legalize Polygamy"
 KOD_legalize_polygamy_desc:0 "In the early church members tried to establish polygamy, joseph smith stopped them for being a violation of common decency; but perhaps he made a mistake."

 KOD_strengthen_monogamy:0 "Enshrine Monogamy"
 KOD_strengthen_monogamy_desc:0 "Marriage between two people is the holiest thing there is, and it shall not be tainted by polygamy or extra-marrital relations."

 KOD_girls_of_deseret:0 "Girls of Deseret"
 KOD_girls_of_deseret_desc:0 "The young women have recently begun to demand equality, appeasing them will help us in the long run."

 KOD_womens_rights:0 "Women's Equalty"
 KOD_womens_rights_desc:0 "Women are just as capable as men, thus their equality should be signed into law, else people might get the wrong ideas."

 KOD_empower_the_relief_society:0 "Empower the Relief Society"
 KOD_empower_the_relief_society_desc:0 "The Relief Society is an old and powerful organization for the women of the church, by granting it power, we empower women."

 KOD_redefine_woman:0 "Redefine Woman"
 KOD_redefine_woman_desc:0 "What really is a woman? We've recently had a large amount of our population concerned over matters of sex, so we shall redefine it!"

 KOD_female_priesthood_holders:0 "Universal Priesthood"
 KOD_female_priesthood_holders_desc:0 "The Priesthood is the power of god, we are his instruments, and all can serve him; regardless of sex or race."

 KOD_integrate_texas:0 "Integrate Texas"
 KOD_integrate_texas_desc:0 "We once lived in texas peacefully until we were kicked out, it's time to repay the favor."

 KOD_conquer_new_spain:0 "Conquer New Spain"
 KOD_conquer_new_spain_desc:0 "The Spanish have long rejected our truths, perhaps with violence they will finally be willing to accept our gospel."

 KOD_integrate_new_spain:0 "Integrate New Spain"
 KOD_integrate_new_spain_desc:0 "We shall convert all those godless spainiards. or- well they have a god, it's just not the right one. - wait I mean, oh nevermind"

 KOD_carribean_rubber:0 "Exploit Carribean Rubber"
 KOD_carribean_rubber_desc:0 "The Carribean is prime territory for rubber plantations, we need only develop them."

 KOD_conquer_louisiana:0 "Conquer The Mississipi"
 KOD_conquer_louisiana_desc:0 "With control of the Mississipi River, we could be unstoppable; in the 18th century."

 KOD_integrate_louisiana:0 "Integrate the River"
 KOD_integrate_louisiana_desc:0 "These poor people have not had the chance to hear the good word, as our citizens they shall be englightened."

 KOD_texas_oil:0 "Drill Texas Oil"
 KOD_texas_oil_desc:0 "With texas's oil supply, the lord's mechanized army will not be slowed by lack of fuel any longer!"

 KOD_integrate_cascadia:0 "Integrate Cascadia"
 KOD_integrate_cascadia_desc:0 "It is now time to preach among the cascadians."

