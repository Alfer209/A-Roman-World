l_english:

 KOD_call_of_yahweh:0 "The Call of The Father"
 KOD_call_of_yahweh_desc:0 "The Lord has spoken once more to His chosen people. The time for isolation has ended; Zion must rise from the dust and steel itself against the wicked nations beyond our frontier."

 KOD_reaffirm_the_articles_of_faith:0 "Reaffirm the Articles of Faith"
 KOD_reaffirm_the_articles_of_faith_desc:0 "Our society must rest upon divine order. We will strengthen the Articles of Faith to remind the Saints who we are and what we fight for."

 KOD_gather_the_church:0 "Gather the Church"
 KOD_gather_the_church_desc:0 "The faithful must be united under one banner — the banner of Deseret. No longer will our communities be scattered; the Church and State shall stand as one."

 KOD_reach_out_to_the_legion:0 "Reach Out to the Legion"
 KOD_reach_out_to_the_legion_desc:0 "To the east lies the Legion, a growing power claiming the legacy of Rome. Perhaps they can be reasoned with — or perhaps they are merely another empire seeking to chain Zion."

 KOD_we_cannot_delay:0 "We Cannot Delay"
 KOD_we_cannot_delay_desc:0 "The day of reckoning approaches. We cannot wait for divine signs any longer; our hands must act as instruments of God’s will."

 KOD_the_loyal_fanatics:0 "The Loyal Fanatics"
 KOD_the_loyal_fanatics_desc:0 "Our most devoted followers will never question the Church’s command. Though outsiders call them zealots, their faith will be our shield and sword."

 KOD_question_of_the_gentiles:0 "The Question of the Gentiles"
 KOD_question_of_the_gentiles_desc:0 "What is to be done with the Gentiles within our borders? Shall we attempt conversion — or purify Zion through fire and exile?"

 KOD_call_of_the_saints:0 "The Call of the Saints"
 KOD_call_of_the_saints_desc:0 "From every corner of Deseret, the faithful answer the Prophet’s call. Men and women abandon their fields to take up arms for the holy cause."

 KOD_purify_the_frontier:0 "Purify the Frontier"
 KOD_purify_the_frontier_desc:0 "Our frontiers are infested with Gentile heresy. The time has come to cleanse these lands, so that only the faithful may dwell within Zion’s walls."

 KOD_rural_missionaries:0 "Rural Missionaries"
 KOD_rural_missionaries_desc:0 "Armed not with rifles but with scripture, our missionaries spread the word of God to the remotest valleys. Faith, not fear, will keep Deseret united."

 KOD_the_battle_for_deseret:0 "The Battle for Deseret"
 KOD_the_battle_for_deseret_desc:0 "The heathens march against us. Now the Saints must fight not merely for land, but for their very souls. This is the Lord’s holy war."

 KOD_the_army_of_salt_lake:0 "The Army of Salt Lake"
 KOD_the_army_of_salt_lake_desc:0 "Once farmers and miners, now soldiers of the Lord. The Army of Salt Lake will rise — inexperienced, untested, but burning with holy purpose."

 KOD_defenders_of_zion:0 "Defenders of Zion"
 KOD_defenders_of_zion_desc:0 "The Lord’s chosen stand ready to defend His city. Every trench dug and rifle fired will be in the name of Zion’s survival."

 KOD_fortress_of_the_holy_valley:0 "Fortress of the Holy Valley"
 KOD_fortress_of_the_holy_valley_desc:0 "The Salt Lake Valley shall become our fortress. With concrete, faith, and blood, we will make it impregnable to any enemy."

 KOD_blessed_ammunition:0 "Blessed Ammunition"
 KOD_blessed_ammunition_desc:0 "Every bullet fired in the Lord’s name is a prayer. Our weapons are sanctified — each cartridge a blessing, each shell a hymn."

 KOD_stand_at_zions_gate:0 "Stand at Zion’s Gate"
 KOD_stand_at_zions_gate_desc:0 "They will come for us, as they always have. But this time, they will not pass. Zion shall never fall."

 KOD_armies_of_the_prophecy:0 "Armies of the Prophecy"
 KOD_armies_of_the_prophecy_desc:0 "From revelation and scripture, the Lord foretold an army of Saints marching to victory. That time has come; prophecy shall be fulfilled."

 KOD_reclaim_the_holy_frontier:0 "Reclaim the Holy Frontier"
 KOD_reclaim_the_holy_frontier_desc:0 "Our destiny is to reclaim every inch of land once tilled by the Saints. We shall expand not for greed, but for divine right."

 KOD_convert_the_kaiserheim_colony:0 "Convert the Kaiserheim Colony"
 KOD_convert_the_kaiserheim_colony_desc:0 "The German settlers of Kaiserheim have long resisted the faith. They will either kneel to Zion — or be swept aside by it."

 KOD_cascadian_menance:0 "The Cascadian Menace"
 KOD_cascadian_menance_desc:0 "With only the forests of the northwest stopping our access to the sea, The path forward is clear."

 KOD_modern_politics:0 "Modernize Our Politics"
 KOD_modern_politics_desc:0 "As the world is advancing, our isolation has left us behind. We must modernize if we hope to survive."

 KOD_right:0 "The Right Wing"
 KOD_right_desc:0 "The high authority of the church is our only hope of survival on the world's stage."

 KOD_left:0 "The Left Wing"
 KOD_left_desc:0 "The people are the heart of the church, only by empowering them can we hope to survive on the world's stage."

 KOD_waste:0 "If it ain't broke-"
 KOD_waste_desc:0 "The Theocracy has lasted the saints this long, we'd be foolish to change it."

 KOD_dem:0 "Democratic Theocracy"
 KOD_dem_desc:0 "By listening to the voice of the people, we can ensure the most faithful and resourceful can be heard."

 KOD_com:0 "Socialist Theocracy"
 KOD_com_desc:0 "As Jesus once said, It is easier for a camel to pass through a needle's eye than for a rich man to get into heaven. Thus, we must seize the means of production to redeem the souls of the rich."

 KOD_pat:0 "Paternal Theocracy"
 KOD_pat_desc:0 "We don't know what paternalism is, but Mister trump said he could tell us if we gave him power."

 KOD_rom:0 "Roman Theocracy"
 KOD_rom_desc:0 "Though we do not agree with their false faith, the roman's system of government can serve us quite well."

 KOD_teu:0 "Ordenstaatic Theocracy"
 KOD_teu_desc:0 "Only by blood can we ensure all hear the good word."

 KOD_mon:0 "Monarchist Theocracy"
 KOD_mon_desc:0 "If our prophet were a king or queen, then we could have lovely parades."

 KOD_roman_scum_to_our_east:0 "The Texan Question"
 KOD_roman_scum_to_our_east_desc:0 "The Romans in texas have long been enemies of god, they must be dealt with to secure our nation."

 KOD_banner_of_heaven:0 "The Banner of Heaven"
 KOD_banner_of_heaven_desc:0 "We must use faith and determination to overcome our military weakness."

 KOD_zions_crusade:0 "Zion's Crusade"
 KOD_zions_crusade_desc:0 "We have grown strong, and now it is our turn to go crusading."

 KOD_develop_arizona:0 "Develop Arizona"
 KOD_develop_arizona_desc:0 "We must develop this state for future production"
 KOD_develop_utah:0 "Develop Utah"
 KOD_develop_utah_desc:0 "We must develop this state for future production"
 KOD_develop_nevada:0 "Develop Nevada"
 KOD_develop_nevada_desc:0 "We must develop this state for future production"

 KOD_faith_and_steel:0 "Faith and Steel"
 KOD_faith_and_steel_desc:0 "With infastructure completed, we can now create grand factories to produce for god"

