 KOD_sister_wives:0 "Sister Wives"
 KOD_sister_wives_desc:0 "We are all children of god, and our wives; like any good sister, will know their place is below that of a man."

 KOD_silence_women:0 "Silence Women"
 KOD_silence_women_desc:0 "It is not the place of women to speak, or do anything a man would."

 KOD_capture_wives_abroad:0 "Capture Wives Abroad"
 KOD_capture_wives_abroad_desc:0 "We don't have nearly enough women."

 KOD_redefine_men:0 "Redefine Men"
 KOD_redefine_men_desc:0 "Many within our ranks, who supposedly are men, do not act manly. Thus we should change the definition to exclude them from the privledges reserved for men."

 KOD_mans_church:0 "A Man's Church"
 KOD_mans_church_desc:0 "God was a Man, Christ was a Man, and the first person was a man. Thus it is our inheritance to do with others as we please, for the only real people are men."

 KOD_terrible_proclamation:0 "The Family Proclaimation"
 KOD_terrible_proclamation_desc:0 "In these trying times we must tell the world what a family is."

 KOD_legalize_prostitution:0 "Legalize Mistresses"
 KOD_legalize_prostitution_desc:0 "Christ told us love was a good thing, so we shouldn't discriminate against those selling love."

 KOD_army_families:0 "Army Families"
 KOD_army_families_desc:0 "By letting servicemembers have families and grow families while in the army, we can help bolster our population."

 KOD_sibling_marriage:0 "Sibling Marriage"
 KOD_sibling_marriage_desc:0 "Throughout the Bible there is described relationships between siblings, to be as those great men of the past we must emulate them in every way."

 KOD_redefine_consent:0 "Redefine Consent"
 KOD_redefine_consent_desc:0 "There is only one type of person, a landowning male member of the church, anyone else is just their tool."

 KOD_evaluate_relationships:0 "Evaluate Relationships"
 KOD_evaluate_relationships_desc:0 "We must define who a relationship is between."

 KOD_ban_queers:0 "Traditional Marriage"
 KOD_ban_queers_desc:0 "Marriage is between a man and a woman, as it has been for all of time; and that shall never change."

 KOD_accept_them:0 "A Blind Eye"
 KOD_accept_them_desc:0 "I didn't see anything."

 KOD_moral_superiority:0 "Moral Victory"
 KOD_moral_superiority_desc:0 "We have enshrined the core tenets of the family as taught by Jesus Christ. And now, we are truly the greatest faith upon this earth, in the eyes of god and man."

 KOD_elected_prophet:0 "Elected Prophet"
 KOD_elected_prophet_desc:0 "By electing a prophet we can ensure that god's servant will be ready for his duties."
 