 WRE_corpus_juris_civilis:0 "Corpus Juris Civilis"
 WRE_corpus_juris_civilis_desc:0 "Roman law is invoked to reform society. Though restrictive at first, these ancient codes provide the framework for a stronger, more stable state."

 WRE_corpus_juris_civilis_2:0 "Corpus Juris Civilis"
 WRE_corpus_juris_civilis_2_desc:0 "Roman law is invoked to reform society. Though restrictive at first, these ancient codes provide the framework for a stronger, more stable state."

