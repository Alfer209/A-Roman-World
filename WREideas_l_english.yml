l_english: 

 WRE_springtime_of_nations:0 "Весна народів"
 WRE_springtime_of_nations_desc:0 "Імперія тремтить від заворушень. Ліберальні рухи, націоналістичні повстання та революційний запал ширяться, немов пожежа, підриваючи стабільність Римської держави."

 WRE_springtime_of_nations_2:0 "Весна народів"
 WRE_springtime_of_nations_2_desc:0 "Імперія тремтить від заворушень. Ліберальні рухи, націоналістичні повстання та революційний запал ширяться, немов пожежа, підриваючи стабільність Римської держави."

 WRE_springtime_of_nations_3:0 "Весна народів"
 WRE_springtime_of_nations_3_desc:0 "Імперія тремтить від заворушень. Ліберальні рухи, націоналістичні повстання та революційний запал ширяться, немов пожежа, підриваючи стабільність Римської держави."

 WRE_thediplomaticsolution:0 "Дипломатичне вирішення"
 WRE_thediplomaticsolution_desc:0 "Завдяки обережним компромісам і прагматичним перемовинам Рим може зменшити заворушення та стабілізувати державу, не скочуючись у нове кровопролиття."

 WRE_imminent_senatorial_coup:0 "Наближається сенаторський переворот"
 WRE_imminent_senatorial_coup_desc:0 "Сенат змовляється у затемнених залах, плануючи перехопити владу в уряду. Чутки про неминучий переворот підривають довіру та паралізують управління."

 WRE_imminent_senatorial_coup_2:0 "Наближається сенаторський переворот"
 WRE_imminent_senatorial_coup_2_desc:0 "Сенат змовляється у затемнених залах, плануючи захопити владу в уряду. Чутки про неминучий переворот підривають довіру та паралізують управління."

 WRE_resonance_of_1926:0 "Відлуння 1926 року"
 WRE_resonance_of_1926_desc:0 "Окопи Іллірії залишили глибокі шрами на свідомості нації. Ветерани несуть кошмари у мирне життя, а спогади про майже повний крах переслідують як політичних, так і військових лідерів. Мораль та єдність страждають під тягарем минулих поразок."

 WRE_resonance_of_1926_2:0 "Відлуння 1926 року"
 WRE_resonance_of_1926_2_desc:0 "Окопи Іллірії залишили глибокі шрами на свідомості нації. Ветерани несуть кошмари у мирне життя, а спогади про майже повний крах переслідують як політичних, так і військових лідерів. Мораль та єдність страждають під тягарем минулих поразок."

 WRE_resonance_of_1926_3:0 "Відлуння 1926 року"
 WRE_resonance_of_1926_3_desc:0 "Окопи Іллірії залишили глибокі шрами на свідомості нації. Ветерани несуть кошмари у мирне життя, а спогади про майже повний крах переслідують як політичних, так і військових лідерів. Мораль та єдність страждають під тягарем минулих поразок."

 WRE_resonance_of_1926_4:0 "Відлуння 1926 року"
 WRE_resonance_of_1926_4_desc:0 "Окопи Іллірії залишили глибокі шрами на свідомості нації. Ветерани несуть кошмари у мирне життя, а спогади про майже повний крах переслідують як політичних, так і військових лідерів. Мораль та єдність страждають під тягарем минулих поразок."

 WRE_corpus_juris_civilis:0 "Корпус Юрис Цивіліс"
 WRE_corpus_juris_civilis_desc:0 "Римське право стає основою для реформ суспільства. Спочатку суворе, воно згодом створює каркас для сильної та стабільної держави."

 WRE_corpus_juris_civilis_2:0 "Корпус Юрис Цивіліс"
 WRE_corpus_juris_civilis_2_desc:0 "Римське право стає основою для реформ суспільства. Спочатку суворе, воно згодом створює каркас для сильної та стабільної держави."

 WRE_corpus_juris_civilis_3:0 "Корпус Юрис Цивіліс"
 WRE_corpus_juris_civilis_3_desc:0 "Римське право стає основою для реформ суспільства. Спочатку занадто суворе, але тепер воно створює каркас для сильної та стабільної держави."

 WRE_extreme_corruption_in_the_state:0 "Крайня корупція у державі"
 WRE_extreme_corruption_in_the_state_desc:0 "Корупція проникає у всі державні структури. Сенатори, генерали та бюрократи збагачуються, поки імперія слабне зсередини."

 WRE_extreme_corruption_in_the_state_2:0 "Крайня корупція у державі"
 WRE_extreme_corruption_in_the_state_2_desc:0 "Корупція проникає у всі державні структури. Сенатори, генерали та бюрократи збагачуються, поки імперія слабне зсередини."

 WRE_extreme_corruption_in_the_state_3:0 "Крайня корупція у державі"
 WRE_extreme_corruption_in_the_state_3_desc:0 "Корупція проникає у всі державні структури. Сенатори, генерали та бюрократи збагачуються, поки імперія слабне зсередини."

 WRE_ineffective_armed_forces:0 "Неефективні збройні сили"
 WRE_ineffective_armed_forces_desc:0 "Десятиліття занедбаності, застарілої доктрини та корумпованих офіцерів зробили армію крихкою. Колись гордість Риму, вона тепер ледве справляється з базовими операціями."

 WRE_ineffective_armed_forces_2:0 "Неефективні збройні сили"
 WRE_ineffective_armed_forces_2_desc:0 "Десятиліття занедбаності, застарілої доктрини та корумпованих офіцерів зробили армію крихкою. Колись гордість Риму, вона тепер ледве справляється з базовими операціями."

 WRE_ineffective_armed_forces_3:0 "Реформа збройних сил"
 WRE_ineffective_armed_forces_3_desc:0 "Армія почала відновлюватися. Модернізація, дисципліна та оновлена доктрина повертають ефективність, хоча шрами минулих невдач залишаються."

 WRE_mobilisation_of_armed_forces:0 "Мобілізація збройних сил"
 WRE_mobilisation_of_armed_forces_desc:0 "Імперія кинула усі сили на швидку мобілізацію. Кожен здатний громадянин покликаний до служби, а військовий механізм працює на повну потужність."

 WRE_purgedofficers:0 "Чистка офіцерів"
 WRE_purgedofficers_desc:0 "Політичні чистки сильно скоротили корпус офіцерів. Армія страждає від кризи лідерства, але молоді командири отримують шанс проявити себе в хаосі."

 WRE_legacy_of_rome:0 "Спадщина Риму"
 WRE_legacy_of_rome_desc:0 "Вічна Імперія несе спадщину своїх предків. Навіть у часи слабкості пам’ять про Рим надихає на єдність, дисципліну та віру в вже написану долю нашої держави."

 WRE_capital_of_the_world:0 "Столиця світу"
 WRE_capital_of_the_world_desc:0 "Рим стоїть культурним і духовним серцем світу. З його мармурових зал ллється влада, авторитет і непохитна віра про вічний Рим."

 WRE_the_lorezean_era:0 "Епоха Лоренцеана"
 WRE_the_lorezean_era_desc:0 "Починається епоха Лоренцеана — час реформ, національного відродження та обіцянка відновити велич Риму через єдність і дисципліну."

 WRE_strength_war_honour:0 "Сила, Війна, Честь"
 WRE_strength_war_honour_desc:0 "Рим був збудований на військовій традиції. Сила, дисципліна та честь на полі бою визначають нашу долю і забезпечують виживання імперії."

 WRE_unity_virtue_prosperity:0 "Єдність, Добродії, Благоденство"
 WRE_unity_virtue_prosperity_desc:0 "Через колективну єдність, громадську добродійність та працьовите благоденство Рим прагне не лише виживання, а й нової ери золотого віку."

 WRE_unity_above_all:0 "Єдність понад усе"
 WRE_unity_above_all_desc:0 "Рим не може бути розділений. Єдність — найвища чеснота імперії, обов’язкова для всіх громадян, солдатів та керівників."

 WRE_prep_for_final_strike:0 "Підготовка до вирішального удару"
 WRE_prep_for_final_strike_desc:0 "Імперія збирає всі сили для вирішального удару. Кожен ресурс, кожен громадянин, кожна зброя спрямовані на майбутній удар, що визначить долю Риму."

 WRE_anti_spanish_operation:0 "Антиіспанська операція"
 WRE_anti_spanish_operation_desc:0 "Оперативні плани спрямовані прямо проти Іберії. Армії Іспанії зіткнуться з могутністю Риму та будуть розбиті під його легіонами."

 WRE_anti_francian_operation:0 "Антифранкійська операція"
 WRE_anti_francian_operation_desc:0 "Загрозу Франкії слід нейтралізувати. Рим готується розбити їхні армії та знищити їхній вплив у Європі."

 WRE_anti_teuton_operation:0 "Антитевтонська операція"
 WRE_anti_teuton_operation_desc:0 "Тевтонська загроза на півночі має бути знищена. Рим загострює меч проти тевтонів, готуючись до неминучого зіткнення."

 WRE_olivebranchofpeace:0 "Оливкова гілка миру"
 WRE_olivebranchofpeace_desc:0 "Рим простягає оливкову гілку, пропонуючи примирення та мир. Хоч це й дорогоцінно, такі жести можуть принести стабільність і дипломатичну прихильність."

 WRE_unificationordeath:0 "Єдність або смерть"
 WRE_unificationordeath_desc:0 "Імперія не буде розділена. Або всі римляни під одним прапором, або ми загинемо в спробі. Іншого шляху немає."

 WRE_art_of_artillery:0 "Мистецтво артилерії"
 WRE_art_of_artillery_desc:0 "Римська доктрина приймає гуркіт артилерії. Через інновації та масований вогонь наші війська зметуть усіх, хто стане на шляху."

 bastico_plan:0 "План Бастіко"
 bastico_plan_desc:0 "Пропозиції генерала Бастіко щодо реформ армії наголошують на наступі ціною моралі. Хоча суперечливі, його плани можуть відновити ударну міць Риму."

 bastico_plan_2:0 "План Бастіко"
 bastico_plan_2_desc:0 "Пропозиції генерала Бастіко щодо реформ армії наголошують на наступі ціною моралі. Хоча суперечливі, його плани можуть відновити ударну міць Риму."

 bastico_plan_3:0 "План Бастіко"
 bastico_plan_3_desc:0 "Пропозиції генерала Бастіко щодо реформ армії наголошують на наступі ціною моралі. Хоча суперечливі, його плани можуть відновити ударну міць Риму."

 graziani_plan:0 "План Граціані"
 graziani_plan_desc:0 "Реформи генерала Граціані зосереджені на артилерії та дисциплінованій обороні. Його плани зміцнюють армію Риму, забезпечуючи витримку перед будь-яким нападом."

 graziani_plan_2:0 "План Граціані"
 graziani_plan_2_desc:0 "Реформи генерала Граціані зосереджені на артилерії та дисциплінованій обороні. Його плани зміцнюють армію Риму, забезпечуючи витримку перед будь-яким нападом."

 graziani_plan_3:0 "План Граціані"
 graziani_plan_3_desc:0 "Реформи генерала Граціані зосереджені на артилерії та дисциплінованій обороні. Його плани зміцнюють армію Риму, забезпечуючи витримку перед будь-яким нападом."

 WRE_awakening_the_roman_industrial_giant:0 "Пробудження римського індустріального гіганта"
 WRE_awakening_the_roman_industrial_giant_desc:0 "Сплячий гігант прокидається. Завдяки реформованій промисловості та потокам ресурсів Рим знову стає непереможною економічною силою, здатною вести тотальну війну."

 WRE_antieastromanoperation:0 "Антисхідноримська операція"

 WRE_the_final_war:0 "Остаточна війна"

 WRE_idea_celeberation_of_lorenzo:0 "Святкування Лоренцо"