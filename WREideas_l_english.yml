l_english: 

 WRE_springtime_of_nations:0 "The Springtime of Nations"
 WRE_springtime_of_nations_desc:0 "The empire trembles under unrest. Liberal agitation, nationalist uprisings, and revolutionary fervor spread like wildfire, sapping the stability of the Roman state."

 WRE_springtime_of_nations_2:0 "The Springtime of Nations"
 WRE_springtime_of_nations_2_desc:0 "The empire trembles under unrest. Liberal agitation, nationalist uprisings, and revolutionary fervor spread like wildfire, sapping the stability of the Roman state."

 WRE_springtime_of_nations_3:0 "The Springtime of Nations"
 WRE_springtime_of_nations_3_desc:0 "The empire trembles under unrest. Liberal agitation, nationalist uprisings, and revolutionary fervor spread like wildfire, sapping the stability of the Roman state."

 WRE_thediplomaticsolution:0 "The Diplomatic Solution"
 WRE_thediplomaticsolution_desc:0 "Through careful compromise and pragmatic negotiation, Rome can reduce unrest and stabilize the realm without descending into further bloodshed."

 WRE_imminent_senatorial_coup:0 "Imminent Senatorial Coup"
 WRE_imminent_senatorial_coup_desc:0 "The Senate conspires in shadowed chambers, plotting to seize power from the executive. Rumors of an impending coup erode trust and paralyze governance."

 WRE_imminent_senatorial_coup_2:0 "Imminent Senatorial Coup"
 WRE_imminent_senatorial_coup_2_desc:0 "The Senate conspires in shadowed chambers, plotting to seize power from the executive. Rumors of an impending coup erode trust and paralyze governance."

 WRE_resonance_of_1926:0 "Resonance of 1926"
 WRE_resonance_of_1926_desc:0 "The trenches of Illyria left deep scars on the psyche of the nation. Veteran soldiers carry nightmares into civilian life, and the memory of near-collapse haunts political and military leaders alike. Morale and unity suffer under the weight of past failures."

