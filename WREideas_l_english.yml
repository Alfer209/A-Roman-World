 graziani_plan_3_desc:0 "General Graziani’s reforms focus on artillery and disciplined defense. His plans seek to steady Rome’s armies and ensure they can withstand any assault."

 WRE_awakening_the_roman_industrial_giant:0 "Awakening the Roman Industrial Giant"
 WRE_awakening_the_roman_industrial_giant_desc:0 "The sleeping giant stirs. With industry reformed and resources flowing, Rome becomes an unstoppable economic power once more, capable of sustaining total war."

