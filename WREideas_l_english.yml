 WRE_corpus_juris_civilis_3_desc:0 "Roman law is invoked to reform society. Though restrictive at first, these ancient codes provide the framework for a stronger, more stable state."

 WRE_extreme_corruption_in_the_state:0 "Extreme Corruption in the State"
 WRE_extreme_corruption_in_the_state_desc:0 "Corruption spreads through every office of government. Senators, generals, and bureaucrats enrich themselves while the empire weakens from within."

 WRE_extreme_corruption_in_the_state_2:0 "Extreme Corruption in the State"
 WRE_extreme_corruption_in_the_state_2_desc:0 "Corruption spreads through every office of government. Senators, generals, and bureaucrats enrich themselves while the empire weakens from within."

 WRE_extreme_corruption_in_the_state_3:0 "Extreme Corruption in the State"
 WRE_extreme_corruption_in_the_state_3_desc:0 "Corruption spreads through every office of government. Senators, generals, and bureaucrats enrich themselves while the empire weakens from within."

 WRE_ineffective_armed_forces:0 "Ineffective Armed Forces"
 WRE_ineffective_armed_forces_desc:0 "Decades of neglect, outdated doctrine, and corrupt officers have left the army brittle. Once the pride of Rome, it now struggles to perform even basic operations."

 WRE_ineffective_armed_forces_2:0 "Ineffective Armed Forces"
 WRE_ineffective_armed_forces_2_desc:0 "Decades of neglect, outdated doctrine, and corrupt officers have left the army brittle. Once the pride of Rome, it now struggles to perform even basic operations."

 WRE_ineffective_armed_forces_3:0 "Reforming the Armed Forces"
 WRE_ineffective_armed_forces_3_desc:0 "The army has begun to recover. Modernization, discipline, and renewed doctrine are restoring effectiveness, though the scars of past failure remain."

 WRE_mobilisation_of_armed_forces:0 "Mobilisation of the Armed Forces"
 WRE_mobilisation_of_armed_forces_desc:0 "The empire has thrown its weight into rapid mobilisation. Every able-bodied citizen is called to serve, and the machinery of war turns at full speed."

 WRE_purgedofficers:0 "Purged Officers"
 WRE_purgedofficers_desc:0 "Political purges have gutted the officer corps. The military suffers a crisis of leadership, though younger commanders gain opportunities to rise in the chaos."

 WRE_legacy_of_rome:0 "The Legacy of Rome"
 WRE_legacy_of_rome_desc:0 "The Eternal Empire carries the legacy of its forebears. Even in times of weakness, the memory of Rome inspires unity, discipline, and faith in destiny."

 WRE_capital_of_the_world:0 "Capital of the World"
 WRE_capital_of_the_world_desc:0 "Rome stands as the cultural and spiritual heart of the world. From its marble halls flow authority, power, and the unshakable belief that Rome is eternal."

 WRE_the_lorezean_era:0 "The Lorenzean Era"
 WRE_the_lorezean_era_desc:0 "The Lorenzean Era begins — a time of reform, national revival, and the promise of restoring Rome’s greatness through unity and discipline."

 WRE_strength_war_honour:0 "Strength, War, Honour"
 WRE_strength_war_honour_desc:0 "Rome was built on martial tradition. Strength, discipline, and honour on the battlefield define our destiny and secure our empire’s survival."

 WRE_unity_virtue_prosperity:0 "Unity, Virtue, Prosperity"
 WRE_unity_virtue_prosperity_desc:0 "Through collective unity, civic virtue, and industrious prosperity, Rome seeks not only survival but a new golden age."

 WRE_unity_above_all:0 "Unity Above All"
 WRE_unity_above_all_desc:0 "Rome cannot be divided. Unity is the highest virtue of the empire, demanded of all citizens, soldiers, and leaders alike."

 WRE_prep_for_final_strike:0 "Preparations for the Final Strike"
 WRE_prep_for_final_strike_desc:0 "The empire rallies its strength for the decisive blow. Every resource, every citizen, every weapon is bent toward the coming strike that will decide Rome’s fate."

 WRE_anti_spanish_operation:0 "Anti-Spanish Operation"
 WRE_anti_spanish_operation_desc:0 "Operational plans target Iberia directly. The armies of Hispania will meet the might of Rome and be crushed beneath its legions."

 WRE_anti_francian_operation:0 "Anti-Francian Operation"
 WRE_anti_francian_operation_desc:0 "The Francian threat must be contained. Rome prepares to break their armies and erase their influence from Europe."

 WRE_anti_teuton_operation:0 "Anti-Teuton Operation"
 WRE_anti_teuton_operation_desc:0 "The Teutonic menace to the north must be destroyed. Rome sharpens its sword against the Teutons, preparing for an inevitable clash."

 WRE_olivebranchofpeace:0 "Olive Branch of Peace"
 WRE_olivebranchofpeace_desc:0 "Rome extends an olive branch, offering reconciliation and peace. Though costly, such gestures may buy stability and diplomatic goodwill."

 WRE_unificationordeath:0 "Unification or Death"
 WRE_unificationordeath_desc:0 "The empire will not be divided. Either all Romans stand under one banner, or we perish in the attempt. There is no other path."

 WRE_art_of_artillery:0 "The Art of Artillery"
 WRE_art_of_artillery_desc:0 "Roman doctrine embraces the thunder of artillery. Through innovation and massed firepower, our armies will sweep aside all who stand against us."

 bastico_plan:0 "The Bastico Plan"
 bastico_plan_desc:0 "General Bastico’s proposals for military reform emphasize offensive action at the cost of morale. Though controversial, his plans could restore Rome’s striking power."

 bastico_plan_2:0 "The Bastico Plan"
 bastico_plan_2_desc:0 "General Bastico’s proposals for military reform emphasize offensive action at the cost of morale. Though controversial, his plans could restore Rome’s striking power."

 bastico_plan_3:0 "The Bastico Plan"
 bastico_plan_3_desc:0 "General Bastico’s proposals for military reform emphasize offensive action at the cost of morale. Though controversial, his plans could restore Rome’s striking power."

 graziani_plan:0 "The Graziani Plan"
 graziani_plan_desc:0 "General Graziani’s reforms focus on artillery and disciplined defense. His plans seek to steady Rome’s armies and ensure they can withstand any assault."

 graziani_plan_2:0 "The Graziani Plan"
 graziani_plan_2_desc:0 "General Graziani’s reforms focus on artillery and disciplined defense. His plans seek to steady Rome’s armies and ensure they can withstand any assault."

