l_english:
FAC_legitimate_front:0 "Legitimate Front"
FAC_legitimate_front_desc:0 "Francia is the only front in this war that has a legitimate claim to victory and we take use of this greatly"
FAC_widespread_thuggery:0 "Widespread Thuggery"
FAC_widespread_thuggery_desc:0 "We may have control over the cities but the gangs rule the streets and they are violent and unforgiving and must be eradicated for the good of Francia"
FAC_napoleonic_fighting_spirit:0 "Napoleonic Fighting Spirit"
FAC_napoleonic_fighting_spirit_desc:0 "Napoleon I was Francia's greatest general and greatest revolutionary. Our militias are well trained just like Napoleons men and will fight so Francia will see better days"
FAC_the_french_legions:0 "The French Legions"
FAC_the_french_legions_desc:0 "The French Legions are a group of people who alienate to our cause and fight for a legion republic in Francia, they are very skilful and their expertise will be helpful"
FAC_disunited_population:0 "Disunited Population"
FAC_disunited_population_desc:0 "Our population isn't fully united to our cause and would much rather sympathise with the enemy"
FAC_united_front:0 "United Front"
