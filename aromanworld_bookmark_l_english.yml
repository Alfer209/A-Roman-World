 AROMANWORLD_DESC:0 "For fifteen centuries, Rome has stood unbroken, its world order shaping the destiny of Europe and beyond. Yet beneath the marble façade of eternal empire, the cracks widen. The Illyrian War ended in stalemate, leaving East and West glaring at each other across a bitter divide. Beyond Rome’s borders, the Teutonic Empire rallies a tide of anti-Romanism that threatens to shatter the old order. Now, the Eternal Empire is eternal no longer. The world trembles on the edge of a new age where steel and fire will decide who inherits the legacy of Rome."
 ERE_AROMANWORLD_DESC:0 "As the world's oldest order, the Eastern Roman Empire outlasted all rivals. Under Belisarius, it reclaimed the Eternal City and restored Rome’s dominion from the Mediterranean to the Alps. Centuries of wars, plagues, and schisms followed, yet Constantinople endured, its emperors styling themselves heirs of Augustus and Constantine.\nBut survival came at a cost. The Illyrian War froze dreams of unification in blood and stalemate, leaving the West as both brother and rival. Now Constantinople stands at a crossroads, wary of the Teutonic menace and rising anti-Roman defiance."

 WRE_AROMANWORLD_DESC:0 "Born from Belisarius’ reconquest, the Western Roman Empire rose once more, crowned in Rome and stretching across Europe. For a century, his dynasty held the West, until the death of Emperor Flavius left the purple vacant and the East declaring us illegitimate pretenders.\n\nSince then, the West has endured tyrants and turmoil. A revolution toppled the last despot, raising Emperor Lorenzo to the throne. Yet division lingers, the Empire is fractured, provinces unruly, armies thin. Still, with unity, a new golden age may dawn from the Eternal City."

 LSA_AROMANWORLD_DESC:0 "Once provinces of the Western Empire, the Legion States won their independence with Rome’s blessing. Shaped by centuries of frontier life, they built fleets, raised citizen legions, and carried Roman tradition across the ocean.\n\nToday they stand as a rising power in the New World, wealthy and martial, yet divided. At their head, Consul George Marshall dreams of more than stewardship—he seeks to crown himself Caesar of New Rome, unifying the continent and claiming destiny across land and sea."

 GEM_AROMANWORLD_DESC:0 "The Teutonic Empire forged in the crucibles of centuries of struggle against Rome, calls themselves the 'Shield of Europe' against the decadent Roman world. Stemming from an ancient order of knights, it elevated their order into a state it is today. The Teutons see themselves as God's chosen crusaders, heirs to a divine mission to shatter Roman hegemony, and raise their black cross over the world.\n\nIn recent history, Kaiser Wilhelm II rises as a militant Ordensstaat, seeking not only to restore this ancient order but to claim the so-called 'eternal empire'..."

 NSR_AROMANWORLD_DESC:0 "Exiles from the Spanish mainland, the New Spanish Empire rules from Mexico City over Mesoamerica and Alta California, claiming to be the true heirs of Ferdinand and Isabella. Their courts, armies, and colonial governors exist for a single purpose; La Reconquista Segunda, the restoration of their lost homeland. Every ship, every legion, and every decree is guided by the conviction that Iberia must be returned to the Crown. Driven by royalist zeal and years of exile, the Empire waits for the moment to strike, hell-bent on reclaiming what is rightfully theirs."

 RSF_AROMANWORLD_DESC:0 "The Russian Federative Socialist Republic stands as the heir to a revolution that toppled one of the world’s oldest empires. The Tsar’s armies, backed by West Roman and Teutonic powers, could not extinguish the Red Dawn; from Kursk to Moscow, workers, peasants, and soldiers bled the Whites dry until the old order collapsed. Out of this crucible rose a republic unlike any other; a federation of multiple parties, still scarred by civil war but bound by the promise of a new, social democracy. Yet the ghosts of empire linger, as émigré generals plot abroad and factions within Moscow quarrel over the Republic’s true destiny."

 MIG_AROMANWORLD_DESC:0 "Once the mightiest empire of the East, the Great Ming stood second only to Constantinople. Yet in 1911, the Xinhai Revolution tore it apart — the Tongmenghui advancing from the south, Tibet and Xinjiang separatists, the throne trembling on the edge of collapse. Only Eastern Roman support saved the dynasty, as a means against Teutonic and British encroachment. Two decades later, Ming remains divided; the heartland loyal to the emperor, the Tongmenghui in the south, the frontiers lost. The Empire claims to be eternal, but its survival depends on one question — can Ming finish what was started, and reclaim its place among the great powers?"

 KOD_AROMANWORLD_DESC:0 "Founded in the 1840s by exiles fleeing the Legion States, Deseret arose in the Great Basin as a theocratic refuge from a corrupt world. Though born of the Chalcedonian faith, its founders rejected the imperial Church, proclaiming a purer communion ruled by prophecy, not Rome or Constantinople. For a century, the Saints endured in isolation, guided by the Prophet and his Twelve Apostles, building a devout, self-reliant society in the desert. Now, as the modern age encroaches and foreign powers draw near, Deseret faces a fateful choice — embrace the world they fled or perish defending their sacred kingdom."
 
 CRP_AROMANWORLD_DESC:0 "Born from the fires of the Xinhai Revolution, the Republic of China stands as a fractured dream of a new order. The Republic's founders sought to bury the Mandate of Heaven and raise in its place a modern, unified nation. Yet deacades later, the promise of 1911 has faded into uncertainty. Sun Yat-Sen's ideals survive only in words, his sucessors divided by ambition and ideology. Now led by Wang Jingwei, the Republic struggles to balance reofrm with survival - industrial progress against rural unrest, idealism against the looming shadow of the Ming to the north. The republic's fate will decide the fate of China’s future."
 
 FAC_AROMANWORLD_DESC:0 "Once the mightiest successor to West Rome, Francia rose under Clovis I and the Carolingians as the dominant power of Western Europe. Yet the resurgence of the Western Roman Empire under Belisarius shattered its ascendancy. Centuries of war and uneasy peace with Rome drained its strength, while the rise of the Teutonic Empire to the east crushed any hope of expansion. By the late 19th century, Francia was a fractured relic of its former self — torn between fading monarchic glory and the growing cries for reform. Now, in 1936, its destiny hangs between rebirth and inevitable dissolution."
 
 PEM_AROMANWORLD_DESC:0 "Once the eternal rival of Rome, Persia stands as one of the world's oldest surviving empires. The Sassanid dynasty, preserved through uneasy peace with Rome and internal struggle, now faces a nation divided between reformists and traditionalists bound to the old faith. Beyond its borders lies the last bastion of Islam - The Arabian Caliphate - a reminder of the desperate alliance with Rome to halt Islam consuming the world. Now in 1936, the Shahanshah must decide Persia's fate: embrace progress and modern power, or reignite the ancient rivalry and restore the glory of the Achaemenids."