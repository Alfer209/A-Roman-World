l_english:

 AROMANWORLD_DESC:0 "П'ятнадцять століть поспіль Рим стояв незламним, його внутрішній лад формував долю Європи та заморських земель. Та під мармуровим фасадом вічної імперії тріщини розширюються. Іллірійська війна закінчилася безрезультатно, залишивши Схід і Захід, що вороже дивляться один на одного через гірку розбіжність. Поза межами Риму Тевтонська імперія згуртовує хвилю антиримських настроїв, що загрожує зруйнувати старий порядок. Тепер Вічна Імперія більше не вічна. Світ тремтить на межі нової ери, де сталь і вогонь вирішать, хто успадкує спадщину Риму."

 ERE_AROMANWORLD_DESC:0 "Як найстаріший світовий лад, Східна Римська імперія пережила усіх суперників. Під проводом Белізарія вона повернула собі Вічне Місто та відновила владу Риму від Середземномор'я до Альп. Століття воєн, епідемій та розколів минали, але Константинополь вистояв, а його імператори називали себе спадкоємцями Августа та Костянтина. Та виживання мало свою ціну. Іллірійська війна заморозила мрії про возз'єднання у крові та безвихідному становищі, залишивши Захід одночасно братом і суперником. Нині Константинополь стоїть на роздоріжжі, насторожений через тевтонську загрозу та зростаючий антиримський спротив."

 WRE_AROMANWORLD_DESC:0 "Держава зі столицею в Римі, яка народжена внаслідок війн Беліза, простягається через Європу -  Західна Римська імперія знову впевнено тримає свою голову. Століття його династія тримала Захід, аж до смерті імператора Флавія, що залишила трон вакантним, а Схід оголосив нас нелегітимними претендентами. /n/nВідтоді Захід пережив тиранів та потрясіння. Революція скинула останнього деспота і звела на трон на трон імператора Лоренцо. Проте розділення залишається, Імперія розколота, провінції непокірні, армії нечисленні. Все ж, у єдності може засяяти нова золота доба з Вічного Міста."

 LSA_AROMANWORLD_DESC:0 "Колись провінції Західної імперії, Легіонерські Штати здобули незалежність за благословенням Риму. Сформовані століттям життя на кордонах, вони збудували флоти, створили легіони громадян і понесли римську традицію через океан./n/n Сьогодні вони є могутньою силою у Новому Світі — багаті войовничі та розділені. На їх чолі консул Джордж Маршалл, який мріє не лише про управління, він також прагне коронувати себе Цезарем Нового Риму, об'єднати континент і підкорити долю на землі та морі."

 GEM_AROMANWORLD_DESC:0 "Народжена у вогні століть боротьби з Римом, Тевтонська імперія іменує себе «Щитом Європи» – оплотом проти розбещеної римської цивілізації. Виникнувши з давнього лицарського ордену, вона перетворилася на могутню державу. Тевтони вбачають себе богообраними воїнами, приреченими знищити римську гегемонію та утвердити свій чорний хрест над світом./n/n Сьогодні кайзер Вільгельм II відроджує войовничий Орденсштат, прагнучи не лише поновити давні звичаї, але й підкорити ту саму «вічну імперію»..."

 NSR_AROMANWORLD_DESC:0 "Вигнанці з іспанського материка, Новоіспанська імперія керує з Мехіко всією Мезоамерикою та Альта-Каліфорнією, проголошуючи себе справжніми спадкоємцями Фердинанда й Ізабелли./n/n Їхні суди, армії та колоніальні намісники існують задля однієї мети — **Ла Реконкіста Сегунда**, відвоювання втраченої батьківщини. Кожен корабель, легіон і указ пройняті переконанням, що Іберію потрібно повернути під владу Корони. Сповнена роялістського фанатизму та років вигнання, Імперія терпляче чекає моменту для удару, рішуче налаштована повернути те, що вважає своїм по праву."

 RSF_AROMANWORLD_DESC:0 "Російська Федеративна Соціалістична Республіка постала як спадкоємиця революції, що повалила одну з найстаріших імперій світу. Армії царя, підтримувані західноримськими та тевтонськими силами, не змогли загасити Червону Зорю; від Курська до Москви робітники, селяни й солдати виснажили білих, доки старий порядок не впав. З цього горнила постала республіка, якої ще не бачив світ — федерація багатьох партій, усе ще позначена шрамами громадянської війни, але об’єднана обіцянкою нової соціальної демократії. Та примари імперії не зникли — емігрантські генерали плетуть змови за кордоном, а у самій Москві фракції сперечаються про справжню долю Республіки."

 MIG_AROMANWORLD_DESC:0 "Колись наймогутніша імперія Сходу, Велика Мін стояла другою після Константинополя. Та в 1911 році Сіньхайська революція розірвала її на частини — Тунменхуей наступав із півдня, тибетські та синьцзянські сепаратисти повстали, а трон хитався на межі падіння. Лише підтримка Східного Риму врятувала династію — як противага тевтонському та британському впливу. Два десятиліття потому Мін залишається розділеною: серце імперії лишається вірним імператору, Тунменхуей тримає південь, а прикордоння втрачено. Імперія проголошує себе вічною, але її виживання залежить від одного питання — чи зможе Мін завершити почате й повернути собі місце серед великих держав?"