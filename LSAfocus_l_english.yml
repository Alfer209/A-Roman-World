l_english:

LSA_strengthentheconsulship:0 "Strengthen the Consulship"
LSA_strengthentheconsulship_desc:0 "George Marshall seeks to consolidate the powers of the Consul, centralizing authority to ensure a firm hand over the governance of our state. Political stability and military preparedness will be bolstered in preparation for the challenges ahead."

LSA_voiceofthelegions:0 "Voice of the Legions"
LSA_voiceofthelegions_desc:0 "By aligning the government with the voices of our military legions, we foster unity between New Rome's citizen-soldiers and the state. Morale is strengthened, and our commanders gain a renewed mandate from the people."

LSA_followeastromandoctrine:0 "Follow the Eastern Roman Doctrine"
LSA_followeastromandoctrine_desc:0 "Adopting tactics inspired by the Eastern Roman military masters, we aim to modernize our armies, integrating disciplined formations with strategic foresight. This doctrine will guide our legionaries in the wars to come."

LSA_eagleascendant:0 "The Eagle Ascendant"
LSA_eagleascendant_desc:0 "The Roman Eagle rises once more, signaling a rebirth of our military might and technological advancement. War support surges as citizens rally behind the renewed strength of our nation."

LSA_amilitarysenate:0 "A Military Senate"
LSA_amilitarysenate_desc:0 "Reforming the Senate to include military leaders ensures our legislative body better understands the needs of a nation at arms. Command efficiency improves, and economic burdens on industry are lightened."

LSA_westromansupport:0 "Support for the Western Romans"
LSA_westromansupport_desc:0 "We offer assistance and military guidance to the Western Roman factions, fostering cooperation and shared defense against the threats that loom on the western frontiers."

LSA_millitaryintelligence:0 "Military Intelligence Bureau"
LSA_millitaryintelligence_desc:0 "Creating a dedicated intelligence bureau allows us to gather critical information on foreign powers and internal threats, enhancing the effectiveness of our strategic planning."

LSA_aromanagency:0 "A Roman Agency"
LSA_aromanagency_desc:0 "By reorganizing our intelligence networks into a specialized Roman Agency, we enhance operational security and improve the efficiency of covert operations across our territories."

LSA_enpowerthemerchants:0 "Empower the Merchants"
LSA_enpowerthemerchants_desc:0 "Supporting our commercial elite strengthens the economic foundation of the state. Political influence and stability rise, but military priorities must be balanced against economic expansion."

LSA_romanindustries:0 "Roman Industries"
LSA_romanindustries_desc:0 "Industrial modernisation fuels both commerce and military production. Factories churn with purpose, equipping our legions and increasing the nation's overall output."

LSA_treatywithcanadians:0 "Treaty with Kanata"
LSA_treatywithcanadians_desc:0 "Formalising a diplomatic treaty with Kanata strengthens our northern border and establishes a framework for mutual support in trade and defense."

LSA_alliancewithcanadians:0 "Alliance with Kanata"
LSA_alliancewithcanadians_desc:0 "Taking our cooperation further, we form a military alliance with Kanata, ensuring mutual defense and a shared commitment to regional stability."

LSA_pursuethegoalofunification:0 "Pursue the Goal of Unification"
LSA_pursuethegoalofunification_desc:0 "The Legion States of America must reunify the fragmented territories of our forefathers. Strategic, political, and military measures are underway to restore our nation to its rightful grandeur."

LSA_revitalisedlegions:0 "Revitalised Legions"
LSA_revitalisedlegions_desc:0 "Our citizen-soldiers are reorganized and reinvigorated, adopting modern tactics while honoring ancient Roman discipline. A rejuvenated military stands ready to enforce the Republic’s will."

LSA_atrueromanarmy:0 "A True Roman Army"
LSA_atrueromanarmy_desc:0 "Transforming our legions into a professional, disciplined, and highly-trained force, we prepare them for the large-scale conflicts that will reunite our divided nation."

LSA_assertnewenglandclaims:0 "Assert New England Claims"
LSA_assertnewenglandclaims_desc:0 "By formally asserting our claims on New England territories, we provoke tensions with local authorities. Threats rise, but so does the legitimacy of our unification efforts."

LSA_encroachontheborder:0 "Encroach on the Border"
LSA_encroachontheborder_desc:0 "Border incursions demonstrate our resolve and pressure New England. Diplomatic friction escalates, and preparations for potential military confrontation are essential."

LSA_pressuretheexiles:0 "Pressure the Exiles"
LSA_pressuretheexiles_desc:0 "The Legion of Exiles must recognize the Legion States' authority. Applying political pressure and reclaiming contested lands strengthens our hand in the northern and western territories."

LSA_secureborderwiththerepublicans:0 "Secure Border with the Republicans"
LSA_secureborderwiththerepublicans_desc:0 "Through limited military engagement and strategic operations, we secure our borders against Texan Republican forces, ensuring the stability and safety of our advancing legions."

LSA_eastromansupport:0 "East Roman Support"
LSA_eastromansupport_desc:0 "By requesting support from our brothers in Constantinople, may we look toward uniting this continent under a Roman banner."

LSA_inviteeastromanvolunteers:0 "Invite Eastern Roman Volunteers"
LSA_inviteeastromanvolunteers_desc:0 "Call upon Eastern Roman volunteers to bolster our ranks, increasing manpower and bringing seasoned warriors to reinforce the Legion States' military campaigns."

LSA_martialcitizenship:0 "Martial Citizenship"
LSA_martialcitizenship_desc:0 "Granting citizenship to those who serve in the legions strengthens loyalty, morale, and national identity. Martial virtues are recognized as a path to full civic rights."

LSA_eternalvigilance:0 "Eternal Vigilance"
LSA_eternalvigilance_desc:0 "Our citizens must remain ever watchful, ensuring that both internal and external threats are swiftly identified and neutralized. The Republic’s security is paramount."

LSA_onelegiononenation:0 "One Legion, One Nation"
LSA_onelegiononenation_desc:0 "The call to arms is sounded. Legionaries march to unify the fractured nation under a single banner. The American Unification War begins, demanding courage and sacrifice from every citizen."

LSA_seizeforeignwealth:0 "Seize Foreign Wealth"
LSA_seizeforeignwealth_desc:0 "Confiscation of foreign-owned assets strengthens our war chest, enabling military campaigns and consolidating control over key economic resources."

LSA_victoriapopuliromani:0 "Victoria Populi Romani"
LSA_victoriapopuliromani_desc:0 "Having successfully unified our lands, the triumph of the Roman People is celebrated. Prosperity, security, and military supremacy define the era."

LSA_bringthehawaiwansintothefold:0 "Bring the Hawaiians into the Fold"
LSA_bringthehawaiwansintothefold_desc:0 "Through diplomacy and incentives, we invite Hawaii to join our state, strengthening our maritime reach and reinforcing our Pacific presence."

LSA_claimsinnewspain:0 "Claims in New Spain"
LSA_claimsinnewspain_desc:0 "The southern territories are part of our manifest destiny. Asserting claims over New Spain establishes our legitimacy and strategic advantage in the region."

LSA_takebackourland:0 "Take Back Our Land"
LSA_takebackourland_desc:0 "Military operations commence to reclaim California, ensuring that our nation’s historical lands are restored under the State authority."

LSA_integratecalifornia:0 "Integrate California"
LSA_integratecalifornia_desc:0 "California is brought into the Republic as a fully integrated state, securing its population, resources, and industrial potential for the benefit of the Legion States."

LSA_befriendthenewspanish:0 "Befriend the New Spanish"
LSA_befriendthenewspanish_desc:0 "Forging a cooperative relationship with New Spanish factions strengthens alliances and opens avenues for trade, intelligence, and military collaboration."

LSA_theamericanpact:0 "The American Pact"
LSA_theamericanpact_desc:0 "Through careful diplomacy, a formal alliance with Kanata and friendly New Spanish states forms 'The American Pact,' guaranteeing mutual defense and unified governance in the western hemisphere."

LSA_bringthesouthernmarchestoheel:0 "Bring the Southern Marches to Heel"
LSA_bringthesouthernmarchestoheel_desc:0 "Military campaigns in the southern marches aim to subjugate remaining opposition. Swift and decisive action ensures the Republic’s authority is unquestioned."

LSA_striketheinteriorsettlements:0 "Strike the Interior Settlements"
LSA_striketheinteriorsettlements_desc:0 "Legion forces penetrate deep into interior territories to dismantle resistance and secure vital settlements, asserting dominance across the heartland."

LSA_thedesseretquestion:0 "The Desseret Question"
LSA_thedesseretquestion_desc:0 "Negotiations and limited military action address the Desseret issue, integrating the region under the State's governance and ensuring the loyalty of its populace."

LSA_subjugatetheteutoniccolony:0 "Subjugate the Teutonic Colony"
LSA_subjugatetheteutoniccolony_desc:0 "The Teutonic enclave must submit to the authority of the Legion States. Strategic operations ensure the colony’s swift incorporation or neutralization."

LSA_securegreenland:0 "Secure Greenland"
LSA_securegreenland_desc:0 "Expeditions to Greenland guarantee control over northern territories and vital resources, fortifying the Republic’s strategic position."

LSA_conquercascadia:0 "Conquer Cascadia"
LSA_conquercascadia_desc:0 "Cascadia resists our authority. Military campaigns are launched to assert control, incorporating the region into the Legion States of America."

LSA_thefutureofnewrome:0 "The Future of New Rome"
LSA_thefutureofnewrome_desc:0 "With unification complete, the Legion States of America emerge as a dominant power. All territories fall under central authority, ensuring lasting peace and prosperity."

LSA_uplift_the_legions:0 "Uplift the Legions"
LSA_uplift_the_legions_desc:0 "A revitalized army requires modernization. New doctrines, improved training, and organized command structures will strengthen the backbone of our Republic."

LSA_thelegionsofamerica:0 "The Legions of America"
LSA_thelegionsofamerica_desc:0 "Our citizen-soldiers are organized into formidable legions, ready to enforce the Republic’s will across the continent. Morale, discipline, and war support are enhanced."

LSA_roman_special_forces:0 "Roman Special Forces"
LSA_roman_special_forces_desc:0 "Elite units are trained in advanced tactics, including airborne, mountain, and reconnaissance operations. These forces provide flexibility and precision on the battlefield."

LSA_transform_the_equites:0 "Transform the Equites"
LSA_transform_the_equites_desc:0 "Cavalry units are mechanized and modernized, blending traditional mobility with mechanized firepower. Doctrine costs are reduced, accelerating strategic adoption."

LSA_motorised_equites:0 "Motorised Equites"
LSA_motorised_equites_desc:0 "The cavalry is now fully motorized, capable of rapid deployment across all theaters. Mobility and effectiveness of mechanized units improve significantly."

LSA_miles_caduci:0 "Miles Caduci"
LSA_miles_caduci_desc:0 "Elite paratroopers and airborne forces form the Miles Caduci, combining Roman martial tradition with modern airborne capabilities to project power swiftly."

LSA_aromanarmy:0 "A Roman Army"
LSA_aromanarmy_desc:0 "Our land forces are reorganized into a coherent Roman Army, capable of sustained operations and strategic flexibility across multiple theaters."

LSA_women_serve_in_the_legions:0 "Women Serve in the Legions"
LSA_women_serve_in_the_legions_desc:0 "Women are officially integrated into support and combat roles within the legions, expanding manpower and enhancing operational capacity."

LSA_artillery_of_legions:0 "Artillery of the Legions"
LSA_artillery_of_legions_desc:0 "Heavy artillery and support weapons are upgraded and integrated into the legions, increasing battlefield firepower and operational effectiveness."

LSA_a_new_type_of_warfare:0 "A New Type of Warfare"
LSA_a_new_type_of_warfare_desc:0 "Innovative tactics and doctrines revolutionize the battlefield, enhancing artillery and support operations to outmatch any adversary."

LSA_tank_experiments:0 "Tank Experiments"
LSA_tank_experiments_desc:0 "Experimental armored vehicles are deployed to test new strategies. Successes here will influence future armored doctrine and production."

LSA_tank_destroyers:0 "Tank Destroyers"
LSA_tank_destroyers_desc:0 "Specialized vehicles are developed to counter enemy armor effectively. These destroyers bolster our mechanized corps and defensive capabilities."

LSA_main_battle_tanks:0 "Main Battle Tanks"
LSA_main_battle_tanks_desc:0 "Our armored divisions are reinforced with main battle tanks, combining firepower, protection, and mobility for decisive breakthroughs."

LSA_armoured_legions:0 "Armoured Legions"
LSA_armoured_legions_desc:0 "Legions now field fully mechanized armor formations, integrating tanks and mechanized infantry into a cohesive and powerful striking force."

LSA_legions_of_air:0 "Legions of the Air"
LSA_legions_of_air_desc:0 "The skies belong to the Legion States. By investing in air power, we establish a foundation for air superiority, providing training and modern equipment for our pilots. This initiative strengthens our doctrines and prepares our forces for future conflicts above the clouds."

LSA_fighter_development:0 "Fighter Development"
LSA_fighter_development_desc:0 "We prioritize the design and production of advanced fighter aircraft. With cutting-edge fighters, we can challenge any enemy in aerial combat, ensuring our control of the skies and protection of our ground forces."

LSA_strat_bombing:0 "Strategic Bombing Doctrine"
LSA_strat_bombing_desc:0 "Focusing on strategic bombing, we aim to disrupt enemy infrastructure and industry from the air. This doctrine seeks to weaken our adversaries before they reach our borders, allowing our ground forces to advance with minimal resistance."

LSA_flexible_bombers:0 "Flexible Bomber Forces"
LSA_flexible_bombers_desc:0 "Our bomber units must be versatile and adaptable. Flexible bombers can strike a wide range of targets, from frontline positions to deep strategic objectives, maximizing the effect of our air campaigns."

LSA_CAS:0 "Close Air Support"
LSA_CAS_desc:0 "Providing close air support to our troops, we enhance battlefield effectiveness and coordination between air and ground forces. Well-trained CAS units can turn the tide of battle by targeting enemy formations and fortifications."

LSA_combined_bombing:0 "Combined Bombing Operations"
LSA_combined_bombing_desc:0 "Through coordinated bombing campaigns with our allies, we amplify our impact on the battlefield. These combined operations demonstrate our capacity to dominate the air and support coalition efforts in times of war."

LSA_escort_fighters:0 "Escort Fighters"
LSA_escort_fighters_desc:0 "Escort fighters safeguard our bombers on their missions, ensuring their payloads reach the intended targets. Properly equipped and coordinated, these units preserve our air superiority and reduce bomber losses."

LSA_legions_rule_the_air:0 "Legions Rule the Air"
LSA_legions_rule_the_air_desc:0 "Our air forces now dominate the skies. With superior tactics, aircraft, and training, the Legion States can project power globally, ensuring any enemy air attack is met with a swift and decisive response."

LSA_masters_of_the_air:0 "Masters of the Air"
LSA_masters_of_the_air_desc:0 "By perfecting aerial strategy and technology, we cement our position as masters of the air. This focus ensures a generation of pilots and doctrines capable of shaping the outcome of future wars."

LSA_the_legionary_navy:0 "The Legionary Navy"
LSA_the_legionary_navy_desc:0 "Our naval forces are expanded and modernized, creating a fleet capable of defending our shores and projecting power abroad. New dockyards and infrastructure ensure rapid construction and deployment of advanced ships."

LSA_maritime_comission:0 "Maritime Commission"
LSA_maritime_comission_desc:0 "The Maritime Commission coordinates naval research and industrial capacity, improving ship design and production efficiency. This organization ensures that our navy can respond to threats with precision and strength."

LSA_ships_of_the_legion:0 "Ships of the Legion"
LSA_ships_of_the_legion_desc:0 "A dedicated effort to expand our fleet with modern ships capable of amphibious assaults and oceanic dominance. The Legionary Navy now has the tools to project power across all oceans."

LSA_naval_department:0 "Naval Department"
LSA_naval_department_desc:0 "The creation of a centralized Naval Department streamlines command and operations, increasing efficiency in shipbuilding, fleet deployment, and maritime strategy."

LSA_battleships:0 "Battleships Program"
LSA_battleships_desc:0 "By focusing on battleships, we develop a fleet capable of challenging any navy in direct combat. Heavily armed and armored, these ships are the backbone of our maritime power."

LSA_strike_doctrine:0 "Naval Strike Doctrine"
LSA_strike_doctrine_desc:0 "Our naval strategy emphasizes precision strikes and concentrated firepower. This doctrine ensures our fleet can neutralize enemy vessels quickly and decisively."

LSA_forward_operating:0 "Forward Operating Bases"
LSA_forward_operating_desc:0 "Strategically positioned naval bases extend our operational reach, allowing for sustained operations in distant theaters and better support for fleet movements."

LSA_carriers_of_war:0 "Carriers of War"
LSA_carriers_of_war_desc:0 "Aircraft carriers become the cornerstone of our fleet, allowing for mobile air power projection and decisive engagement with enemy forces at sea."

LSA_aeronautic_support:0 "Aeronautic Support"
LSA_aeronautic_support_desc:0 "Integrated naval aviation provides reconnaissance and bombing support to our fleet, enhancing both offensive and defensive operations."

LSA_naval_radar:0 "Naval Radar Development"
LSA_naval_radar_desc:0 "Radar technology gives our navy an edge in detection and coordination. Ships and aircraft equipped with radar can operate effectively in all conditions, ensuring superiority in naval engagements."

LSA_escort_focus:0 "Convoy Escort Focus"
LSA_escort_focus_desc:0 "Protecting our merchant and troop convoys is essential. Escort vessels ensure the safe passage of critical supplies across contested waters, reducing losses from enemy submarines and raiders."

LSA_convoy_tactics:0 "Convoy Defense Tactics"
LSA_convoy_tactics_desc:0 "Specialized tactics improve the defense of shipping routes, allowing our navy to safeguard vital supply lines and maintain operational readiness."

LSA_submarines:0 "Submarine Program"
LSA_submarines_desc:0 "Submarines enhance our ability to disrupt enemy shipping and maintain sea denial. Stealth and precision attacks allow our forces to weaken adversaries economically and militarily."

LSA_unrestricted_sub_warfare:0 "Unrestricted Submarine Warfare"
LSA_unrestricted_sub_warfare_desc:0 "Employing unrestricted submarine warfare, our navy can interdict enemy trade, cripple supply chains, and impose strategic pressure on adversaries."

LSA_fund_the_navy:0 "Fund the Navy"
LSA_fund_the_navy_desc:0 "Increased investment in our naval forces strengthens shipbuilding, technology, and fleet readiness, ensuring maritime dominance and readiness for conflict."

LSA_form_the_LSMC:0 "Form the Legion Marine Corps"
LSA_form_the_LSMC_desc:0 "The Legion Marine Corps is established, combining elite infantry and amphibious capabilities. This specialized force can conduct rapid deployment operations and secure key objectives in coastal regions."

LSA_amphibious_ops:0 "Amphibious Operations"
LSA_amphibious_ops_desc:0 "Specialized amphibious operations enhance our ability to project power onto enemy shores. Marines trained for such missions ensure that Legion forces remain versatile and lethal in all theatres."

LSA_caesarofnewrome:0 "Caesar of Nova Roma"
LSA_caesarofnewrome_desc:0 "As the American Unification War comes to an end, George Marshall now proclaims himself the 'Caesar of New Rome', emphaising his power and dominion over the New World."

LSA_nationalreconciliation:0 "National Reconciliation"
LSA_nationalreconciliation_desc:0 "Bridging the divides of our citizenry, we work to heal internal fractures and promote a sense of shared purpose across all regions of the Legion States."

LSA_citizenandsoldier:0 "Citizen and Soldier"
LSA_citizenandsoldier_desc:0 "Encouraging citizens to serve in the military fosters loyalty and preparedness, blending civic duty with national defense."

LSA_eaglestandards:0 "Eagle Standards"
LSA_eaglestandards_desc:0 "Our military and civilian institutions unite under shared symbols and standards, promoting discipline, pride, and coordinated national effort."

LSA_totheaidofrome:0 "To the Aid of Rome"
LSA_totheaidofrome_desc:0 "We extend our hand to allied powers, offering our military might and strategic support to secure shared interests and strengthen the position of Nova Roma globally."

LSA_securethealtanticlifelines:0 "Secure the Atlantic Lifelines"
LSA_securethealtanticlifelines_desc:0 "Control over vital Atlantic shipping routes ensures the movement of troops and resources, maintaining strategic dominance over transatlantic supply lines."

LSA_theeaglesreturntoeurope:0 "The Eagles Return to Europe"
LSA_theeaglesreturntoeurope_desc:0 "Legion States forces redeploy to Europe, asserting influence and protecting our interests while projecting power across the continent."

LSA_legionsontherhine:0 "Legions on the Rhine"
LSA_legionsontherhine_desc:0 "Our forces establish a strong presence along the Rhine, securing strategic positions and preparing for further operations to restore order and influence."

LSA_aromanworldrestored:0 "A Roman World Restored"
LSA_aromanworldrestored_desc:0 "Through careful diplomacy and decisive action, we revive a world inspired by Roman principles, bringing stability, prosperity, and the glory of Nova Roma to Europe and beyond."

LSA_establishthelegiondenari:0 "Establish the Legion Denari"
LSA_establishthelegiondenari_desc:0 "A stable currency strengthens our economy and enables sustained industrial growth. The Legion Denari becomes the backbone of our national financial system."

LSA_agriculturaladjustments:0 "Agricultural Adjustments"
LSA_agriculturaladjustments_desc:0 "We reform farming practices to balance efficiency and output, ensuring the nation can sustain its population and military without economic instability."

LSA_workersunions:0 "Workers’ Unions"
LSA_workersunions_desc:0 "Integrating labor unions into economic planning promotes stability, improves productivity, and aligns workforce interests with national objectives."

LSA_civiliansciencyacademy:0 "Civilian Science Academy"
LSA_civiliansciencyacademy_desc:0 "Expanding research institutions fosters innovation across industry and military technology, creating a skilled workforce capable of advancing national interests."

LSA_legionrubberindustry:0 "Legion Rubber Industry"
LSA_legionrubberindustry_desc:0 "Developing rubber production and processing ensures our armed forces and industrial sectors have access to critical materials for vehicles, aircraft, and weapons."

LSA_militaryconstructioneffort:0 "Military Construction Effort"
LSA_militaryconstructioneffort_desc:0 "A focused initiative to rapidly expand military infrastructure, from factories to transport networks, enabling large-scale production and deployment of armed forces."

LSA_wartimeproduction:0 "Wartime Production"
LSA_wartimeproduction_desc:0 "Maximizing industrial output supports our military campaigns. Factories and supply chains are optimized for efficient wartime production."

LSA_centralisedplanning:0 "Centralized Planning"
LSA_centralisedplanning_desc:0 "Streamlined economic and industrial planning ensures resources are allocated effectively to meet national and military needs."

LSA_projecty:0 "Project Y"
LSA_projecty_desc:0 "A top-secret research initiative aimed at harnessing nuclear power for national defense. Success could provide unmatched strategic leverage over global rivals."
