l_english:

LSA_strengthentheconsulship:0 "Зміцнити Консульство"
LSA_strengthentheconsulship_desc:0 "Джордж Маршалл прагне консолідувати повноваження Консула, централізуючи владу для забезпечення твердого керівництва нашим державним управлінням. Політична стабільність та військова готовність будуть посилені в рамках підготовки до майбутніх викликів."

LSA_voiceofthelegions:0 "Голос Легіонів"
LSA_voiceofthelegions_desc:0 "Узгоджуючи уряд із голосами наших військових легіонів, ми сприяємо єдності між громадянами-солдатами Нового Риму та державою. Зміцнюється моральний дух, а наші командири отримують оновлений мандат від народу."

LSA_followeastromandoctrine:0 "Дотримуватися Східноримської Доктрини"
LSA_followeastromandoctrine_desc:0 "Приймаючи тактику, натхненну східноримськими військовими майстрами, ми прагнемо модернізувати наші армії, інтегруючи дисципліновані формування зі стратегічною передбачливістю. Ця доктрина керуватиме нашими легіонерами у майбутніх війнах."

LSA_eagleascendant:0 "Орел, Що Підноситься"
LSA_eagleascendant_desc:0 "Римський Орел знову піднімається, сигналізуючи про відродження нашої військової могутності та технологічного прогресу. Військова підтримка зростає, оскільки громадяни гуртуються навколо оновленої сили нашої нації."

LSA_amilitarysenate:0 "Військовий Сенат"
LSA_amilitarysenate_desc:0 "Реформування Сенату для включення військових лідерів забезпечує, що наш законодавчий орган краще розуміє потреби нації, що перебуває в стані війни. Ефективність командування покращується, а економічний тягар на промисловість полегшується."

LSA_westromansupport:0 "Підтримка Західних Римлян"
LSA_westromansupport_desc:0 "Ми пропонуємо допомогу та військове керівництво фракціям Західного Риму, сприяючи співпраці та спільній обороні проти загроз, що нависають над західними рубежами."

LSA_millitaryintelligence:0 "Бюро Військової Розвідки"
LSA_millitaryintelligence_desc:0 "Створення спеціалізованого бюро розвідки дозволяє нам збирати критично важливу інформацію про іноземні держави та внутрішні загрози, підвищуючи ефективність нашого стратегічного планування."

LSA_aromanagency:0 "Римська Агенція"
LSA_aromanagency_desc:0 "Реорганізовуючи наші розвідувальні мережі в спеціалізовану 'Римську Агенцію', ми посилюємо оперативну безпеку та покращуємо ефективність таємних операцій на наших територіях."

LSA_enpowerthemerchants:0 "Надати Повноважень Купцям"
LSA_enpowerthemerchants_desc:0 "Підтримка нашої комерційної еліти зміцнює економічний фундамент держави. Політичний вплив та стабільність зростають, але військові пріоритети мають бути збалансовані з економічною експансією."

LSA_romanindustries:0 "Римські Промисловості"
LSA_romanindustries_desc:0 "Промислова модернізація підживлює як торгівлю, так і військове виробництво. Фабрики працюють із метою, оснащуючи наші легіони та збільшуючи загальний випуск продукції нації."

LSA_treatywithcanadians:0 "Договір із Канатою"
LSA_treatywithcanadians_desc:0 "Формалізація дипломатичного договору з Канатою зміцнює наш північний кордон та встановлює рамки для взаємної підтримки у торгівлі та обороні."

LSA_alliancewithcanadians:0 "Союз із Канатою"
LSA_alliancewithcanadians_desc:0 "Поглиблюючи нашу співпрацю, ми формуємо військовий союз із Канатою, забезпечуючи взаємну оборону та спільну відданість регіональній стабільності."

LSA_pursuethegoalofunification:0 "Прагнути Мети Об'єднання"
LSA_pursuethegoalofunification_desc:0 "Легіонерські Штати Америки повинні об'єднати фрагментовані території наших предків. Стратегічні, політичні та військові заходи тривають для відновлення законної величі нашої нації."

LSA_revitalisedlegions:0 "Відроджені Легіони"
LSA_revitalisedlegions_desc:0 "Наші громадяни-солдати реорганізовані та відновлені, приймаючи сучасну тактику, водночас шануючи стародавню Римську дисципліну. Оновлена армія готова забезпечити волю Республіки."

LSA_atrueromanarmy:0 "Справжня Римська Армія"
LSA_atrueromanarmy_desc:0 "Перетворюючи наші легіони на професійну, дисципліновану та висококваліфіковану силу, ми готуємо їх до великомасштабних конфліктів, які возз'єднають нашу розділену націю."

LSA_assertnewenglandclaims:0 "Заявити Претензії на Нову Англію"
LSA_assertnewenglandclaims_desc:0 "Формально заявляючи про наші претензії на території Нової Англії, ми провокуємо напругу з місцевою владою. Загрози зростають, але зростає й легітимність наших зусиль з об'єднання."

LSA_encroachontheborder:0 "Зазіхати на Кордон"
LSA_encroachontheborder_desc:0 "Прикордонні вторгнення демонструють нашу рішучість та тиснуть на Нову Англію. Дипломатичні тертя загострюються, і підготовка до потенційного військового протистояння є необхідною."

LSA_pressuretheexiles:0 "Чинити Тиск на Вигнанців"
LSA_pressuretheexiles_desc:0 "Легіон Вигнанців має визнати владу Легіонерських Штатів. Застосування політичного тиску та повернення спірних земель зміцнює наші позиції на північних та західних територіях."

LSA_secureborderwiththerepublicans:0 "Забезпечити Кордон із Республіканцями"
LSA_secureborderwiththerepublicans_desc:0 "Завдяки обмеженим військовим діям та стратегічним операціям ми забезпечуємо наші кордони проти Техаських Республіканських сил, гарантуючи стабільність та безпеку наших легіонів, що наступають."

LSA_eastromansupport:0 "Східноримська Підтримка"
LSA_eastromansupport_desc:0 "Звертаючись по підтримку до наших братів у Константинополі, ми можемо очікувати об'єднання цього континенту під Римським прапором."

LSA_inviteeastromanvolunteers:0 "Запросити Східноримських Добровольців"
LSA_inviteeastromanvolunteers_desc:0 "Закликати Східноримських добровольців для поповнення наших лав, збільшуючи живу силу та залучаючи досвідчених воїнів для підкріплення військових кампаній Легіонерських Штатів."

LSA_martialcitizenship:0 "Військове Громадянство"
LSA_martialcitizenship_desc:0 "Надання громадянства тим, хто служить у легіонах, зміцнює лояльність, моральний дух та національну ідентичність. Войовничі чесноти визнаються шляхом до повних громадянських прав."

LSA_eternalvigilance:0 "Вічна Пильність"
LSA_eternalvigilance_desc:0 "Наші громадяни повинні завжди бути пильними, забезпечуючи швидке виявлення та нейтралізацію як внутрішніх, так і зовнішніх загроз. Безпека Республіки є першочерговою."

LSA_onelegiononenation:0 "Один Легіон, Одна Нація"
LSA_onelegiononenation_desc:0 "Оголошено заклик до зброї. Легіонери виступають, щоб об'єднати розколоту націю під єдиним прапором. Починається Війна за Об'єднання Америки, вимагаючи мужності та жертовності від кожного громадянина."

LSA_seizeforeignwealth:0 "Захопити Іноземне Багатство"
LSA_seizeforeignwealth_desc:0 "Конфіскація активів, що належать іноземцям, зміцнює наш військовий скарб, дозволяючи проводити військові кампанії та консолідувати контроль над ключовими економічними ресурсами."

LSA_victoriapopuliromani:0 "Victoria Populi Romani (Перемога Римського Народу)"
LSA_victoriapopuliromani_desc:0 "Після успішного об'єднання наших земель святкується тріумф Римського Народу. Процвітання, безпека та військова перевага визначають цю еру."

LSA_bringthehawaiwansintothefold:0 "Залучити Гавайців до Справи"
LSA_bringthehawaiwansintothefold_desc:0 "За допомогою дипломатії та стимулів ми запрошуємо Гаваї приєднатися до нашої держави, зміцнюючи наше морське охоплення та посилюючи нашу присутність у Тихому океані."

LSA_claimsinnewspain:0 "Претензії в Новій Іспанії"
LSA_claimsinnewspain_desc:0 "Південні території є частиною нашого доленосного призначення. Заява про претензії на Нову Іспанію встановлює нашу легітимність та стратегічну перевагу в регіоні."

LSA_takebackourland:0 "Повернути Нашу Землю"
LSA_takebackourland_desc:0 "Розпочинаються військові операції з повернення Каліфорнії, забезпечуючи відновлення історичних земель нашої нації під владою Держави."

LSA_integratecalifornia:0 "Інтегрувати Каліфорнію"
LSA_integratecalifornia_desc:0 "Каліфорнія вводиться до складу Республіки як повністю інтегрований штат, забезпечуючи її населення, ресурси та промисловий потенціал на благо Легіонерських Штатів."

LSA_befriendthenewspanish:0 "Подружитися з Новими Іспанцями"
LSA_befriendthenewspanish_desc:0 "Налагодження співпраці з Новоіспанськими фракціями зміцнює союзи та відкриває шляхи для торгівлі, розвідки та військової співпраці."

LSA_theamericanpact:0 "Американський Пакт"
LSA_theamericanpact_desc:0 "Завдяки обережній дипломатії, формується формальний союз із Канатою та дружніми Новоіспанськими державами — 'Американський Пакт', що гарантує взаємну оборону та єдине управління в західній півкулі."

LSA_bringthesouthernmarchestoheel:0 "Привести Південні Марки до Покори"
LSA_bringthesouthernmarchestoheel_desc:0 "Військові кампанії в південних марках мають на меті підкорити опозицію, що залишилася. Швидкі та рішучі дії гарантують беззаперечність авторитету Республіки."

LSA_striketheinteriorsettlements:0 "Ударити по Внутрішнім Поселенням"
LSA_striketheinteriorsettlements_desc:0 "Сили Легіону проникають глибоко у внутрішні території, щоб ліквідувати опір та забезпечити життєво важливі поселення, утверджуючи домінування по всьому серцю нації."

LSA_thedesseretquestion:0 "Питання Дессерету"
LSA_thedesseretquestion_desc:0 "Переговори та обмежені військові дії вирішують питання Дессерету, інтегруючи регіон під управління Держави та забезпечуючи лояльність його населення."

LSA_subjugatetheteutoniccolony:0 "Підкорити Тевтонську Колонію"
LSA_subjugatetheteutoniccolony_desc:0 "Тевтонський анклав повинен підкоритися владі Легіонерських Штатів. Стратегічні операції забезпечують швидке включення або нейтралізацію колонії."

LSA_securegreenland:0 "Забезпечити Гренландію"
LSA_securegreenland_desc:0 "Експедиції до Гренландії гарантують контроль над північними територіями та життєво важливими ресурсами, зміцнюючи стратегічні позиції Республіки."

LSA_conquercascadia:0 "Завоювати Каскадію"
LSA_conquercascadia_desc:0 "Каскадія чинить опір нашій владі. Розпочато військові кампанії для встановлення контролю, інтегруючи регіон до Легіонерських Штатів Америки."

LSA_thefutureofnewrome:0 "Майбутнє Нового Риму"
LSA_thefutureofnewrome_desc:0 "З завершенням об'єднання, Легіонерські Штати Америки постають як домінуюча сила. Усі території потрапляють під центральну владу, забезпечуючи тривалий мир та процвітання."

---

## Реформи Армії, Бронетехніка та Спецпідрозділи

```yml
LSA_uplift_the_legions:0 "Піднести Легіони"
LSA_uplift_the_legions_desc:0 "Відновлена армія вимагає модернізації. Нові доктрини, покращена підготовка та організовані командні структури зміцнять основу нашої Республіки."

LSA_thelegionsofamerica:0 "Легіони Америки"
LSA_thelegionsofamerica_desc:0 "Наші громадяни-солдати організовані у грізні легіони, готові втілювати волю Республіки по всьому континенту. Покращено моральний дух, дисципліна та підтримка війни."

LSA_roman_special_forces:0 "Римські Спеціальні Сили"
LSA_roman_special_forces_desc:0 "Елітні підрозділи навчаються передовій тактиці, включаючи повітряно-десантні, гірські та розвідувальні операції. Ці сили забезпечують гнучкість та точність на полі бою."

LSA_transform_the_equites:0 "Трансформувати Еквітів"
LSA_transform_the_equites_desc:0 "Кавалерійські підрозділи механізуються та модернізуються, поєднуючи традиційну мобільність із механізованою вогневою міццю. Витрати на доктрину знижуються, прискорюючи стратегічне прийняття."

LSA_motorised_equites:0 "Моторизовані Еквіти"
LSA_motorised_equites_desc:0 "Кавалерія тепер повністю моторизована, здатна до швидкого розгортання на всіх театрах. Мобільність та ефективність механізованих підрозділів значно покращуються."

LSA_miles_caduci:0 "Miles Caduci (Падаючі Солдати)"
LSA_miles_caduci_desc:0 "Елітні парашутисти та повітряно-десантні сили формують 'Miles Caduci', поєднуючи Римську військову традицію з сучасними повітряно-десантними можливостями для швидкого проєктування сили."

LSA_aromanarmy:0 "Римська Армія"
LSA_aromanarmy_desc:0 "Наші сухопутні сили реорганізовані у злагоджену Римську Армію, здатну до тривалих операцій та стратегічної гнучкості на багатьох театрах."

LSA_women_serve_in_the_legions:0 "Жінки Служать у Легіонах"
LSA_women_serve_in_the_legions_desc:0 "Жінки офіційно інтегровані в допоміжні та бойові ролі в легіонах, розширюючи живу силу та посилюючи оперативну спроможність."

LSA_artillery_of_legions:0 "Артилерія Легіонів"
LSA_artillery_of_legions_desc:0 "Важка артилерія та допоміжна зброя модернізуються та інтегруються в легіони, підвищуючи вогневу міць на полі бою та оперативну ефективність."

LSA_a_new_type_of_warfare:0 "Новий Тип Ведення Війни"
LSA_a_new_type_of_warfare_desc:0 "Інноваційні тактики та доктрини революціонізують поле бою, посилюючи артилерійські та допоміжні операції, щоб перевершити будь-якого супротивника."

LSA_tank_experiments:0 "Танкові Експерименти"
LSA_tank_experiments_desc:0 "Експериментальні броньовані машини розгортаються для тестування нових стратегій. Успіхи тут вплинуть на майбутню бронетанкову доктрину та виробництво."

LSA_tank_destroyers:0 "Винищувачі Танків"
LSA_tank_destroyers_desc:0 "Розробляються спеціалізовані машини для ефективної протидії ворожій бронетехніці. Ці винищувачі посилюють наш механізований корпус та оборонні можливості."

LSA_main_battle_tanks:0 "Основні Бойові Танки"
LSA_main_battle_tanks_desc:0 "Наші бронетанкові дивізії посилюються основними бойовими танками, поєднуючи вогневу міць, захист та мобільність для рішучих проривів."

LSA_armoured_legions:0 "Бронетанкові Легіони"
LSA_armoured_legions_desc:0 "Легіони тепер виставляють повністю механізовані бронетанкові формування, інтегруючи танки та моторизовану піхоту в згуртовану та потужну ударну силу."

---

## Повітряні та Морські Сили

```yml
LSA_legions_of_air:0 "Легіони Повітря"
LSA_legions_of_air_desc:0 "Небеса належать Легіонерським Штатам. Інвестуючи в повітряну міць, ми створюємо основу для переваги в повітрі, забезпечуючи підготовку та сучасне обладнання для наших пілотів. Ця ініціатива зміцнює наші доктрини та готує наші сили до майбутніх конфліктів над хмарами."

LSA_fighter_development:0 "Розвиток Винищувачів"
LSA_fighter_development_desc:0 "Ми надаємо пріоритет проєктуванню та виробництву передових винищувачів. З передовими винищувачами ми можемо кинути виклик будь-якому ворогу в повітряному бою, забезпечуючи наш контроль над небом та захист наших наземних сил."

LSA_strat_bombing:0 "Доктрина Стратегічного Бомбардування"
LSA_strat_bombing_desc:0 "Зосереджуючись на стратегічному бомбардуванні, ми прагнемо порушити інфраструктуру та промисловість ворога з повітря. Ця доктрина спрямована на ослаблення наших супротивників до того, як вони досягнуть наших кордонів, дозволяючи нашим наземним силам наступати з мінімальним опором."

LSA_flexible_bombers:0 "Гнучкі Бомбардувальні Сили"
LSA_flexible_bombers_desc:0 "Наші бомбардувальні підрозділи мають бути універсальними та адаптованими. Гнучкі бомбардувальники можуть завдавати ударів по широкому спектру цілей, від передових позицій до глибоких стратегічних об'єктів, максимізуючи ефект наших повітряних кампаній."

LSA_CAS:0 "Безпосередня Авіаційна Підтримка"
LSA_CAS_desc:0 "Надаючи безпосередню авіаційну підтримку нашим військам, ми підвищуємо ефективність на полі бою та координацію між повітряними та наземними силами. Добре навчені підрозділи БАП можуть переломити хід битви, атакуючи ворожі формування та укріплення."

LSA_combined_bombing:0 "Комбіновані Бомбардувальні Операції"
LSA_combined_bombing_desc:0 "Завдяки скоординованим бомбардувальним кампаніям з нашими союзниками, ми посилюємо наш вплив на полі бою. Ці комбіновані операції демонструють нашу здатність домінувати в повітрі та підтримувати коаліційні зусилля під час війни."

LSA_escort_fighters:0 "Винищувачі Супроводу"
LSA_escort_fighters_desc:0 "Винищувачі супроводу захищають наші бомбардувальники під час їхніх місій, забезпечуючи доставку їхніх боєприпасів до намічених цілей. Належним чином оснащені та скоординовані, ці підрозділи зберігають нашу перевагу в повітрі та зменшують втрати бомбардувальників."

LSA_legions_rule_the_air:0 "Легіони Панують у Повітрі"
LSA_legions_rule_the_air_desc:0 "Наші повітряні сили тепер домінують у небі. Завдяки чудовій тактиці, літакам та підготовці, Легіонерські Штати можуть проєктувати силу по всьому світу, забезпечуючи швидку та рішучу відповідь на будь-яку ворожу повітряну атаку."

LSA_masters_of_the_air:0 "Майстри Повітря"
LSA_masters_of_the_air_desc:0 "Удосконалюючи повітряну стратегію та технології, ми закріплюємо свою позицію як майстрів повітря. Цей фокус забезпечує покоління пілотів та доктрин, здатних формувати результат майбутніх воєн."

LSA_the_legionary_navy:0 "Легіонерський Флот"
LSA_the_legionary_navy_desc:0 "Наші військово-морські сили розширюються та модернізуються, створюючи флот, здатний захищати наші береги та проєктувати силу за кордон. Нові верфі та інфраструктура забезпечують швидке будівництво та розгортання передових кораблів."

LSA_maritime_comission:0 "Морська Комісія"
LSA_maritime_comission_desc:0 "Морська Комісія координує військово-морські дослідження та промислову потужність, покращуючи проєктування кораблів та ефективність виробництва. Ця організація забезпечує, що наш флот може реагувати на загрози з точністю та силою."

LSA_ships_of_the_legion:0 "Кораблі Легіону"
LSA_ships_of_the_legion_desc:0 "Цілеспрямовані зусилля з розширення нашого флоту сучасними кораблями, здатними до амфібійних штурмів та панування в океані. Легіонерський Флот тепер має інструменти для проєктування сили по всіх океанах."

LSA_naval_department:0 "Військово-морський Департамент"
LSA_naval_department_desc:0 "Створення централізованого Військово-морського Департаменту оптимізує командування та операції, підвищуючи ефективність у суднобудуванні, розгортанні флоту та морській стратегії."

LSA_battleships:0 "Програма Лінкорів"
LSA_battleships_desc:0 "Зосереджуючись на лінкорах, ми створюємо флот, здатний кинути виклик будь-якому флоту в прямому бою. Важко озброєні та броньовані, ці кораблі є основою нашої морської могутності."

LSA_strike_doctrine:0 "Доктрина Морського Удару"
LSA_strike_doctrine_desc:0 "Наша військово-морська стратегія наголошує на точності ударів та концентрованій вогневій міці. Ця доктрина забезпечує, що наш флот може швидко та рішуче нейтралізувати ворожі судна."

LSA_forward_operating:0 "Передові Оперативні Бази"
LSA_forward_operating_desc:0 "Стратегічно розташовані військово-морські бази розширюють наше оперативне охоплення, дозволяючи тривалі операції на віддалених театрах та кращу підтримку руху флоту."

LSA_carriers_of_war:0 "Носії Війни"
LSA_carriers_of_war_desc:0 "Авіаносці стають наріжним каменем нашого флоту, дозволяючи мобільне проєктування повітряної міці та рішуче залуження до бою з ворожими силами на морі."

LSA_aeronautic_support:0 "Аеронавігаційна Підтримка"
LSA_aeronautic_support_desc:0 "Інтегрована військово-морська авіація забезпечує розвідку та бомбардувальну підтримку нашому флоту, посилюючи як наступальні, так і оборонні операції."

LSA_naval_radar:0 "Розробка Морського Радару"
LSA_naval_radar_desc:0 "Радіолокаційні технології дають нашому флоту перевагу у виявленні та координації. Кораблі та літаки, оснащені радаром, можуть ефективно діяти за будь-яких умов, забезпечуючи перевагу в морських боях."

LSA_escort_focus:0 "Фокус на Супроводі Конвоїв"
LSA_escort_focus_desc:0 "Захист наших торговельних та військових конвоїв є надзвичайно важливим. Судна супроводу забезпечують безпечний прохід критично важливих запасів через спірні води, зменшуючи втрати від ворожих підводних човнів та рейдерів."

LSA_convoy_tactics:0 "Тактика Захисту Конвоїв"
LSA_convoy_tactics_desc:0 "Спеціалізована тактика покращує захист морських шляхів, дозволяючи нашому флоту захищати життєво важливі лінії постачання та підтримувати оперативну готовність."

LSA_submarines:0 "Програма Підводних Човнів"
LSA_submarines_desc:0 "Підводні човни посилюють нашу здатність зривати вороже судноплавство та забезпечувати блокування моря. Непомітність та точні атаки дозволяють нашим силам послаблювати супротивників економічно та військово."

LSA_unrestricted_sub_warfare:0 "Необмежена Підводна Війна"
LSA_unrestricted_sub_warfare_desc:0 "Застосовуючи необмежену підводну війну, наш флот може перешкоджати ворожій торгівлі, кришити ланцюги постачання та чинити стратегічний тиск на супротивників."

LSA_fund_the_navy:0 "Фінансувати Флот"
LSA_fund_the_navy_desc:0 "Збільшені інвестиції в наші військово-морські сили зміцнюють суднобудування, технології та готовність флоту, забезпечуючи панування на морі та готовність до конфлікту."

LSA_form_the_LSMC:0 "Сформувати Корпус Морської Піхоти Легіону"
LSA_form_the_LSMC_desc:0 "Створюється Корпус Морської Піхоти Легіону, що поєднує елітну піхоту та амфібійні можливості. Ця спеціалізована сила може проводити операції швидкого розгортання та захоплювати ключові об'єкти в прибережних регіонах."

LSA_amphibious_ops:0 "Амфібійні Операції"
LSA_amphibious_ops_desc:0 "Спеціалізовані амфібійні операції посилюють нашу здатність проєктувати силу на ворожі береги. Морські піхотинці, навчені для таких місій, забезпечують, що сили Легіону залишаються універсальними та смертоносними на всіх театрах."

LSA_caesarofnewrome:0 "Цезар Нової Роми"
LSA_caesarofnewrome_desc:0 "З наближенням кінця Війни за Об'єднання Америки, Джордж Маршалл тепер проголошує себе 'Цезарем Нової Роми', підкреслюючи свою владу та домінування над Новим Світом."

LSA_nationalreconciliation:0 "Національне Примирення"
LSA_nationalreconciliation_desc:0 "Подолаючи розколи серед нашого громадянства, ми працюємо над зціленням внутрішніх чвар та просуванням почуття спільної мети в усіх регіонах Легіонерських Штатів."

LSA_citizenandsoldier:0 "Громадянин та Солдат"
LSA_citizenandsoldier_desc:0 "Заохочення громадян до військової служби сприяє лояльності та готовності, поєднуючи громадянський обов'язок із національною обороною."

LSA_eaglestandards:0 "Орлині Стандарти"
LSA_eaglestandards_desc:0 "Наші військові та цивільні інститути об'єднуються під спільними символами та стандартами, сприяючи дисципліні, гордості та скоординованим національним зусиллям."

LSA_totheaidofrome:0 "На Допомогу Риму"
LSA_totheaidofrome_desc:0 "Ми простягаємо руку союзним державам, пропонуючи нашу військову міць та стратегічну підтримку для забезпечення спільних інтересів та зміцнення позиції Нової Роми у світі."

LSA_securethealtanticlifelines:0 "Забезпечити Атлантичні Життєві Лінії"
LSA_securethealtanticlifelines_desc:0 "Контроль над життєво важливими Атлантичними морськими шляхами забезпечує рух військ та ресурсів, підтримуючи стратегічне домінування над трансатлантичними лініями постачання."

LSA_theeaglesreturntoeurope:0 "Орли Повертаються до Європи"
LSA_theeaglesreturntoeurope_desc:0 "Сили Легіонерських Штатів передислоковуються до Європи, утверджуючи вплив та захищаючи наші інтереси, водночас проєктуючи владу по всьому континенту."

LSA_legionsontherhine:0 "Легіони на Рейні"
LSA_legionsontherhine_desc:0 "Наші сили встановлюють міцну присутність уздовж Рейну, забезпечуючи стратегічні позиції та готуючись до подальших операцій для відновлення порядку та впливу."

LSA_aromanworldrestored:0 "Відновлений Римський Світ"
LSA_aromanworldrestored_desc:0 "Завдяки обережній дипломатії та рішучим діям, ми відроджуємо світ, натхненний Римськими принципами, приносячи стабільність, процвітання та славу Нової Роми до Європи та за її межі."

LSA_establishthelegiondenari:0 "Створити Легіонерський Денарій"
LSA_establishthelegiondenari_desc:0 "Стабільна валюта зміцнює нашу економіку та забезпечує стійке промислове зростання. Легіонерський Денарій стає основою нашої національної фінансової системи."

LSA_agriculturaladjustments:0 "Сільськогосподарські Коригування"
LSA_agriculturaladjustments_desc:0 "Ми реформуємо сільськогосподарські практики, щоб збалансувати ефективність та випуск продукції, забезпечуючи здатність нації підтримувати своє населення та армію без економічної нестабільності."

LSA_workersunions:0 "Профспілки Робітників"
LSA_workersunions_desc:0 "Інтеграція профспілок в економічне планування сприяє стабільності, покращує продуктивність та узгоджує інтереси робочої сили з національними цілями."

LSA_civiliansciencyacademy:0 "Цивільна Наукова Академія"
LSA_civiliansciencyacademy_desc:0 "Розширення науково-дослідних установ сприяє інноваціям у промисловості та військових технологіях, створюючи кваліфіковану робочу силу, здатну просувати національні інтереси."

LSA_legionrubberindustry:0 "Легіонерська Гумова Промисловість"
LSA_legionrubberindustry_desc:0 "Розвиток виробництва та переробки гуми забезпечує нашим збройним силам та промисловим секторам доступ до критично важливих матеріалів для транспортних засобів, літаків та зброї."

LSA_militaryconstructioneffort:0 "Військове Будівельне Зусилля"
LSA_militaryconstructioneffort_desc:0 "Цілеспрямована ініціатива щодо швидкого розширення військової інфраструктури, від заводів до транспортних мереж, що дозволяє великомасштабне виробництво та розгортання збройних сил."

LSA_wartimeproduction:0 "Виробництво Воєнного Часу"
LSA_wartimeproduction_desc:0 "Максимізація промислового випуску підтримує наші військові кампанії. Заводи та ланцюги постачання оптимізовані для ефективного виробництва воєнного часу."

LSA_centralisedplanning:0 "Централізоване Планування"
LSA_centralisedplanning_desc:0 "Оптимізоване економічне та промислове планування забезпечує ефективне розподілення ресурсів для задоволення національних та військових потреб."

LSA_projecty:0 "Проєкт Y"
LSA_projecty_desc:0 "Цілком секретна дослідницька ініціатива, спрямована на використання ядерної енергії для національної оборони. Успіх може забезпечити неперевершені стратегічні переваги над глобальними суперниками."
