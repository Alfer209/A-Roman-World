l_english:
FARW_farw_event.1.t:0 "The French Civil-War!"
FARW_farw_event.1.d:0 "Francia Has Fallen!\nEarlier this morning several separatist groups have declared their independence from Francia. All sides have agreed to a 30-day ceasefire to prepare their militias and let their citizens prepare for this massive conflict which will change the fate of Francia forever"
FARW_farw_event.1.a:0 "We Must Stop This Insurrection!"
FARW_farw_event.1.b:0 "Vive La Revolution!"
FARW_farw_event.2.t:0 "The Revolutionaries"
FARW_farw_event.2.desc:0 "Francia is split into five new factions, we will have to choose one to support and fight with until our righteous victory. Who will we fight for?"
FARW_farw_event.2.a:0 "The Commune!"
FARW_farw_event.2.b:0 "The Republic!"
FARW_farw_event.2.c:0 "The Legions!"
FARW_farw_event.2.d:0 "The Empire!"
FARW_farw_event.3.t:0 "The Collapse Of Francia!"
FARW_farw_event.3.d:0 "Earlier today Francia has announced its collapse as four factions have risen up to fight for total dominance of Francia. The remaining members of the French government now reside in Paris planning an attack against the revolutionaries. The future of Francia is undecided"
FARW_farw_event.3.a:0 "Worrying"
FARW_farw_event.4.t:0 "The End Of The Ceasefire"
FARW_farw_event.4.d:0 "The 30-Day ceasefire has ended, our enemies are already moving towards our frontlines, our divisions are ready for the war, we need to act now to secure Francia from the tyrants. "
FARW_farw_event.4.a:0 "Attack!"
FARW_farw_event.5.t:0 "Brutal Police Clashes!"
FARW_farw_event.5.d:0 "Earlier this morning rioters took the streets across Britany throwing bricks at police and lighting fires in a demonstration of strength by the French commune front. This has lead to other groups notably the French Legion Front and the Bonaparte house starting demonstrations of their own... If only we had searched for high risk areas"
FARW_farw_event.5.a:0 "FUCK"
FARW_farw_event.5.b:0 "The Unthinkable Option.."
