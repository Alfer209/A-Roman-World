dacia.1.t:0 "Dacia in 1936"
dacia.1.d:0 "After we failed to regain our rightful land of Apulia and our beloved rightful true capital, Sarmizegeduza Regia, our nation was plunged into chaos. While the king still managed to keep a somewhat control over Dacia, everywhere there are left wing revolutionaries, right wing esoterics and centrist fanatics. This has followed into the 1921 political crisis, which has been going on since then, and with the recent escape of Codran, leader of the FRP (Frunt Revitir Polidivin), the political landscape worsens even more. Now the king’s advisors gathered to the strategic table 2 decisions: reform the monarchy or cleanse the political landscape. Reforming the monarchy can deal a serious blow to the extremists such as Codran and Dejis (Dejis being the leader of the communist party), and possibly install a democracy like we see in Russia. Or try to not care about anyone’s opinion and imprison purge and exile them all"
dacia.1.a:0 "OK."

