 britannia.1.t:0 "The Death of Governor Allenby"
 britannia.1.d:0 "PLACEHOLDER - TODO"
 britannia.1.a:0 "Londinium will appoint a replacement"
 britannia.2.t:0 "A New Governor in the East Indies"
 britannia.2.d:0 "Following the death of General Allenby, the governor of the East Indies, we must now select a replacement.\n\nGovernorship of the East Indies is not a luxurious nor particularly rewarding task. Allenby himself was only sent there after he began to challenge Kitchener's dominance as Consul. That being said, as Brittannia's largest overseas colony, there is generally a lot of prestige in the role and the newspapers always like to make a big song and dance about it.\n\nThere are three obvious choices.\n\nBernard Montgomery is a charismatic and popular general, and his affiliation with the Landed Britannia League is no secret. He's a strong campaigner for them, and losing his support won't even be worth the headlines it will make. Sending him to Indonesia would be a blow to our coalition partner.\n\nClaude Auchinleck is considered a bit of a man of the people. His soldiers speak very highly of him and he is very personable. He also started his career working in the East Indies, so this won't come across as just another politically motivated appointment.\n\nArchie Wavell is the pick of the Consul's Office. A staunch loyalist to Kitchener, putting him in charge of Indonesia would curtail the previous independence of the East Indian defence forces and render them back under Kitchener's grasp."
 britannia.2.a:0 "I hope Monty likes the Jungle"
 britannia.2.b:0 "Auchinleck is the natural choice"
 britannia.2.c:0 "Wavell can bring them back in line"