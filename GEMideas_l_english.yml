l_english:
bureaucraticrestraints:0 "Bureaucratic Restraints"
bureaucraticrestraints_desc:0 "Complex bureacracy slows every decision. Military mobilisation and industrial expansion are hindered, and reforms take longer to enact. While orderly and stable, the Empire moves with deliberate caution."

theteutonicsenate:0 "The Teutonic Senate"
theteutonicsenate_desc:0 "A model of efficiency borrowed from foreign traditions, the Teutonic Senate proves to be a thorn to the structure of the Empire. Senators constantly bicker and argue on useless matters, slowing and halting any considerable progress in the nation."
 
fruits_of_japan:0 "Fruits of Japan"
fruits_of_japan_desc:0 "In the aftermath of the §YFirst Concession War§!, the §YTreaty of Nagasaki§! forced Japan to surrender a chain of §Yconcession cities§! to the victorious coalition of §GEast Rome, West Rome, the Teutonic Empire, Great Britain, Russia, and Ming§!. These enclaves stand not only as monuments to Japan’s humiliation, but as lucrative gateways for trade, profit, and influence in the East."

militarisedclergy:0 "Militarised Clergy"
militarisedclergy_desc:0 "The clergy have been drawn into military affairs, preaching loyalty to the state and encouraging enlistment. While this boosts manpower, it undermines independent thought and drains political influence."

senatorialretirement:0 "Senatorial Retirement"
senatorialretirement_desc:0 "Older senators are encouraged—or forced—into retirement, temporarily calming tensions within the Senate. Yet, this weakens political authority and erodes public stability."

senatorialpurge:0 "Senatorial Purge"
senatorialpurge_desc:0 "A purge of troublesome senators consolidates power in the hands of the executive. Though unpopular and destabilising, it strengthens the regime’s grip and raises morale among the loyal."

dissidentsexecuted:0 "Dissidents Executed"
dissidentsexecuted_desc:0 "Enemies of the regime are executed publicly as an example to others. Fear strengthens control, but the heavy-handedness severely undermines social stability."

dissidentstrialed:0 "Dissidents Put on Trial"
dissidentstrialed_desc:0 "Rather than execution, dissidents are publicly tried, showing a veneer of justice. While this gains some legitimacy, it also exposes political weaknesses and drains authority."

dissidentsexiled:0 "Dissidents Exiled"
dissidentsexiled_desc:0 "Dissidents are banished from the homeland, allowing the government to maintain stability while avoiding the optics of mass killings. Yet, exiles often become rallying points abroad."

preparingforwar:0 "Preparing for War"
preparingforwar_desc:0 "The economy is shifted toward war readiness. Factories hum with production, shipyards are busy, and the nation steels itself for the coming storms."

preparingformountainwarfare:0 "Preparing for Mountain Warfare"
preparingformountainwarfare_desc:0 "Training and logistics are adjusted for combat in harsh alpine terrain. Troops gain specialist skills for mountain assaults, making them far more resilient in rugged battlefields."

antiromandoctrine:0 "Anti-Roman Doctrine"
antiromandoctrine_desc:0 "Doctrine and training are tailored specifically to fight the Western Romans. Every soldier is taught how to resist their tactics and strike at their weaknesses."

WAI_antiroman:0 "Anti-Roman Doctrine"
WAI_antiroman_desc:0 "Doctrine and training are tailored specifically to fight the Eastern Romans. Every soldier is taught how to resist their tactics and strike at their weaknesses."

winbyair:0 "Victory Through Airpower"
winbyair_desc:0 "The future of war lies in the skies. By investing heavily in fighters, bombers, and close air support, the nation ensures dominance in the air will decide battles on the ground."

womenarmyscorpsp:0 "Women's Army Corps"
womenarmyscorpsp_desc:0 "Women are mobilised into military and industrial roles, boosting manpower and national output. Though controversial, this greatly expands the war effort."

legacyof1901:0 "Legacy of 1901"
legacyof1901_desc:0 "The bitter lessons of the 1901 conflict remain etched into the nation’s memory. Defensive fortifications, naval reforms, and a deep-rooted hostility toward the Japanese shape modern policy."

eyesandeareverywhere:0 "Eyes and Ears Everywhere"
eyesandeareverywhere_desc:0 "A vast intelligence network spreads across the nation. Operatives watch every corner, rooting out dissent and ensuring no enemy agent escapes notice."

reformedbureaucracy:0 "Reformed Bureaucracy"
reformedbureaucracy_desc:0 "The administrative system has been cleaned and streamlined. Corruption fades, efficiency rises, and the nation can finally modernise effectively."

gfemabsoluteimperialcontrol:0 "Absolute Imperial Control"
gfemabsoluteimperialcontrol_desc:0 "All authority rests in the emperor’s hands. Freed from senatorial oversight, the empire commands with unmatched efficiency and unity."

reforming:0 "National Reforms"
reforming_desc:0 "The state is in the midst of deep reforms, modernising its institutions and army. Progress is slow and costly, but promises stability in the long run."

reforming2:0 "National Reforms"
reforming2_desc:0 "The state is in the midst of deep reforms, modernising its institutions and army. Progress is slow and costly, but promises stability in the long run."

suppressedsenators:0 "Senators Suppressed"
suppressedsenators_desc:0 "The voices of dissent in the Senate have been crushed. Though political unity is gained, stability suffers as democratic legitimacy erodes."

senatorialnegotiations:0 "Senatorial Negotiations"
senatorialnegotiations_desc:0 "Fragile compromises are struck with the Senate. This slows political power but helps defend the regime from ideological subversion."

senateoutrage:0 "Senate Outrage"
senateoutrage_desc:0 "The Senate is outraged by recent decisions, destabilising the nation and hampering the government’s authority even as war fervor quietly rises."

teutoniclegacy:0 "Teutonic Legacy"
teutoniclegacy_desc:0 "The old martial traditions of the Teutons still inspire modern soldiers. Discipline and aggression in battle are seen as the true path to victory."

expandedacademy:0 "Expanded Military Academy"
expandedacademy_desc:0 "Military education is reformed and expanded, producing more officers and ensuring the army has a steady stream of capable recruits."

afrikacorps:0 "Afrika Korps"
afrikacorps_desc:0 "Experience from desert warfare is institutionalised. Soldiers adapt to hot climates with improved organisation and survivability in harsh terrain."

lawofreichstag:0 "Law of the Reichstag"
lawofreichstag_desc:0 "A new law strengthens central authority, ensuring stability and war support. Political influence grows as the Reichstag is brought into line."

concentratedarmamentproduction:0 "Concentrated Armament Production"
concentratedarmamentproduction_desc:0 "Production is centralised in large industrial centres, boosting efficiency and output of war materials."

concentratedarmamentproduction2:0 "Concentrated Armament Production"
concentratedarmamentproduction2_desc:0 "Production is centralised in large industrial centres, boosting efficiency and output of war materials."

concentratedarmamentproduction3:0 "Concentrated Armament Production"
concentratedarmamentproduction3_desc:0 "Production is centralised in large industrial centres, boosting efficiency and output of war materials."

concentratedarmamentproduction4:0 "Concentrated Armament Production"
concentratedarmamentproduction4_desc:0 "Production is centralised in large industrial centres, boosting efficiency and output of war materials."

concentratedarmamentproduction5:0 "Concentrated Armament Production"
concentratedarmamentproduction5_desc:0 "Production is centralised in large industrial centres, boosting efficiency and output of war materials."

ulimatumvetoed:0 "Ultimatum Vetoed"
ulimatumvetoed_desc:0 "The senate has vetoed the latest ultimatum, rejecting compromise. This decision damages industry and stability, but preserves independence."

ulimatumaccepted:0 "Ultimatum Accepted"
ulimatumaccepted_desc:0 "The senate has accepted the ultimatum, prioritising peace and survival over national pride. Industry and stability improve under the agreement."

decentralisedarmy:0 "Decentralised Army"
decentralisedarmy_desc:0 "A fractured command structure undermines efficiency. Officers act independently, slowing planning and draining cohesion."

armyloyal1:0 "Army Loyalty"
armyloyal1_desc:0 "The army swears loyalty to the regime, restoring planning speed and morale. Political control over the armed forces grows stronger."

armyloyal2:0 "Army Loyalty"
armyloyal2_desc:0 "The army swears loyalty to the regime, restoring planning speed and morale. Political control over the armed forces grows stronger."

armyloyal3:0 "Army Loyalty"
armyloyal3_desc:0 "The army swears loyalty to the regime, restoring planning speed and morale. Political control over the armed forces grows stronger."

finalblowtoallromans:0 "Final Blow to the Romans"
finalblowtoallromans_desc:0 "The empire prepares for its greatest struggle: a decisive war to end Roman influence once and for all. Every soldier and ship is dedicated to this ultimate campaign."

combinationarms:0 "Combined Arms Doctrine"
combinationarms_desc:0 "The army perfects coordination between infantry, armour, and air support, ensuring maximum efficiency in modern warfare."

altanticnavaldominance:0 "Atlantic Naval Dominance"
altanticnavaldominance_desc:0 "By expanding its fleets and training for large amphibious operations, the empire seeks to dominate the Atlantic and ensure secure supply lines."

shatterlegionaryair:0 "Shatter the Legionary Air Force"
shatterlegionaryair_desc:0 "The air force is restructured to break Roman air superiority, investing in elite aces, detection networks, and tactical mission efficiency."

antilegionary:0 "Anti-Legionary Strategy"
antilegionary_desc:0 "Every doctrine, plan, and weapon is aimed at defeating the Legionary States. The entire army trains specifically for this foe."

GEM_defendthevaterland_ns:0 "Defend the Vaterland"
GEM_defendthevaterland_ns_desc:0 "The homeland is fortified with rapid construction and deep entrenchment. Every resource is directed toward protecting the Vaterland."

GEM_asianfront:0 "The Asian Front"
GEM_asianfront_desc:0 "Resources are shifted eastward to confront the Republic of the Indies. Naval plans and invasion strategies are redrawn to meet this challenge."

TEI_theteutoniceastindies:0 "The Teutonic East Indies"
TEI_theteutoniceastindies_desc:0 "The East Indies are bound tightly to the empire. Factories, resources, and trade are redirected to serve the Teutonic overlords, ensuring dominance overseas."
