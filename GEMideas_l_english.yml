l_english:
bureaucraticrestraints:0 "Бюрократичні Обмеження"
bureaucraticrestraints_desc:0 "Складна бюрократія уповільнює кожне рішення. Військова мобілізація та промислова експансія гальмуються, а впровадження реформ займає більше часу. Хоча Імперія впорядкована та стабільна, вона рухається з навмисною обережністю."

theteutonicsenate:0 "Тевтонський Сенат"
theteutonicsenate_desc:0 "Зразок ефективності, запозичений з іноземних традицій, Тевтонський Сенат виявляється проблемою для структури Імперії. Сенатори постійно сперечаються та сперечаються про марні питання, уповільнюючи та зупиняючи будь-який значний прогрес у нації."

fruits_of_japan:0 "Плоди Японії"
fruits_of_japan_desc:0 "Після §YПершої Концесійної Війни§! §YНагасакський Договір§! змусив Японію передати ланцюг §Yконцесійних міст§! переможній коаліції §GСхідного Риму, Західного Риму, Тевтонської Імперії, Великої Британії, Росії та Мін§!. Ці анклави є не лише пам’ятниками приниження Японії, але й прибутковими воротами для торгівлі, прибутку та впливу на Сході."

militarisedclergy:0 "Мілітаризоване Духовенство"
militarisedclergy_desc:0 "Духовенство залучено до військових справ, проповідуючи лояльність до держави та заохочуючи до вступу в армію. Хоча це збільшує живу силу, це підриває незалежне мислення та виснажує політичний вплив."

senatorialretirement:0 "Відставка Сенаторів"
senatorialretirement_desc:0 "Старших сенаторів заохочують — або змушують — до виходу на пенсію, тимчасово заспокоюючи напругу всередині Сенату. Однак це послаблює політичний авторитет та підриває громадську стабільність."

senatorialpurge:0 "Чистка Сенату"
senatorialpurge_desc:0 "Чистка проблемних сенаторів консолідує владу в руках виконавчої влади. Хоча це непопулярно та дестабілізуюче, це зміцнює хватку режиму та піднімає моральний дух серед лоялістів."

dissidentsexecuted:0 "Дисиденти Страчені"
dissidentsexecuted_desc:0 "Вороги режиму страчуються публічно як приклад для інших. Страх зміцнює контроль, але жорсткість суворо підриває соціальну стабільність."

dissidentstrialed:0 "Дисиденти Віддані Під Суд"
dissidentstrialed_desc:0 "Замість страти, дисиденти публічно судяться, демонструючи видимість справедливості. Хоча це дає певну легітимність, це також викриває політичні слабкості та виснажує авторитет."

dissidentsexiled:0 "Дисиденти Вислані"
dissidentsexiled_desc:0 "Дисиденти виганяються з батьківщини, що дозволяє уряду підтримувати стабільність, уникаючи вигляду масових вбивств. Проте вигнанці часто стають центрами об'єднання за кордоном."

preparingforwar:0 "Готуючись до Війни"
preparingforwar_desc:0 "Економіка переходить на воєнний лад. Заводи гудуть виробництвом, верфі зайняті, і нація готується до прийдешніх штормів."

preparingformountainwarfare:0 "Готуючись до Гірської Війни"
preparingformountainwarfare_desc:0 "Навчання та логістика пристосовуються для бойових дій у суворих альпійських умовах. Війська набувають спеціалізованих навичок для гірських штурмів, роблячи їх набагато стійкішими на пересіченій місцевості."

antiromandoctrine:0 "Антиримська Доктрина"
antiromandoctrine_desc:0 "Доктрина та навчання пристосовані спеціально для боротьби із Західними Римлянами. Кожного солдата вчать, як протистояти їхній тактиці та бити по їхніх слабких місцях."

WAI_antiroman:0 "Антиримська Доктрина"
WAI_antiroman_desc:0 "Доктрина та навчання пристосовані спеціально для боротьби зі Східними Римлянами. Кожного солдата вчать, як протистояти їхній тактиці та бити по їхніх слабких місцях."

winbyair:0 "Перемога Повітрям"
winbyair_desc:0 "Майбутнє війни лежить у небі. Інвестуючи значні кошти у винищувачі, бомбардувальники та безпосередню авіаційну підтримку, нація забезпечує, що домінування в повітрі вирішуватиме битви на землі."

womenarmyscorpsp:0 "Жіночий Армійський Корпус"
womenarmyscorpsp_desc:0 "Жінки мобілізуються на військові та промислові ролі, підвищуючи живу силу та національний вихід. Хоча це суперечливо, це значно розширює військові зусилля."

legacyof1901:0 "Спадщина 1901 року"
legacyof1901_desc:0 "Гіркі уроки конфлікту 1901 року залишаються викарбуваними у пам’яті нації. Оборонні укріплення, військово-морські реформи та глибоко вкорінена ворожість до Японців формують сучасну політику."

eyesandeareverywhere:0 "Очі та Вуха Скрізь"
eyesandeareverywhere_desc:0 "По всій нації розгортається величезна розвідувальна мережа. Оперативники стежать за кожним куточком, викорінюючи інакомислення та забезпечуючи, щоб жоден ворожий агент не уникнув уваги."

reformedbureaucracy:0 "Реформована Бюрократія"
reformedbureaucracy_desc:0 "Адміністративна система очищена та спрощена. Корупція зникає, ефективність зростає, і нація нарешті може ефективно модернізуватися."

gfemabsoluteimperialcontrol:0 "Абсолютний Імперський Контроль"
gfemabsoluteimperialcontrol_desc:0 "Уся влада зосереджена в руках імператора. Звільнена від сенаторського нагляду, імперія керує з неперевершеною ефективністю та єдністю."

reforming:0 "Національні Реформи"
reforming_desc:0 "Держава перебуває в процесі глибоких реформ, модернізуючи свої інститути та армію. Прогрес повільний і коштовний, але обіцяє стабільність у довгостроковій перспективі."

reforming2:0 "Національні Реформи"
reforming2_desc:0 "Держава перебуває в процесі глибоких реформ, модернізуючи свої інститути та армію. Прогрес повільний і коштовний, але обіцяє стабільність у довгостроковій перспективі."

suppressedsenators:0 "Придушені Сенатори"
suppressedsenators_desc:0 "Голоси незгоди в Сенаті були придушені. Хоча політична єдність здобута, стабільність страждає, оскільки демократична легітимність підривається."

senatorialnegotiations:0 "Сенаторські Переговори"
senatorialnegotiations_desc:0 "Укладено крихкі компроміси з Сенатом. Це уповільнює політичну владу, але допомагає захистити режим від ідеологічної диверсії."

senateoutrage:0 "Обурення Сенату"
senateoutrage_desc:0 "Сенат обурений недавніми рішеннями, дестабілізуючи націю та перешкоджаючи авторитету уряду, навіть коли воєнний запал тихо зростає."

teutoniclegacy:0 "Тевтонська Спадщина"
teutoniclegacy_desc:0 "Старі військові традиції Тевтонів все ще надихають сучасних солдатів. Дисципліна та агресія в бою розглядаються як справжній шлях до перемоги."

expandedacademy:0 "Розширена Військова Академія"
expandedacademy_desc:0 "Військова освіта реформована та розширена, що дозволяє готувати більше офіцерів та забезпечує армію постійним потоком здібних новобранців."

afrikacorps:0 "Африканський Корпус"
afrikacorps_desc:0 "Досвід бойових дій у пустелі інституціоналізований. Солдати адаптуються до жаркого клімату з покращеною організацією та виживанням у суворій місцевості."

lawofreichstag:0 "Закон про Райхстаг"
lawofreichstag_desc:0 "Новий закон зміцнює центральну владу, забезпечуючи стабільність та підтримку війни. Політичний вплив зростає, оскільки Райхстаг приведений до покори."

concentratedarmamentproduction:0 "Концентроване Виробництво Озброєнь"
concentratedarmamentproduction_desc:0 "Виробництво централізовано у великих промислових центрах, підвищуючи ефективність та випуск військових матеріалів."

concentratedarmamentproduction2:0 "Концентроване Виробництво Озброєнь"
concentratedarmamentproduction2_desc:0 "Виробництво централізовано у великих промислових центрах, підвищуючи ефективність та випуск військових матеріалів."

concentratedarmamentproduction3:0 "Концентроване Виробництво Озброєнь"
concentratedarmamentproduction3_desc:0 "Виробництво централізовано у великих промислових центрах, підвищуючи ефективність та випуск військових матеріалів."

concentratedarmamentproduction4:0 "Концентроване Виробництво Озброєнь"
concentratedarmamentproduction4_desc:0 "Виробництво централізовано у великих промислових центрах, підвищуючи ефективність та випуск військових матеріалів."

concentratedarmamentproduction5:0 "Концентроване Виробництво Озброєнь"
concentratedarmamentproduction5_desc:0 "Виробництво централізовано у великих промислових центрах, підвищуючи ефективність та випуск військових матеріалів."

ulimatumvetoed:0 "Ультиматум Ветовано"
ulimatumvetoed_desc:0 "Сенат наклав вето на останній ультиматум, відхиляючи компроміс. Це рішення завдає шкоди промисловості та стабільності, але зберігає незалежність."

ulimatumaccepted:0 "Ультиматум Прийнято"
ulimatumaccepted_desc:0 "Сенат прийняв ультиматум, надаючи пріоритет миру та виживанню над національною гордістю. Промисловість та стабільність покращуються згідно з угодою."

decentralisedarmy:0 "Децентралізована Армія"
decentralisedarmy_desc:0 "Розколота командна структура підриває ефективність. Офіцери діють незалежно, уповільнюючи планування та виснажуючи згуртованість."

armyloyal1:0 "Лояльність Армії"
armyloyal1_desc:0 "Армія присягає на вірність режиму, відновлюючи швидкість планування та моральний дух. Політичний контроль над збройними силами зростає."

armyloyal2:0 "Лояльність Армії"
armyloyal2_desc:0 "Армія присягає на вірність режиму, відновлюючи швидкість планування та моральний дух. Політичний контроль над збройними силами зростає."

armyloyal3:0 "Лояльність Армії"
armyloyal3_desc:0 "Армія присягає на вірність режиму, відновлюючи швидкість планування та моральний дух. Політичний контроль над збройними силами зростає."

finalblowtoallromans:0 "Фінальний Удар по Всім Римлянам"
finalblowtoallromans_desc:0 "Імперія готується до своєї найбільшої боротьби: рішучої війни, щоб раз і назавжди покінчити з Римським впливом. Кожен солдат і корабель присвячений цій кінцевій кампанії."

combinationarms:0 "Доктрина Об'єднаних Родів Військ"
combinationarms_desc:0 "Армія вдосконалює координацію між піхотою, бронетехнікою та повітряною підтримкою, забезпечуючи максимальну ефективність у сучасній війні."

altanticnavaldominance:0 "Панування на Атлантиці"
altanticnavaldominance_desc:0 "Розширюючи свій флот та тренуючись для великих амфібійних операцій, імперія прагне домінувати на Атлантиці та забезпечити надійні лінії постачання."

shatterlegionaryair:0 "Розтрощити Легіонерські Повітряні Сили"
shatterlegionaryair_desc:0 "Повітряні сили реструктуруються, щоб зламати Римську перевагу в повітрі, інвестуючи в елітних асів, мережі виявлення та ефективність тактичних місій."

antilegionary:0 "Антилегіонерська Стратегія"
antilegionary_desc:0 "Кожна доктрина, план та зброя спрямовані на перемогу над Легіонерськими Державами. Уся армія тренується спеціально для цього ворога."

GEM_defendthevaterland_ns:0 "Захистити Вітчизну"
GEM_defendthevaterland_ns_desc:0 "Батьківщина укріплюється швидким будівництвом та глибоким окопуванням. Кожен ресурс спрямовується на захист Вітчизни."

GEM_asianfront:0 "Азійський Фронт"
GEM_asianfront_desc:0 "Ресурси перекидаються на схід, щоб протистояти Республіці Індій. Військово-морські плани та стратегії вторгнення переробляються, щоб відповісти на цей виклик."

TEI_theteutoniceastindies:0 "Тевтонські Східні Індії"
TEI_theteutoniceastindies_desc:0 "Східні Індії міцно прив'язані до імперії. Заводи, ресурси та торгівля перенаправляються для обслуговування Тевтонських володарів, забезпечуючи панування за океаном."
