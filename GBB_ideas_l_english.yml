l_english:
 GBB_state_lollardy:0 "State Lollardy"
 GBB_state_lollardy_desc:0 "Previously only tolerated within Britannia, the radically independent and anti-Roman faith of Lollardy became the state religion after the nation won its independence in 1850.\n\nSince then, Lollardy has come to permeate all levels of society, and Rome's grip over the souls of Britannia is likely lost forever."
 GBB_ailing_consul:0 "The Ailing Consul"
 GBB_ailing_consul_desc:0 "Herbert Kitchener has been the Consul of Britannia for a very, very long time now.\n\nAlthough the Wolseley-Dilke Constitution generally limits his powers, he still nontheless has a significant amount of sway and power over the affairs of the nation.\n\nIn spite of his worsening condition, he has long made clear he intends to serve until death... in spite of his obvious senility and dementia."
 GBB_coalition_government:0 "The First Coalition Government"
 GBB_coalition_government_desc:0 "For the first time in Britannian history, no political party has managed to secure a majority in Parliament. As such, and in the face of the growing Socialist peril, the historic enemies of the Chartist Party and the Landed Britannia League have agreed to come together and form a Grand Coalition.\n\nThe ambitious and savvy Archibald Sinclair of the Chartists holds the office of Prime Minister, while the young, idealistic- and naive- Anthony Eden of the LBL wields the Foreign Office like a cricket bat."