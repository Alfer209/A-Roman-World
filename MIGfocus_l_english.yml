l_english: 

MIG_mandate_of_heaven:0 "Мандат Небес"
MIG_mandate_of_heaven_desc:0 "Після смути настав час підтвердити божественний та непорушний авторитет трону Мін. Утверджуючи наше правління як призначене самими Небесами, ми зміцнюємо основи імперії, вселяємо лояльність серед народу та відновлюємо довіру до вічної династії. Наша легітимність сяятиме як маяк для всього Китаю, демонструючи, що під правлінням Мін нація знову процвітатиме."

MIG_secure_the_court:0 "Убезпечити Двір"
MIG_secure_the_court_desc:0 "Політичні інтриги столиці загрожують послабити авторитет трону. Придворні та міністри, кожен з яких шукає впливу та влади. Убезпечуючи двір, усуваючи корупцію та забезпечуючи, щоб лояльні міністри займали ключові посади, ми захищаємо священне місце імперської влади та гарантуємо, що рішення імператора будуть беззаперечними та виконуватимуться з непохитною вірністю."

MIG_rebuilding_efforts:0 "Загальнонаціональні Зусилля з Відбудови"
MIG_rebuilding_efforts_desc:0 "Наша імперія пережила жорстоке повстання. Вкрай необхідно відновити інфраструктуру, відродити сільське господарство та повернути процвітання до наших міст і сільської місцевості. Ці зусилля з відбудови, хоча й вимагають великої праці, відродять економіку нації, зміцнять моральний дух та підготують Китай до викликів, що стоять попереду, гарантуючи, що кожна провінція знову служитиме славі династії Мін."

MIG_mandate_reaffirmed:0 "Мандат Підтверджено"
MIG_mandate_reaffirmed_desc:0 "Через політичні маневри та невтомні зусилля з відновлення порядку, імперія тепер стоїть об'єднаною під визнаним Мандатом Небес. Це підтвердження зміцнює як внутрішню згуртованість Китаю, так і нашу позицію у світі, сигналізуючи, що династія Мін є законним управителем Серединного Царства."

MIG_purge_the_reformists:0 "Провести Чистку Реформістів"
MIG_purge_the_reformists_desc:0 "Реформісти та радикали загрожують стабільності імперії, просуваючи ідеї, які кидають виклик імперському авторитету та підривають традиційне управління. Необхідно діяти рішуче, усуваючи голоси незгоди та забезпечуючи, що жодна фракція не зможе підірвати гармонію нашого правління. Через цю чистку лояльність винагороджується, а повстання придушуються, захищаючи імперію для прийдешніх поколінь."

MIG_placate_the_assembly:0 "Умиротворити Асамблею"
MIG_placate_the_assembly_desc:0 "Хоча реформісти усунені, імперська асамблея все ще має вплив на місцеві справи та громадські настрої. Щоб уникнути заворушень та підтримати соціальну стабільність, ми повинні задовольнити їхні вимоги, пропонуючи поступки та демонструючи, що імператор цінує їхню пораду. Цей обережний баланс між авторитетом та дипломатією гарантує лояльність, водночас запобігаючи відродженню внутрішнього інакомислення."

MIG_lessons_of_the_revolution:0 "Уроки Революції"
MIG_lessons_of_the_revolution_desc:0 "Революції минулого навчили нас безцінним урокам стратегії, стійкості та управління. Вивчаючи ці бурхливі часи, армія, науковці та лідери Мін можуть прийняти вищі тактики, краще організувати сили та підготувати націю до будь-якого конфлікту, що може виникнути. Знання минулих помилок та успіхів стає основою нашої військової та цивільної сили."

MIG_a_chinese_economy:0 "Китайська Економіка"
MIG_a_chinese_economy_desc:0 "Відновлення економіки імперії є першочерговим. Інвестиції в торгівлю, сільське господарство та промисловість відновлять багатство нації та забезпечать, що громадяни отримають вигоду від процвітання імперії. Використовуючи місцеві ресурси та заохочуючи підприємництво, ми створюємо самодостатню економічну систему, здатну підтримувати армію, державу та народ протягом десятиліть."

MIG_mobilise_all_layers_of_the_population:0 "Мобілізувати Всі Верстви Населення"
MIG_mobilise_all_layers_of_the_population_desc:0 "Щоб зміцнити націю, кожен громадянин повинен сприяти обороні та зростанню Китаю. Селяни, купці та науковці — усі закликаються служити, чи то зі зброєю, працею, чи логістикою. Мобілізуючи всі верстви суспільства, ми створюємо об'єднане та дисципліноване населення, готове захищати імперію від внутрішнього повстання та зовнішнього втручання."

MIG_redirect_rebuilding_toward_militarisation:0 "Перенаправити Відбудову на Мілітаризацію"
MIG_redirect_rebuilding_toward_militarisation_desc:0 "Хоча відбудова є важливою, армія вимагає сучасного обладнання, підготовки та інфраструктури. Направляючи частину зусиль з реконструкції на військові потреби, ми гарантуємо, що сили імперії будуть добре підготовлені, технологічно просунуті та здатні захищати імперію від будь-якої зовнішньої загрози чи внутрішніх заворушень, що можуть виникнути."

MIG_anti_republicanism:0 "Антиреспубліканські Заходи"
MIG_anti_republicanism_desc:0 "Республіканські ідеології загрожують божественному та вічному правлінню династії Мін. Щоб зберегти наші традиції та авторитет, ми повинні активно протидіяти республіканському впливу, викорінюючи симпатиків та посилюючи лоялістську пропаганду. Забезпечуючи, що серця людей залишаються вірними трону, ми запобігаємо хаосу та підтримуємо багатовікову спадкоємність імперського порядку."

MIG_change_tianming_principles:0 "Змінити Принципи Тяньміна"
MIG_change_tianming_principles_desc:0 "Стародавні принципи Мандату Небес мають адаптуватися до сучасної ери. Переглядаючи доктрини та філософії, що керують імперським правлінням, ми можемо зміцнити легітимність, краще виправдовувати рішення та забезпечувати, що наше правління резонує з ширшим сегментом населення. Ці зміни забезпечать божественний авторитет імператора, водночас вирішуючи сучасні політичні реалії."

MIG_strengthen_roman_support:0 "Зміцнити Римську Підтримку"
MIG_strengthen_roman_support_desc:0 "Східна Римська Імперія залишається життєво важливим союзником у нашій боротьбі за модернізацію та забезпечення безпеки Китаю. Посилюючи дипломатичні, економічні та технологічні зв'язки, ми забезпечуємо доступ до передового військового обладнання, стратегічного консультування та критично важливих знань, які прискорять відродження імперії. Їхня підтримка зміцнює наші позиції як усередині країни, так і на міжнародній арені."

MIG_joint_research:0 "Спільні Дослідницькі Ініціативи"
MIG_joint_research_desc:0 "Через співпрацю з нашими Східноримськими союзниками ми можемо обмінюватися науковими знаннями, технологічними досягненнями та промисловим досвідом. Спільні дослідницькі проєкти обіцяють модернізувати інфраструктуру Китаю, вдосконалити військове виробництво та сприяти інноваціям, які забезпечать перевагу імперії в наступні століття."

MIG_acquire_roman_tank_designs:0 "Отримати Римські Проєкти Танків"
MIG_acquire_roman_tank_designs_desc:0 "Проєкти Східних Римлян є вершиною бронетанкової війни. Приймаючи їхні креслення та будуючи власні танки, ми оснащуємо армію машинами, які втілюють як міць, так і точність. Цей технологічний стрибок гарантує, що сили Мін зможуть протистояти будь-якому супротивнику з неперевершеною вогневою міццю та тактичною перевагою."

MIG_acquire_roman_plane_designs:0 "Отримати Римські Проєкти Літаків"
MIG_acquire_roman_plane_designs_desc:0 "Авіація — це майбутнє війни, і небеса мають належати імперії Мін. Включаючи проєкти Римських літаків у наші фабрики, ми отримуємо технологічну перевагу, виробляючи літаки, які є швидкими, добре озброєними та здатними домінувати в будь-якій повітряній конфронтації. Охоплення імперії поширюється за межі кордонів, забезпечене завдяки майстерності в небі."

MIG_future_of_the_empire:0 "Майбутнє Імперії"
MIG_future_of_the_empire_desc:0 "З досягненням стабільності та початком модернізації, Династія Мін тепер ставить собі за мету об'єднане та процвітаюче майбутнє. Імператор приймає роль візіонера-лідера, ведучи націю до величі, гуртуючи вірних союзників та створюючи рамки для тривалого миру, безпеки та впливу, які проіснує протягом поколінь."

MIG_path_to_unification:0 "Шлях до Об'єднання"
MIG_path_to_unification_desc:0 "Китай має бути возз'єднаний під суверенним правлінням Імператора Мін. Вирішуючи прикордонні суперечки, умиротворюючи бунтівні регіони та утверджуючи домінування над фракціями, що не погоджуються, імперія гарантує, що кожна провінція визнає авторитет імператора, відновлюючи територіальну та культурну цілісність Серединного Царства."

MIG_destroy_the_republicans_once_and_for_all:0 "Знищити Республіканців Раз і Назавжди"
MIG_destroy_the_republicans_once_and_for_all_desc:0 "Залишки республіканських сил є останньою перешкодою на шляху до повного об'єднання. Рішуче перемагаючи їх, чи то через битву, чи через стратегічне маневрування, ми цементуємо авторитет династії Мін та усуваємо загрози стабільності нашої нації. Перемога гарантує, що весь Китай схилиться перед волею імператора."

MIG_thexinjiangmenance:0 "Синьцзянська Загроза"
MIG_thexinjiangmenance_desc:0 "Сепаратисти Синьцзяну продовжують чинити опір авторитету імператора, загрожуючи західним кордонам імперії. Потрібна рішуча кампанія для відновлення порядку, приведення регіону до гармонії з імперським управлінням та запобігання експлуатації заворушень іноземними державами. Контроль над Синьцзяном забезпечує західний кордон імперії та зміцнює національну єдність."

MIG_cross_into_tibet:0 "Перетнути Кордон із Тибетом"
MIG_cross_into_tibet_desc:0 "Тибетське плато, багате культурою та стратегічним значенням, залишається поза імперським контролем. Поширюючи управління на Тибет, ми беремо регіон під захист династії Мін, забезпечуємо життєво важливі гірські перевали та утверджуємо авторитет імператора над усіма землями, що традиційно належать Серединному Царству."

MIG_china_united:0 "Об'єднаний Китай"
MIG_china_united_desc:0 "Після років обережного планування, військових кампаній та дипломатії, увесь Китай нарешті об'єднаний під династією Мін. З лояльністю кожного регіону до трону, нація стоїть як непорушна імперія, здатна витримати іноземні загрози та внутрішні заворушення. Процвітання, безпека та імперська слава тепер є долею повністю об'єднаного Китаю."

MIG_coorperate_with_the_republicans:0 "Співпрацювати з Республіканцями?"
MIG_coorperate_with_the_republicans_desc:0 "У несподіваному повороті, імперія прагне співпрацювати із залишками республіканських сил. Формуючи стратегічні союзи, пропонуючи поступки та сприяючи діалогу, Династія Мін може зменшити внутрішній конфлікт, отримати доступ до ресурсів та плавніше орієнтуватися в політичному ландшафті. Цей неортодоксальний шлях може уникнути негайного кровопролиття, водночас забезпечуючи довгострокову стабільність."

MIG_renew_the_treaty_of_nanjing:0 "Поновити Нанкінський Договір"
MIG_renew_the_treaty_of_nanjing_desc:0 "Договір із республіканцями забезпечує мир та визначає параметри співпраці. Поновлюючи цю угоду, імперія зміцнює дипломатичні відносини, забезпечує економічні вигоди та підтримує буфер проти потенційних ворожих дій. Цей договір символізує делікатний баланс між прагматичною дипломатією та імперським авторитетом."

MIG_open_arms_policy:0 "Політика 'Відкритих Обіймів'"
MIG_open_arms_policy_desc:0 "Китай має прийняти іноземний вплив та сприяти міжнародній співпраці для швидкої модернізації. Вітаючи радників, технології та торгівлю, імперія прискорює індустріалізацію, зміцнює військових та отримує конкурентну перевагу над суперниками. Відкрита взаємодія зі світом забезпечує виживання та процвітання Китаю в сучасну еру."

MIG_jingyiwei:0 "Цзіньївей"
MIG_jingyiwei_desc:0 "Імперська таємна поліція, Цзіньївей, має бути зміцнена для виконання волі імператора, збору розвідувальних даних та запобігання змовам. Створюючи лояльну та ефективну силу, ми гарантуємо, що загрози трону, чи то внутрішні, чи зовнішні, будуть швидко виявлені та усунені, зберігаючи стабільність та святість династії Мін."

MIG_distribute_real_country:0 "Розподілити Справжню Країну"
MIG_distribute_real_country_desc:0 "Контроль над провінціями та ресурсами має бути збалансований, щоб запобігти корупції та сприяти лояльності. Розподіляючи владу розсудливо серед довірених чиновників та лояльних військових підрозділів, імперія забезпечує ефективне управління, водночас гарантуючи вірність від тих, хто вірно служить трону."

MIG_coorperate_with_the_teutons:0 "Співпрацювати з Тевтонами"
MIG_coorperate_with_the_teutons_desc:0 "Створюючи союзи з технологічно просунутими Тевтонськими державами, Імперія Мін отримує доступ до промислового досвіду, військових технологій та стратегічних партнерств. Співпраця посилює позиції імперії на міжнародній арені, водночас готуючись до остаточного об'єднання та захисту наших кордонів."

MIG_strengthening_of_the_civilian_adminstration:0 "Зміцнення Цивільної Адміністрації"
MIG_strengthening_of_the_civilian_adminstration_desc:0 "Ефективна бюрократія забезпечує швидке та ефективне виконання імперських указів. Зміцнюючи цивільну адміністрацію, ми оптимізуємо управління, зменшуємо корупцію та покращуємо якість обслуговування населення, дозволяючи імператору правити з більшим авторитетом та передбачливістю."

MIG_attempt_at_unification:0 "Спроба Об'єднання"
MIG_attempt_at_unification_desc:0 "Фінальний етап об'єднання вимагає обережної координації, дипломатії та військової точності. Ведучи переговори, умиротворюючи або перемагаючи фракції, що залишилися, Династія Мін працює над створенням Китаю, де лояльність є абсолютною, кордони безпечні, а авторитет імператора визнається по всій імперії."

MIG_one_china_two_systems:0 "Один Китай, Дві Системи"
MIG_one_china_two_systems_desc:0 "Певні регіони зберігають відмінні культурні чи політичні системи, але всі вони лояльні до імператора. Дозволяючи місцеву автономію в рамках імперського авторитету, Династія Мін підтримує єдність, не підриваючи традицій, досягаючи гармонії та зміцнюючи довговічність нашого правління."

MIG_the_dragon_emperor:0 "Імператор Дракон"
MIG_the_dragon_emperor_desc:0 "Імператор втілює силу, мудрість та гідність самого дракона. Приймаючи мантію 'Імператора Дракона', він символізує національну єдність, божественний авторитет та кінцевого захисника народу. Це піднесене становище надихає лояльність, мужність та повагу по всій імперії."

MIG_revive_confucian_bureacracy:0 "Відродити Конфуціанську Бюрократію"
MIG_revive_confucian_bureacracy_desc:0 "Стародавні традиції Конфуціанського управління забезпечують мудрість, стабільність та моральне керівництво. Відроджуючи Конфуціанську бюрократію, імперія гарантує, що чиновники освічені, доброчесні та віддані добробуту народу, зміцнюючи легітимність та ефективне управління по всьому Китаю."

MIG_master_of_the_east:0 "Володар Сходу"
MIG_master_of_the_east_desc:0 "Китай відновлює своє домінування по всій Східній Азії, проєктуючи силу та вплив на сусідні держави. Через дипломатію, торгівлю та військову майстерність, Династія Мін утверджується як беззаперечний володар регіону, забезпечуючи безпеку та процвітання імперії, водночас стримуючи потенційних суперників."

MIG_consolidate_international_industries:0 "Консолідувати Міжнародні Промисловості"
MIG_consolidate_international_industries_desc:0 "Іноземні інвестиції та підприємства інтегровані до національної структури, забезпечуючи, що багатство, згенероване за кордоном, приносить користь Китаю безпосередньо. Консолідуючи промисловість під імперським наглядом, ми посилюємо економічну стабільність, технологічний прогрес та контроль над стратегічними ресурсами, зміцнюючи імперію для майбутніх викликів."

MIG_pardon_republican_officers:0 "Помилувати Республіканських Офіцерів"
MIG_pardon_republican_officers_desc:0 "Для забезпечення лояльності та запобігання подальшому опору, деяким республіканським офіцерам надається помилування та реінтеграція до імперських сил. Їхній досвід та знання є цінними активами, і їхня вірність, щойно забезпечена, зміцнює єдність та ефективність армії Мін."

MIG_fate_of_joseon:0 "Доля Чосону"
MIG_fate_of_joseon_desc:0 "Королівство Чосон, наш традиційний васал, вимагає чіткого керівництва та твердого нагляду. Утверджуючи вплив або контроль над Чосоном, Династія Мін забезпечує регіональну стабільність, стримує іноземне втручання та підтримує історичне домінування Китаю над Корейським півостровом."

MIG_look_to_the_east:0 "Погляд на Схід"
MIG_look_to_the_east_desc:0 "Увага імперії має звернутися до східних морів, де суперники, колоніальні держави та потенційні союзники борються за вплив. Проєктуючи силу, зміцнюючи війська та утверджуючи дипломатичну та військову присутність, Китай готується захистити свої східні кордони та розширити свій вплив по всій Азії."

MIG_take_direct_control_over_concession_cities:0 "Взяти Прямий Контроль Над Концесійними Містами"
MIG_take_direct_control_over_concession_cities_desc:0 "Контрольовані іноземцями міста становлять як можливість, так і загрозу. Беручи прямий контроль над цими концесіями, Династія Мін забезпечує безпеку, зміцнює суверенітет та використовує економічний потенціал, інтегруючи ці міські центри в імперську структуру, водночас обмежуючи іноземне втручання."

MIG_take_dainam:0 "Захопити Дайнам"
MIG_take_dainam_desc:0 "Регіон Дайнам, багатий на ресурси та стратегічно розташований, має бути введений у сферу впливу Мін. Утверджуючи владу та встановлюючи контроль, імперія забезпечує торговельні шляхи, зміцнює регіональне домінування та гарантує, що Дайнам сприятиме процвітанню та безпеці Китаю."

MIG_the_japanese_question:0 "Японське Питання"
MIG_the_japanese_question_desc:0 "Зростаюча міць та мілітаризм Японії становлять пряму загрозу безпеці та впливу Китаю. Готуючись до конфлікту, організовуючи антияпонські сили та формулюючи стратегічні відповіді, імперія гарантує, що її кордони, торгівля та народ захищені від іноземної агресії, водночас підтримуючи баланс сил у Східній Азії."

MIG_liberate_indonesia:0 "Визволити Індонезію"
MIG_liberate_indonesia_desc:0 "Архіпелаг Індонезії довго страждав під колоніальною експлуатацією. Розпочинаючи визвольну кампанію, Китай розширює свій вплив, підтримує рухи за незалежність та забезпечує життєво важливі ресурси, демонструючи силу, охоплення та відданість Династії Мін регіональній справедливості."

MIG_invest_in_foreign_industries:0 "Інвестувати в Іноземні Галузі Промисловості"
MIG_invest_in_foreign_industries_desc:0 "Іноземні промислові інвестиції приносять технології, досвід та капітал в імперію. Обережно керуючи цими інвестиціями, Китай модернізує свою промисловість, створює робочі місця та сприяє економічному зростанню, водночас забезпечуючи, що такі проєкти служать стратегічним інтересам Династії Мін."

MIG_import_roman_steel:0 "Імпортувати Римську Сталь"
MIG_import_roman_steel_desc:0 "Високоякісна сталь від Східних Римлян забезпечує основу для промислової та військової експансії. Імпортуючи та інтегруючи цю сталь у наші фабрики та інфраструктуру, ми зміцнюємо виробництво, оснащуємо наші сили вищою зброєю та прискорюємо модернізацію по всій імперії."

MIG_western_rail_engineers:0 "Західні Залізничні Інженери"
MIG_western_rail_engineers_desc:0 "Кваліфіковані інженери із Заходу можуть будувати ефективні залізниці, які з'єднують ключові регіони імперії. Ці залізничні мережі посилюють логістику, полегшують пересування військ та стимулюють економічний розвиток, формуючи основу зусиль Китаю з модернізації та національної інтеграції."

MIG_shenyang_manufacturing_firms:0 "Шеньянські Виробничі Фірми"
MIG_shenyang_manufacturing_firms_desc:0 "Створюючи передові виробничі центри в Шеньяні, ми створюємо осередки промислових інновацій. Фабрики виробляють зброю, машини та критично важливі запаси, водночас навчаючи кваліфікованих робітників, посилюючи промислову спроможність імперії та забезпечуючи самодостатність у часи кризи."

MIG_advanced_equipment:0 "Передове Обладнання"
MIG_advanced_equipment_desc:0 "Сучасна війна та промисловість вимагають передового обладнання. Через іноземні контракти, внутрішні дослідження та технологічне прийняття ми оснащуємо наші сили та фабрики інструментами, необхідними для конкуренції з будь-якою світовою державою, забезпечуючи, що Династія Мін залишається на передовій прогресу та військової могутності."

MIG_modernising_synthetic:0 "Модернізація Синтетичного Виробництва"
MIG_modernising_synthetic_desc:0 "Синтетичні ресурси, як-от гума та паливо, є критично важливими для промисловості та війни. Модернізуючи виробничі потужності, Китай забезпечує стратегічні матеріали, зменшує залежність від імпорту та гарантує, що фабрики та армії можуть працювати з максимальною ефективністю, навіть під час тривалих конфліктів."

MIG_foreign_expertise:0 "Іноземний Досвід"
MIG_foreign_expertise_desc:0 "Знання та навички іноземних експертів прискорюють модернізацію Китаю. Включаючи міжнародну інженерну, наукову та промислову практику, імперія зміцнює інфраструктуру, покращує виробничі технології та сприяє інноваціям, які зміцнять національну міць на десятиліття вперед."

MIG_university_exchange:0 "Програми Університетського Обміну"
MIG_university_exchange_desc:0 "Програми стипендій та академічні обміни з іноземними університетами культивують нове покоління кваліфікованих інженерів, науковців та адміністраторів. Ця освітня ініціатива гарантує, що Китай отримає вигоду від передових знань, сучасних практик та кадрів навчених професіоналів, здатних керувати національним розвитком."

MIG_central_china_development:0 "Розвиток Центрального Китаю"
MIG_central_china_development_desc:0 "Серце Китаю багате на ресурси, населення та стратегічну цінність. Інвестуючи в інфраструктуру, видобуток корисних копалин та промисловість у центральних провінціях, ми стимулюємо економічне зростання, збільшуємо зайнятість та забезпечуємо ключові ресурси, які зміцнюють імперію та підтримують національні цілі."

MIG_expand_the_kailuan_mines:0 "Розширити Копальні Кайлуань"
MIG_expand_the_kailuan_mines_desc:0 "Кайлуань є критично важливим джерелом вугілля та промислового багатства. Розширення видобутку забезпечує сировиною фабрики, енергією залізниці та зміцнює промислову базу Китаю. Ця ініціатива живить модернізацію та гарантує, що економіка імперії залишається надійною та стійкою."

QIE_expanding_our_shanxi_spoils:0 "Розширення Нашої Здобичі в Шаньсі"
QIE_expanding_our_shanxi_spoils_desc:0 "Розширюючи промислові та транспортні мережі в Шаньсі, ми інтегруємо новопридбані території в економіку імперії. Залізниці та інфраструктурні проєкти не лише підсилюють торгівлю та видобуток ресурсів, але й консолідують політичний контроль та зміцнюють національну єдність."

MIG_daye_hanyang:0 "Промисловий Центр Дає-Ханьян"
MIG_daye_hanyang_desc:0 "Розвиток промислових регіонів Дає та Ханьян забезпечує виробництво необхідних товарів, зброї та машин. Фабрики, майстерні та енергетичні об'єкти спільно створюють потужний промисловий коридор, забезпечуючи як економічне процвітання, так і військовий потенціал для імперії."

MIG_expand_arsenals_of_war:0 "Розширити Арсенали Війни"
MIG_expand_arsenals_of_war_desc:0 "Військова міць посилюється арсеналами, здатними виробляти зброю, боєприпаси та обладнання у великих масштабах. Розширення цих об'єктів гарантує, що Китай може швидко реагувати на загрози, ефективно оснащувати свої війська та підтримувати домінуючу військову присутність на всіх театрах операцій."

MIG_the_guanziying_army:0 "Армія Гуанцзіїн"
MIG_the_guanziying_army_desc:0 "Армія Гуанцзіїн стоїть як традиційне ядро міці Китаю, об'єднуючи ветеранів та навчених новобранців під багатовіковою військовою традицією. Її присутність підтверджує Мандат Небес та нашу непохитну рішучість захищати імперію від розбрату та зовнішніх загроз."

MIG_the_imperial_army_of_china:0 "Імперська Армія Китаю"
MIG_the_imperial_army_of_china_desc:0 "Імперська Армія, основа нації, поєднує дисципліну з багатовіковим досвідом, водночас модернізуючись для нових викликів. З удосконаленою артилерією, логістикою та стратегією, вона невтомно тренується, щоб захищати імперію від заворушень та іноземних загроз, оберігаючи спадщину Мін."

MIG_a_traditional_fighting_doctrine:0 "Традиційна Бойова Доктрина"
MIG_a_traditional_fighting_doctrine_desc:0 "У бою вчення наших предків зберігаються. Через дисципліновані формування та освячені часом стратегії, ця доктрина готує наші війська протистояти сучасним арміям, забезпечуючи, що їхня мужність та рішучість відповідають силі їхньої зброї."

MIG_goals_of_the_imperial_army:0 "Цілі Імперської Армії"
MIG_goals_of_the_imperial_army_desc:0 "Армія є інструментом нашої національної волі, що захищає кордони імперії, підтримує стабільність та проєктує міць Мін. Кожен підрозділ підтримує Мандат Небес, відображаючи як стратегічне бачення, так і незмінний дух імперії."

MIG_overwhelming_strength:0 "Непереборна Сила"
MIG_overwhelming_strength_desc:0 "Через невтомну підготовку, вищу тактику та стратегічне використання наших сил, ми прагнемо досягти непереборної сили. Концентруючи наші армії, координуючи об'єднані роди військ та використовуючи переваги місцевості, ми прагнемо вселяти страх у серця наших ворогів. Міць Мін буде очевидною на кожному полі бою, доводячи, що жоден іноземний загарбник не може кинути виклик нашому верховенству."

MIG_the_ming_new_army:0 "Нова Армія Мін"
MIG_the_ming_new_army_desc:0 "Модернізація — це шлях до виживання в епоху мінливої війни. 'Нова Армія Мін' поєднує традиційну доблесть із сучасними інноваціями, включаючи механізовані підрозділи, передову артилерію та покращені організаційні структури. Ці реформи гарантують, що сили імперії зможуть протистояти будь-якому супротивнику з точністю, дисципліною та гнучкістю, готуючи Китай утвердитися як військова держава у бурхливому світі."

MIG_expanding_the_baoding_arsenal:0 "Розширення Баодінського Арсеналу"
MIG_expanding_the_baoding_arsenal_desc:0 "Наш знаменитий Баодінський Арсенал є серцем нашого сухопутного військового виробництва. Розширюючи його потужність, ми забезпечуємо безперервне постачання зброї, боєприпасів та машин для підтримки як традиційних, так і сучасних підрозділів. Це зусилля символізує відданість імперії самостійності, зменшуючи залежність від іноземних постачальників та оснащуючи наших солдатів інструментами, необхідними для забезпечення перемоги."

MIG_new_armoured_divisions:0 "Нові Бронетанкові Дивізії"
MIG_new_armoured_divisions_desc:0 "Поле бою змінилося, і бронетанкові дивізії приносять швидкість та силу. Танки та механізовані підрозділи очолюють кампанії, прориваючи ворожі лінії та відображаючи прийняття Мін сучасної війни, водночас зберігаючи незламний дух солдатів."

MIG_the_green_standards:0 "Зелені Штандарти"
MIG_the_green_standards_desc:0 "Відроджуючи легендарні 'Зелені Штандарти', ми поєднуємо традицію з сучасною військовою практикою. Ці підрозділи несуть символічні прапори нашої імперії, що представляють порядок, лояльність та непохитну мужність. Їхня присутність вселяє впевненість у наших людей та вселяє жах у тих, хто загрожує нашому суверенітету. 'Зелені Штандарти' втілюють єдність минулої доблесті та теперішнього потенціалу."

MIG_superiority_of_the_chinese_army:0 "Перевага Китайської Армії"
MIG_superiority_of_the_chinese_army_desc:0 "З сучасними тактиками, ветеранськими лідерами та добре оснащеними підрозділами, Китайська Армія досягає неперевершеної сили. Імперія Мін готова захищати свої території та проєктувати силу, гарантуючи, що жоден ворог не загрожуватиме нашій спадщині."

MIG_the_imperial_airforce:0 "Імперські Повітряні Сили"
MIG_the_imperial_airforce_desc:0 "Небеса належать імперії. Імперські Повітряні Сили вводять Китай у сучасну війну з розвідкою, повітряною підтримкою та стратегічним бомбардуванням. Навчені пілоти, нові летовища та сучасні арсенали гарантують, що жоден ворог ніколи не пануватиме в нашому небі."

MIG_kongjun_xueyuan:0 "Кунцзюнь Сюеюань (Академія ВПС)"
MIG_kongjun_xueyuan_desc:0 "Кунцзюнь Сюеюань слугує колискою нашого авіаційного досвіду. Тут найперспективніші пілоти імперії здобувають освіту та підготовку для вирішення викликів сучасної війни. Зосереджуючись на стратегії, інженерії та тактиці повітряного бою, ця установа гарантує, що Імперські Повітряні Сили залишаються на передовій інновацій та готовності, поєднуючи дисципліну з баченням."

MIG_new_airbases:0 "Нові Авіабази"
MIG_new_airbases_desc:0 "Для проєктування сили по всій нашій величезній імперії, будівництво нових авіабаз є необхідним. Ці стратегічні вузли дозволяють швидке розгортання літаків, ефективне обслуговування та посилену координацію з наземними силами. Їхня присутність зміцнює наші кордони та забезпечує швидку відповідь на будь-яку загрозу, демонструючи прагнення Мін до панування в повітряному просторі."

MIG_domestic_designs:0 "Вітчизняні Проєкти"
MIG_domestic_designs_desc:0 "Наші інженери та конструктори звернули свою винахідливість до неба, створюючи літаки, пристосовані до наших унікальних потреб. Надаючи пріоритет вітчизняним проєктам, ми зменшуємо залежність від іноземних постачальників та створюємо машини, адаптовані до стратегічних вимог імперії. Цей фокус сприяє інноваціям, національній гордості та самодостатній аерокосмічній промисловості."

MIG_foreign_aircraft:0 "Іноземні Літаки"
MIG_foreign_aircraft_desc:0 "Поки наша вітчизняна промисловість розвивається, залишається важливим придбання передових літаків з-за кордону. Інтегруючи іноземні технології, ми прискорюємо модернізацію та гарантуємо, що наші пілоти мають доступ до новітніх досягнень. Цей імпорт доповнює наш флот, забезпечуючи універсальність та спроможність, необхідну для підтримки контролю в небі."

MIG_domestic_aircraft_industry:0 "Вітчизняна Авіаційна Промисловість"
MIG_domestic_aircraft_industry_desc:0 "Через інвестиції та інновації, вітчизняна авіаційна промисловість Китаю досягає нових висот. Фабрики виробляють передові планери, двигуни та допоміжне обладнання, сприяючи самодостатності, водночас створюючи фундамент для потужних, стійких Імперських Повітряних Сил. Цей фокус знаменує поворотний момент у нашій спроможності захищати імперію як із суші, так і з повітря."

MIG_the_chinese_imperial_navy:0 "Китайський Імперський Флот"
MIG_the_chinese_imperial_navy_desc:0 "Води, що оточують імперію, — це наша життєва сила. Зміцнення Імперського Флоту гарантує наш суверенітет над торговельними шляхами, прибережними територіями та морськими доменами. Зі вправними моряками, сучасними кораблями та потужними верфями, Флот проєктує силу, стримує агресію та захищає моря для прийдешніх поколінь."

MIG_torpedo_production:0 "Виробництво Торпед"
MIG_torpedo_production_desc:0 "Розширення виробництва торпед збільшує нашу спроможність завдавати рішучих ударів по ворожих флотах. Ця потужна зброя підвищує летальність наших військово-морських підрозділів та захищає узбережжя імперії. Приймаючи передові боєприпаси, ми демонструємо нашу прихильність технологічній майстерності та пануванню на морі."

MIG_expand_naval_facilities:0 "Розширити Військово-морські Об'єкти"
MIG_expand_naval_facilities_desc:0 "Будівництво та вдосконалення військово-морських об'єктів зміцнює морську інфраструктуру нашої імперії. Верфі, ремонтні доки та допоміжні будівлі забезпечують більший флот, швидше суднобудування та покращену логістичну підтримку. Це розширення означає рішучість імперії домінувати в морях та захищати свою торгівлю та береги."

MIG_naval_guns:0 "Морські Гармати"
MIG_naval_guns_desc:0 "Вища вогнева міць є важливою для нашої військово-морської доктрини. Покращуючи виробництво морських гармат та встановлюючи передову артилерію на наших кораблях, Китайський Імперський Флот може домінувати в прибережних боях та морських битвах. Ці гармати — сталеві пальці нашої імперії, які проєктують авторитет та гарантують ворогу неминучу поразку."

MIG_strengthen_coastline:0 "Зміцнити Берегову Лінію"
MIG_strengthen_coastline_desc:0 "Укріплена берегова лінія є першою лінією оборони проти будь-якої морської загрози. Будуючи військово-морські бази та прибережні бункери у стратегічних точках, ми захищаємо життєво важливі порти та забезпечуємо швидку відповідь на вторгнення. Береги Імперії Мін тепер не лише прекрасні, але й неприступні."

MIG_maritime_artillery:0 "Морська Артилерія"
MIG_maritime_artillery_desc:0 "Наші прибережні укріплення посилені передовою морською артилерією. Ці батареї гарантують, що будь-який ворожий флот зустрінеться з нищівною вогневою міццю, стримуючи агресію та захищаючи наші суверенні води. Кожна гармата, кожна установка відображає рішучість Китаю домінувати в морях."

MIG_superior_navy:0 "Вищий Флот"
MIG_superior_navy_desc:0 "Завдяки інноваціям, дисциплінованим екіпажам та модернізованим кораблям, Імперський Флот досягає переваги над регіональними конкурентами. Вища тактика, передові технології та добре обслуговуваний флот дозволяють нам проєктувати силу, захищати торговельні шляхи та підтримувати морські інтереси імперії з непохитною міццю."

MIG_stockpile_fuel:0 "Запастися Паливом"
MIG_stockpile_fuel_desc:0 "Паливо — це життєва сила сучасної війни. Забезпечуючи та накопичуючи запаси нафти у стратегічних об'єктах, імперія гарантує, що її армії, флоти та повітряні сили можуть діяти без перерв. Готовність в енергетиці гарантує, що жоден ворог не зможе скористатися дефіцитом чи уповільнити наш марш до перемоги."

MIG_imperial_marines:0 "Імперська Морська Піхота"
MIG_imperial_marines_desc:0 "Спеціалізовані на амфібійній війні, Імперська Морська Піхота навчена завдавати ударів з моря на сушу з точністю та рішучістю. Оснащені передовим спорядженням та навчені для спільних операцій, ці елітні війська гарантують, що інтереси імперії можуть бути захищені скрізь, де хвилі зустрічаються з берегом."

MIG_chinese_flotilla:0 "Китайська Флотилія"
MIG_chinese_flotilla_desc:0 "Формування спеціалізованої флотилії зміцнює здатність імперії патрулювати прибережні води, реагувати на загрози та підтримувати більші військово-морські операції. Спритні, універсальні та добре озброєні, ці підрозділи підтримують морську безпеку, водночас проєктуючи міць Мін через наші внутрішні моря та річкові мережі."

MIG_light_crusiers:0 "Легкі Крейсери"
MIG_light_crusiers_desc:0 "Швидкі, маневрені та легко озброєні, наші легкі крейсери служать розвідниками, ескортом та захисниками торгівлі. Вони дозволяють флоту швидко реагувати на загрози, проводити розвідку та підтримувати більші судна в бою. Їхня присутність гарантує, що Китайський Імперський Флот зберігає гнучкість та оперативне охоплення."

MIG_heavy_crusiers:0 "Важкі Крейсери"
MIG_heavy_crusiers_desc:0 "Важко озброєні та броньовані, ці крейсери є молотом нашого флоту. Вони проникають глибоко у ворожі формування, забезпечують вогневу підтримку легшим підрозділам та служать видимим стримуючим фактором для потенційних агресорів. Важкі крейсери символізують рішучість імперії та морську міць."

MIG_naval_intelligence:0 "Морська Розвідка"
MIG_naval_intelligence_desc:0 "Знання такі ж потужні, як і сталь. Інвестуючи в морську розвідку, ми відстежуємо рух ворога, передбачаємо загрози та оптимізуємо розгортання флоту. Вища інформація дозволяє Китайському Імперському Флоту діяти рішуче, перехиляючи суперників та забезпечуючи домінування над морським простором."

MIG_escort_destroyers:0 "Ескортні Есмінці"
MIG_escort_destroyers_desc:0 "Есмінці забезпечують спритний захист наших основних флотів, оберігаючи їх від підводних човнів, рейдерів та несподіваних атак. Їхня швидкість, вогнева міць та спеціалізоване обладнання гарантують безпеку більших суден та забезпечують контроль над ключовими морськими шляхами, відображаючи стратегічну передбачливість та військово-морський досвід імперії."

MIG_superior_subs:0 "Вищі Підводні Човни"
MIG_superior_subs_desc:0 "Наш підводний флот завдає ударів тихо під хвилями, здатний калічити вороже судноплавство та збирати життєво важливу розвідку. Поєднуючи непомітність, витривалість та передові технології, ці підводні воїни розширюють охоплення нашого флоту та створюють невизначеність у свідомості будь-якого супротивника, що розглядає морське протистояння."

MIG_battleships:0 "Лінкори"
MIG_battleships_desc:0 "Основа військово-морської могутності, лінкори забезпечують неперевершену вогневу міць та стійкість. Кожне судно — це плавуча фортеця, здатна формувати результат морських боїв. Їхня присутність гарантує контроль імперії над стратегічними водами та підкреслює прихильність Китаю до панування на морі."

MIG_proper_carriers:0 "Повноцінні Авіаносці"
MIG_proper_carriers_desc:0 "Авіаносці трансформують морську війну, слугуючи мобільними авіабазами, що проєктують силу далеко від рідних берегів. Замовляючи авіаносці класу 'Ляонін', імперія демонструє технологічну майстерність та стратегічну передбачливість. Ці плавучі фортеці дозволяють Імперському Флоту контролювати небо та домінувати на віддалених театрах із неперевершеним охопленням та гнучкістю."

MIG_refit_civilian_ships:0 "Переоснастити Цивільні Кораблі"
MIG_refit_civilian_ships_desc:0 "Імперія розпочала переобладнання цивільних лайнерів у допоміжні авіаносці, перетворюючи судна комерції на інструменти війни. Посилені корпуси, авіаційні палуби та протиповітряна оборона роблять їх життєво важливими для проєктування сили вздовж нашого узбережжя та територій. Розширені верфі прискорюють ці переобладнання, зміцнюючи флот та захищаючи ключові порти в цю невизначену еру."

MIG_top_of_the_line_navy:0 "Флот Найвищого Класу"
MIG_top_of_the_line_navy_desc:0 "Китайський Імперський Флот стоїть сильнішим, ніж будь-коли, виставляючи крейсери, лінкори та есмінці, озброєні сучасною артилерією, торпедами та протиповітряними системами. Сміливі адмірали, розширені верфі та нові класи крейсерів, як-от 'Шаньдун', знаменують піднесення імперії як справжньої морської держави, готової захищати свої береги та проєктувати вплив за кордон."
