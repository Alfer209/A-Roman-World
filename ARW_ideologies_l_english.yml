paternalism_noun: "Paternal"
paternalism_desc: "Paternal Regime"

FACTION_NAME_PATERNALISM_1: "The $LEADER_COUNTRY_ADJ$ Union"

corppat: "Corporate Paternalism"
corppat_desc: "Neither a sovereign state nor a true colony, the Concession Cities exist under the control of an international mandate composed of foreign generals, governors, and corporate syndicates. Rule is paternalistic, justified as 'protection' of trade and order, yet fundamentally driven by profit. This unique structure blends paternal authority with corporate governance, creating an international zone where sovereignty is sacrificed to multinational interests.\n--------------------------\n§YCorporate Paternalism§!"

patautocrat: "Paternal Autocracy"
patautocrat_desc: "A paternal autocracy is a system built upon order, traditon, and authority. The state is seen as a guiding hand, where rulers govern as guardians of the nation rather than servants of the people. Individual freedom is heavily limited, but in exchange the people are promised stability, unity, and the preseveration of established values. Loyalty to the state and obedience to its leaders are upheld as virtues, ensuring continuity in times of uncertainity.\n--------------------------\n§YPaternal Autocracy§!"

theocracy: "Theocracy"
theocracy_noun: "Theocratic"
theocracy_desc: "Theocratic Regime"

FACTION_NAME_THEOCRACY_1: "The $LEADER_COUNTRY_ADJ$ Coalition"

islamictheocracy: "Islamic Theocracy"
islamictheocracy_desc: "An Islamic theocracy is a form of government where religious law, derived from Islamic principles and teachings, forms the basis of the state's legal system and political authority. In this system, religious leaders or scholars hold significant power, exercising influence over governmental processes and claiming divine guidance or acting as God's representatives on Earth. The goal is to establish a system of government that reflects and enforces Islamic values and laws, often through a council of religious figures who vet candidates or influence policy.\n--------------------------\n§YIslamic Theocracy§!"

