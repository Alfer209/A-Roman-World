ldscom_desc: "The Latter day saints have long practiced the law of consecration, communism is a natural extension of this"

cum_anarchy: "Cumanic Anarchism"
cum_anarchy_desc: "A radical ideology without a state."

communism: "Communism"
communism_desc: "§R'Communism is the doctrine of the conditions of the liberation of the proletariat.' - Frederick Engels.§!\n\nCommunism is an interesting ideology, to say the least. But what exactly is communism? Descended and encompasses all groups from the thought of Marx and Engels, end goals include the establishment of a classless, stateless, humane and human society based on common ownership of the means of production and free distribution thereof according to one's needs. Its adherents are firm believers in the concept of class struggle, and aim to overthrow the bourgeoisie to establish a dictatorship of the proletariat - a society and government where the working class and the state are synonymous.\n\nWhile some movements believe in electoralism, most strains of communism are fiercely revolutionary, and tirelessly advocate for the coming of said revolution through 'praxis', or direct action. In this regard, they consciously emulate Lenin and reject the prospect of reform and compromise. Of course, critics abound from all sides; from people claiming that human nature is inherently individualistic and selfish, to socialists decrying the means employed to bring about the proletarian dictatorship, communism has no shortage of detractors. And yet, 'Reds' of all stripes fight on, for they know that once the workers of the world unite, they have nothing to lose but their chains.\n--------------------------\n§YCommunism§!"
