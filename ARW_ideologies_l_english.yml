l_english:

romanitasautocracy: "Романітанська автократія"
romanitasautocracy_noun: "Римський автократ"
romanitasautocracy_desc: "Римський автократичний режим"

aristocracy: "Римська елліністична аристократія"
aristocracy_desc: "Римська елліністична аристократія — це витончена синтеза давньоримської влади та елліністичного державного управління, що наголошує на балансі між імперською владою та аристократичним наглядом. Заснована на традиціях Візантії, вона підтримує божественну легітимність, одночасно сприяючи розширенню бюрократичної адміністрації. Ця система цінує культуру, освіту та дипломатію, прагнучи зберегти східну спадщину Риму як через управління, так і через ретельне координування військової сили."

autocratia: "Латино-римська автократія"
autocratia_desc: "Латино-римська автократія втілює незмінну могутність Західного Риму, де центральна влада має беззаперечну силу, засновану на традиціях і військовому престижі. Ця система, міцно вкорінена в латино-римських звичаях, наголошує на сильному лідерстві, територіальній експансії та дисциплінованому дотриманні законів. Вона покликана поширювати римський вплив назовні, придушуючи внутрішні розбіжності та підтримуючи стабільність завдяки поєднанню влади, військової сили та дотримання класичних римських ідеалів.

neoromanism: "Неороманізм"
neoromanism_desc: "Неороманізм — це сучасна репрезентація Римських ідеалів, сформована в Легіонерських Штатах після отримання незалежності від влади Західної Римської Імперії. Поєднуючи революційний дух з шаною до історичного управління Римом, він наголошує на громадянському мілітаризмі, національному об'єднанні та промисловій модернізації. Неороманізм відстоює розширення держави як за допомогою дипломатії, так і рішучих дій, прагнучи відродити велич Риму в сучасному, американізованому контексті, зберігаючи при цьому його філософську та культурну спадщину."
FACTION_NAME_ROMANITASAUTOCRACY_1: "Альянс $LEADER_COUNTRY_ADJ$"

russiandem: "Демократія"
russiandem_noun: "Демократичний"
russiandem_desc: "Соціал-демократичний режим"

socdem: "Соціал-демократія"
socdem_desc: "Соціал-демократія — це соціальна, економічна та політична філософія в рамках соціалізму, яка підтримує політичну та економічну демократію, а також поступовий, реформістський і демократичний підхід до досягнення соціальної рівності."

demsoc: "Демократичний Соціалізм"
demsoc_desc: "Демократичний Соціалістичний режим"

provs: "Тимчасова Соціалістична Республіка"
provs_desc: "Створені під наглядом Російської Федеративної Соціалістичної Республіки, тимчасові соціалістичні республіки служать як буфером, так і експериментом у соціалістичному управлінні. Хоча їхні інституції офіційно є «тимчасовими», на практиці вони перебувають під пильним наглядом і керівництвом російських чиновників та військових адміністраторів. Проголошена незалежність є скоріше символічною, ніж реальною, а політичний курс республік міцно пов'язаний з Москвою."

parliament: "Парламентська демократія"
parliament_desc: "Парламентська демократія — це система правління, за якої народ обирає представників для формування законодавчої влади, яка, у свою чергу, контролює виконавчу владу. Влада виходить від парламенту, де дебати, компроміси та правило більшості визначають напрямок розвитку країни. Вона цінує громадянські свободи, верховенство права та мирну передачу влади. Хоча парламентську демократію часто критикують за нерішучість або повільність у кризових ситуаціях, вона забезпечує легітимність, закріплюючи державну владу у волі своїх громадян."

FACTION_NAME_RUSSIANDEM_1: "Альянс $LEADER_COUNTRY_ADJ$"

monarchism: "Монархізм"
monarchism_noun: "Монархіст"
monarchism_desc: "Монархіський режим"

legitmonarchism: "Легітимний монархізм"
legitmonarchism_desc: "Легітимний монархізм — це ідеологія династичної спадкоємності та законного правонаступництва, яка особливо поширена в Новій Іспанії. Заснована на лояльності до вигнаної іспанської корони, вона розглядає Мексику не як наступницю, а як справжню спадкоємицю Іспанської імперії. Легітимний монархізм закликає до відновлення Іберії під владою її законного монарха, ставлячи традиції та божественне право вище республіканізму чи претендентів на престол."

mandateofheaven: "Мандат Небес"
mandateofheaven_desc: "Мандат Небес — це божественний принцип, що надає легітимність правлінню, дарований імператору як Сину Неба. На відміну від абсолютного божественного права, цей мандат є умовним — процвітання, справедливість і порядок свідчать про прихильність Неба, тоді як голод, корупція і заворушення сигналізують про його відмову. За часів династії Мін мандат поєднує конфуціанську гармонію, династичну спадкоємність і бюрократичне управління, пов'язуючи правителя і підданих священним союзом. Слідувати за імператором означає підтримувати космічний порядок; чинити йому опір означає кидати виклик самому Небу."

constitmonarch: "Конституційна Монархія"
constitmonarch_desc: "Конституційна монархія — це система правління, в якій монарх, наприклад король або королева, є главою держави, але його повноваження обмежені конституцією та рекомендаціями обраного уряду. Хоча монарх символічно представляє націю, його фактична політична влада обмежена законом і звичаями, а реальна влада належить демократично обраним чиновникам, які керують країною."

absolutism: "Абсолютна Монархія"
absolutism_desc: "Абсолютна монархія — це форма правління, за якої єдиний правитель, монарх, має необмежену і безмежну владу над державою, без будь-яких стримувань і противаг з боку конституції, законодавчих органів чи інших урядових структур. У цій системі монарх є єдиним джерелом політичної влади і може приймати рішення та закони без необхідності затвердження з боку інших гілок влади."

FACTION_NAME_MONARCHISM_1: "Альянс $LEADER_COUNTRY_ADJ$"

ordenstaat: "Орденштат"
ordenstaat_noun: "Орденштат"
ordenstaat_desc: "Режим Орденштату"

teutonic: "Тевтонізм"
teutonic_desc: "Тевтонізм, державна ідеологія Тевтонської імперії, є войовничою ультранаціоналістичною ідеологією, викуваною в горнилі багатовікової боротьби проти Риму. Заснована на середньовічному лицарському ордені, вона підносить націю до рівня священного братства — святого «Ordensstaat» — яке присягнулося бути «щитом Європи» проти «корумпованого римського світу». Тевтони вважають себе обраними Богом хрестоносцями, спадкоємцями божественної місії зруйнувати Рим, скинути його самозванців-імператорів і підняти свій чорний хрест над світом. Її доктрини поєднують релігійний фанатизм, расовий шовінізм і повну покірність Хохмейстеру, обіцяючи єдність і славу через завоювання. Для своїх послідовників тевтонізм — це не просто політика, а свята війна.
FACTION_NAME_ORDENSTAAT_1: "$LEADER_COUNTRY_ADJ$ий Імперіум "

paternalism: "Патерналізм"
paternalism_noun: "Патерналіст"
paternalism_desc: "Патерналістичний режим"

FACTION_NAME_PATERNALISM_1: "$LEADER_COUNTRY_ADJ$івський союз"

corppat: "Корпоративний Патерналізм"
corppat_desc: "Не будучи ані суверенною державою, ані справжньою колонією, міста-концесії існують під контролем міжнародного мандата, до складу якого входять іноземні генерали, губернатори та корпоративні синдикати. Управління є патерналістським, виправдовується «захистом» торгівлі та порядку, але в основі лежить прагнення до прибутку. Ця унікальна структура поєднує патерналістську владу з корпоративним управлінням, створюючи міжнародну зону, де суверенітет поступається місцем інтересам транснаціональних корпорацій.\n--------------------------\n§YКорповативний Патерналізм§!"

patautocrat: "Патерналіська Автократія"
patautocrat_desc: "Патерналістська Автократія — це система, побудована на порядку, традиціях та авторитеті. Держава розглядається як керівна сила, де правителі керують як захисники нації, а не слуги народу. Індивідуальна свобода сильно обмежена, але натомість народу обіцяють стабільність, єдність та збереження встановлених цінностей. Лояльність до держави та послух її лідерам вважаються чеснотами, що забезпечують стабільність у часи невизначеності.\n--------------------------\n§YПатерналістична Автократія§!"

theocracy: "Теократія"
theocracy_noun: "Теократичний"
theocracy_desc: "Теократичний режим"

FACTION_NAME_THEOCRACY_1: "$LEADER_COUNTRY_ADJ$івська коаліція"

islamictheocracy: "Ісламська Теократія"
islamictheocracy_desc: "Ісламська теократія — це форма правління, в якій релігійне право, що випливає з ісламських принципів і вчень, становить основу правової системи та політичної влади держави. У цій системі релігійні лідери або вчені мають значну владу, впливають на урядові процеси та заявляють про божественне керівництво або діють як представники Бога на Землі. Мета полягає у створенні системи правління, яка відображає та забезпечує дотримання ісламських цінностей і законів, часто через раду релігійних діячів, які перевіряють кандидатів або впливають на політику.\n--------------------------\n§YІсламська Теократія§!"

radicalsocialism: "Radical Socialism"
radicalsocialism_noun: "Radical Socialist"
radicalsocialism_desc: "Radical Socialist Regime"

FACTION_NAME_RADICALSOCIALISM_1: "$LEADER_COUNTRY_ADJ$івський Інтернаціонал "

minsheng: "Міншенг"
minsheng_desc: "Життєдіяльність народу є основою Республіки. Під керівництвом Ван Цзинвея партія «Міншен» прагне об'єднати роздроблений південь, перерозподілити багатство та надати повноваження селянам і робітникам. Заснована на баченні Сунь Ятсена про три принципи народу, вона надає пріоритет земельній реформі, державній промисловості та громадському добробуту, одночасно протистоячи вторгненню імперіалістичних держав та владі конкуруючих династій. Рух є безкомпромісним, революційним та прагматичним — його метою є відновлення Китаю з нуля, забезпечення того, щоб суверенітет, рівність та добробут народу були невід'ємними стовпами управління.\n--------------------------\n§YМіншенгський Соціалізм§!"