minsheng: "Minsheng"
minsheng_desc: "The people’s livelihood is the foundation of the Republic. Under the guidance of Wang Jingwei, Minsheng seeks to unify the fractured south, redistribute wealth, and empower peasants and workers alike. Rooted in Sun Yat-Sen’s vision of the three principles of the people, it prioritises land reform, state-led industry, and public welfare, while resisting the encroachment of imperialist powers and rival dynastic authorities. The movement is uncompromising, revolutionary, and pragmatic—aiming to rebuild China from the ground up, ensuring that sovereignty, equality, and the welfare of the people are inseparable pillars of governance.\n--------------------------\n§YMinsheng Socialism§!"

