l_english:

romanitasautocracy: "Romanitas Autocracy"
romanitasautocracy_noun: "Roman Autocractic"
romanitasautocracy_desc: "Roman Autocratic Regime"

aristocracy: "Roman Hellenistic Aristocracy"
aristocracy_desc: "Roman Hellenistic Aristocracy is a sophisticated synthesis of ancient Roman authority and Hellenistic statecraft, emphasizing a balance between imperial power and aristocratic oversight. Rooted in the traditions of Byzantium, it upholds divine legitimacy while promoting a sprawling, bureaucratic administration. This system prizes culture, learning, and diplomacy, seeking to maintain Rome’s eastern legacy through both governance and the careful orchestration of military might."

autocratia: "Latin Roman Autocratia"
autocratia_desc: "The Latin Roman Autocratia embodies the enduring might of Western Rome, where the central authority wields unquestioned power grounded in tradition and martial prestige. Firmly rooted in Latin Roman customs, this system emphasizes strong leadership, territorial expansion, and the disciplined enforcement of law. It is designed to project Roman influence outward while suppressing internal dissent, maintaining stability through a combination of authority, military strength, and adherence to classical Roman ideals."

neoromanism: "Neo Romanism"
neoromanism_desc: "Neo-Romanism is a modern reinterpretation of Roman ideals, formed in the Legion States after independence from Western Roman authority. Blending revolutionary spirit with reverence for Rome’s historic governance, it emphasizes civic militarism, national unification, and industrial modernization. Neo-Romanism champions the expansion of the state through both diplomacy and decisive action, seeking to resurrect the grandeur of Rome in a contemporary, Americanised context while preserving its philosophical and cultural legacy."

FACTION_NAME_ROMANITASAUTOCRACY_1: "The $LEADER_COUNTRY_ADJ$ Alliance"

russiandem: "Democracy"
russiandem_noun: "Democratic"
russiandem_desc: "Socialist Democratic Regime"

socdem: "Social Democracy"
socdem_desc: "Social democracy is a social, economic, and political philosophy within socialism that supports political and economic democracy and a gradualist, reformist, and democratic approach toward achieving social equality. All other democratic forms of governments, such as liberal and conservative stem from the Russian Revolution.\n--------------------------\n§YSocial Democracy§!"

demsoc: "Democratic Socialism"
demsoc_desc: "TESTING"

liberaldem: "Liberal Democracy"
liberaldem_desc: "Liberal Democracy is a representative system shaped by the Russian Revolution, where the old autocracy fell and a new era of popular governance began. It upholds individual liberty, political pluralism, and equality under the law. Free and fair elections, constitutional protections, and limits on state power safeguard the rights of citizens from authoritarian rule. Inspired by Russia’s democratic revolution, nations across the world adopted these principles, creating a global order where personal freedoms and civic participation serve as the foundation of government.\n--------------------------\n§YLiberalism§!"

conservativedem: "Conservative Democracy"
conservativedem_desc: "Conservative Democracy, or simply Conservatism, emphasises responsible governance rooted in tradition, cultural heritage, and national identity. While embracing the democratic achievements pioneered by revolutionary Russia, conservative democrats argue for gradual reform and prioritising social stability over radical change. They uphold values such as family, religious institutions, national unity, property rights, and the rule of law. In both Russian and Roman worlds, these principles aim to preserve the moral and historical foundations of society while still honoring the democratic rights earned through the struggle against autocracy.\n--------------------------\n§YConservatism§!"

ldsdem: "Democratic Theocracy"
ldsdem_desc: "A theocracy with local democracy."

provs: "Provisional Socialist Republic"
provs_desc: "Established under the oversight of the Russian Federative Socialist Republic, provisional socialist republics serves as both a buffer and an experiment in socialist governance. While its institutions are officially 'temporary,' in practice they are closely monitored and directed by Russian officials and military administrators. Its proclaimed independence is more symbolic than real, with its political course firmly tied to Moscow."

FACTION_NAME_RUSSIANDEM_1: "The $LEADER_COUNTRY_ADJ$ Alliance"

monarchism: "Monarchism"
monarchism_noun: "Monarchist"
monarchism_desc: "Monarchist Regime"

legitmonarchism: "Legitimist Monarchism"
legitmonarchism_desc: "Legitimist Monarchism is the ideology of dynastic continuity and rightful inheritance, upheld above all in New Spain. Rooted in loyalty to the exiled Spanish Crown, it frames Mexico not as a successor, but as the true heir to the Spanish Empire. Legitimist Monarchism calls for the restoration of Iberia under its lawful monarch, placing tradition and divine right above republicanism or pretender thrones."

mandateofheaven: "Mandate of Heaven"
mandateofheaven_desc: "The Mandate of Heaven is the divine principle that grants legitimacy to rule, bestowed upon the Emperor as the Son of Heaven. Unlike absolute divine right, this mandate is conditional—prosperity, justice, and order prove Heaven’s favor, while famine, corruption, and unrest signal its withdrawal. Under the Ming Dynasty, the Mandate intertwines Confucian harmony, dynastic continuity, and bureaucratic governance, binding ruler and subject in a sacred covenant. To follow the Emperor is to uphold the cosmic order; to resist him is to challenge Heaven itself."

constitmonarch: "Constitutional Monarchy"
constitmonarch_desc: "A constitutional monarchy is a system of government where a monarch, such as a king or queen, serves as the head of state, but their powers are limited by a constitution and the advice of an elected government. While the monarch represents the nation symbolically, their actual political authority is constrained by law and custom, with power residing in democratically elected officials who govern the country."

absolutism: "Absolute Monarchy"
absolutism_desc: "An absolute monarchy is a form of government where a single ruler, the monarch, holds unlimited and unrestrained power over the state, with no checks or balances from constitutions, legislatures, or other governmental bodies. In this system, the monarch is the sole source of political authority and can make decisions and laws without requiring approval from other parts of the government."

FACTION_NAME_MONARCHISM_1: "The $LEADER_COUNTRY_ADJ$ Alliance"

ordenstaat: "Ordenstaat"
ordenstaat_noun: "Ordenstaat"
ordenstaat_desc: "Ordenstaat Regime"

teutonic: "Teutonism"
teutonic_desc: "Teutonism, the state creed of the Teutonic Empire, is a militant ultra-nationalist ideology forged in the crucible of centuries of struggle against Rome. Rooted in the medieval order of knights, it elevates the nation into a sacred brotherhood — a holy 'Ordensstaat' — sworn to be the 'Shield of Europe' against the 'corrupt Roman world.' The Teutons see themselves as God’s chosen crusaders, heirs to a divine mission to shatter Rome, dethrone its pretender emperors, and raise their black cross over the world. Its doctrines fuse religious zeal, racial chauvinism, and total obedience to the Hochmeister, promising unity and glory through conquest. To its followers, Teutonism is not merely politics, but a holy war."

democratic_jingoism:0 "Democratic Jingoism"
democratic_jingoism_desc:0 "Blending radical militarism with an elected mandate, Democratic Jingoism is a form of authoritarian democracy which seeks to see a state transformed into a war machine but by the will of the people as opposed to a military dictator." #placeholder description

FACTION_NAME_ORDENSTAAT_1: "The $LEADER_COUNTRY_ADJ$ Imperium"

