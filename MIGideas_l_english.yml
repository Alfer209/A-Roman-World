l_english:

MING_placated_assembly:0 "Заспокоєна Імперська Асамблея"
MING_placated_assembly_desc:0 "Через обережні переговори та стратегічне надання обмежених поступок, імперська асамблея була заспокоєна, забезпечуючи політичну стабільність, водночас зберігаючи верховенство трону. Хоча це відбувається ціною деякого уповільнення прогресу у виконанні політики, уряд користується підвищеною політичною маневреністю, що дозволяє лідерам консолідувати владу, забезпечувати союзи та зосереджувати ресурси на зміцненні імперії без постійного страху внутрішніх заворушень."

MING_lessons_of_the_revolution:0 "Уроки Революції"
MING_lessons_of_the_revolution_desc:0 "Шрами минулих повстань та громадянських заворушень не забуті. Покоління військових лідерів та науковців вивчали помилки та тріумфи попередніх повстань, застосовуючи їхні уроки до сучасної армії та повітряних сил. Методи підготовки вдосконалені, доктрини ретельно переглянуті, а досвід на полі бою скрупульозно задокументований. Як наслідок, сили імперії швидше набувають досвіду, можуть тренувати війська з більшою ефективністю та приймати нові тактики за зниженою ціною, гарантуючи, що помилки минулого ніколи не повторяться."

MING_rebuilding_efforts:0 "Зусилля з Відбудови"
MING_rebuilding_efforts_desc:0 "Імперія перебуває в процесі монументального відновлення, відбудовуючи міста, фабрики та інфраструктуру, спустошені роками конфлікту. Ефективність виробництва неухильно зростає, оскільки фабрики модернізуються, тоді як стабільність та задоволеність громадян поступово покращуються. Обережне управління споживчими товарами гарантує, що населення залишається задоволеним та продуктивним, дозволяючи імперії відновити свою економічну силу та закласти основи для оновленого періоду процвітання та промислових досягнень."

MING_militarisation:0 "Мілітаризація Імперії"
MING_militarisation_desc:0 "Визнаючи бурхливий світ навколо нас, імперія надала пріоритет розширенню та модернізації своїх військових сил. Перетворюючи цивільні фабрики на військове виробництво та значно інвестуючи у верфі та розвиток сухопутної доктрини, ми гарантуємо, що наші збройні сили залишаються сильними, адаптованими та готовими до будь-якої загрози. Ця мілітаризація гарантує, що імперія може захищати свої кордони, проєктувати силу за океан та швидко реагувати на постійно мінливий геополітичний ландшафт."

MING_antirepublicans:0 "Опозиція Республіканським Силам"
MING_antirepublicans_desc:0 "Імперські сили залишаються пильними проти республіканських та сепаратистських фракцій, які прагнуть підірвати авторитет трону. Стратегічне планування, сувора підготовка та обережне розгортання дозволяють нашим арміям здобути перевагу над республіканськими силами, збільшуючи як наступальні, так і оборонні можливості проти таких супротивників. Єдність та стійкість імперії посилюються рішучою відданістю збереженню традиційного управління проти внутрішніх та зовнішніх загроз."

MING_a_chinese_economy:0 "Китайська Економіка"
MING_a_chinese_economy_desc:0 "Імперія розпочала кампанію економічної модернізації, надаючи пріоритет ефективності фабрик, промисловій потужності та оптимізованим будівельним процесам. Інвестиції в інфраструктуру та новітні виробничі технології гарантують неухильне зростання економіки, при цьому фабрики працюють з максимальною ефективністю, а нові промислові проєкти швидко завершуються. Цей економічний фундамент зміцнює як цивільне життя, так і військову готовність, забезпечуючи процвітання та стабільність по всій імперії."

unityvirtueprosperity:0 "Єдність, Чеснота та Процвітання"
unityvirtueprosperity_desc:0 "Народ імперії натхненний спільним почуттям мети та повагою до чеснот традицій та управління. Стабільність зростає, оскільки громадяни приймають ці ідеали, тоді як політична влада тече вільніше, дозволяючи державі ефективніше впроваджувати реформи та реагувати на кризи. Гармонія населення підкріплює силу імперії, забезпечуючи стійке суспільство, готове зустрічати виклики з рішучістю та лояльністю."

strengthordersoverignity:0 "Сила, Порядок та Суверенітет"
strengthordersoverignity_desc:0 "Імперія наголошує на військовій готовності, дисциплінованому управлінні та підтримці суверенного авторитету. Військова підтримка посилюється, а армії швидше набувають досвіду, але суворі заходи, необхідні для підтримання порядку, можуть іноді напружувати внутрішню стабільність. Тим не менш, ці жертви вважаються необхідними для проєктування сили, збереження територіальної цілісності та утвердження законного місця імперії серед націй світу."

bloodobediencedestiny:0 "Кров, Покора та Доля"
bloodobediencedestiny_desc:0 "Сила імперії черпається з непохитної лояльності, ієрархічного порядку та безперервної спадкоємності династичного авторитету. Політична влада генерується з надзвичайною ефективністю, дозволяючи уряду діяти рішуче, але ціною певної внутрішньої напруги. Цей баланс відданості та авторитету гарантує, що імперія слідує своїм призначеним шляхом, укріплена рішучістю свого народу та незмінною спадщиною своїх правителів."

fruits_of_japan:0 "Плоди Японії"
fruits_of_japan_desc:0 "Через торгівлю, придбання ресурсів та обережне управління закордонними відносинами, імперія отримує вигоду від розширеного доступу до необхідної сировини. Промислове будівництво прогресує ефективніше, а місцеві ресурси експлуатуються на повну потужність. Ці зусилля забезпечують імперії економічний та промисловий фундамент, необхідний для підтримки експансії, модернізації та створення самодостатнього військово-промислового комплексу."

MIG_foreign_contracts:0 "Іноземні Контракти"
MIG_foreign_contracts_desc:0 "Імперія уклала вигідні угоди з іноземними державами, надаючи доступ до передового обладнання та виробничих технологій. Фабрики отримують вигоду від швидших темпів будівництва, тоді як виробництво споживчих товарів дещо зменшується, щоб надати пріоритет військовому та промисловому випуску. Ці контракти забезпечують як негайні ресурси, так і довгострокову передачу знань, зміцнюючи нашу промислову базу та забезпечуючи стабільне постачання необхідних матеріалів."

MIG_foreign_production:0 "Підтримка Іноземного Виробництва"
MIG_foreign_production_desc:0 "Використовуючи міжнародний досвід та промислові 'ноу-хау', імперія прискорює виробництво піхотного обладнання, артилерії та броньованих машин. Доступ до передових іноземних проєктів та технологій зменшує витрати та час виробництва, дозволяючи нашим збройним силам швидко модернізуватися та підтримувати технологічну перевагу над потенційними супротивниками. Вливання іноземних ресурсів зміцнює як наші військові, так і нашу спроможність для стійкого промислового зростання."

MIG_foreign_investors:0 "Іноземні Інвестори"
MIG_foreign_investors_desc:0 "Інвестиції від закордонних фінансистів приносять критично важливий капітал та досвід у промисловий сектор імперії. Фабрики працюють ефективніше, виробничі лінії швидко адаптуються, і загальний промисловий випуск зростає. Хоча політичний вплив іноземних інвесторів дещо обмежує урядове прийняття рішень, відчутні переваги для виробництва та технологічного розвитку надають імперії міцніший економічний фундамент та покращену здатність підтримувати військове розширення."

MIG_western_railways:0 "Західні Залізниці"
MIG_western_railways_desc:0 "Розширення сучасних залізниць, спроєктованих та профінансованих за іноземною допомогою, революціонізувало транспорт по всій імперії. Сировина, готова продукція та війська можуть пересуватися з безпрецедентною швидкістю, тоді як місцеві ресурси експлуатуються ефективніше. Ця інфраструктура не лише зміцнює комерцію та промисловість, але й забезпечує швидку стратегічну мобільність, дозволяючи імперії швидко реагувати на загрози та проєктувати силу на своїх територіях."

kaiping_mines:0 "Копальні Кайпін"
kaiping_mines_desc:0 "Експлуатація Кайпінських мінеральних родовищ стала наріжним каменем промислового зростання імперії. Фабрики, збройові заводи та важка промисловість отримують вигоду від стабільного потоку сировини, тоді як дослідження в галузі видобутку покращують ефективність. Ці копальні забезпечують як негайні ресурси для виробництва, так і довгострокове технологічне розуміння, підкріплюючи прагнення імперії до економічної та військової модернізації."

daye_hanyang:0 "Промислова Експансія в Дає та Ханьян"
daye_hanyang_desc:0 "Промислові центри Дає та Ханьян переживають безпрецедентне зростання, з фабриками та збройовими заводами, що працюють на максимальній потужності. Збільшена швидкість виробництва та промислова ефективність дозволяють швидко розширювати інфраструктуру, тоді як дослідження передових технологій гарантують, що ці регіони залишаються на передовій зусиль імперії з модернізації. Це розширення зміцнює як економічну, так і військову міць, цементуючи промислову основу імперії."

achinaunited:0 "Об'єднаний Китай"
achinaunited_desc:0 "Імперія успішно консолідувала контроль над раніше розколотими регіонами, приносячи єдність та порядок на землю. Промислова потужність максимізована, будівельні проєкти швидко просуваються, а додаткові слоти для будівництва в ключових провінціях дозволяють швидко розвиватися. Ця єдність не лише зміцнює економічну та військову базу імперії, але й посилює оборонні можливості, забезпечуючи, що внутрішня згуртованість підкріплює національну безпеку."

distributed_real_country:0 "Розподілена Справжня Країна"
distributed_real_country_desc:0 "Імперія підтримує стабільність та промислову ефективність, балансуючи регіональний розвиток із централізованим наглядом. Фабрики працюють на повну потужність, і населення відчуває підвищену політичну та соціальну стабільність. Цей обережний розподіл ресурсів та влади гарантує, що імперія залишається стійкою, здатною витримувати кризи, водночас продовжуючи свою програму промислового та військового прогресу."

thedragonemperor:0 "Імператор Дракон"
thedragonemperor_desc:0 "Правлячий Імператор Дракон забезпечує фігуру стабільності та натхнення для імперії. Під його керівництвом виробництво та будівництво йдуть ефективно, водночас підтримується політична стабільність. Присутність імператора посилює легітимність держави, забезпечуючи безперервність управління та збереження традиційного авторитету по всій імперії."

thedragonemperor2:0 "Імператор Дракон"
thedragonemperor2_desc:0 "Правлячий Імператор Дракон забезпечує фігуру стабільності та натхнення для імперії. Під його керівництвом виробництво та будівництво йдуть ефективно, водночас підтримується політична стабільність. Присутність імператора посилює легітимність держави, забезпечуючи безперервність управління та збереження традиційного авторитету по всій імперії."

consolidatedinternationalindustries:0 "Консолідовані Міжнародні Промисловості"
consolidatedinternationalindustries_desc:0 "Через стратегічні злиття та партнерства з міжнародними промисловими фірмами, імперія розширила свою спроможність для виробництва та технологічного прогресу. Фабрики досягають вищої ефективності, промисловий випуск зростає, а нові будівельні проєкти прискорюються. Хоча виникає певна напруга від централізації цих галузей, імперія отримує вигоду від неперевершених виробничих можливостей та посиленої економічної могутності."

cooperatingwithteutons:0 "Співпраця з Тевтонськими Інженерами"
cooperatingwithteutons_desc:0 "Співпраця з Тевтонськими інженерами дозволяє імперії оптимізувати дослідження сухопутної доктрини, ефективніше приймаючи передові військові технології. Це партнерство сприяє швидкій модернізації армії, забезпечуючи, що наші сили залишаються конкурентоспроможними на полі бою та здатними виконувати складні операції з точністю."

MIG_eastromansupport:0 "Східноримська Підтримка"
MIG_eastromansupport_desc:0 "Допомога від Східної Римської Імперії надає імперії цінні знання у військовій доктрині та організаційній стратегії. Дослідження сухопутної доктрини прискорюється, уможливлюючи ефективнішу розробку тактик та оперативних процедур. Ця підтримка гарантує, що наші збройні сили можуть приймати найкращі практики з-за кордону, водночас зберігаючи національні традиції та стратегічну автономію."

MIG_eastromansupport2:0 "Східноримська Підтримка"
MIG_eastromansupport2_desc:0 "Допомога від Східної Римської Імперії надає імперії цінні знання у військовій доктрині та організаційній стратегії. Дослідження сухопутної доктрини прискорюється, уможливлюючи ефективнішу розробку тактик та оперативних процедур. Ця підтримка гарантує, що наші збройні сили можуть приймати найкращі практики з-за кордону, водночас зберігаючи національні традиції та стратегічну автономію."

MIG_a_fractured_mandate:0 "Розколотий Мандат"
MIG_a_fractured_mandate_desc:0 "Імперія стикається з внутрішніми розколами та політичною фрагментацією, що підриває центральну владу. Стабільність хитка, і політичну владу важче ефективно здійснювати. Захист від відхилень страждає, вимагаючи обережного управління як внутрішніми, так і військовими справами. Радники коштують дорожче, що відображає виклик управління розділеною державою. Незважаючи на ці труднощі, імперія зберігає потенціал для відновлення через стратегічну реформу та консолідацію влади."

anti_japanese_warriors:0 "Антияпонські Воїни"
anti_japanese_warriors_desc:0 "Патріотичні воїни та місцеві ополчення стоять пильно проти Японців. Їхня хоробрість та тактична майстерність підвищують ефективність імперських сил в операціях проти Японії, посилюючи як наступальну, так і оборонну ефективність. Ці воїни втілюють дух опору, надихаючи ширше населення та зміцнюючи рішучість імперії захищати свій суверенітет за будь-яку ціну."

indonesianliberationcampaign:0 "Індонезійська Визвольна Кампанія"
indonesianliberationcampaign_desc:0 "Імперія виділила ресурси на підтримку визвольних рухів за кордоном, зокрема в архіпелазі Індонезії. Амфібійні операції посилюються, виснаження мінімізується, а атаки на малі держави стають ефективнішими. Ці кампанії зміцнюють імперський вплив за океаном, демонструють військові можливості та надають цінний досвід в експедиційній війні, забезпечуючи стратегічні позиції та сприяючи союзам у віддалених регіонах."

MIG_stockpiling_fuel:0 "Стратегічні Запаси Палива"
MIG_stockpiling_fuel_desc:0 "Імперія надала пріоритет накопиченню та управлінню запасами палива для армії, флоту та повітряних сил. Зменшене споживання палива всіма силами, у поєднанні зі швидшим будівництвом сховищ палива, гарантує, що імперія залишається оперативно гнучкою та здатною підтримувати тривалі військові кампанії, як удома, так і за кордоном."

MIG_imperial_marines:0 "Імперська Морська Піхота"
MIG_imperial_marines_desc:0 "Спеціалізовані амфібійні підрозділи підвищують здатність імперії проводити прибережні штурми та закордонні операції. Ця елітна морська піхота збільшує спроможність вторгнення, покращує швидкість підготовки та високо навчена для швидкого розгортання, забезпечуючи, що імперія може проєктувати силу через річки, узбережжя та острови з винятковою ефективністю та тактичною точністю."

MIG_superior_navy:0 "Вищий Флот"
MIG_superior_navy_desc:0 "Через модернізацію та сувору підготовку імперський флот досягає вищих можливостей. Доктрини приймаються за зниженою ціною, моральний дух флоту посилюється, а штрафи за рух ударної сили мінімізуються. Це гарантує, що військово-морські сили імперії здатні захищати торговельні шляхи, забезпечувати територіальні води та ефективно проєктувати морську силу."

MIG_chinese_flotilla:0 "Китайська Флотилія"
MIG_chinese_flotilla_desc:0 "Зосереджуючись на менших кораблях та підводних човнах, імперія розробляє спеціалізовані флотилії, здатні до рейдерства конвоїв, морських сутичок та операцій швидкого реагування. Підводні човни ефективніше відступають, критично важливі військово-морські дії мають вищий відсоток успіху, і вся флотилія діє з посиленою координацією, максимізуючи стратегічну корисність наших менших військово-морських підрозділів."

MIG_naval_intelligence:0 "Морська Розвідка"
MIG_naval_intelligence_desc:0 "Передова криптографія та збір розвідувальних даних покращують військово-морські операції імперії. Флот отримує вигоду від швидшої дешифровки та посиленої ефективності розвідки, надаючи командирам кращу інформацію для стратегічного прийняття рішень, тактичних маневрів та оперативного планування на всіх театрах морського залучення."

MIG_a_fractured_mandate2:0 "Розколотий Мандат"
MIG_a_fractured_mandate2_desc:0 "Імперія продовжує боротися з внутрішніми політичними розколами та фрагментованою владою. Хоча стабільність маргінально підтримується, спроможність держави здійснювати владу обмежена, а захист від відхилень страждає. Управління вимагає обережного менеджменту для запобігання подальшого ослаблення, але залишаються можливості для консолідації влади та відновлення єдності та сили імперії з часом."

theguanziyingarmy:0 "Армія Гуанцзіїн"
theguanziyingarmy_desc:0 "Армія Гуанцзіїн втілює дисципліновану, традиційну військову міць імперії. Війська ефективно тренуються, польові офіцери можуть бути підвищені з меншими витратами, а медалі надихають лояльність та моральний дух. Хоча відновлення організації відбувається поступово, обережна підготовка забезпечує, що ці війська формують надійну основу сухопутних сил імперії, здатних тримати лінію в тривалих конфліктах."

theguanziyingarmytraditional:0 "Армія Гуанцзіїн"
theguanziyingarmytraditional_desc:0 "Вкорінена в історичній тактиці та освячених часом формуваннях, традиційна Армія Гуанцзіїн відмінно справляється як в атаці, так і в обороні. Армія отримує скромні бонуси до бойової ефективності та прийняття доктрини, відображаючи силу досвіду, дисципліни та тактичної спадкоємності, що передається через покоління імперських солдатів."

theguanziyingarmyoverwhelm:0 "Армія Гуанцзіїн"
theguanziyingarmyoverwhelm_desc:0 "З посиленою підготовкою та агресивними доктринами, Армія Гуанцзіїн досягає домінування на полі бою. Війська завдають сильніших ударів, ефективніше захищаються та швидко відновлюють організацію, дозволяючи командирам виконувати рішучі операції та перевантажувати супротивників через вищу концентрацію сил та скоординовані маневри."

theguanziyingarmyexpansion:0 "Армія Гуанцзіїн"
theguanziyingarmyexpansion_desc:0 "Імперія зосереджується на розширенні бронетанкових та механізованих дивізій в Армії Гуанцзіїн. Танки та мобільні підрозділи діють зі збільшеною швидкістю та ефективністю, тоді як операції об'єднаних родів військ покращують загальну мобільність на полі бою. Це розширення зміцнює наступальні можливості та підвищує здатність імперії реагувати на численні загрози одночасно."

theguanziyingarmygreenstandards:0 "Армія Гуанцзіїн"
theguanziyingarmygreenstandards_desc:0 "Включення елітних підрозділів 'Зеленого Штандарту' (Green Standard) дозволяє Армії Гуанцзіїн поєднати традиційну піхотну дисципліну з модернізованою бронетехнікою та мобільністю. Бонуси до атаки та оборони покращуються, бронетанкові підрозділи завдають потужніших ударів та маневрують ефективніше, а відновлення організації відбувається швидше, роблячи ці сили високо адаптованими як у конвенційній, так і в мобільній війні."

theguanziyingarmysuperior1:0 "Армія Гуанцзіїн"
theguanziyingarmysuperior1_desc:0 "Армія Гуанцзіїн 'Вищий I' демонструє досконалість на полі бою. Піхота, бронетехніка та доктрини оптимізовані для максимальної ефективності, з швидким відновленням організації та швидшим окопуванням. Ці елітні формування становлять рішуче ядро, здатне виконувати складні операції та швидко адаптуватися до мінливих умов поля бою."

theguanziyingarmysuperior2:0 "Армія Гуанцзіїн"
theguanziyingarmysuperior2_desc:0 "Підрозділи 'Вищий II' Армії Гуанцзіїн — це елітні сили, що поєднують виняткові можливості атаки та оборони, вищу броньовану ефективність та підвищену швидкість. Їхня організація швидко відновлюється, надаючи командирам можливість розпочинати стійкі операції та підтримувати домінування на багатьох фронтах."

new_armoured_divisions:0 "Нові Бронетанкові Дивізії"
new_armoured_divisions_desc:0 "Імперія інвестувала в сучасні бронетанкові дивізії, покращуючи можливості механізованої війни та зменшуючи витрати на доктрину. Танки виробляються ефективніше та доступні негайно, дозволяючи швидке розгортання бронетанкових підрозділів, які можуть проникати через ворожі лінії, захоплювати ключові об'єкти та підтримувати наступ піхоти рішучою силою."

imperial_airforce_of_china:0 "Імперські Повітряні Сили Китаю"
imperial_airforce_of_china_desc:0 "Повітряні сили імперії швидше набувають додаткового досвіду, гарантуючи, що пілоти та ескадрильї покращуються з кожною операцією. Ця професіоналізація зміцнює повітряні операції, посилює бойову готовність та покращує координацію з сухопутними та військово-морськими силами, сприяючи загальній стратегічній гнучкості."

imperial_airforce_of_china2:0 "Імперські Повітряні Сили Китаю"
imperial_airforce_of_china2_desc:0 "Окрім набуття досвіду, повітряні сили приймають доктрини за зниженою ціною та ефективніше виробляють асів. Пілоти та ескадрильї можуть виконувати передові операції, тоді як загальна організація та готовність повітряних сил покращуються. Ці досягнення забезпечують вищу ефективність як у оборонних, так і в наступальних місіях."

imperial_airforce_of_china3:0 "Імперські Повітряні Сили Китаю"
imperial_airforce_of_china3_desc:0 "Повністю модернізовані повітряні сили отримують вигоду від посиленого досвіду, швидшого прийняття доктрини, збільшеної генерації асів та додаткової промислової потужності для виробництва. Ця всеосяжна модернізація уможливлює стійку перевагу в повітрі, швидке розгортання повітряних активів та ефективну підтримку сухопутних та морських операцій."

MIG_superior_navy:0 "Вищий Флот"
MIG_superior_navy_desc:0 "Флот імперії досяг вищої якості та організації, з ефективним прийняттям доктрин, посиленим моральним духом та мінімізованими штрафами за рух ударної сили. Кораблі готові до тривалих операцій, захисту торгівлі та швидкого розгортання, забезпечуючи панування на морі як у оборонних, так і в наступальних сценаріях."

MIG_superior_navy2:0 "Вищий Флот"
MIG_superior_navy2_desc:0 "Спираючись на попередні досягнення, ця військово-морська сила підтримує знижені витрати на доктрину, високий моральний дух та посилену ефективність ударної сили. Покращена ефективність скринінгу та споживчих товарів надає імперії добре скоординований, стійкий флот, здатний підтримувати тривалі кампанії та проєктувати силу через моря."

MIG_superior_navy3:0 "Вищий Флот"
MIG_superior_navy3_desc:0 "Ця ітерація флоту зберігає всі попередні переваги, включаючи ефективні доктрини, високий моральний дух та ефективний рух ударної сили. Незначні бонуси до виробництва споживчих товарів ще більше покращують логістичну підтримку. Флот діє як згуртований, потужний інструмент імперської політики, здатний домінувати в регіональних водах та підтримувати глобальні амбіції."

strengtheningcivilianadminstration:0 "Зміцнення Цивільної Адміністрації"
strengtheningcivilianadminstration_desc:0 "Зміцнюючи цивільний аспект політичного тіла Мінської Імперії, буде забезпечена більша співпраця між керуючими дворами Серединного Царства."