l_english:

MING_placated_assembly:0 "Placated Imperial Assembly"
MING_placated_assembly_desc:0 "Through careful negotiation and the strategic granting of limited concessions, the imperial assembly has been placated, ensuring political stability while maintaining the primacy of the throne. Though this comes at the cost of some slowed progress in policy execution, the government enjoys increased political maneuverability, allowing leaders to consolidate power, secure alliances, and focus resources on strengthening the empire without the constant fear of internal unrest."

MING_lessons_of_the_revolution:0 "Lessons of the Revolution"
MING_lessons_of_the_revolution_desc:0 "The scars of past rebellions and civil unrest have not been forgotten. Generations of military leaders and scholars have studied the mistakes and triumphs of previous uprisings, applying their lessons to the modern army and air force. Training methods have been refined, doctrines carefully reviewed, and battlefield experience meticulously documented. As a result, the empire’s forces gain experience more rapidly, can train troops with greater efficiency, and adopt new tactics at reduced cost, ensuring that the mistakes of the past are never repeated."

MING_rebuilding_efforts:0 "Rebuilding Efforts"
MING_rebuilding_efforts_desc:0 "The empire is in the midst of a monumental recovery, rebuilding cities, factories, and infrastructure ravaged by years of conflict. Production efficiency increases steadily as factories are modernized, while stability and civilian satisfaction gradually improve. Careful management of consumer goods ensures that the populace remains content and productive, allowing the empire to regain its economic strength and lay the foundations for a renewed period of prosperity and industrial achievement."

MING_militarisation:0 "Militarisation of the Empire"
MING_militarisation_desc:0 "Recognizing the turbulent world around us, the empire has prioritized the expansion and modernisation of its military forces. By converting civilian factories to military production and investing heavily in dockyards and land doctrine development, we ensure our armed forces remain strong, adaptable, and prepared for any threat. This militarisation guarantees that the empire can defend its borders, project power overseas, and respond swiftly to the ever-changing geopolitical landscape."

MING_antirepublicans:0 "Opposition to Republican Forces"
MING_antirepublicans_desc:0 "The imperial forces remain vigilant against republican and separatist factions that seek to undermine the authority of the throne. Strategic planning, rigorous training, and careful deployment allow our armies to gain an advantage over republican forces, increasing both offensive and defensive capabilities against such adversaries. The empire’s unity and resilience are reinforced by a determined commitment to preserving traditional governance against internal and external threats."

MING_a_chinese_economy:0 "A Chinese Economy"
MING_a_chinese_economy_desc:0 "The empire has embarked on a campaign of economic modernization, prioritizing factory efficiency, industrial capacity, and streamlined construction processes. Investments in infrastructure and the latest production techniques ensure that the economy grows steadily, with factories operating at peak efficiency while new industrial projects are completed rapidly. This economic foundation strengthens both civilian life and military preparedness, securing prosperity and stability across the empire."

unityvirtueprosperity:0 "Unity, Virtue, and Prosperity"
unityvirtueprosperity_desc:0 "The people of the empire are inspired by a shared sense of purpose and a reverence for the virtues of tradition and governance. Stability increases as citizens embrace these ideals, while political power flows more freely, allowing the state to implement reforms and respond to crises more effectively. The harmony of the populace underpins the empire’s strength, ensuring a resilient society prepared to face challenges with determination and loyalty."

strengthordersoverignity:0 "Strength, Order, and Sovereignty"
strengthordersoverignity_desc:0 "The empire emphasizes martial readiness, disciplined governance, and the maintenance of sovereign authority. War support is bolstered, and armies gain greater experience, but the stringent measures required to maintain order may sometimes strain internal stability. Nonetheless, these sacrifices are deemed essential to project power, maintain territorial integrity, and assert the empire’s rightful place among the nations of the world."

bloodobediencedestiny:0 "Blood, Obedience, and Destiny"
bloodobediencedestiny_desc:0 "The empire’s strength is drawn from unwavering loyalty, hierarchical order, and the unbroken continuity of dynastic authority. Political power is generated with remarkable efficiency, allowing the government to act decisively, but at the cost of certain internal tensions. This balance of devotion and authority ensures the empire follows its destined path, fortified by the resolve of its people and the enduring legacy of its rulers."

fruits_of_japan:0 "Fruits of Japan"
fruits_of_japan_desc:0 "In the aftermath of the §YFirst Concession War§!, the §YTreaty of Nagasaki§! forced Japan to surrender a chain of §Yconcession cities§! to the victorious coalition of §GEast Rome, West Rome, the Teutonic Empire, Great Britain, Russia, and Ming§!. These enclaves stand not only as monuments to Japan’s humiliation, but as lucrative gateways for trade, profit, and influence in the East."

MIG_foreign_contracts:0 "Foreign Contracts"
MIG_foreign_contracts_desc:0 "The empire has entered into profitable agreements with foreign powers, granting access to advanced equipment and production techniques. Factories benefit from faster construction rates, while consumer goods production is slightly reduced to prioritize military and industrial output. These contracts provide both immediate resources and long-term knowledge transfer, strengthening our industrial base and ensuring a steady supply of essential materiel."

MIG_foreign_production:0 "Foreign Production Support"
MIG_foreign_production_desc:0 "By leveraging international expertise and industrial know-how, the empire accelerates the production of infantry equipment, artillery, and armored vehicles. Access to advanced foreign designs and techniques reduces costs and production time, allowing our armed forces to modernize swiftly and maintain a technological edge over potential adversaries. The infusion of foreign resources strengthens both our military and our capacity for sustained industrial growth."

MIG_foreign_investors:0 "Foreign Investors"
MIG_foreign_investors_desc:0 "Investment from overseas financiers brings critical capital and expertise to the empire’s industrial sector. Factories operate more efficiently, production lines adapt swiftly, and overall industrial output grows. While political influence from foreign investors slightly constrains governmental decision-making, the tangible benefits to production and technological development provide the empire with a stronger economic foundation and improved capacity to support military expansion."

MIG_western_railways:0 "Western Railways"
MIG_western_railways_desc:0 "The expansion of modern railways, designed and funded with foreign expertise, has revolutionized transport across the empire. Raw materials, finished goods, and troops can move with unprecedented speed, while local resources are exploited more efficiently. This infrastructure not only strengthens commerce and industry but also ensures rapid strategic mobility, allowing the empire to respond to threats swiftly and project power across its territories."

kaiping_mines:0 "Kaiping Mines"
kaiping_mines_desc:0 "The exploitation of the Kaiping mineral fields has become a cornerstone of the empire’s industrial growth. Factories, arms plants, and heavy industry benefit from a steady stream of raw materials, while research into mining techniques improves efficiency. These mines provide both immediate resources for production and long-term technological insight, underpinning the empire’s drive for economic and military modernization."

daye_hanyang:0 "Daye and Hanyang Industrial Expansion"
daye_hanyang_desc:0 "The industrial hubs of Daye and Hanyang are undergoing unprecedented growth, with factories and arms plants operating at maximum capacity. Increased production speed and industrial efficiency enable rapid expansion of infrastructure, while research into advanced techniques ensures these regions remain at the forefront of the empire’s modernization efforts. This expansion fortifies both economic and military strength, cementing the empire’s industrial backbone."

achinaunited:0 "A United China"
achinaunited_desc:0 "The empire has successfully consolidated control over previously fractured regions, bringing unity and order to the land. Industrial capacity is maximized, construction projects progress swiftly, and additional building slots in key provinces allow for rapid development. This unity not only strengthens the economic and military base of the empire but also enhances defensive capabilities, ensuring that internal cohesion underpins national security."

distributed_real_country:0 "Distributed Real Country"
distributed_real_country_desc:0 "The empire maintains stability and industrial efficiency by balancing regional development with centralized oversight. Factories operate at full potential, and the populace experiences enhanced political and social stability. This careful distribution of resources and power ensures that the empire remains resilient, capable of enduring crises while continuing its program of industrial and military advancement."

thedragonemperor:0 "The Dragon Emperor"
thedragonemperor_desc:0 "The reigning Dragon Emperor provides a figure of stability and inspiration for the empire. Under his guidance, production and construction proceed efficiently, while political stability is maintained. The emperor’s presence reinforces the legitimacy of the state, ensuring the continuity of governance and the preservation of traditional authority across the realm."

thedragonemperor2:0 "The Dragon Emperor"
thedragonemperor2_desc:0 "The reigning Dragon Emperor provides a figure of stability and inspiration for the empire. Under his guidance, production and construction proceed efficiently, while political stability is maintained. The emperor’s presence reinforces the legitimacy of the state, ensuring the continuity of governance and the preservation of traditional authority across the realm."

consolidatedinternationalindustries:0 "Consolidated International Industries"
consolidatedinternationalindustries_desc:0 "Through strategic mergers and partnerships with international industrial firms, the empire has expanded its capacity for production and technological advancement. Factories achieve higher efficiency, industrial output increases, and new construction projects are accelerated. While some tension arises from centralizing these industries, the empire benefits from unparalleled manufacturing capabilities and enhanced economic power."

cooperatingwithteutons:0 "Cooperation with Teutonic Engineers"
cooperatingwithteutons_desc:0 "Collaborating with Teutonic engineers allows the empire to streamline its land doctrine research, adopting advanced military techniques more efficiently. This partnership facilitates rapid modernization of the army, ensuring that our forces remain competitive on the battlefield and capable of executing complex operations with precision."

MIG_eastromansupport:0 "Eastern Roman Support"
MIG_eastromansupport_desc:0 "Assistance from the Eastern Roman Empire provides the empire with valuable knowledge in military doctrine and organizational strategy. Land doctrine research is accelerated, enabling more effective development of tactics and operational procedures. This support ensures that our armed forces can adopt best practices from abroad while preserving national traditions and strategic autonomy."

MIG_eastromansupport2:0 "Eastern Roman Support"
MIG_eastromansupport2_desc:0 "Assistance from the Eastern Roman Empire provides the empire with valuable knowledge in military doctrine and organizational strategy. Land doctrine research is accelerated, enabling more effective development of tactics and operational procedures. This support ensures that our armed forces can adopt best practices from abroad while preserving national traditions and strategic autonomy."

MIG_a_fractured_mandate:0 "A Fractured Mandate"
MIG_a_fractured_mandate_desc:0 "The empire faces internal divisions and political fragmentation, undermining central authority. Stability is tenuous, and political power is harder to exercise efficiently. Drift defense suffers, requiring careful management of both domestic and military affairs. Advisors are more costly, reflecting the challenge of governing a divided state. Despite these difficulties, the empire retains potential for recovery through strategic reform and consolidation of power."

anti_japanese_warriors:0 "Anti-Japanese Warriors"
anti_japanese_warriors_desc:0 "Patriotic warriors and local militias stand vigilant against the Japanese. Their bravery and tactical skill increase the effectiveness of imperial forces in operations against Japan, enhancing both offensive and defensive performance. These warriors embody the spirit of resistance, inspiring the broader population and reinforcing the empire’s determination to defend its sovereignty at all costs."

indonesianliberationcampaign:0 "Indonesian Liberation Campaign"
indonesianliberationcampaign_desc:0 "The empire has committed resources to supporting liberation movements abroad, particularly in the archipelago of Indonesia. Amphibious operations are enhanced, attrition minimized, and attacks on minor powers are more effective. These campaigns strengthen imperial influence overseas, demonstrate military capability, and provide valuable experience in expeditionary warfare, securing strategic positions and fostering alliances in distant regions."

MIG_stockpiling_fuel:0 "Strategic Fuel Stockpiles"
MIG_stockpiling_fuel_desc:0 "The empire has prioritized the accumulation and management of fuel reserves for the army, navy, and air force. Reduced fuel consumption across all forces, combined with faster construction of fuel storage facilities, ensures that the empire remains operationally flexible and capable of sustaining extended military campaigns, both at home and abroad."

MIG_imperial_marines:0 "Imperial Marines"
MIG_imperial_marines_desc:0 "Specialized amphibious units enhance the empire’s ability to conduct coastal assaults and overseas operations. These elite marines increase invasion capacity, improve preparation speed, and are highly trained for rapid deployment, ensuring that the empire can project force across rivers, coasts, and islands with exceptional efficiency and tactical precision."

MIG_superior_navy:0 "Superior Navy"
MIG_superior_navy_desc:0 "Through modernization and rigorous training, the imperial navy achieves superior capabilities. Doctrines are adopted at reduced cost, fleet morale is enhanced, and strike force movement penalties are minimized. This ensures that the empire’s naval forces are capable of protecting trade routes, securing territorial waters, and projecting maritime power effectively."

MIG_chinese_flotilla:0 "Chinese Flotilla"
MIG_chinese_flotilla_desc:0 "Focused on smaller ships and submarines, the empire develops specialized flotillas capable of convoy raiding, naval skirmishes, and rapid response operations. Submarines retreat more effectively, critical naval actions have higher success rates, and the entire flotilla operates with enhanced coordination, maximizing the strategic utility of our smaller naval units."

MIG_naval_intelligence:0 "Naval Intelligence"
MIG_naval_intelligence_desc:0 "Advanced cryptography and intelligence-gathering improve the empire’s naval operations. The navy benefits from faster decryption and enhanced intelligence efficiency, providing commanders with better information for strategic decision-making, tactical maneuvers, and operational planning across all theaters of maritime engagement."

MIG_a_fractured_mandate2:0 "A Fractured Mandate"
MIG_a_fractured_mandate2_desc:0 "The empire continues to struggle with internal political divisions and fragmented authority. While stability is marginally maintained, the state’s ability to exercise power is constrained and drift defense suffers. Governance requires careful management to prevent further weakening, yet opportunities remain to consolidate power and restore the empire’s unity and strength over time."

theguanziyingarmy:0 "The Guanziying Army"
theguanziyingarmy_desc:0 "The Guanziying Army embodies the disciplined, traditional military might of the empire. Troops train efficiently, field officers can be promoted with lower cost, and medals inspire loyalty and morale. Though regaining organization is gradual, careful preparation ensures that these troops form a reliable backbone of the empire’s land forces, capable of holding the line in prolonged conflicts."

theguanziyingarmytraditional:0 "Guanziying Army"
theguanziyingarmytraditional_desc:0 "Rooted in historical tactics and time-honored formations, the traditional Guanziying Army excels in both attack and defense. The army gains modest bonuses to combat performance and doctrine adoption, reflecting the strength of experience, discipline, and tactical continuity passed down through generations of imperial soldiers."

theguanziyingarmyoverwhelm:0 "Guanziying Army"
theguanziyingarmyoverwhelm_desc:0 "With enhanced training and aggressive doctrines, the Guanziying Army achieves dominance on the battlefield. Troops strike harder, defend more effectively, and regain organization rapidly, allowing commanders to execute decisive operations and overwhelm opponents through superior force concentration and coordinated maneuvers."

theguanziyingarmyexpansion:0 "Guanziying Army"
theguanziyingarmyexpansion_desc:0 "The empire focuses on expanding armored and mechanized divisions within the Guanziying Army. Tanks and mobile units operate with increased speed and effectiveness, while combined arms operations improve overall battlefield mobility. This expansion strengthens offensive capabilities and enhances the empire’s ability to respond to multiple threats simultaneously."

theguanziyingarmygreenstandards:0 "Guanziying Army"
theguanziyingarmygreenstandards_desc:0 "By incorporating elite Green Standard units, the Guanziying Army combines traditional infantry discipline with modernized armor and mobility. Attack and defense bonuses improve, armored units strike more powerfully and maneuver more efficiently, and regaining organization occurs faster, making these forces highly adaptable in both conventional and mobile warfare."

theguanziyingarmysuperior1:0 "Guanziying Army"
theguanziyingarmysuperior1_desc:0 "The Superior I Guanziying Army exemplifies battlefield excellence. Infantry, armor, and doctrines are optimized for maximum performance, with rapid recovery of organization and faster entrenchment. These elite formations form a decisive core capable of executing complex operations and adapting quickly to changing battlefield conditions."

theguanziyingarmysuperior2:0 "Guanziying Army"
theguanziyingarmysuperior2_desc:0 "Superior II units of the Guanziying Army are elite forces combining exceptional attack and defense capabilities, superior armored effectiveness, and enhanced speed. Their organization recovers swiftly, providing commanders with the ability to launch sustained operations and maintain dominance across multiple fronts."

new_armoured_divisions:0 "New Armored Divisions"
new_armoured_divisions_desc:0 "The empire has invested in modern armored divisions, improving mechanized warfare capabilities and reducing doctrine costs. Tanks are produced more efficiently and available immediately, enabling rapid deployment of armored units that can penetrate enemy lines, secure key objectives, and support infantry advances with decisive force."

imperial_airforce_of_china:0 "Imperial Airforce of China"
imperial_airforce_of_china_desc:0 "The empire’s air force gains incremental experience more rapidly, ensuring that pilots and squadrons improve with each operation. This professionalization strengthens aerial operations, enhances combat readiness, and improves coordination with ground and naval forces, contributing to overall strategic flexibility."

imperial_airforce_of_china2:0 "Imperial Airforce of China"
imperial_airforce_of_china2_desc:0 "In addition to experience gains, the air force adopts doctrines at reduced cost and produces aces more efficiently. Pilots and squadrons can perform advanced operations, while the overall organization and readiness of the air force improve. These advancements ensure superior performance in both defensive and offensive missions."

imperial_airforce_of_china3:0 "Imperial Airforce of China"
imperial_airforce_of_china3_desc:0 "The fully modernised air force benefits from enhanced experience, faster doctrine adoption, increased ace generation, and additional industrial capacity for production. This comprehensive modernization enables sustained air superiority, rapid deployment of air assets, and effective support for land and naval operations."

MIG_superior_navy2:0 "Superior Navy"
MIG_superior_navy2_desc:0 "Building on prior achievements, this naval force maintains reduced doctrine costs, high morale, and enhanced strike force performance. Screening and consumer goods efficiency are improved, giving the empire a well-coordinated, resilient fleet capable of sustaining prolonged campaigns and projecting power across the seas."

MIG_superior_navy3:0 "Superior Navy"
MIG_superior_navy3_desc:0 "This iteration of the navy maintains all previous advantages, including efficient doctrines, high morale, and effective strike force movement. Minor boosts to consumer goods production further enhance logistical support. The fleet operates as a cohesive, powerful instrument of imperial policy, capable of dominating regional waters and supporting global ambitions."

strengtheningcivilianadminstration:0 "Strengthening of the Civilian Adminstration"
strengtheningcivilianadminstration_desc:0 "By strengthening the civilian aspect of the political body of the Ming Empire, shall there be greater coorperation between the governing courts of the Middle Kingdom."