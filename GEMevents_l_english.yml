l_english:

 teuton.788.t:0 "The Teutons Proposes War Against Rome"
 teuton.788.desc:0 "The ambassadors from the Teutonic Empire have arrived with a chilling proposition; join their war against the Eastern Roman Empire. Their plan is bold—strike through our lands to reach Constantinople, the beating heart of Rome’s eastern empire. They promise swift victory, shared spoils, and a place in history. But the cost of war is steep, and our neutrality has kept our borders safe and our people prosperous. To join them is to gamble everything. To refuse is to risk being swept aside by the tide of conquest. The crossroads of history lies before us."
 teuton.788.a:0 "We'll turn the tide of war!"
 teuton.788.b:0 "Never! We cannot risk our neutrality and peace."

 teuton.789.t:0 "The Romanians Join The War!"
 teuton.789.desc:0 "Romania has answered our call to arms. Their decision marks a seismic shift in the balance of power. With their armies mobilised and their territory opened to our forces, the gates to the Eastern Roman heartland now lie within reach. From the Carpathian passes to the banks of the Danube, our war machine will surge forward, carving a path straight to Constantinople. Their lands border the vulnerable underbelly of the Roman Empire, a region poorly defended and ripe for a lightning strike. Our combined forces will launch a coordinated blitzkrieg, striking with such speed and ferocity that the Romans will be paralyzed before they can react. The illusion of Roman invincibility will be shattered as their enemies close in from unexpected angles."
 teuton.789.a:0 "They will help us turn the tide of war."

 teuton.781.t:0 "The Romanians Refuse To Join."
 teuton.781.desc:0 "Our overtures have been rejected. Romania, blinded by fear or lulled by Roman diplomacy, has chosen neutrality over destiny. Their refusal leaves our path to Constantinople obstructed and our plans delayed. This betrayal will not be forgotten. If they will not stand with us, they may one day fall beneath us. The war must go on—with or without them. But the cost will be higher, and the bloodshed greater."
 teuton.781.a:0 "Damn Romanians..."

 teuton.9192.t:0 "Teutonic-Austrian Union"
 teuton.9192.desc:0 "The long-standing neutrality of Austria has come to an abrupt end. Once a proud marchland of the Western Roman Empire, created to guard the Alpine passes, Austria had endured centuries as a precarious buffer between East, West, and Teutonic ambitions. Now, under immense pressure and with Teutonic troops already massed along its borders, Vienna has declared a union with the Teutonic Empire. For the Teutons, it is hailed as a triumphant ‘return of rightful Teuton land.’ For the Romans, it is a dire warning; the shield of the Alps has been absorbed, and the road to Italy lies exposed."
 teuton.9192.a:0 "The Empire grows ever stronger!"
 teuton.9192.b:0 "There's nothing in between the Teutons and Romans now..."

 teuton.21565.t:0 "The Teutons Proposes An Alliance Against Rome"
 teuton.21565.desc:0 "Ambassadors from the Teutonic Empire have arrived in Budapest, bearing a bold proposal; join their crusade against the Romans. The Teutons speak of shared enemies and promises of territorial gains along the Danube, but their words drip with menace as much as opportunity. To align with them may mean survival — or damnation. To refuse may preserve our independence — or invite annihilation. The Danube trembles once again as the question hangs; shall Pannonia march with the Teutons against Rome?"
 teuton.21565.a:0 "Maybe we can get something out of this..."
 teuton.21565.b:0 "I will not drag our people into this meaningless war!"

 teuton.21566.t:0 "The Pannonians Join!"
 teuton.21566.desc:0 "The Pannonians have chosen wisely. Their armies will march under the black cross alongside our legions, and their fertile plains shall become the staging ground for our assault upon Constantinople. With Pannonia secured, the road into the Balkans opens wide. The crusade against Rome grows stronger by the day!"
 teuton.21566.a:0 "To Constantinople!"
 
 teuton.21567.t:0 "The Pannonians Refuse."
 teuton.21567.desc:0 "The Pannonian cowards have refused our generous offer. They cling to their so-called neutrality, blind to the tide of history. Their refusal is an insult to the Teutonic Empire, one that will not be forgotten. If they will not join us against Rome willingly, then they may one day face the wrath of our steel."
 teuton.21567.a:0 "Damn Pannonians..."

 teuton.867.t:0 "Expanding the Teutonic Legions"
 teuton.867.desc:0 "With the Empire’s borders growing ever more precarious and the world sliding into chaos, the High Command has decreed a major expansion of the Teutonic Legions. Across the provinces, recruitment offices are flooded with eager volunteers and stern conscripts alike, sworn to bear the black cross of the Empire. New formations are being drilled day and night, banners raised in the old martial style that once made our forefathers feared across the continent. Now, we must decide: do we raise these legions in full, forging eight proud new divisions to carry the Hochmeister’s will abroad, or do we take a more pragmatic approach—redirecting their equipment to strengthen the forces we already field?"
 teuton.867.a:0 "Raise them!"
 teuton.867.b:0 "We have enough."
 
 teuton.9.t:0 "Fate of the Commonwealth"
 teuton.9.desc:0 "The Polish-Lithuanian Commonwealth is now formally under our grasp, securing the border with the Russians. However; this prompts the question of what to do with them now. We could directly incorporate them into our Empire, transferring all resources and industry over to us, but this will present challenges. We could also leave them as is; as a 'protectorate'. Or a more radical choice, freeing them."
 teuton.9.a:0 "Annex them into the Empire!"
 teuton.9.b:0 "Leave them as is."
 teuton.9.c:0 "They deserve freedom."

 teuton.10.t:0 "The Teutonic Empire Sends An Ulimatum!"
 teuton.10.desc:0 "A courier from the Teutonic Empire has arrived with grim news. Their government has issued a harsh ultimatum demanding that we submit to their authority and accept incorporation of our territories into their realm. They believe our position is hopeless, and that resistance will only bring ruin. The choice is before us: surrender and preserve the lives of our citizens, or stand firm and risk war against a far stronger foe."
 teuton.10.a:0 "We cannot possibly win..."
 teuton.10.b:0 "We never give in to Teutons!"

 teuton.11.t:0 "The United Provinces Gives In!"
 teuton.11.desc:0 "The ultimatum has achieved its intended effect. Faced with the prospect of war and destruction, the United Provinces have capitulated without a fight. Their leaders have accepted our demands, and the Benelux now falls under the authority of the Teutonic Empire. The world will see this as yet another testament to our growing power."
 teuton.11.a:0 "The Benelux is ours."

 teuton.12.t:0 "The United Provinces Refuses To Give In!"
 teuton.12.desc:0 "Against all reason, the United Provinces have rejected our ultimatum. Their leaders have chosen defiance over submission, declaring that they will never yield to the Teutonic Empire. By spurning our demands, they have left us only one option: to enforce our will through force of arms."
 teuton.12.a:0 "They have chosen the hard way then."

 teuton.13.t:0 "The Teutonic Empire Sends Demands!"
 teuton.13.desc:0 "A message has arrived from the Teutonic Empire, bearing heavy demands upon our sovereignty. They insist that we accept their 'protection,' which in truth means bending to their will and forfeiting our independence. To agree would preserve peace at the cost of freedom. To refuse would mean standing alone against one of the strongest powers in Europe. The decision will shape the fate of Sweden-Norway for generations."
 teuton.13.a:0 "We'll accept their 'protection' for peace..."
 teuton.13.b:0 "We'll never surrender our sovereignty!"

 teuton.14.t:0 "Sweden-Norway Accepts Our Protection!"
 teuton.14.desc:0 "Our ultimatum has succeeded. Sweden-Norway, recognising the futility of resistance, has bowed to our demands and accepted our protection. Though they may grumble about their lost independence, their fate is now tied to that of the Teutonic Empire. Another nation joins our sphere, and our influence grows stronger with each passing day."
 teuton.14.a:0 "Our brothers in the north come to reason."

 teuton.15.t:0 "Sweden-Norway Refuses!"
 teuton.15.desc:0 "In an act of stubborn defiance, Sweden-Norway has outright rejected our demands. They claim they will never surrender their sovereignty, even if it means war. By refusing our protection, they leave us no choice but to enforce our will through arms and bring them to heel by force."
 teuton.15.a:0 "What? Then we must take all means necessary to protect them."

 teuton.16.t:0 "The Teutonic Empire Proposes An Alliance"
 teuton.16.desc:0 "Envoys from the Teutonic Empire have arrived, bearing a bold proposal: a formal alliance between our nations. They argue that only through unity can we withstand the threats of the modern age, offering us protection and partnership in exchange for our loyalty. Some see this as a chance to secure our place beside a rising power, while others fear it would mean abandoning old ties and compromising our independence."
 teuton.16.a:0 "We'll side with the Teutons over the Romans anyday!"
 teuton.16.b:0 "Teutons? Never!"

 teuton.17.t:0 "The Iberian Commonwealth Joins Us!"
 teuton.17.desc:0 "Our proposal has been accepted! The Iberian Commonwealth, recognising the strength of the Teutonic Empire, has agreed to stand beside us in alliance. With Iberia now firmly in our camp, the southern flank is secure and our influence grows ever wider across Europe."
 teuton.17.a:0 "The Iberian front is secure!"

 teuton.18.t:0 "The Iberian Commonwealth Refuses!"
 teuton.18.desc:0 "To our disappointment, the Iberian Commonwealth has rejected our overtures. They have refused to align themselves with the Teutonic Empire, choosing instead to remain distant—or perhaps to lean toward our rivals. Their refusal is a setback, but it only strengthens our resolve to dominate the continent."
 teuton.18.a:0 "They cannot see reason..."