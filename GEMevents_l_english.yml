l_english:

 teuton.788.t:0 "Тевтони Пропонують Війну Проти Риму"
teuton.788.desc:0 "Посли з Тевтонської Імперії прибули з жахливою пропозицією: приєднатися до їхньої війни проти Східної Римської Імперії. Їхній план сміливий — завдати удару через наші землі, щоб дістатися до Константинополя, б’ючого серця східної імперії Риму. Вони обіцяють швидку перемогу, спільну здобич і місце в історії. Але ціна війни висока, і наш нейтралітет забезпечував безпеку наших кордонів і процвітання нашого народу. Приєднатися до них — це ризикнути всім. Відмовитися — це ризик бути зметеним хвилею завоювання. Перед нами лежить роздоріжжя історії."
teuton.788.a:0 "Ми змінимо хід війни!"
teuton.788.b:0 "Ніколи! Ми не можемо ризикувати нашим нейтралітетом і миром."

teuton.789.t:0 "Румуни Приєднуються До Війни!"
teuton.789.desc:0 "Румунія відповіла на наш заклик до зброї. Їхнє рішення знаменує сейсмічний зсув у балансі сил. З мобілізацією їхніх армій та відкриттям їхньої території для наших сил, ворота до східноримського серця тепер у межах досяжності. Від Карпатських перевалів до берегів Дунаю, наша військова машина рине вперед, прокладаючи шлях прямо до Константинополя. Їхні землі межують із вразливим підчерев’ям Римської Імперії, регіоном, погано захищеним і дозрілим для блискавичного удару. Наші об'єднані сили розпочнуть скоординований бліцкриг, завдаючи удару з такою швидкістю і люттю, що Римляни будуть паралізовані, перш ніж зможуть відреагувати. Ілюзія Римської непереможності буде розбита, коли їхні вороги наблизяться з несподіваних сторін."
teuton.789.a:0 "Вони допоможуть нам змінити хід війни."

teuton.781.t:0 "Румуни Відмовляються Приєднатися."
teuton.781.desc:0 "Наші пропозиції були відхилені. Румунія, осліплена страхом або заколисана Римською дипломатією, обрала нейтралітет замість долі. Їхня відмова залишає наш шлях до Константинополя перекритим, а наші плани — затриманими. Ця зрада не буде забута. Якщо вони не стануть з нами, то одного дня можуть впасти під нами. Війна має тривати — з ними чи без них. Але ціна буде вищою, а кровопролиття — більшим."
teuton.781.a:0 "Кляті румуни..."

teuton.9192.t:0 "Тевтонсько-Австрійський Союз"
teuton.9192.desc:0 "Давній нейтралітет Австрії різко закінчився. Колись гордий прикордонний маркграфство Західної Римської Імперії, створене для охорони Альпійських перевалів, Австрія століттями була нестійким буфером між Сходом, Заходом і Тевтонськими амбіціями. Тепер, під величезним тиском і з Тевтонськими військами, вже стягнутими вздовж її кордонів, Відень оголосив про союз із Тевтонською Імперією. Для Тевтонів це вітається як тріумфальне 'повернення законної Тевтонської землі'. Для Римлян це грізне попередження; щит Альп був поглинений, і дорога до Італії відкрита."
teuton.9192.a:0 "Імперія стає все сильнішою!"
teuton.9192.b:0 "Тепер між Тевтонами та Римлянами нічого немає..."

teuton.21565.t:0 "Тевтони Пропонують Союз Проти Риму"
teuton.21565.desc:0 "Посли від Тевтонської Імперії прибули до Будапешта, несучи сміливу пропозицію: приєднатися до їхнього хрестового походу проти Римлян. Тевтони говорять про спільних ворогів і обіцяють територіальні здобутки вздовж Дунаю, але їхні слова просочені загрозою так само, як і можливістю. Приєднатися до них може означати виживання — або прокляття. Відмовитися може зберегти нашу незалежність — або накликати знищення. Дунай знову тремтить, коли висить питання: чи Паннонія піде з Тевтонами проти Риму?"
teuton.21565.a:0 "Можливо, ми зможемо щось з цього отримати..."
teuton.21565.b:0 "Я не втягну наш народ у цю безглузду війну!"

teuton.21566.t:0 "Паннонці Приєднуються!"
teuton.21566.desc:0 "Паннонці обрали мудро. Їхні армії маршируватимуть під чорним хрестом поряд із нашими легіонами, а їхні родючі рівнини стануть плацдармом для нашого штурму Константинополя. З Паннонією, що забезпечена, дорога на Балкани широко відкривається. Хрестовий похід проти Риму стає сильнішим з кожним днем!"
teuton.21566.a:0 "На Константинополь!"

teuton.21567.t:0 "Паннонці Відмовляються."
teuton.21567.desc:0 "Паннонські боягузи відмовилися від нашої щедрої пропозиції. Вони чіпляються за свій так званий нейтралітет, сліпі до ходу історії. Їхня відмова — це образа Тевтонської Імперії, яка не буде забута. Якщо вони не приєднаються до нас проти Риму добровільно, то одного дня вони можуть зіткнутися з гнівом нашої сталі."
teuton.21567.a:0 "Кляті паннонці..."

teuton.867.t:0 "Розширення Тевтонських Легіонів"
teuton.867.desc:0 "Зі зростанням небезпеки кордонів Імперії та зануренням світу в хаос, Верховне Командування наказало провести велике розширення Тевтонських Легіонів. По всіх провінціях вербувальні пункти переповнені охочими добровольцями та суворими призовниками, які присягнули нести чорний хрест Імперії. Нові формування проходять навчання вдень і вночі, прапори підняті у старому військовому стилі, який колись змушував наших предків боятися по всьому континенту. Тепер ми повинні вирішити: чи ми збираємо ці легіони повністю, створюючи вісім гордих нових дивізій, щоб нести волю Гохмайстра за кордон, чи ми обираємо більш прагматичний підхід — перенаправляючи їхнє обладнання на зміцнення сил, які ми вже маємо?"
teuton.867.a:0 "Створити їх!"
teuton.867.b:0 "У нас достатньо."

teuton.9.t:0 "Доля Співдружності"
teuton.9.desc:0 "Польсько-Литовська Співдружність тепер формально в наших руках, забезпечуючи кордон з Росіянами. Однак, це порушує питання, що з ними робити далі. Ми могли б безпосередньо включити їх до нашої Імперії, передавши всі ресурси та промисловість нам, але це створить проблеми. Ми також могли б залишити їх як є — як 'протекторат'. Або більш радикальний вибір — звільнити їх."
teuton.9.a:0 "Анексувати їх до Імперії!"
teuton.9.b:0 "Залишити їх як є."
teuton.9.c:0 "Вони заслуговують на свободу."

teuton.10.t:0 "Тевтонська Імперія Надсилає Ультиматум!"
teuton.10.desc:0 "Кур'єр з Тевтонської Імперії прибув із грізною новиною. Їхній уряд висунув жорсткий ультиматум, вимагаючи, щоб ми підкорилися їхній владі та погодилися на включення наших територій до їхньої держави. Вони вважають наше становище безнадійним, і що опір принесе лише руїну. Перед нами вибір: здатися та зберегти життя наших громадян, або стояти твердо та ризикувати війною проти набагато сильнішого ворога."
teuton.10.a:0 "Ми, мабуть, не зможемо перемогти..."
teuton.10.b:0 "Ми ніколи не здаємося Тевтонам!"

teuton.11.t:0 "Об'єднані Провінції Піддаються!"
teuton.11.desc:0 "Ультиматум досяг бажаного ефекту. Зіткнувшись із загрозою війни та руйнування, Об'єднані Провінції капітулювали без бою. Їхні лідери прийняли наші вимоги, і Бенелюкс тепер потрапляє під владу Тевтонської Імперії. Світ побачить це як чергове свідчення нашої зростаючої могутності."
teuton.11.a:0 "Бенелюкс наш."

teuton.12.t:0 "Об'єднані Провінції Відмовляються Піддатися!"
teuton.12.desc:0 "Всупереч усякому розуму, Об'єднані Провінції відхилили наш ультиматум. Їхні лідери обрали непокору замість підкори, заявивши, що ніколи не поступляться Тевтонській Імперії. Відкинувши наші вимоги, вони залишили нам лише один варіант: нав'язати нашу волю силою зброї."
teuton.12.a:0 "Тоді вони обрали важкий шлях."

teuton.13.t:0 "Тевтонська Імперія Надсилає Вимоги!"
teuton.13.desc:0 "Надійшло повідомлення від Тевтонської Імперії, що містить важкі вимоги до нашого суверенітету. Вони наполягають, щоб ми прийняли їхній 'захист', що насправді означає підкорення їхній волі та втрату нашої незалежності. Згода збереже мир ціною свободи. Відмова означатиме, що ми залишимося наодинці проти однієї з найсильніших держав у Європі. Це рішення визначить долю Швеції-Норвегії на покоління."
teuton.13.a:0 "Ми приймемо їхній 'захист' заради миру..."
teuton.13.b:0 "Ми ніколи не поступимося нашим суверенітетом!"

teuton.14.t:0 "Швеція-Норвегія Приймає Наш Захист!"
teuton.14.desc:0 "Наш ультиматум спрацював. Швеція-Норвегія, визнаючи марність опору, підкорилася нашим вимогам та прийняла наш захист. Хоча вони можуть нарікати на втрачену незалежність, їхня доля тепер пов'язана з долею Тевтонської Імперії. Ще одна нація приєднується до нашої сфери, і наш вплив зростає з кожним днем."
teuton.14.a:0 "Наші брати на півночі приходять до розуму."

teuton.15.t:0 "Швеція-Норвегія Відмовляється!"
teuton.15.desc:0 "В акті впертої непокори Швеція-Норвегія відверто відхилила наші вимоги. Вони стверджують, що ніколи не відмовляться від свого суверенітету, навіть якщо це означає війну. Відмовляючись від нашого захисту, вони не залишають нам іншого вибору, окрім як нав'язати нашу волю силою зброї та приборкати їх."
teuton.15.a:0 "Що? Тоді ми повинні вжити всіх необхідних заходів, щоб захистити їх."

teuton.16.t:0 "Тевтонська Імперія Пропонує Союз"
teuton.16.desc:0 "Посланці з Тевтонської Імперії прибули, несучи сміливу пропозицію: формальний союз між нашими націями. Вони стверджують, що лише через єдність ми зможемо протистояти загрозам сучасної епохи, пропонуючи нам захист та партнерство в обмін на нашу лояльність. Дехто бачить у цьому шанс забезпечити собі місце поруч із зростаючою силою, тоді як інші побоюються, що це означатиме відмову від старих зв'язків та компроміс щодо нашої незалежності."
teuton.16.a:0 "Ми станемо на бік Тевтонів, а не Римлян, будь-якого дня!"
teuton.16.b:0 "Тевтони? Ніколи!"

teuton.17.t:0 "Іберійська Співдружність Приєднується До Нас!"
teuton.17.desc:0 "Наша пропозиція прийнята! Іберійська Співдружність, визнаючи силу Тевтонської Імперії, погодилася стати поруч із нами в союзі. З Іберією, яка тепер міцно в нашому таборі, південний фланг забезпечений, і наш вплив поширюється все ширше по Європі."
teuton.17.a:0 "Іберійський фронт забезпечений!"

teuton.18.t:0 "Іберійська Співдружність Відмовляється!"
teuton.18.desc:0 "На наше розчарування, Іберійська Співдружність відхилила наші пропозиції. Вони відмовилися приєднатися до Тевтонської Імперії, обравши замість цього залишатися осторонь — або, можливо, схилитися до наших суперників. Їхня відмова є невдачею, але вона лише зміцнює нашу рішучість домінувати на континенті."
teuton.18.a:0 "Вони не можуть бачити розум..."