l_english:
 WRE_assemble_the_roman_senate:0 "Assemble the Roman Senate"
 WRE_assemble_the_roman_senate_desc:0 "The Curia once more fills with the voices of senators. By assembling the Senate, we decide the foundations of our future government—whether to place power in the hands of the Senate, the people, or both. This act will set the tone for the rebirth of Western Rome."

 WRE_springtime_of_nations:0 "Springtime of Nations"
 WRE_springtime_of_nations_desc:0 "Across Europe, the cries for liberty, unity, and reform echo. We must decide how Rome will respond to this great tide of nationalism and republicanism sweeping the continent."

 WRE_scars_of_1926:0 "Scars of 1926"
 WRE_scars_of_1926_desc:0 "The disastrous struggles of the 1920s in Illyria still haunt our nation. The scars left upon our people, our politics, and our lands must be acknowledged—and healed—before Rome can rise again."

 WRE_issue_of_the_illyrian_border:0 "Issue of the Illyrian Border"
 WRE_issue_of_the_illyrian_border_desc:0 "The Illyrian frontier remains a contested and unstable region. Left unresolved, it threatens to reignite the flames of war. The Senate must take decisive action to resolve the border dispute."

 WRE_reorganise_the_military_industrial_complex:0 "Reorganise the Military-Industrial Complex"
 WRE_reorganise_the_military_industrial_complex_desc:0 "Our military and industry remain fractured and inefficient. By restructuring the military-industrial complex, we can ensure that Rome’s economy and armies work hand-in-hand toward national renewal."

 WRE_stitching_the_scars:0 "Stitching the Scars"
 WRE_stitching_the_scars_desc:0 "The wounds of the 1926 Illyrian War have left our nation bleeding. Through careful investment in industry, infrastructure, and reconciliation, we will begin to stitch together a stronger Rome."

 WRE_springlock_rebellion:0 "Springlock Rebellion"
 WRE_springlock_rebellion_desc:0 "As teutonic ideas spread, rebellion brews. The Springlock uprising threatens to destabilise the Empire unless decisive measures are taken. How we respond will shape Rome’s path forward."

 WRE_looming_senate_coup:0 "Looming Senate Coup"
 WRE_looming_senate_coup_desc:0 "The Senate grows restless. Whispers of a coup d’état swirl within its halls, as ambitious senators seek to expand their power. If unchecked, their schemes may imperil the Empire itself."

 WRE_solve_the_internal_crisis:0 "Solve the Internal Crisis"
 WRE_solve_the_internal_crisis_desc:0 "Our internal instability cannot be ignored. By restoring public confidence, stabilising politics, and rewarding loyalty, we can finally end this era of endless crises."

 WRE_looking_inward:0 "Looking Inward"
 WRE_looking_inward_desc:0 "Rather than meddling in foreign adventures, we must focus on internal reform. By looking inward, Rome will strengthen its laws, institutions, and national cohesion."

 WRE_amend_the_taxaation_system:0 "Amend the Taxation System"
 WRE_amend_the_taxaation_system_desc:0 "Our outdated tax structure is riddled with corruption and inefficiency. Reforming the system will provide the state with new revenues and curb abuses by Rome’s elites."

 WRE_stamp_out_corruption:0 "Stamp Out Corruption"
 WRE_stamp_out_corruption_desc:0 "Corruption festers within every corner of our administration. By rooting out the corrupt and enforcing accountability, we can restore integrity to the Empire."

 WRE_reorganise_the_corpus_juris_civilis:0 "Reorganise the Corpus Juris Civilis"
 WRE_reorganise_the_corpus_juris_civilis_desc:0 "Rome’s laws, the very foundation of order, have become tangled and contradictory. By reorganising the Corpus Juris Civilis, we will restore clarity and justice to our legal system."

 WRE_further_inward:0 "Further Inward"
 WRE_further_inward_desc:0 "Having reorganised our state and laws, we must continue to deepen reform. By further looking inward, Rome will achieve stability through order and legal unity."

 WRE_strength_war_honour:0 "Strength, War, Honour"
 WRE_strength_war_honour_desc:0 "Rome’s survival has always depended on strength of arms and the honour of its soldiers. We must embrace these values and forge a society bound by martial pride."

 WRE_unity_virtue_prosperity:0 "Unity, Virtue, Prosperity"
 WRE_unity_virtue_prosperity_desc:0 "Rome’s destiny lies not in endless strife, but in unity and shared virtue. By fostering prosperity for all, we will prove that the Empire can thrive through harmony."

 WRE_the_roman_juggernaut:0 "The Roman Juggernaut"
 WRE_the_roman_juggernaut_desc:0 "With our crises behind us and our state reorganised, Rome rises as an unstoppable force. The world will once again tremble before the might of the Roman juggernaut."

 WRE_unity_above_all:0 "Unity Above All"
 WRE_unity_above_all_desc:0 "Rome’s rebirth culminates in one truth: unity above all else. By binding our people together in one will and one destiny, we secure the eternal future of the West Roman Empire."

 WRE_peaceful_diplomacy:0 "Peaceful Diplomacy"
 WRE_peaceful_diplomacy_desc:0 "Rather than resorting to bloodshed, we shall extend our hands across the empire. If there is any hope of Roman unity, it will be forged through careful negotiation and patient diplomacy."

 WRE_the_olive_branch_of_peace:0 "The Olive Branch of Peace"
 WRE_the_olive_branch_of_peace_desc:0 "The olive branch, symbol of concord, will be raised high in our time. We must rally our people behind the idea of reconciliation with the East and prove that Rome’s future lies not in war, but in peace."

 WRE_offer_recompensation_for_illyria:0 "Offer Recompensation for Illyria"
 WRE_offer_recompensation_for_illyria_desc:0 "Though Illyria remains a point of bitter contention, we can offer material compensation and gestures of goodwill to Constantinople. While costly, such measures may open the road to understanding."

 WRE_attempt_reconciliation_with_constantinople:0 "Attempt Reconciliation with Constantinople"
 WRE_attempt_reconciliation_with_constantinople_desc:0 "Rome and Constantinople have been estranged for too long. A formal attempt to reconcile may succeed—or fail spectacularly. Nevertheless, the future of the empire depends upon this bold move."

 WRE_meeting_of_the_dual_emperors:0 "Meeting of the Dual Emperors"
 WRE_meeting_of_the_dual_emperors_desc:0 "The West and East have long claimed to be the true Roman Empire. It is time for both emperors to meet face to face, to determine whether there is a path toward cooperation—or inevitable war."

 WRE_unification_or_death:0 "Unification or Death"
 WRE_unification_or_death_desc:0 "If reconciliation fails, then only the sword remains. We must prepare for a struggle to the bitter end: either the empire shall be whole again, or it shall perish in the attempt."

 WRE_one_empire_two_emperors:0 "One Empire, Two Emperors"
 WRE_one_empire_two_emperors_desc:0 "Unity does not have to mean the end of imperial duality. For the survival of Rome, we may establish a system where both emperors share power—one empire, yet two thrones."

 WRE_imperial_directive_78:0 "Imperial Directive 78"
 WRE_imperial_directive_78_desc:0 "The emperors have issued Directive 78: a sweeping mobilization order to prepare the Roman world for the great struggle ahead. Every citizen must now give their strength to the empire."

 WRE_the_final_frontier:0 "The Final Frontier"
 WRE_the_final_frontier_desc:0 "Our defenses must hold, for beyond them lies only annihilation. We will fortify every inch of our frontiers, transforming them into impenetrable bulwarks against any would-be invader."

 WRE_preparations_for_the_final_war:0 "Preparations for the Final War"
 WRE_preparations_for_the_final_war_desc:0 "The clash between Rome and its enemies is no longer a question of 'if,' but 'when.' We must prepare for the last, decisive war that will determine the fate of the empire forever."

 WRE_operation_lowland:0 "Operation Lowland"
 WRE_operation_lowland_desc:0 "Plans are being drawn up to crush Hispania and its resistance once and for all. By striking swiftly and decisively, Rome will reclaim the lowlands and restore her rightful dominion."

 WRE_operation_phoenix:0 "Operation Phoenix"
 WRE_operation_phoenix_desc:0 "The Francian pretenders have risen from the ashes too many times. Now, the empire will ensure that from these flames rises only Rome’s rebirth—not theirs."

 WRE_the_inevitable:0 "The Inevitable"
 WRE_the_inevitable_desc:0 "The storm with the Teutonic Empire can no longer be avoided. The war that history has conspired toward is upon us. Only the steel of Rome shall decide whether we prevail."


 WRE_inspection_of_the_armed_forces:0 "Inspection of the Armed Forces"
 WRE_inspection_of_the_armed_forces_desc:0 "The state of our legions, fleets, and squadrons must be carefully reviewed. Years of neglect and political turmoil have left our military a shadow of its former self. By undertaking a thorough inspection, we can identify weaknesses, reward competence, and prepare Rome’s sword for the trials to come."

 WRE_the_roman_legions:0 "The Roman Legions"
 WRE_the_roman_legions_desc:0 "Once the backbone of the Empire, the legions are more than just soldiers—they are the very embodiment of Roman order. By re-emphasizing discipline, training, and modern battlefield doctrine, we shall restore their place as the most feared land force in the world."

 WRE_a_roman_legacy:0 "A Roman Legacy"
 WRE_a_roman_legacy_desc:0 "The victories of the Caesars echo across the ages. To reclaim that legacy, we must learn from both our ancient glories and the hard lessons of recent defeats. By codifying these experiences into doctrine, our army will march with renewed strength and purpose."

 WRE_strengthen_the_legions:0 "Strengthen the Legions"
 WRE_strengthen_the_legions_desc:0 "The legions cannot fight with spirit alone. Modern infantry weapons, efficient artillery support, and improved tactical doctrine will give our soldiers the tools they need to carry the Roman eagle to triumph once more."

 WRE_mob_of_the_armed_forces:0 "Mobilisation of the Armed Forces"
 WRE_mob_of_the_armed_forces_desc:0 "Rome requires total mobilization. By uniting our air wings, legions, and naval squadrons into a single coordinated machine, we will ensure that the full strength of the Empire is ready to answer any threat."

 WRE_the_roman_airforce:0 "The Roman Airforce"
 WRE_the_roman_airforce_desc:0 "A new battlefield has emerged in the skies. Our airforce must be expanded and modernized to secure our cities, support our legions, and strike terror into those who dare defy Rome."

 WRE_purge_incompetent_officers:0 "Purge Incompetent Officers"
 WRE_purge_incompetent_officers_desc:0 "Corruption, nepotism, and incompetence infest the officer corps. The legions cannot be commanded by fools. Through decisive purges, we will sweep away the weak and elevate the capable, no matter how bloody the process."

 WRE_submarine_flotilla:0 "Submarine Flotilla"
 WRE_submarine_flotilla_desc:0 "Beneath the waves lies Rome’s dagger. By investing in submarine warfare, we will deny our enemies secure trade routes and choke their supply lines. Silent hunters will serve as the hidden fangs of the Imperial fleet."

 WRE_soaring_the_skies:0 "Soaring the Skies"
 WRE_soaring_the_skies_desc:0 "Our pilots are the new legionaries, their cockpits the chariots of the modern age. From light fighters to mighty bombers, Rome’s airforce must soar above the battlefield and dominate the heavens."

 WRE_revival_of_the_armed_forces:0 "Revival of the Armed Forces"
 WRE_revival_of_the_armed_forces_desc:0 "At last, our reforms bear fruit. The legions are drilled, the fleets are modernized, the squadrons are equipped, and our officers are tested. Rome’s armed forces rise once more, a phoenix of steel and discipline, ready to defend and expand the Empire."

 WRE_the_roman_navy:0 "The Roman Navy"
 WRE_the_roman_navy_desc:0 "The seas once bowed to Rome. To restore that dominance, we must invest in naval doctrine, expand our fleets, and ensure that no power can rival us on the waves."

 WRE_roaming_the_seas:0 "Roaming the Seas"
 WRE_roaming_the_seas_desc:0 "Our ships shall roam the seas as in centuries past, from the Pillars of Hercules to the distant coasts. Cruisers, carriers, and mighty battleships will once again carry Roman banners across the waters, a reminder to the world that Mare Nostrum is ours."

 WRE_revisit_the_treaty_of_belgrade:0 "Revisit the Treaty of Belgrade"
 WRE_revisit_the_treaty_of_belgrade_desc:0 "The Treaty of Belgrade, signed in 1926, ended the bloody Illyrian War between East and West. It left the once-united Illyria partitioned, carved up between our Empire and Constantinople after years of attrition. Though peace was restored, the treaty is regarded in the West as a humiliation — a half-measure born of exhaustion rather than victory."

 WRE_the_diplomatic_solution:0 "The Diplomatic Solution"
 WRE_the_diplomatic_solution_desc:0 "Lorenzo must pursue foreign affairs of the Western Roman Empire, whether he likes it or not. He must guide our eternal empire toward different paths, one that leads to peace with Constantinople, or inevitable war..."

 WRE_aggressive_diplomacy:0 "Aggressive Diplomacy"
 WRE_aggressive_diplomacy_desc:0 "Our Eastern brothers believe patience and subtlety will preserve the Empire. We in the West know that only strength and intimidation keep borders secure. By openly pursuing a policy of threats and demands, we remind both allies and enemies that Rome is still to be feared."

 WRE_force_constantinoples_hand:0 "Force Constantinople’s Hand"
 WRE_force_constantinoples_hand_desc:0 "The Eastern Roman Empire must be made to choose — cooperation with us or open confrontation. By pressuring them militarily and diplomatically, we will ensure their submission to Western policy."

 WRE_man_border_postings:0 "Man the Border Postings"
 WRE_man_border_postings_desc:0 "The Rhine, the Alps, and the Danube — our legions must guard them all. By deploying new equipment and fresh divisions, we prepare to meet any incursion head-on."

 WRE_initiate_border_conflicts:0 "Initiate Border Conflicts"
 WRE_initiate_border_conflicts_desc:0 "Border skirmishes are a time-honored Roman tradition. By escalating patrols into organized clashes, we test our enemy’s readiness and give our soldiers valuable experience."

 WRE_the_belgrade_incident:0 "The Belgrade Incident"
 WRE_the_belgrade_incident_desc:0 "Tensions boil over in Illyria. A manufactured crisis in Belgrade will give us the justification we need to openly declare war on Constantinople and pursue our vision of a united Rome."

 WRE_west_roman_warfare:0 "West Roman Warfare"
 WRE_west_roman_warfare_desc:0 "Our style of war differs from the East. We value decisive blows, heavy armor, and modern tactics. By codifying our methods, the Western way of war shall dominate the Empire once again."

 WRE_bastico_plan:0 "The Bastico Plan"
 WRE_bastico_plan_desc:0 "General Bastico proposes a comprehensive restructuring of the legions, emphasizing doctrine reform and modern organization. Though costly, it may be the blueprint for a resurgent Western military machine."

 WRE_mechanised_warfare:0 "Mechanised Warfare"
 WRE_mechanised_warfare_desc:0 "The future of Rome lies not in tired infantry columns but in mechanized legions. With armored carriers and motorized formations, we will restore the thunder of Roman legions across Europe."

 WRE_mastering_tank_tech:0 "Mastering Tank Technology"
 WRE_mastering_tank_tech_desc:0 "Our engineers have studied foreign tanks and armored warfare doctrines. Now we must surpass them, producing uniquely Roman armored designs that will spearhead our future conquests."

 WRE_light_warfare:0 "Light Warfare"
 WRE_light_warfare_desc:0 "Speed, mobility, and agility — the tools of victory for light armored formations. By refining our doctrines, we can outmaneuver heavier but slower enemies."

 WRE_the_art_of_mechanised_warfare:0 "The Art of Mechanised Warfare"
 WRE_the_art_of_mechanised_warfare_desc:0 "Combining armor, infantry, and support into one seamless machine — this is the art of modern mechanised warfare. Our legions will become juggernauts, unstoppable and disciplined."

 WRE_the_art_of_light_warfare:0 "The Art of Light Warfare"
 WRE_the_art_of_light_warfare_desc:0 "Some battles are not won through brute force, but through cunning maneuvers and rapid exploitation. Light divisions will be our spearpoints, striking where the enemy least expects."

 WRE_the_roman_mind:0 "The Roman Mind"
 WRE_the_roman_mind_desc:0 "Our military genius is not in copying foreign doctrines, but in adapting them to Roman discipline. The Roman mind has always been the greatest weapon of our people — and it will be again."

 WRE_graziani_plan:0 "The Graziani Plan"
 WRE_graziani_plan_desc:0 "General Graziani calls for aggressive expansion of infantry forces and the adoption of new doctrines to exploit manpower advantages. His plan envisions massive, disciplined legions dominating the battlefield."

 WRE_deep_battle_warfare:0 "Deep Battle Warfare"
 WRE_deep_battle_warfare_desc:0 "Rather than win battles piecemeal, we will strike deep, overwhelming the enemy’s lines and dismantling their capacity to fight. This is a doctrine of annihilation, not attrition."

 WRE_new_infantry_tech:0 "New Infantry Technologies"
 WRE_new_infantry_tech_desc:0 "The legionary of tomorrow must be equipped with modern rifles, machine guns, and tactical knowledge. By embracing technological progress, our infantry can once again be the backbone of Rome."

 WRE_artillery_bombardment:0 "Artillery Bombardment"
 WRE_artillery_bombardment_desc:0 "The legions of old had their catapults and ballistae. Ours shall have the thunder of modern artillery. With devastating barrages, the enemy will crumble before our advance."

 WRE_the_art_of_deep_battle_warfare:0 "The Art of Deep Battle"
 WRE_the_art_of_deep_battle_warfare_desc:0 "Deep Battle is not merely a tactic, but a philosophy. By training elite troops and refining doctrines, we will perfect the art of crushing our foes in decisive campaigns."

 WRE_art_of_artillery:0 "The Art of Artillery"
 WRE_art_of_artillery_desc:0 "Artillery is more than firepower — it is the hammer that shapes the battlefield. By mastering its use, our legions will wield fire and steel as extensions of Roman will."

 WRE_the_roman_legacy:0 "The Roman Legacy"
 WRE_the_roman_legacy_desc:0 "Rome has survived for centuries, adapting and enduring through every challenge. Now we shall forge a military legacy equal to our forebears — a legacy to dominate the modern world."

 WRE_one_empire_one_emperor:0 "One Empire, One Emperor"
 WRE_one_empire_one_emperor_desc:0 "The division of East and West was always a temporary compromise. Now, after centuries, the dream of uniting the Empire under one banner and one Emperor can finally be achieved. The world shall once again bow to Rome."

 WRE_recovery_directive_66:0 "Recovery Directive 66"
 WRE_recovery_directive_66_desc:0 "The war has scarred our lands, and the West Roman economy remains fractured. Directive 66 orders the immediate restoration of key infrastructure, reconnecting cities and provinces to ensure Rome may rise again."

 WRE_development_plan_north:0 "Development Plan: North"
 WRE_development_plan_north_desc:0 "The northern provinces, rich in resources and manpower, must be revitalised. By directing new investments and opening land for construction, we will transform these regions into pillars of Roman industry."

 WRE_invest_in_the_steel_companies:0 "Invest in the Steel Companies"
 WRE_invest_in_the_steel_companies_desc:0 "Steel is the backbone of modern power. By expanding and modernising our steel companies, we guarantee that Rome’s armies and factories will never lack the resources to forge victory."

 WRE_development_plan_south:0 "Development Plan: South"
 WRE_development_plan_south_desc:0 "The southern territories have long been neglected, yet their potential is vast. By channelling resources into their development, we will open new opportunities for growth and prosperity."

 WRE_invest_in_the_aluminum_companies:0 "Invest in the Aluminum Companies"
 WRE_invest_in_the_aluminum_companies_desc:0 "Aluminum is vital for modern aircraft production and industrial expansion. By strengthening our southern aluminum industry, we secure the skies for West Rome."

 WRE_development_plan_west:0 "Development Plan: West"
 WRE_development_plan_west_desc:0 "The western provinces are the heartland of our empire. A grand plan of urban expansion and industrial reform will ensure these lands shine as Rome’s greatest beacon of recovery."

 WRE_military_industrial_complex:0 "The Military-Industrial Complex"
 WRE_military_industrial_complex_desc:0 "Rome’s security depends on the strength of her arms. We will unite industry and the military into a single engine of war, producing the weapons and factories required to defend and expand our realm."

 WRE_civilian_industrial_complex:0 "The Civilian Industrial Complex"
 WRE_civilian_industrial_complex_desc:0 "Rome cannot survive on war alone. By expanding our civilian industrial base, we provide the people with jobs, stability, and the consumer goods that strengthen national unity."

 WRE_awakening_the_roman_industrial_giant:0 "Awakening the Roman Industrial Giant"
 WRE_awakening_the_roman_industrial_giant_desc:0 "With our industries unified, our infrastructure restored, and our resources harnessed, Rome’s industrial might will awaken in full. The world will once again tremble before the economic power of the Eternal Empire."

 WRE_the_lorenzean_era:0 "The Lorenzean Era"
 WRE_the_lorenzean_era_desc:0 "Lorenzo rises as Emperor, ushering in a new age of centralized power and stability for the Empire."

 WRE_operation_francia:0 "Operation Francia"
 WRE_operation_francia_desc:0 "Francia, once the heartland of Western Europe, now stands defiant against the reborn Roman Empire. Their pretensions to continental dominance cannot coexist with our divine mission. Operation Francia will bring their proud republics and kingdoms under the true banner of civilization. Let their legions remember who taught them empire."

 WRE_operation_sunset:0 "Operation Sunset"
 WRE_operation_sunset_desc:0 "To the far east lies the Empire of the Setting Sun — heirs to an ancient warrior code and the last great naval power beyond Rome’s reach. Yet even the sun must bow to the horizon of eternity. Operation Sunset will bring the islands of the Far East into the embrace of Imperial order and fulfill the dream of a world united beneath the twin eagles."

 WRE_operation_storm:0 "Operation Storm"
 WRE_operation_storm_desc:0 "The Teutonic Empire to the north once tore at Rome’s borders with steel and flame. They have long considered themselves heirs to our legacy — imitators of imperial grandeur. Now, they shall face the storm of the true Rome reborn. Operation Storm will strike swiftly across the Rhine and bring their false empire to its knees."

 WRE_operation_turtle:0 "Operation Turtle"
 WRE_operation_turtle_desc:0 "The Persian Empire — ancient rival, eternal shadow. Since the days of the Caesars, Persia has stood as Rome’s mirror in the East. Operation Turtle will finally end that age-old rivalry. Our legions will cross the deserts and mountains once more, bringing Roman law and order to the lands of Cyrus and Darius."

 WRE_operation_shovel:0 "Operation Shovel"
 WRE_operation_shovel_desc:0 "In the cold heart of the north, the Russian dominion rises — vast, unyielding, and convinced of its divine right to rule. But no kingdom of man stands eternal before Rome. Operation Shovel will dig deep into the steppes and sweep away the old world, replacing it with a single, indivisible Empire stretching from the Atlantic to the Urals."

 WRE_the_final_war:0 "The Final War"
 WRE_the_final_war_desc:0 "The world stands on the edge of its last great conflict. Rome has united her allies, forged her legions, and raised her banners one final time. The Emperor proclaims: this shall be the last war mankind will ever wage. When it ends, no borders shall divide us, no crowns shall rival ours — for Rome shall be the world itself."



