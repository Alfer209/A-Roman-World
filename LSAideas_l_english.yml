l_english:

 revitalisedlegions:0 "Відроджені Легіони"
revitalisedlegions_desc:0 "Легіонерські Штати Америки відродили давню дисципліну Римської війни. Їхні основні сили борються з оновленою енергією, хоча їхні жорсткі формування перешкоджають оперативній гнучкості."

revitalisedlegions2:0 "Відроджені Легіони"
revitalisedlegions2_desc:0 "Легіони тепер наступають зі швидкістю та точністю, вселяючи страх у менші держави та зосереджуючи свою міць проти північних супротивників."

LSA_foreignwealthseized:0 "Захоплене Іноземне Багатство"
LSA_foreignwealthseized_desc:0 "Іноземні активи в межах нації були присвоєні, що дозволяє державі перенаправити ресурси на національний розвиток та стратегічні пріоритети."

LSA_military_intelligence:0 "Бюро Військової Розвідки"
LSA_military_intelligence_desc:0 "Створено централізоване розвідувальне бюро для моніторингу загроз, проведення шпигунства та захисту інтересів нації за кордоном."

LSA_military_intelligence2:0 "Бюро Військової Розвідки"
LSA_military_intelligence2_desc:0 "Розширені розвідувальні операції тепер впливають на іноземні ідеології, тонко змінюючи глобальну політику на користь Легіонерських Штатів."

militarysenate:0 "Військовий Сенат"
militarysenate_desc:0 "Сенат, що складається з військових чиновників, керує разом із консулом, оптимізуючи командні структури та зменшуючи цивільний нагляд."

martialcitizenship:0 "Військове Громадянство"
martialcitizenship_desc:0 "Громадянство надається через військову службу, сприяючи дисциплінованому населенню та зміцнюючи ідеологічну згуртованість."

martialcitizenship2:0 "Військове Громадянство"
martialcitizenship2_desc:0 "Войовничий етос глибоко вкорінився в суспільстві, забезпечуючи непохитну лояльність та готовність до конфлікту."

victoriapopuliromani:0 "Victoria Populi Romani (Перемога Римського Народу)"
victoriapopuliromani_desc:0 "Перемога проголошується в ім'я Римського народу. Легіони борються з неперевершеним моральним духом, агресією та швидкістю."

followeastromandoctrine:0 "Східноримська Доктрина"
followeastromandoctrine_desc:0 "Прийнято стратегічні доктрини, натхненні Східноримськими військовими, що зменшує виснаження та розширює логістичне охоплення."

eastromansupport:0 "Східноримська Підтримка"
eastromansupport_desc:0 "Підтримка від ідеологічних союзників на Сході поповнює запаси палива та прискорює військові дослідження."

LSA_wardepartment:0 "Військовий Департамент"
LSA_wardepartment_desc:0 "Централізований військовий департамент посилює командну спроможність та полегшує стратегічну координацію на всіх фронтах."

LSA_aromanarmy:0 "Римська Армія"
LSA_aromanarmy_desc:0 "Збройні сили мобілізовані з Римською ефективністю, готуючи націю до тотальної війни."

motorised_equities:0 "Моторизовані Еквіти"
motorised_equities_desc:0 "Інвестиції в моторизовану інфраструктуру знизили виробничі витрати, дозволяючи швидше розгортати механізовані підрозділи."

milescaduci:0 "Miles Caduci"
milescaduci_desc:0 "Сили спеціального призначення, навчені стародавнім Римським бойовим технікам, розширюють можливості нації для елітних операцій."

LSA_women_serve_in_the_legions:0 "Жінки в Легіонах"
LSA_women_serve_in_the_legions_desc:0 "Жінки інтегровані в легіони, збільшуючи живу силу нації та демонструючи модернізований військовий етос."

LSA_airwarplans:0 "Плани Повітряної Війни"
LSA_airwarplans_desc:0 "Стратегічне планування оптимізувало виробництво літаків, забезпечуючи домінування в небі."

fighterdevelopmentfocus:0 "Фокус на Розвитку Винищувачів"
fighterdevelopmentfocus_desc:0 "Держава надає пріоритет розробці спритних та смертоносних винищувачів для забезпечення переваги в повітрі."

stratbombingfocus:0 "Фокус на Стратегічному Бомбардуванні"
stratbombingfocus_desc:0 "Ефективне виробництво бомбардувальників дозволяє знищувати ворожу інфраструктуру здалеку."

combinedbombingfocus:0 "Фокус на Комбінованому Бомбардуванні"
combinedbombingfocus_desc:0 "Посилені можливості для далекобійного бомбардування дозволяють завдавати ударів глибоко у ворожу територію, порушуючи логістику та моральний дух."

LSA_masters_of_the_air:0 "Майстри Повітря"
LSA_masters_of_the_air_desc:0 "Майстерність у повітряній доктрині знизила витрати на дослідження та покращила ефективність повітряного бою."

LSA_navaldepartment:0 "Військово-морський Департамент"
LSA_navaldepartment_desc:0 "Військово-морський департамент наглядає за проєктуванням та модернізацією кораблів, підвищуючи ефективність флоту та знижуючи виробничі витрати."

LSA_escortfocus:0 "Фокус на Супроводі"
LSA_escortfocus_desc:0 "Легкі судна супроводу отримують пріоритет для захисту конвоїв та підтримки більших військових кораблів."

LSA_unrestricted_sub_warfare:0 "Необмежена Підводна Війна"
LSA_unrestricted_sub_warfare_desc:0 "Застосування необмеженої підводної війни дозволяє нашому флоту перехоплювати ворожу торгівлю, калічити ланцюги постачання та чинити стратегічний тиск на супротивників."

LSA_maritime_comission:0 "Морська Комісія"
LSA_maritime_comission_desc:0 "Національна морська комісія прискорює будівництво верфей та розширення флоту."

LSA_legionaryships:0 "Легіонерські Кораблі"
LSA_legionaryships_desc:0 "Конвої будуються для швидкого розгортання та амфібійних операцій, відображаючи військово-морські амбіції сучасної Римської держави."

eagleascendant:0 "Орел, Що Підноситься"
eagleascendant_desc:0 "Орел знову піднімається. Національна гордість та військова готовність піднесені серед населення."

LSA_wartimeproduction:0 "Виробництво Воєнного Часу"
LSA_wartimeproduction_desc:0 "Цивільна промисловість перепрофільована для військового використання, різко збільшуючи виробництво воєнного часу."

projecty:0 "Проєкт Y"
projecty_desc:0 "Таємна дослідницька ініціатива прискорює ядерну розробку, обіцяючи неперевершену руйнівну спроможність."

nationalreconciliation:0 "Національне Примирення"
nationalreconciliation_desc:0 "Зусилля з подолання внутрішніх розколів стабілізували націю, хоча напруга залишається під поверхнею."

citizenandsoldier:0 "Громадянин та Солдат"
citizenandsoldier_desc:0 "Громадянство повністю мілітаризоване, кожна особа готова захищати державу та сприяти її відновленню."

citizenandsoldier2:0 "Громадянин та Солдат"
citizenandsoldier2_desc:0 "Мілітаризоване населення тепер підтримує іноземні інтервенції та швидке промислове відновлення, втілюючи єдність громадянина та солдата."

agriculturaleconomy:0 "Сільськогосподарська Економіка"
agriculturaleconomy_desc:0 "Надмірна залежність від сільського господарства стримує промисловий розвиток та знижує ефективність виробництва."

sloweconomicgrowth:0 "Повільне Економічне Зростання"
sloweconomicgrowth_desc:0 "Економіка зростає млявими темпами, обмежуючи промисловий потенціал та будівельні зусилля."

economiccompotence:0 "Економічна Компетентність"
economiccompotence_desc:0 "Компетентне економічне управління покращило випуск продукції фабриками та зменшило навантаження на споживачів, зміцнюючи національну економіку."

destroyingremainingresistance:0 "Знищення Опору, Що Залишився"
destroyingremainingresistance_desc:0 "Осередки опору придушуються зі швидкістю та точністю, дозволяючи легіонам наступати швидше та завдавати сильніших ударів."

legionstatecontinentalarmy:0 "Континентальна Армія Легіонерських Штатів"
legionstatecontinentalarmy_desc:0 "Континентальна армія піднімається, готова проєктувати силу за кордон із зростаючою впевненістю, добровольцями та політичною підтримкою."

legionstatecontinentalarmy2:0 "Континентальна Армія Легіонерських Штатів"
legionstatecontinentalarmy2_desc:0 "Континентальна армія піднімається, готова проєктувати силу за кордон із зростаючою впевненістю, добровольцями та політичною підтримкою."

altaniclifelines:0 "Альтанічні Життєві Лінії"
altaniclifelines_desc:0 "Атлантичні життєві лінії забезпечені. Морські вторгнення стають більшими, швидшими та краще забезпеченими, відкриваючи шлях до глобальних кампаній."

romanindustries:0 "Римські Промисловості"
 romanindustries_desc:0 ""