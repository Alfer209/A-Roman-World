l_english:

 revitalisedlegions:0 "Revitalised Legions"
 revitalisedlegions_desc:0 "The Legion States of America has revived the ancient discipline of Roman warfare. Its core forces fight with renewed vigour, though their rigid formations hinder operational flexibility."

 revitalisedlegions2:0 "Revitalised Legions"
 revitalisedlegions2_desc:0 "The legions now advance with speed and precision, instilling fear in lesser powers and focusing their might against northern adversaries."

 LSA_foreignwealthseized:0 "Foreign Wealth Seized"
 LSA_foreignwealthseized_desc:0 "Foreign assets within the nation's borders have been appropriated, allowing the state to redirect resources towards national development and strategic priorities."

 LSA_military_intelligence:0 "Military Intelligence Bureau"
 LSA_military_intelligence_desc:0 "A centralised intelligence bureau has been established to monitor threats, conduct espionage, and safeguard the nation's interests abroad."

 LSA_military_intelligence2:0 "Military Intelligence Bureau"
 LSA_military_intelligence2_desc:0 "Expanded intelligence operations now influence foreign ideologies, subtly reshaping global politics to favour the Legion States."

 militarysenate:0 "Military Senate"
 militarysenate_desc:0 "A senate composed of military officials governs alongside the consul, streamlining command structures and reducing civilian oversight."

 martialcitizenship:0 "Martial Citizenship"
 martialcitizenship_desc:0 "Citizenship is granted through military service, fostering a disciplined populace and reinforcing ideological cohesion."

 martialcitizenship2:0 "Martial Citizenship"
 martialcitizenship2_desc:0 "The martial ethos has become deeply ingrained in society, ensuring unwavering loyalty and readiness for conflict."

 victoriapopuliromani:0 "Victoria Populi Romani"
 victoriapopuliromani_desc:0 "Victory is claimed in the name of the Roman people. The legions fight with unmatched morale, aggression, and speed."

 followeastromandoctrine:0 "Eastern Roman Doctrine"
 followeastromandoctrine_desc:0 "The strategic doctrines of the Eastern Roman Empire have been adopted, reducing attrition and extending logistical reach."

 eastromansupport:0 "Eastern Roman Support"
 eastromansupport_desc:0 "Support from ideological allies in the East bolsters fuel reserves and accelerates military research."

 LSA_wardepartment:0 "War Department"
 LSA_wardepartment_desc:0 "A centralised war department enhances command capacity and facilitates strategic coordination across all fronts."

 LSA_aromanarmy:0 "A Roman Army"
 LSA_aromanarmy_desc:0 "The armed forces are mobilised with Roman efficiency, preparing the nation for total war."

 motorised_equities:0 "Motorised Equities"
 motorised_equities_desc:0 "Investments in motorised infrastructure have reduced production costs, enabling faster deployment of mechanised units."

 milescaduci:0 "Miles Caduci"
 milescaduci_desc:0 "Special forces trained in ancient Roman combat techniques expand the nation's capacity for elite operations."

 LSA_women_serve_in_the_legions:0 "Women in the Legions"
 LSA_women_serve_in_the_legions_desc:0 "Women have been integrated into the legions, increasing the nation's manpower and demonstrating a modernised martial ethos."

 LSA_airwarplans:0 "Air War Plans"
 LSA_airwarplans_desc:0 "Strategic planning has streamlined aircraft production, ensuring dominance in the skies."

 fighterdevelopmentfocus:0 "Fighter Development Focus"
 fighterdevelopmentfocus_desc:0 "The state prioritises the development of agile and lethal fighter aircraft to secure aerial superiority."

 stratbombingfocus:0 "Strategic Bombing Focus"
 stratbombingfocus_desc:0 "Efficient bomber production enables the destruction of enemy infrastructure from afar."

 combinedbombingfocus:0 "Combined Bombing Focus"
 combinedbombingfocus_desc:0 "Enhanced long-range bombing capabilities allow strikes deep into enemy territory, disrupting logistics and morale."

 LSA_masters_of_the_air:0 "Masters of the Air"
 LSA_masters_of_the_air_desc:0 "Mastery of aerial doctrine has reduced research costs and improved air combat effectiveness."

 LSA_navaldepartment:0 "Naval Department"
 LSA_navaldepartment_desc:0 "A naval department oversees ship design and upgrades, improving fleet efficiency and reducing production costs."

 LSA_escortfocus:0 "Escort Focus"
 LSA_escortfocus_desc:0 "Light escort vessels are prioritised to safeguard convoys and support larger warships."

 LSA_unrestricted_sub_warfare:0 "Unrestricted Submarine Warfare"
 LSA_unrestricted_sub_warfare_desc:0 "Submarines operate with stealth and precision, disrupting enemy supply lines through unrestricted warfare."

 LSA_maritime_comission:0 "Maritime Commission"
 LSA_maritime_comission_desc:0 "A national maritime commission accelerates dockyard construction and naval expansion."

 LSA_legionaryships:0 "Legionary Ships"
 LSA_legionaryships_desc:0 "Convoys are constructed for rapid deployment and amphibious operations, reflecting the naval ambitions of a modern Roman state."

 eagleascendant:0 "Eagle Ascendant"
 eagleascendant_desc:0 "The eagle rises once more. National pride and war readiness are elevated across the populace."

 LSA_wartimeproduction:0 "Wartime Production"
 LSA_wartimeproduction_desc:0 "Civilian industry has been repurposed for military use, dramatically increasing wartime output."

 projecty:0 "Project Y"
 projecty_desc:0 "A clandestine research initiative accelerates nuclear development, promising unparalleled destructive capability."

 nationalreconciliation:0 "National Reconciliation"
 nationalreconciliation_desc:0 "Efforts to reconcile internal divisions have stabilised the nation, though tensions remain beneath the surface."

 citizenandsoldier:0 "Citizen and Soldier"
 citizenandsoldier_desc:0 "The citizenry is fully militarised, with every individual prepared to defend the state and contribute to its recovery."

 citizenandsoldier2:0 "Citizen and Soldier"
 citizenandsoldier2_desc:0 "The militarised population now supports foreign interventions and rapid industrial repair, embodying the unity of citizen and soldier."

 agriculturaleconomy:0 "Agricultural Economy"
 agriculturaleconomy_desc:0 "An overreliance on agriculture has hindered industrial development and reduced production efficiency."

 sloweconomicgrowth:0 "Slow Economic Growth"
 sloweconomicgrowth_desc:0 "The economy grows at a sluggish pace, limiting industrial capacity and construction efforts."

 economiccompotence:0 "Economic Competence"
 economiccompotence_desc:0 "Competent economic management has improved factory output and reduced consumer strain, strengthening the national economy."

 destroyingremainingresistance:0 "Destroying Remaining Resistance"
 destroyingremainingresistance_desc:0 "Pockets of resistance are crushed with speed and precision, allowing the legions to advance faster and strike harder."

 legionstatecontinentalarmy:0 "Legionary Continental Army"
 legionstatecontinentalarmy_desc:0 "A continental army rises, ready to project power abroad with growing confidence, volunteers, and political backing."

 legionstatecontinentalarmy2:0 "Legionary Continental Army"
 legionstatecontinentalarmy2_desc:0 "A continental army rises, ready to project power abroad with growing confidence, volunteers, and political backing."

 altaniclifelines:0 "Altanic Lifelines"
 altaniclifelines_desc:0 "The Atlantic lifelines are secured. Naval invasions become larger, faster, and better supplied, opening the path to global campaigns."

 romanindustries:0 "Roman Industries"
 romanindustries_desc:0 ""