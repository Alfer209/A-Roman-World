 MARCUS_VARRO_DESC:0 "Born into an old senatorial family in Ravenna, Marcus Varro rose through the ranks of the Roman diplomatic corps rather than the legions. Known for his austere manners and unshakable faith in Roman order, he became a key figure in negotiating commercial privileges for the empire in Asia. When the International Mandate for Japanese Concessions was established, Varro was selected as its first Governor-Chairman — not only for his experience in handling foreign courts, but also for his reputation as incorruptible in a world where money and influence often outweighed duty.\n\nVarro sees himself as a custodian rather than a conqueror. To him, the Concession Cities are not colonies, but “outposts of civilization” where Roman, Teutonic, Ming, Russian, and Britannic traders must be kept in fragile balance. His paternalist philosophy emphasises strict social order, guided commerce, and controlled modernisation — what he calls the Roman hand upon the Eastern shore. While corporations and foreign councils technically dominate Yokohama, Varro’s iron presence ensures that disputes are settled with Roman arbitration.\n\nTo the Japanese, he is an aloof figure, rarely seen outside official ceremonies; to the international elites, he is a stern but reliable arbiter who ensures the concessions remain profitable. His critics whisper that he is little more than a glorified corporate overseer, but Varro himself believes he is serving history — binding East and West under Rome’s guidance, one port at a time."
 
 ZACH_MAK_DESC:0 "King Zacharias Makourios traces his lineage back to the ancient Christian kings of Makuria, the medieval Nubian kingdom that resisted Arab conquest for centuries. Educated in Alexandria under the patronage of the East Roman Church, he returned to Khartoum determined to forge a modern Nubia that could stand proud against both imperial encroachment and Islamic neighbors. Zacharias rules as a paternal autocrat — half monarch, half high priest — blending Byzantine-style court ceremony with local traditions. He champions the Coptic Church, presents himself as the “Defender of the Nile,” and carefully balances East Roman patronage with Nubian pride. Though lacking the industrial might of his neighbors, he commands fierce loyalty among his people, who see him as the last Christian king on the Upper Nile."
