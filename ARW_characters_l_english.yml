 AUT_KURT_SCHUSCHNIGG_LEADER_DESC:0 "Kurt Schuschnigg rose from the tumult of Austria’s fractured politics with a singular message: Austria must be more than a pawn. For centuries, the land had been trapped between two giants — the Teutonic Empire to the north and the West Roman Empire to the south — reduced to little more than a buffer state, its sovereignty tolerated only so long as it served the ambitions of others. Schuschnigg rejected this role outright.\n\nA staunch nationalist, he became the first leader to openly champion a distinct Austrian path, arguing that the nation’s history, culture, and destiny placed it above its so-called “protectors.” To him, both Teutonic militarism and Roman imperial pretensions were hollow relics of faded glory, while Austria embodied a purer and more enduring strength. His fiery speeches denounced foreign meddling and declared that Austria would no longer kneel before the weight of its neighbors’ empires.\n\nAs his influence grew, Schuschnigg transformed from a cautious politician into the standard-bearer of Austrian independence. He vowed to fortify the nation against Roman intrigue and Teutonic dominance alike, declaring Austria not as a buffer, but as the rightful arbiter of Central Europe’s future. In his vision, Austria was no longer a line on someone else’s map — it was the center of its own world, destined to stand superior to the great powers that once overshadowed it."

 DAM_ANH_NGUYEN_LEADER_DESC:0 "Born in the crowded alleys of Huế to a family of impoverished farmers, Anh Nguyen’s story is one of relentless ambition and unshakable devotion to her people. Raised amid hardship, she grew to embody the voice of the dispossessed, refusing to bow to emperors, colonial officers, or foreign merchants who saw Đại Nam only as a pawn in their endless wars. Fiercely intelligent and uncompromising, Nguyen rose from the lowest ranks of society to become a figurehead of resistance and reform, winning the admiration of peasants, soldiers, and scholars alike.\n\nPolitically, she is unwavering: pro-Ming to the core, seeing in China not only a cultural kinship but also a bulwark against Western imperialism and the predations of rival empires. To Nguyen, the Teutonic and Roman empires represent the worst of European arrogance, threatening to carve up Asia as they once carved up Europe. She despises Japan as well, viewing it as a treacherous imitator of Western colonialism, cloaking conquest in pan-Asian rhetoric. Her speeches rail against the 'false promises of progress' brought by colonial bayonets, insisting instead that true progress must come from within, by and for the people of Đại Nam.\n\nNguyen is no mere ideologue; she is pragmatic, ruthless when needed, and utterly ambitious. She envisions an empire reborn not as a monarchy of privilege, but as a state forged from the sweat of its people — a nation that can meet the world as an equal, not a vassal. To her supporters, she is the daughter of Đại Nam, proof that destiny does not belong solely to nobles or generals. To her enemies, she is a dangerous radical whose words ignite rebellion and whose rise threatens centuries of imperial order. For Anh Nguyen, however, the struggle is clear; the people of Đại Nam will either stand tall and sovereign, or be crushed beneath the boots of empire."
 
 