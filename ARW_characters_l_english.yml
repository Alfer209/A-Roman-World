 MARCUS_VARRO_DESC:0 "Народжений у старовинній сенаторській родині в Равенні, Марк Варрон піднявся кар’єрними щаблями не через легіони, а через дипломатичний корпус Риму. Відомий своєю суворою вдачею та непохитною вірою в римський порядок, він став ключовою фігурою у переговорах щодо торгових привілеїв імперії в Азії. Коли було створено Міжнародний Мандат Японські Концесій, Варрона обрали його першим губернатором-головою — не лише за досвід у справах із чужоземними дворами, але й за репутацію людини, яку не можна підкупити у світі, де гроші й вплив часто переважають обов’язок.\n\nВаррон бачить себе не завойовником, а опікуном. Для нього міста-концесії — це не колонії, а “форпости цивілізації”, де римських, тевтонських, мінських, російських і британських торговців слід утримувати в крихкій рівновазі. Його патерналістська філософія підкреслює суворий соціальний порядок, керовану торгівлю та контрольовану модернізацію — те, що він називає “римською рукою над східним берегом”. Хоч корпорації та іноземні ради формально панують у Йокогамі, залізна присутність Варрона гарантує, що суперечки вирішуються під римським арбітражем.\n\nДля японців він — відсторонена постать, яку рідко бачать поза офіційними церемоніями; для міжнародної еліти — суворий, але надійний арбітр, що забезпечує прибутковість концесій. Критики шепочуть, що він лише розкішний корпоративний наглядач, але сам Варрон вірить, що служить історії — поєднуючи Схід і Захід під проводом Риму, порт за портом."
 
 ZACH_MAK_DESC:0 "Король Захарій Макурій походить від стародавніх християнських царів Макурії — середньовічного нубійського королівства, що століттями чинило опір арабським завоюванням. Освічений в Александрії під покровительством Східноримської церкви, він повернувся до Хартума з рішучим наміром створити сучасну Нубію, здатну гордо протистояти як імперському тиску, так і ісламським сусідам.\n\nЗахарій править як патерналістичний автократ — наполовину монарх, наполовину верховний жрець — поєднуючи візантійський придворний церемоніал із місцевими традиціями. Він є покровителем Коптської церкви, називає себе “Захисником Нілу” та ретельно зберігає баланс між східноримським заступництвом і нубійською гордістю.\n\nХоча його держава не має промислової потуги сусідів, Захарій користується палкою відданістю свого народу, який бачить у ньому останнього християнського царя Верхнього Нілу."

