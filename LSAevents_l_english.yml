l_english: 

 legionstates.1.t:0 "Pursuing the Goal of Unification"
 legionstates.1.desc:0 "George Marshall, Consul of the Legion States, Caesar-to-be of New Rome, announced for pursuing his ulimate goal of unification. The fragmented states of North America will be finally unified under the Legion States of America, only under us with strength and solidatry can we proclaim our rightful place in history. Long Live New Rome! Long Live the Legion States! Long Live George Marshall! For a greater future of our peoples across America."
 legionstates.1.a:0 "One people, one purpose, one future!"

 legionstates.2.t:0 "The Legion States Sends An Ulimatum"
 legionstates.2.desc:0 "The message arrived at dawn, sealed with the insignia of the Legion States and bearing the unmistakable authority of Consul George Marshall himself. It was not a request. It was a demand. The Legion, now ascendant, turns its gaze toward our lands, offering us a choice: submission or destruction. Their legions stand ready, their armies ready for discipline and conquest. We face a grim reality — our sovereignty hangs by a thread, and the cost of defiance may be paid in blood. The people of Louisiana look to their crown for guidance, as history prepares to judge whether we bend to survive or stand and risk all."
 legionstates.2.a:0 "We cannot possibly fight them off... better to join than bloodshed."
 legionstates.2.b:0 "We will never give up!"

 legionstates.3.t:0 "Louisiana Gives In!"
 legionstates.3.desc:0 "Following the ultimatum issued by the Legion States, the Kingdom of Louisiana has formally accepted the terms of integration. The decision, made under mounting military and political pressure, secures the region without armed conflict and expands the strategic reach of the Legion States in the southern corridor. With local administration dissolved and transitional governance established, preparations begin for full incorporation into the Legion framework. The acquisition strengthens our position for future operations against the Republic and reinforces the momentum of continental unification."
 legionstates.3.a:0 "Our staging ground for conquest of the Republic is secure."

 legionstates.4.t:0 "Louisiana Refuses To Give In!"
 legionstates.4.desc:0 "The Kingdom of Louisiana has officially rejected the ultimatum issued by the Legion States, opting to resist integration and maintain its sovereignty. Diplomatic channels have been severed, and military preparations are reportedly underway across key border regions. The refusal marks a significant escalation in regional tensions and confirms that further unification will not proceed peacefully. Strategic planning must now shift toward forced compliance, as the path forward demands decisive action."
 legionstates.4.a:0 "They have chosen the hard way then..."

 legionstates.5.t:0 "The Legion States Request Support"
 legionstates.5.desc:0 "The Legion States have reached out to us, invoking past shared heritage and strategic alignment. Their Consul, George Marshall have recently adopted the plan for unification of the whole fragmented states of the North American continent. They seek from us, experienced advisors, logistical expertise, and political backing from its Eastern counterpart. This request marks a significant step in trans-Altantic cooperation and may shape the future balance of power across both continents. Shall we send our best advisors to help our Roman brothers across the Altantic? Or shall we neglect them to focus on our own needs?"
 legionstates.5.a:0 "Send our best advisors to help our brothers across the Altantic."
 legionstates.5.b:0 "Our resources are stretched thin. Decline the request."

 legionstates.6.t:0 "Constantinople Sends Their Support!"
 legionstates.6.desc:0 "The government in Constantinople has accepted our request and pledged full support for the unification campaign. Advisors, strategic planners, and diplomatic envoys are en route to assist in coordination and implementation. This marks a historic moment of renewed cooperation between European Roman powers and New Rome, strengthening our legitimacy and operational capacity as we move forward."
 legionstates.6.a:0 "The legacy of Rome marches united once more."

 legionstates.7.t:0 "Constantinople Refuses To Send Support"
 legionstates.7.desc:0 "Despite our diplomatic overtures, Constantinople has declined to provide support for our unification efforts. Citing internal priorities and regional instability, their government has chosen to remain neutral. While disappointing, this refusal will not deter our mission. The legions will advance — with or without Eastern backing."
 legionstates.7.a:0 "We stand alone. But we do not falter."

 legionstates.8.t:0 "One Legion, One Nation!"
 legionstates.8.desc:0 "After months of tireless preparation, strategic planning, and relentless training, the moment has arrived. Consul George Marshall, the architect of New Rome, has issued the final decree — and the legions have answered without hesitation. The banners of the Legion States rise high as the drums of war thunder across the continent. Our enemies, the so-called Roman Republic of Texas and the defiant enclave of New England, have long stood as obstacles to unity, clinging to fractured ideals and outdated sovereignty. Their resistance is no longer tolerable.\n\nThis is not a campaign of ambition — it is a crusade of destiny. The legions will march with precision and fury, crossing borders not as invaders, but as liberators of a divided land. The Republic will fall. New England will kneel. The continent will be reforged in the image of strength, discipline, and order. One banner. One command. One nation.\n\nThe American Unification War has begun. Let the world bear witness to the trial that will define our legacy. We do not seek peace. We seek victory — total, undeniable, and eternal."
 legionstates.8.a:0 "Our greatest trial has come."

 legionstates.9.t:0 "Southern Offensive Operation"
 legionstates.9.desc:0 "The southern campaign begins. Our legions have received orders to advance into Apalachia, the Prairie Confederation, and the traitorous Legion of Exiles. These regions, plagued by instability and defiance, stand as barriers to our rightful dominion. The Exiles, once part of our own ranks, now face the full weight of retribution. This operation will secure the southern corridor and eliminate threats to internal cohesion. The march begins — swift, brutal, and absolute."
 legionstates.9.a:0 "Launch the operation."

 legionstates.10.t:0 "Constantinople Invites Us To Their 'Roman Pact'"
 legionstates.10.desc:0 "The government of Constantinople has extended a formal invitation to join the Roman Pact — a strategic alliance aimed at preserving Roman heritage and coordinating geopolitical influence across continents. While the offer emphasizes shared cultural identity and mutual defense, the Legion States must weigh the benefits of alignment against their own national priorities."
 legionstates.10.a:0 "They are our brothers across the Altantic."
 legionstates.10.b:0 "No, we have our own matters to deal with!"

 legionstates.11.t:0 "The Legion States Are With Us!"
 legionstates.11.desc:0 "The Legion States have accepted our invitation to join the Roman Pact. Their decision marks a significant step toward trans-Atlantic cooperation and strengthens the ideological and strategic unity of the Roman world. Together, we stand prepared to shape the future."
 legionstates.11.a:0 "Our brother across the Altantic is finally with us!"

 legionstates.12.t:0 "The Legion States Refuses..."
 legionstates.12.desc:0 "The Legion States have declined our invitation to join the Roman Pact. Despite shared heritage and strategic interests, their leadership has chosen to pursue an independent course. While disappointing, we shall continue our efforts without their support."
 legionstates.12.a:0 "We will proceed alone, as we always have."

 legionstates.13.t:0 "The Legion States Demands California"
 legionstates.13.desc:0 "The Legion States have issued a formal demand to the New Spanish Empire for the immediate transfer of California. Citing historical claims, strategic necessity, and the broader goal of continental unification, Consul George Marshall has declared that California must be liberated from foreign control. The ultimatum presents a stark choice: peaceful transfer or inevitable conflict. We can relinquish control over one of our richest states, or give in and preserve our hopeful peace and prosperity..."
 legionstates.13.a:0 "We must preserve peace at all costs..."
 legionstates.13.b:0 "We'll never give into those Roman colonists!"

 legionstates.14.t:0 "The New Spanish Empire Gives In!"
 legionstates.14.desc:0 "Faced with mounting pressure and the threat of war, the New Spanish Empire has agreed to cede California to the Legion States. The transition is underway, with Legion forces entering the region unopposed. This peaceful acquisition marks a significant step toward continental consolidation and strengthens the Legion’s strategic position in the West."
 legionstates.14.a:0 "California is finally liberated!"

 legionstates.15.t:0 "The New Spanish Empire Refuses To Relinquish Control!"
 legionstates.15.desc:0 "The New Spanish Empire has rejected the Legion States’ demand for California, refusing to relinquish control over the territory. Diplomatic channels have collapsed, and tensions have escalated rapidly. The refusal signals a potential military confrontation, as the Legion prepares to enforce its claim by force. The path to unification grows bloodier."
 legionstates.15.a:0 "Goddamn Imperialists!"

 legionstates.16.t:0 "Interior Offensive Operation"
 legionstates.16.desc:0 "Our forces must turn inward to strike at the interior states. The Two Rivers Republic, Great Sioux Nation, Great Lakes Federation, and Dakota Territories have resisted integration and stand as fractured remnants of a failed order. The Interior Offensive will break their resistance, secure vital infrastructure, and pave the way for western operations. This is the heart of the continent — and it will beat under the Legion’s banner."
 legionstates.16.a:0 "Launch the operation."

 legionstates.17.t:0 "The Legion States Sends An Ulimatum"
 legionstates.17.desc:0 "Consul George Marshall has issued a formal ultimatum to the State of Deseret: surrender sovereignty and submit to integration, or face the wrath of the Legion. Citing Deseret’s strategic location and ideological divergence, the Legion States have declared that neutrality is no longer acceptable. The message is clear — join the march toward unity, or be crushed beneath it. "
 legionstates.17.a:0 "We can not sacrfise life for meaningless unwinnable wars..."
 legionstates.17.b:0 "Fight! Fight them back!"

 legionstates.18.t:0 "Deseret Gives In!"
 legionstates.18.desc:0 "Under immense pressure and facing overwhelming force, the leadership of Deseret has agreed to the terms of the ultimatum. Their banners are lowered, and Legion troops have entered the territory unopposed. Though tensions remain, the transition is swift and orderly. Another piece of the continental puzzle falls into place — without a single shot fired."
 legionstates.18.a:0 "Deseret has seen reason. The march continues north."

 legionstates.19.t:0 "Deseret Refuses To Give In!"
 legionstates.19.desc:0 "Deseret has rejected our ultimatum. Even as war echoes across the continent and Legion flags rise over unified lands, they dare to defy the inevitable. Their leaders speak of divine mandate and sacred soil, clinging to faith as the legions close in. There is no negotiation. No retreat. The war is already here — and Deseret has chosen to meet it with stubborn pride. Their refusal will be remembered not as courage, but as folly. The legions do not pause. They do not forgive. They advance."
 legionstates.19.a:0 "They have sealed their fate."

 legionstates.20.t:0 "The Legion States Sends An Ulimatum"
 legionstates.20.desc:0 "The Legion States have delivered a direct ultimatum to Kaiserheim, demanding the peaceful surrender of sovereignty and integration into the continental order. Citing historical grievances and the need to eliminate foreign influence, Consul George Marshall has declared that the Teutonic legacy must end — or be broken. The ultimatum offers a final chance to avoid bloodshed, but few believe Kaiserheim will bow to Roman authority without a fight."
 legionstates.20.a:0 "We must preserve peace for our people..."
 legionstates.20.b:0 "Romans? Never! Death before victory!"

 legionstates.21.t:0 "Kaiserheim Gives In!"
 legionstates.21.desc:0 "Under immense pressure and facing overwhelming force, Kaiserheim has accepted the terms of the Legion States’ ultimatum. Their banners are lowered, and Legion troops have entered the territory without resistance. Though resentment simmers beneath the surface, the transition is swift. The Teutonic legacy fades quietly — and the march of New Rome continues."
 legionstates.21.a:0 "Kaiserheim has bent the knee. Another province reclaimed."

 legionstates.22.t:0 "The Teutonic Colonists Gives Us The Finger"
 legionstates.22.desc:0 "Kaiserheim has rejected our ultimatum with open contempt. Their leaders denounce Roman imperialism and vow to defend their Teutonic heritage to the last breath. Legion scouts report fortified positions and defiant broadcasts from the capital. There will be no peace. The colonists have chosen defiance — and they will be crushed beneath the boots of the legions."
 legionstates.22.a:0 "Then let Kaiserheim drown in its own pride."

 legionstates.23.t:0 "The Legion States Request Support"
 legionstates.23.desc:0 "The Legion States have reached out to us, invoking past shared heritage and strategic alignment. Their Consul, George Marshall have recently adopted the plan for unification of the whole fragmented states of the North American continent. They seek from us, experienced advisors, logistical expertise, and political backing from its Western Roman counterpart. This request marks a significant step in trans-Altantic cooperation and may shape the future balance of power across both continents. Shall we send our best advisors to help our Roman brothers across the Altantic? Or shall we neglect them to focus on our own needs?"
 legionstates.23.a:0 "Send our best advisors to help our brothers across the Altantic."
 legionstates.23.b:0 "Our resources are stretched thin. Decline the request."

 legionstates.24.t:0 "Rome Sends Their Support!"
 legionstates.24.desc:0 "The government in Rome has accepted our request and pledged full support for the unification campaign. Advisors, strategic planners, and diplomatic envoys are en route to assist in coordination and implementation. This marks a historic moment of renewed cooperation between European Roman powers and New Rome, strengthening our legitimacy and operational capacity as we move forward."
 legionstates.24.a:0 "The legacy of Rome marches united once more."

 legionstates.25.t:0 "Rome Refuses To Send Support"
 legionstates.25.desc:0 "Despite our diplomatic overtures, Rome has declined to provide support for our unification efforts. Citing internal priorities and regional instability, their government has chosen to remain neutral. While disappointing, this refusal will not deter our mission. The legions will advance — with or without Western backing."
 legionstates.25.a:0 "We stand alone. But we do not falter."

 legionstates.26.t:0 "The Legion States Requests To Join!"
 legionstates.26.desc:0 "A formal communiqué has arrived from across the Atlantic. The Legion States, finally achieved their goal of continental unification, now seek entry into the Roman League. Their message is clear: the time has come to unite brothers across the world under one Roman banner, to stand together in the face of global upheaval, and to bring order to a world descending into chaos.\n\nConsul George Marshall invokes shared heritage, mutual destiny, and the sacred duty of Rome reborn. Yet within the halls of Constantinople, debate stirs. Some see the Legion as brothers-in-arms, tempered by war and ready to uphold the legacy of empire. Others see opportunists — latecomers drawn by glory, not loyalty. The decision will shape the course of the Bellum Magnum, and perhaps the fate of Rome itself."
 legionstates.26.a:0 "Our brother across the Altantic has finally answered!"
 legionstates.26.b:0 "No! They joined for the glory, not to help us!"

 legionstates.27.t:0 "Constantinople Answers!"
 legionstates.27.desc:0 "The Eastern Roman Empire has accepted our petition. The pact is signed, the banners aligned. For the first time in centuries, the legions of the States and European Romans stand united under the Roman League. Across the seas, war drums echo in harmony. Our armies will march not as isolated powers, but as one civilisation — ancient, eternal, and unyielding.\n\nThe Bellum Magnum will surely turn to our favour. A war not merely of survival, but of restoration. From the marble halls of Constantinople to the steel fortresses of New Rome, the call has gone out: Rome rises again. And this time, it will not fall."
 legionstates.27.a:0 "To Europe! To War! For Rome across the world!"

 legionstates.28.t:0 "Constantinople Refuses..."
 legionstates.28.desc:0 "Our request has been denied. The Eastern Roman Empire, despite our shared blood and vision, has chosen to walk alone. Their envoys speak of caution, of timing, of mistrust. But beneath their polished words lies a bitter truth: they do not believe in us. They see our rise as a threat, not a triumph.\n\nLet them. We did not unify a continent to beg for approval. If they will not stand beside us, they will stand behind us — or be swept aside. The legions do not wait. The legions do not kneel. Rome will rise, with or without Constantinople."
 legionstates.28.a:0 "They don't need us? Let them perish in their own pride."

 legionstates.29.t:0 "The Legion States Sends An Ulimatum!"
 legionstates.29.desc:0 "A formal ultimatum has arrived from the Legion States. With their ambitions of uniting the mainland, they turn their gaze westward — toward the Pacific. The message is clear: align with New Rome or risk isolation in a world growing ever more hostile. They offer guarantees, protection, and partnership — but beneath the polished rhetoric lies a veiled threat.\n\nFor the Hawaiian Kingdom, the decision is monumental. To accept is to surrender autonomy in exchange for survival. To refuse is to stand alone, surrounded by giants. The crown must choose; submission under Roman order, or defiance in uncertain waters."
 legionstates.29.a:0 "Rather the Romans than the other powers..."
 legionstates.29.b:0 "We'll never cede our sovereignty!"

 legionstates.30.t:0 "Hawai'ians Accept!"
 legionstates.30.desc:0 "The Hawai'ian Kingdom has accepted our terms. Their monarch has signed the Treaty of Pacific Integration, formally aligning the islands with the Legion States. Our banners now fly over Pearl Harbor, and Roman advisors have begun coordinating defense and administration. Though resistance lingers in whispers, the transition has been peaceful.\n\nThis marks a major strategic victory for New Rome — a foothold in the Pacific, a symbol of expanding influence, and a partner in the coming global order. The islands are ours. The sea is ours. The future is Roman."
 legionstates.30.a:0 "Welcome to the fold."

 legionstates.31.t:0 "Hawai'ians Refuse!"
 legionstates.31.desc:0 "The Hawai'ian Kingdom has rejected our ultimatum. Their monarch declared that Hawai‘i will remain sovereign, free from foreign domination — Roman or otherwise. Our ambassadors were expelled, and coastal defenses have been quietly reinforced. Though no shots have been fired, the message is clear; they will not bow.\n\nLet them cling to their isolation. The Pacific is vast, but our reach is growing. If they will not join us willingly, they may yet be swept aside by the tides of history. Rome does not forget."
 legionstates.31.a:0 "They’ve chosen defiance. So be it."

 legionstates.32.t:0 "The Ending Of The Unification War"
 legionstates.32.desc:0 "Years of bloodshed, sacrifice, and relentless struggle have at last come to an end. The banners of rival claimants lie in the dust, their armies scattered, their capitals silenced. From coast to coast, the Legion stands supreme. What began as a desperate bid for unity against overwhelming odds has transformed into a crusade that reshaped the destiny of a continent. Now, with the last enemy defeated, the guns fall quiet and the dream of a united America has become reality. Yet victory brings with it questions of its own—what kind of nation shall rise from the ashes of war? The people look to the Legion for guidance, and the world watches as the future of a continent is written anew."
 legionstates.32.a:0 "Unification... is finally here."

 legionstates.33.t:0 "The Legion States Demand Greenland!"
 legionstates.33.desc:0 "A most unexpected diplomatic cable has arrived from across the Atlantic. The Legion States, emboldened by their recent continental consolidation, have delivered an ultimatum to our government: hand over Greenland to their administration, or risk straining relations. They argue that the island is of little value to us yet of strategic importance to them, serving as a forward base between the Old World and the New. While few in our nation see Greenland as more than a barren wasteland of ice and rock, the principle of foreign powers dictating our territorial sovereignty is a matter not so easily dismissed. Our cabinet now debates whether to acquiesce to their request or reject it outright, fully aware of the consequences each path may bring."
 legionstates.33.a:0 "They want a barren wasteland? Sure."
 legionstates.33.b:0 "That's ours!"

 legionstates.34.t:0 "Norway Accepts!"
 legionstates.34.desc:0 "Success! Oslo have agreed to transfer sovereignty over Greenland to the Legion States, citing the island’s limited economic worth and logistical burdens. Though couched in diplomatic language, it is clear they see little reason to contest our growing influence. This decision marks a tremendous geopolitical victory for us — Greenland shall now serve as our gateway into Europe, a forward bastion from which to project power across the Atlantic. While some international voices may grumble, the simple fact is undeniable: the Legion States now control a stepping stone into the Old World itself."
 legionstates.34.a:0 "We now have direct access to Europe!"

 legionstates.35.t:0 "Norway Refuses!"
 legionstates.35.desc:0 "Our demand has been met with outright rejection. The Norwegian cabinet declared that Greenland, regardless of its icy and inhospitable terrain, is an inalienable part of their sovereignty. Their refusal is laced with arrogance, as though our rising power can simply be ignored. The insult has not gone unnoticed in our capital. While some urge restraint, warning of the risks of escalating conflict with a European power, others argue that the time has come to demonstrate that Legion demands cannot be dismissed without consequence. Whether we choose diplomacy or force, one truth remains: Europe has just been reminded that the Legion States are not to be trifled with."
 legionstates.35.a:0 "Arrogant fools."




 legionstates.200.t:0 "The American Unification War"
 legionstates.200.desc:0 "War has erupted on the North American continent as the Legion States formally declare their campaign to unify the fractured republics and kingdoms under a single banner. Led by Consul George Marshall, the Legion has launched coordinated offensives against its strongest rivals — the Republic of Texas and New England — marking the beginning of a continent-wide conflict. The American Unification War has begun, and its outcome will reshape the political landscape of the Western Hemisphere. Nations across the world now watch with anticipation, concern, or resolve as the legions march toward their vision of a new order."
 legionstates.200.a:0 "The banner of the Legion States will fly across the continent!"
 legionstates.200.b:0 "Our Roman brothers across the Altantic rises, let the Eagle prevail."
 legionstates.200.c:0 "A new war begins in America. We must prepare for the consequences."

 legionstates.207.t:0 "Legion States Forces Encroach On The Border"
 legionstates.207.desc:0 "Reports flood in from the southern frontier — Legion forces have begun massing along the border. Columns of armoured vehicles, disciplined infantry, and banners bearing the insignia of New Rome now cast long shadows across our lands. Their silence is deafening, their intent unmistakable. This is not a drill. The Legion States are preparing for war.\n\nConsul George Marshall’s vision of continental domination has reached its final phase, and New England stands in its path. Our diplomats are ignored, our warnings dismissed. The air grows heavy with dread as citizens brace for the storm. We are alone. The trial of survival begins now — and the cost will be measured in blood."
 legionstates.207.a:0 "Sound the alarms. We face annihilation or defiance."

 legionstates.222.t:0 "The Legion States Extends Their Hand"
 legionstates.222.desc:0 "The Legion States have proposed a formal treaty of mutual defense and strategic cooperation. Citing shared interests and the need for stability in the Western Hemisphere, Consul George Marshall has extended guarantees of military support in exchange for reciprocal commitments. The offer presents a chance to forge a powerful alliance — one that could reshape regional dynamics and deter external threats. The decision now lies with us."
 legionstates.222.a:0 "We require a strong ally in this part of the world."
 legionstates.222.b:0 "Romans? Never!"

 legionstates.223.t:0 "The New Spanish Empire Signs The Treaty!"
 legionstates.223.desc:0 "The New Spanish Empire has accepted our proposal and signed the mutual defense treaty. This agreement formalises a strategic partnership, ensuring military guarantees and coordinated action in the face of external aggression. The pact strengthens our position in the region and marks a new era of cooperation between Rome and Mexico City."
 legionstates.223.a:0 "A new force rises in the west."

 legionstates.224.t:0 "The New Spanish Empire Refuses..."
 legionstates.224.desc:0 "Despite our overtures, the New Spanish Empire has rejected the proposed treaty. Their leadership has chosen to remain independent, citing concerns over entanglement and ideological divergence. While disappointing, the Legion States will continue to pursue its strategic objectives — with or without their support."
 legionstates.224.a:0 "They have made their choice. So shall we."

 legionstates.201.t:0 "Caesar Of New Rome"
 legionstates.201.desc:0 "In a declaration that echoes through history, George Marshall has crowned himself Caesar of New Rome, proclaiming the birth of a continental empire stretching from coast to coast. With the American Unification War concluded and rival states crushed beneath the march of the legions, the Legion States now stand supreme over the New World. The ceremony, held beneath towering banners and thunderous acclaim, marks the end of division and the rise of a new Roman order.\n\nAcross the globe, reactions are mixed — some hail the birth of empire, others fear the ambitions of a militarist colossus. One thing is certain; the age of the Legion States has begun."
 legionstates.201.a:0 "Long Live the Caesar!"
 legionstates.201.b:0 "A new Caesar in the west?"
 legionstates.201.c:0 "Another Caesar?"

 legionstates.90.t:0 "The End of the American Unification War"
 legionstates.90.desc:0 "After an intense and bloody conflict spanning the whole continent, the American Unification War has finally come to an end. The armies of the Legion States stand triumphant, their banners now flying over the vast expanse of North America. From the plains of Texas to the harbors of New England, rival powers have been defeated, their governments either dissolved or absorbed into the Legion’s growing dominion.\n\nConsul George Marshall, hailed as both a conqueror and a founder, now presides over a united continent under the Eagle of the Legion. The world looks on with awe and trepidation: a new power has risen across the Atlantic, one forged in fire and blood, determined to claim its place among the great nations of history."
 legionstates.90.a:0 "Long Live the Legion States!"
 legionstates.90.b:0 "The Eagle of the West has risen."
 legionstates.90.c:0 "A new power across the sea has risen..."

