l_english: 

 legionstates.1.t:0 "Прагнучи Об'єднання"
legionstates.1.desc:0 "Джордж Маршалл, Консул Легіонерських Штатів, майбутній Цезар Нового Риму, оголосив про досягнення своєї кінцевої мети об'єднання. Розколоті держави Північної Америки будуть остаточно об'єднані під Легіонерськими Штатами Америки; лише під нами, завдяки силі та солідарності, ми можемо проголосити наше законне місце в історії. Хай живе Новий Рим! Хай живуть Легіонерські Штати! Хай живе Джордж Маршалл! За велике майбутнє наших народів по всій Америці."
legionstates.1.a:0 "Один народ, одна мета, одне майбутнє!"

legionstates.2.t:0 "Легіонерські Штати Надсилають Ультиматум"
legionstates.2.desc:0 "Повідомлення прибуло на світанку, запечатане відзнакою Легіонерських Штатів та несучи безпомилковий авторитет самого Консула Джорджа Маршалла. Це був не запит. Це була вимога. Легіон, що тепер підноситься, звертає свій погляд на наші землі, пропонуючи нам вибір: підкорення або знищення. Їхні легіони стоять напоготові, їхні армії готові до дисципліни та завоювання. Ми стикаємося з похмурою реальністю — наш суверенітет висить на волосині, і ціна непокори може бути заплачена кров'ю. Народ Луїзіани дивиться на свою корону в пошуках керівництва, оскільки історія готується судити, чи ми зігнемося, щоб вижити, чи станемо і ризикнемо всім."
legionstates.2.a:0 "Ми не зможемо їх перемогти... краще приєднатися, ніж кровопролиття."
legionstates.2.b:0 "Ми ніколи не здамося!"

legionstates.3.t:0 "Луїзіана Піддається!"
legionstates.3.desc:0 "Після ультиматуму, виданого Легіонерськими Штатами, Королівство Луїзіана офіційно прийняло умови інтеграції. Рішення, прийняте під зростаючим військовим і політичним тиском, забезпечує регіон без збройного конфлікту та розширює стратегічне охоплення Легіонерських Штатів у південному коридорі. З розпуском місцевої адміністрації та встановленням перехідного управління, розпочинається підготовка до повної інкорпорації до структури Легіону. Придбання зміцнює наші позиції для майбутніх операцій проти Республіки та посилює імпульс континентального об'єднання."
legionstates.3.a:0 "Наш плацдарм для завоювання Республіки забезпечено."

legionstates.4.t:0 "Луїзіана Відмовляється Піддатися!"
legionstates.4.desc:0 "Королівство Луїзіана офіційно відхилило ультиматум, виданий Легіонерськими Штатами, вирішивши чинити опір інтеграції та зберегти свій суверенітет. Дипломатичні канали були розірвані, і, за повідомленнями, у ключових прикордонних регіонах триває військова підготовка. Відмова знаменує значну ескалацію регіональної напруги та підтверджує, що подальше об'єднання не відбудеться мирним шляхом. Стратегічне планування тепер має зміститися до примусового підкорення, оскільки шлях вперед вимагає рішучих дій."
legionstates.4.a:0 "Тоді вони обрали важкий шлях..."

legionstates.5.t:0 "Легіонерські Штати Просять Про Підтримку"
legionstates.5.desc:0 "Легіонерські Штати звернулися до нас, посилаючись на минулу спільну спадщину та стратегічну узгодженість. Їхній Консул, Джордж Маршалл, нещодавно прийняв план об'єднання всіх розколотих держав Північноамериканського континенту. Вони прагнуть отримати від нас, від їхнього Східного колеги, досвідчених радників, логістичний досвід та політичну підтримку. Цей запит знаменує значний крок у трансатлантичній співпраці та може сформувати майбутній баланс сил на обох континентах. Чи надішлемо ми наших найкращих радників, щоб допомогти нашим Римським братам через Атлантику? Чи знехтуємо ними, щоб зосередитися на власних потребах?"
legionstates.5.a:0 "Надіслати наших найкращих радників, щоб допомогти нашим братам через Атлантику."
legionstates.5.b:0 "Наші ресурси обмежені. Відхилити запит."

legionstates.6.t:0 "Константинополь Надсилає Свою Підтримку!"
legionstates.6.desc:0 "Уряд у Константинополі прийняв наш запит та пообіцяв повну підтримку кампанії об'єднання. Радники, стратегічні планувальники та дипломатичні посланці вже в дорозі, щоб допомогти у координації та впровадженні. Це знаменує історичний момент оновленої співпраці між Європейськими Римськими державами та Новим Римом, зміцнюючи нашу легітимність та оперативну спроможність у міру нашого просування."
legionstates.6.a:0 "Спадщина Риму знову марширує об'єднаною."

legionstates.7.t:0 "Константинополь Відмовляється Надіслати Підтримку"
legionstates.7.desc:0 "Незважаючи на наші дипломатичні пропозиції, Константинополь відмовився надати підтримку нашим зусиллям з об'єднання. Посилаючись на внутрішні пріоритети та регіональну нестабільність, їхній уряд вирішив залишатися нейтральним. Хоча це розчаровує, ця відмова не зупинить нашу місію. Легіони просуватимуться — з підтримкою Сходу чи без неї."
legionstates.7.a:0 "Ми стоїмо самі. Але ми не хитаємося."

legionstates.8.t:0 "Один Легіон, Одна Нація!"
legionstates.8.desc:0 "Після місяців невтомної підготовки, стратегічного планування та невпинних тренувань настав момент. Консул Джордж Маршалл, архітектор Нового Риму, видав остаточний указ — і легіони відповіли без вагань. Прапори Легіонерських Штатів високо здіймаються, коли гуркіт війни лунає по всьому континенту. Наші вороги, так звана 'Римська Республіка Техасу' та непокірний анклав Нової Англії, довго стояли як перешкоди на шляху до єдності, чіпляючись за роздроблені ідеали та застарілий суверенітет. Їхній опір більше не можна терпіти.\n\nЦе не кампанія амбіцій — це хрестовий похід долі. Легіони маршируватимуть з точністю та люттю, перетинаючи кордони не як загарбники, а як визволителі розділеної землі. Республіка впаде. Нова Англія схилить коліна. Континент буде перекований в образі сили, дисципліни та порядку. Один прапор. Одна команда. Одна нація.\n\nВійна за Об'єднання Америки розпочалася. Нехай світ стане свідком випробування, яке визначить нашу спадщину. Ми не прагнемо миру. Ми прагнемо перемоги — повної, беззаперечної та вічної."
legionstates.8.a:0 "Наше найбільше випробування настало."

legionstates.9.t:0 "Операція 'Південний Наступ'"
legionstates.9.desc:0 "Починається південна кампанія. Наші легіони отримали накази просуватися в Апалачію, Конфедерацію Прерій та зрадницький 'Легіон Вигнанців'. Ці регіони, охоплені нестабільністю та непокорою, стоять як бар'єри на шляху до нашого законного домінування. Вигнанці, колись частина наших власних лав, тепер зіткнуться з усією вагою відплати. Ця операція забезпечить південний коридор та усуне загрози внутрішній згуртованості. Марш починається — швидкий, брутальний та абсолютний."
legionstates.9.a:0 "Розпочати операцію."

legionstates.10.t:0 "Константинополь Запрошує Нас До Свого 'Римського Пакту'"
legionstates.10.desc:0 "Уряд Константинополя надіслав офіційне запрошення приєднатися до 'Римського Пакту' — стратегічного альянсу, спрямованого на збереження Римської спадщини та координацію геополітичного впливу на континентах. Хоча пропозиція наголошує на спільній культурній ідентичності та взаємній обороні, Легіонерські Штати повинні зважити переваги приєднання проти власних національних пріоритетів."
legionstates.10.a:0 "Вони наші брати через Атлантику."
legionstates.10.b:0 "Ні, у нас є власні справи, якими потрібно займатися!"

legionstates.11.t:0 "Легіонерські Штати З Нами!"
legionstates.11.desc:0 "Легіонерські Штати прийняли наше запрошення приєднатися до 'Римського Пакту'. Це рішення знаменує значний крок до трансатлантичної співпраці та зміцнює ідеологічну та стратегічну єдність Римського світу. Разом ми готові формувати майбутнє."
legionstates.11.a:0 "Наш брат через Атлантику нарешті з нами!"

legionstates.12.t:0 "Легіонерські Штати Відмовляються..."
legionstates.12.desc:0 "Легіонерські Штати відхилили наше запрошення приєднатися до 'Римського Пакту'. Незважаючи на спільну спадщину та стратегічні інтереси, їхнє керівництво вирішило обрати незалежний курс. Хоча це розчаровує, ми продовжимо наші зусилля без їхньої підтримки."
legionstates.12.a: "Ми будемо діяти самі, як завжди."

legionstates.13.t:0 "Легіонерські Штати Вимагають Каліфорнію"
legionstates.13.desc:0 "Легіонерські Штати висунули офіційну вимогу Новій Іспанській Імперії щодо негайної передачі Каліфорнії. Посилаючись на історичні претензії, стратегічну необхідність та ширшу мету континентального об'єднання, Консул Джордж Маршалл оголосив, що Каліфорнія має бути звільнена від іноземного контролю. Ультиматум ставить перед нами жорсткий вибір: мирна передача або неминучий конфлікт. Ми можемо відмовитися від контролю над одним із наших найбагатших штатів, або підкоритися та зберегти наш сподіваний мир та процвітання..."
legionstates.13.a:0 "Ми повинні зберегти мир за будь-яку ціну..."
legionstates.13.b:0 "Ми ніколи не здамося тим Римським колоністам!"

legionstates.14.t:0 "Нова Іспанська Імперія Піддається!"
legionstates.14.desc:0 "Зіткнувшись із зростаючим тиском та загрозою війни, Нова Іспанська Імперія погодилася передати Каліфорнію Легіонерським Штатам. Перехід триває, і сили Легіону безперешкодно входять на територію. Це мирне придбання знаменує значний крок до континентальної консолідації та зміцнює стратегічні позиції Легіону на Заході."
legionstates.14.a:0 "Каліфорнія нарешті звільнена!"

legionstates.15.t:0 "Нова Іспанська Імперія Відмовляється Віддати Каліфорнію!"
legionstates.15.desc:0 "Нова Іспанська Імперія відхилила вимогу Легіонерських Штатів щодо Каліфорнії, відмовляючись віддавати контроль над територією. Дипломатичні канали зруйновані, а напруга швидко зросла. Відмова сигналізує про потенційне військове протистояння, оскільки Легіон готується силою відстояти свої претензії. Шлях до об'єднання стає більш кривавим."
legionstates.15.a:0 "Кляті Імперіалісти!"

legionstates.16.t:0 "Операція 'Внутрішній Наступ'"
legionstates.16.desc:0 "Наші сили повинні звернутися всередину, щоб завдати удару по внутрішнім штатам. Республіка Двох Річок, Велика Нація Сіу, Федерація Великих Озер та Території Дакоти чинили опір інтеграції та стоять як розколоті залишки невдалого порядку. 'Внутрішній Наступ' зламає їхній опір, забезпечить життєво важливу інфраструктуру та прокладе шлях до західних операцій. Це серце континенту — і воно битиметься під прапором Легіону."
legionstates.16.a:0 "Розпочати операцію."

legionstates.17.t:0 "Легіонерські Штати Надсилають Ультиматум"
legionstates.17.desc:0 "Консул Джордж Маршалл видав офіційний ультиматум Державі Дессерет: відмовитися від суверенітету та підкоритися інтеграції, або зіткнутися з гнівом Легіону. Посилаючись на стратегічне розташування Дессерету та ідеологічні розбіжності, Легіонерські Штати оголосили, що нейтралітет більше не є прийнятним. Повідомлення чітке — приєднатися до маршу до єдності, або бути розчавленим під ним."
legionstates.17.a:0 "Ми не можемо жертвувати життями за безглузді, непереможні війни..."
legionstates.17.b:0 "Боротися! Дати їм відсіч!"

legionstates.18.t:0 "Дессерет Піддається!"
legionstates.18.desc:0 "Під величезним тиском та зіткнувшись із переважною силою, керівництво Дессерету погодилося на умови ультиматуму. Їхні прапори опущені, і війська Легіону безперешкодно увійшли на територію. Хоча напруга залишається, перехід відбувається швидко та впорядковано. Ще один фрагмент континентального пазла стає на місце — без єдиного пострілу."
legionstates.18.a:0 "Дессерет побачив розум. Марш продовжується на північ."

legionstates.19.t:0 "Дессерет Відмовляється Піддатися!"
legionstates.19.desc:0 "Дессерет відхилив наш ультиматум. Навіть коли війна лунає по всьому континенту, а прапори Легіону здіймаються над об'єднаними землями, вони наважуються кинути виклик неминучому. Їхні лідери говорять про божественний мандат та священну землю, чіпляючись за віру, коли легіони наближаються. Немає переговорів. Немає відступу. Війна вже тут — і Дессерет вирішив зустріти її з упертою гордістю. Їхня відмова буде запам'ятана не як мужність, а як дурість. Легіони не зупиняються. Вони не прощають. Вони наступають."
legionstates.19.a:0 "Вони вирішили свою долю."

legionstates.20.t:0 "Легіонерські Штати Надсилають Ультиматум"
legionstates.20.desc:0 "Легіонерські Штати доставили прямий ультиматум 'Кайзерхайму', вимагаючи мирної відмови від суверенітету та інтеграції в континентальний порядок. Посилаючись на історичні образи та необхідність усунення іноземного впливу, Консул Джордж Маршалл оголосив, що Тевтонська спадщина має закінчитися — або бути зламаною. Ультиматум пропонує останній шанс уникнути кровопролиття, але мало хто вірить, що Кайзерхайм схилиться перед Римською владою без бою."
legionstates.20.a:0 "Ми повинні зберегти мир для нашого народу..."
legionstates.20.b:0 "Римляни? Ніколи! Смерть перед перемогою!"

legionstates.21.t:0 "Кайзерхайм Піддається!"
legionstates.21.desc:0 "Під величезним тиском та зіткнувшись із переважною силою, 'Кайзерхайм' прийняв умови ультиматуму Легіонерських Штатів. Їхні прапори опущені, і війська Легіону без опору увійшли на територію. Хоча невдоволення кипить під поверхнею, перехід відбувається швидко. Тевтонська спадщина тихо згасає — і марш Нового Риму продовжується."
legionstates.21.a:0 "Кайзерхайм схилив коліно. Ще одна провінція відвойована."

legionstates.22.t:0 "Тевтонські Колоністи Показують Нам Дулю"
legionstates.22.desc:0 "'Кайзерхайм' відхилив наш ультиматум з відкритою зневагою. Їхні лідери засуджують Римський імперіалізм і клянуться захищати свою Тевтонську спадщину до останнього подиху. Розвідники Легіону повідомляють про укріплені позиції та непокірні радіопередачі зі столиці. Миру не буде. Колоністи обрали непокору — і будуть розчавлені під чоботами легіонів."
legionstates.22.a:0 "Тоді нехай 'Кайзерхайм' захлинеться своєю гордістю."

legionstates.23.t:0 "Легіонерські Штати Просять Про Підтримку"
legionstates.23.desc:0 "Легіонерські Штати звернулися до нас, посилаючись на минулу спільну спадщину та стратегічну узгодженість. Їхній Консул, Джордж Маршалл, нещодавно прийняв план об'єднання всіх розколотих держав Північноамериканського континенту. Вони прагнуть отримати від нас, від їхнього Західного Римського колеги, досвідчених радників, логістичний досвід та політичну підтримку. Цей запит знаменує значний крок у трансатлантичній співпраці та може сформувати майбутній баланс сил на обох континентах. Чи надішлемо ми наших найкращих радників, щоб допомогти нашим Римським братам через Атлантику? Чи знехтуємо ними, щоб зосередитися на власних потребах?"
legionstates.23.a:0 "Надіслати наших найкращих радників, щоб допомогти нашим братам через Атлантику."
legionstates.23.b:0 "Наші ресурси обмежені. Відхилити запит."

 legionstates.24.t:0 "Рим Надсилає Свою Підтримку!"
legionstates.24.desc:0 "Уряд у Римі прийняв наш запит та пообіцяв повну підтримку кампанії об'єднання. Радники, стратегічні планувальники та дипломатичні посланці вже в дорозі, щоб допомогти у координації та впровадженні. Це знаменує історичний момент оновленої співпраці між Європейськими Римськими державами та Новим Римом, зміцнюючи нашу легітимність та оперативну спроможність у міру нашого просування."
legionstates.24.a:0 "Спадщина Риму знову марширує об'єднаною."

legionstates.25.t:0 "Рим Відмовляється Надіслати Підтримку"
legionstates.25.desc:0 "Незважаючи на наші дипломатичні пропозиції, Рим відхилив надання підтримки нашим зусиллям з об'єднання. Посилаючись на внутрішні пріоритети та регіональну нестабільність, їхній уряд вирішив залишатися нейтральним. Хоча це розчаровує, ця відмова не зупинить нашу місію. Легіони просуватимуться — з підтримкою Заходу чи без неї."
legionstates.25.a:0 "Ми стоїмо самі. Але ми не хитаємося."

legionstates.26.t:0 "Легіонерські Штати Просять Приєднатися!"
legionstates.26.desc:0 "Надійшло офіційне комюніке з-за Атлантики. Легіонерські Штати, нарешті досягнувши своєї мети континентального об'єднання, тепер прагнуть вступити до Римської Ліги. Їхнє повідомлення чітке: настав час об'єднати братів по всьому світу під одним Римським прапором, стояти разом перед обличчям глобальних потрясінь та навести лад у світі, що занурюється в хаос.\n\nКонсул Джордж Маршалл посилається на спільну спадщину, спільну долю та священний обов'язок відродженого Риму. Проте в залах Константинополя спалахують дебати. Дехто бачить у Легіоні братів по зброї, загартованих війною та готових підтримувати спадщину імперії. Інші бачать опортуністів — тих, хто приєднався пізно, спокушений славою, а не лояльністю. Це рішення, безсумнівно, сформує перебіг Bellum Magnum (Великої Війни), і, можливо, долю самого Риму."
legionstates.26.a:0 "Наш брат через Атлантику нарешті відповів!"
legionstates.26.b:0 "Ні! Вони приєдналися заради слави, а не для допомоги нам!"

legionstates.27.t:0 "Константинополь Відповідає!"
legionstates.27.desc:0 "Східна Римська Імперія прийняла наше прохання. Пакт підписано, прапори узгоджені. Вперше за століття легіони Штатів та Європейських Римлян стоять об'єднані під Римською Лігою. Через моря лунають військові барабани в гармонії. Наші армії маршируватимуть не як ізольовані сили, а як єдина цивілізація — стародавня, вічна та непохитна.\n\nBellum Magnum, безсумнівно, повернеться на нашу користь. Війна не просто за виживання, а за відновлення. Від мармурових залів Константинополя до сталевих фортець Нового Риму пролунав заклик: Рим знову піднімається. І цього разу він не впаде."
legionstates.27.a:0 "До Європи! До Війни! За Рим по всьому світу!"

legionstates.28.t:0 "Константинополь Відмовляється..."
legionstates.28.desc:0 "Наше прохання було відхилено. Східна Римська Імперія, незважаючи на спільну кров та бачення, вирішила йти сама. Їхні посланці говорять про обережність, час, недовіру. Але під їхніми відточеними словами криється гірка правда: вони не вірять у нас. Вони бачать наше піднесення як загрозу, а не тріумф.\n\nНехай. Ми об'єднали континент не для того, щоб просити схвалення. Якщо вони не стануть поруч із нами, вони стоятимуть позаду нас — або будуть зметені. Легіони не чекають. Легіони не схиляються. Рим повстане, з Константинополем чи без нього."
legionstates.28.a:0 "Ми їм не потрібні? Нехай гинуть у власній гордині."

legionstates.29.t:0 "Легіонерські Штати Надсилають Ультиматум!"
legionstates.29.desc:0 "Надійшов офіційний ультиматум від Легіонерських Штатів. З амбіціями об'єднання материка вони звертають свій погляд на захід — до Тихого океану. Повідомлення чітке: об'єднатися з Новим Римом або ризикнути ізоляцією у світі, що стає все більш ворожим. Вони пропонують гарантії, захист та партнерство — але під відточеною риторикою криється прихована загроза.\n\nДля Гавайського Королівства це монументальне рішення. Прийняти — означає відмовитися від автономії в обмін на виживання. Відмовитися — означає стояти на самоті, оточеним гігантами. Корона має вибрати: підкорення під Римським порядком, чи непокора в невизначених водах."
legionstates.29.a:0 "Краще Римляни, ніж інші сили..."
legionstates.29.b:0 "Ми ніколи не поступимося нашим суверенітетом!"

legionstates.30.t:0 "Гавайці Приймають!"
legionstates.30.desc:0 "Гавайське Королівство прийняло наші умови. Їхній монарх підписав 'Договір про Тихоокеанську Інтеграцію', офіційно приєднавши острови до Легіонерських Штатів. Наші прапори тепер майорять над Перл-Гарбором, і Римські радники розпочали координацію оборони та адміністрації. Хоча опір ще жевріє у шепоті, перехід відбувся мирно.\n\nЦе знаменує велику стратегічну перемогу для Нового Риму — плацдарм у Тихому океані, символ експансії впливу та партнер у майбутньому світовому порядку. Острови наші. Море наше. Майбутнє — Римське."
legionstates.30.a:0 "Ласкаво просимо до справи."

legionstates.31.t:0 "Гавайці Відмовляються!"
legionstates.31.desc:0 "Гавайське Королівство відхилило наш ультиматум. Їхній монарх оголосив, що Гаваї залишаться суверенними, вільними від іноземного панування — Римського чи будь-якого іншого. Наших послів вислали, а берегові укріплення тихо посилюються. Хоча жодного пострілу не пролунало, повідомлення чітке: вони не схиляться.\n\nНехай чіпляються за свою ізоляцію. Тихий океан величезний, але наше охоплення зростає. Якщо вони не приєднаються до нас добровільно, їх може змести хвиля історії. Рим не забуває."
legionstates.31.a:0 "Вони обрали непокору. Хай буде так."

 legionstates.32.t:0 "Кінець Війни за Об'єднання"
legionstates.32.desc:0 "Роки кровопролиття, жертв та невтомної боротьби нарешті добігли кінця. Прапори суперників лежать у пилу, їхні армії розбиті, їхні столиці замовкли. Від узбережжя до узбережжя Легіон панує безроздільно. Те, що починалося як відчайдушна спроба об'єднання проти непереборних сил, перетворилося на хрестовий похід, який змінив долю континенту. Тепер, з розгромом останнього ворога, зброя замовкає, і мрія про об'єднану Америку стала реальністю. Проте перемога несе із собою власні питання: яка нація повстане з попелу війни? Народ шукає керівництва у Легіону, і світ спостерігає, як майбутнє континенту пишеться наново."
legionstates.32.a:0 "Об'єднання... нарешті настало."

legionstates.33.t:0 "Легіонерські Штати Вимагають Ґренландію!"
legionstates.33.desc:0 "З-за Атлантики надійшов найбільш несподіваний дипломатичний лист. Легіонерські Штати, натхнені своєю недавньою континентальною консолідацією, висунули ультиматум нашому уряду: передати Ґренландію під їхню адміністрацію або ризикувати напругою у відносинах. Вони стверджують, що острів має для нас невелику цінність, але має стратегічне значення для них, слугуючи передовою базою між Старим та Новим Світом. Хоча мало хто в нашій нації бачить у Ґренландії щось більше, ніж безплідну пустку льоду та скель, принцип диктування нам територіального суверенітету іноземними державами — це питання, яке не так легко проігнорувати. Наш кабінет тепер обговорює, чи варто погоджуватися на їхнє прохання, чи відхилити його одразу, повністю усвідомлюючи наслідки, які може принести кожен шлях."
legionstates.33.a:0 "Вони хочуть безплідну пустку? Звісно."
legionstates.33.b:0 "Це наше!"

legionstates.34.t:0 "Швеція-Норвегія Погоджується!"
legionstates.34.desc:0 "Успіх! Стокгольм та Осло погодилися передати суверенітет над Ґренландією Легіонерським Штатам, посилаючись на обмежену економічну цінність острова та логістичні труднощі. Хоча це обгорнуто в дипломатичні фрази, очевидно, що вони не бачать причин оскаржувати наш зростаючий вплив. Це знаменує величезну геополітичну перемогу для нас — Ґренландія тепер слугуватиме нашим воротам до Європи, передовим бастіоном, звідки ми проєктуватимемо силу через Атлантику. Хоча деякі міжнародні голоси можуть нарікати, простий факт незаперечний: Легіонерські Штати тепер контролюють плацдарм у сам Старий Світ."
legionstates.34.a:0 "Тепер ми маємо прямий доступ до Європи!"

legionstates.35.t:0 "Швеція-Норвегія Відмовляється!"
legionstates.35.desc:0 "Нашу вимогу зустріли відвертою відмовою. Шведсько-Норвезький кабінет оголосив, що Ґренландія, незалежно від її крижаної та непривітної місцевості, є невід'ємною частиною їхнього суверенітету. Їхня відмова пронизана зарозумілістю, ніби нашу зростаючу міць можна просто ігнорувати. Образа не залишилася непоміченою в нашій столиці. Хоча дехто закликає до стриманості, попереджаючи про ризики ескалації конфлікту з Європейською державою, інші стверджують, що настав час продемонструвати, що вимоги Легіону не можуть бути відкинуті без наслідків. Незалежно від того, чи оберемо ми дипломатію, чи силу, одна істина залишається: Європі щойно нагадали, що з Легіонерськими Штатами не варто жартувати."
legionstates.35.a:0 "Зарозумілі дурні."




 legionstates.200.t:0 "Війна за Об'єднання Америки"
legionstates.200.desc:0 "На Північноамериканському континенті спалахнула війна, оскільки Легіонерські Штати офіційно оголосили кампанію з об'єднання розколотих республік та королівств під єдиним прапором. На чолі з Консулом Джорджем Маршаллом Легіон розпочав скоординовані наступи проти своїх найсильніших суперників — Республіки Техас та Нової Англії — що знаменує початок континентального конфлікту. Війна за Об'єднання Америки розпочалася, і її результат змінить політичний ландшафт Західної Півкулі. Нації по всьому світу тепер спостерігають із передчуттям, занепокоєнням чи рішучістю, коли легіони марширують до свого бачення нового порядку."
legionstates.200.a:0 "Прапор Легіонерських Штатів майорітиме по всьому континенту!"
legionstates.200.b:0 "Наші Римські брати через Атлантику піднімаються, хай Орел переможе."
legionstates.200.c:0 "У Америці починається нова війна. Ми повинні готуватися до наслідків."

legionstates.207.t:0 "Сили Легіонерських Штатів Зазіхають на Кордон"
legionstates.207.desc:0 "Надходять повідомлення з південного кордону — сили Легіону почали масово збиратися вздовж лінії розмежування. Колони бронетехніки, дисциплінована піхота та прапори з відзнаками Нового Риму тепер відкидають довгі тіні на наші землі. Їхня тиша оглушлива, їхній намір безпомилковий. Це не навчання. Легіонерські Штати готуються до війни.\n\nБачення континентального домінування Консула Джорджа Маршалла досягло своєї фінальної фази, і Нова Англія стоїть на його шляху. Наших дипломатів ігнорують, наші попередження відкидають. Повітря стає важким від жаху, коли громадяни готуються до бурі. Ми одні. Випробування на виживання починається зараз — і ціна буде вимірюватися в крові."
legionstates.207.a:0 "Бити на сполох. Нас чекає або знищення, або непокора."

legionstates.222.t:0 "Легіонерські Штати Простягають Руку"
legionstates.222.desc:0 "Легіонерські Штати запропонували формальний договір про взаємну оборону та стратегічну співпрацю. Посилаючись на спільні інтереси та потребу в стабільності в Західній Півкулі, Консул Джордж Маршалл розширив гарантії військової підтримки в обмін на взаємні зобов'язання. Пропозиція дає шанс створити потужний союз — такий, що може змінити регіональну динаміку та стримати зовнішні загрози. Рішення тепер за нами."
legionstates.222.a:0 "У цій частині світу нам потрібен сильний союзник."
legionstates.222.b:0 "Римляни? Ніколи!"

legionstates.223.t:0 "Нова Іспанська Імперія Підписує Договір!"
legionstates.223.desc:0 "Нова Іспанська Імперія прийняла нашу пропозицію та підписала договір про взаємну оборону. Ця угода формалізує стратегічне партнерство, забезпечуючи військові гарантії та скоординовані дії перед обличчям зовнішньої агресії. Пакт зміцнює наші позиції в регіоні та знаменує нову еру співпраці між Римом та Мехіко."
legionstates.223.a:0 "На заході піднімається нова сила."

legionstates.224.t:0 "Нова Іспанська Імперія Відмовляється..."
legionstates.224.desc:0 "Незважаючи на наші пропозиції, Нова Іспанська Імперія відхилила запропонований договір. Їхнє керівництво вирішило залишатися незалежним, посилаючись на занепокоєння щодо втягування та ідеологічні розбіжності. Хоча це розчаровує, Легіонерські Штати продовжуватимуть досягати своїх стратегічних цілей — з їхньою підтримкою чи без неї."
legionstates.224.a:0 "Вони зробили свій вибір. Так само зробимо і ми."

legionstates.201.t:0 "Цезар Нового Риму"
legionstates.201.desc:0 "У декларації, що лунає крізь історію, Джордж Маршалл коронував себе Цезарем Нового Риму, проголошуючи народження континентальної імперії, що простягається від узбережжя до узбережжя. З завершенням Війни за Об'єднання Америки та розчавленими суперницькими державами під маршем легіонів, Легіонерські Штати тепер панують над Новим Світом. Церемонія, проведена під високими прапорами та гучні оплески, знаменує кінець розколу та піднесення нового Римського порядку.\n\nПо всьому світу реакції неоднозначні — одні вітають народження імперії, інші бояться амбіцій мілітаристського колоса. Одне безсумнівно; ера Легіонерських Штатів розпочалася."
legionstates.201.a:0 "Хай живе Цезар!"
legionstates.201.b:0 "Новий Цезар на заході?"
legionstates.201.c:0 "Ще один Цезар?"

legionstates.90.t:0 "Кінець Війни за Об'єднання Америки"
legionstates.90.desc:0 "Після напруженого та кривавого конфлікту, що охопив увесь континент, Війна за Об'єднання Америки нарешті добігла кінця. Армії Легіонерських Штатів стоять тріумфально, їхні прапори тепер майорять над величезними просторами Північної Америки. Від рівнин Техасу до гаваней Нової Англії, суперницькі держави були розгромлені, а їхні уряди або розпущені, або поглинені зростаючим доменом Легіону.\n\nКонсул Джордж Маршалл, якого вітають як завойовника, так і засновника, тепер головує над об'єднаним континентом під Орлом Легіону. Світ дивиться із благоговінням та острахом: через Атлантику піднялася нова сила, викувана у вогні та крові, рішуча зайняти своє місце серед великих націй історії."
legionstates.90.a:0 "Хай живуть Легіонерські Штати!"
legionstates.90.b:0 "Орел Заходу піднявся."
legionstates.90.c:0 "Нова сила піднялася через море..."

